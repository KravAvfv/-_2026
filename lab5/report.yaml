lab_number: 5
theme: Побудова концепції автоматизованої системи в нотації UML
year: 2026
output: lab5/ЛР5_Кравченко_ІР-31.docx
blocks:
- h1: Мета роботи
- p: 'Вивчити мову об’єктно-орієнтованого моделювання UML (Unified Modeling Language) і створити UML-модель концепції
    автоматизованої системи — IoT-платформи «Щит-Лінк» для умовного РЦПДО «Щит-Північ», визначеного в лабораторній
    роботі № 1: діаграми варіантів використання, діяльності, послідовності та класів, а також проаналізувати призначення
    кожного виду діаграм.'
- h1: Короткі теоретичні відомості
- p: 'UML — уніфікована мова візуального моделювання, яка є де-факто галузевим стандартом розроблення програмного
    забезпечення. Згідно з лекцією «Моделювання UML» вона слугує засобом комунікації в команді та із замовником,
    використовується для проєктування, реверс-інжинірингу і документування. Графічна нотація UML містить чотири
    типи елементів: фігури, значки, лінії та написи. Канонічні діаграми поділяють на структурні (класів, компонентів,
    розгортання), поведінкові (варіантів використання, діяльності, станів) і діаграми взаємодії (послідовності,
    кооперації).'
- p: Діаграма варіантів використання (прецедентів) відображає відношення між акторами та прецедентами системи. Актор
    — роль користувача або іншої системи (а не конкретна особа); основні актори ініціюють взаємодію, другорядні
    — обслуговують її. Прецедент (еліпс, назва — дієслово) описує суттєвий для актора результат роботи системи,
    не визначаючи способу реалізації. Між прецедентами встановлюють відношення включення «include» (базовий прецедент
    завжди використовує поведінку включеного) і розширення «extend» (спеціальний випадок базового), між акторами
    — узагальнення.
- p: 'Діаграма діяльності — візуальне подання графу діяльностей, вершинами якого є дії, а переходи відбуваються
    після завершення дій; доріжки (swimlanes) показують виконавців, ромби — розгалуження, товсті лінії — паралельне
    виконання (fork/join). Діаграма послідовності відображає впорядковані в часі взаємодії об’єктів: лінії життя,
    повідомлення (суцільні — виклики, пунктирні — результати), фрагменти alt/loop; на ній використовують стереотипи
    межі (boundary), управління (control) і сутності (entity). Діаграма класів — статичне подання структури моделі:
    класи з атрибутами «<видимість><ім’я>: <тип>» та операціями, відношення асоціації (з кратністю), агрегації (незафарбований
    ромб), композиції (зафарбований ромб), узагальнення (трикутна стрілка) і залежності (пунктир).'
- h1: Хід виконання роботи
  new_page: true
- h2: 1. Функціональна модель системи в нотації UML
- p: 'Об’єктом моделювання є IoT-платформа «Щит-Лінк» умовного РЦПДО «Щит-Північ» (*навчальна умовна модель організації*,
    ЛР1). UML-модель продовжує структурні моделі попередніх робіт: ролі акторів відповідають доріжкам BPMN (ЛР2)
    і механізмам IDEF0 (ЛР3), прецеденти — функціям A1–A5 та процесам DFD (ЛР4), класи — сховищам даних і сутностям
    предметної області. Склад моделі наведено в табл. {tab:diag}.'
- table:
    id: diag
    caption: Склад UML-моделі платформи «Щит-Лінк»
    header:
    - Діаграма
    - Що моделює
    - Рисунки
    widths:
    - 4.2
    - 8.6
    - 3.2
    font: 12
    rows:
    - - Варіантів використання
      - 'Функціональні вимоги: актори та прецеденти бойового управління, забезпечення й адміністрування'
      - рис. {fig:uc1}, {fig:uc2}
    - - Діяльності
      - Бізнес-процес «виявлення — призначення — перехоплення» з розподілом дій між ролями
      - рис. {fig:act1}, {fig:act2}
    - - Послідовності
      - Взаємодію об’єктів під час виконання прецеденту «Призначити розрахунок»
      - рис. {fig:seq}
    - - Класів
      - 'Статичну структуру предметної області: сутності, атрибути, операції, відношення'
      - рис. {fig:cls1}, {fig:cls2}
- h2: 2. Діаграма варіантів використання
  new_page: true
- p: Акторів системи визначено за ролями (табл. {tab:actors}). Ролі командного пункту узагальнено абстрактним актором
    «Персонал КП», що дозволяє один раз задати спільний прецедент «Переглянути повітряну обстановку». Сенсорний
    вузол, постачальник і вищий КП є акторами-системами (стереотип «система») — це машинна взаємодія (M2M), характерна
    для IoT-систем (лекція «Архітектура ІС»).
- table:
    id: actors
    caption: Актори системи
    header:
    - Актор
    - Відповідальність
    widths:
    - 6
    - 10
    font: 12
    rows:
    - - Персонал КП (абстрактний актор)
      - Узагальнення ролей командного пункту; переглядає повітряну обстановку
    - - Аналітик повітряної обстановки
      - Класифікує цілі, веде треки
    - - Оперативний черговий
      - Підтверджує ціль, санкціонує пуск (правило двох осіб)
    - - Офіцер бойового управління
      - Призначає розрахунок на ціль
    - - Командир розрахунку
      - Приймає бойове завдання, доповідає про результат
    - - Оператор перехоплювача
      - Супроводжує місію, підтверджує ціль у фазі наведення
    - - Сенсорний вузол («система»)
      - Передає виявлення (машинна взаємодія M2M)
    - - Технік, логіст
      - Облік стану техніки, запасів і заявок
    - - Аналітик ефективності
      - Звіти, показники KPI, відтворення місій
    - - Адміністратор, офіцер кібербезпеки
      - Користувачі і ролі, реєстрація пристроїв, журнал аудиту
    - - Постачальник, вищий КП («система»)
      - 'Зовнішні системи: приймають заявки та звіти'
- p: 'Для читабельності прецеденти розділено на дві діаграми. Діаграма бойового управління (рис. {fig:uc1}) містить
    12 прецедентів: прецедент «Призначити розрахунок» завжди включає «Перевірити деконфлікцію» («include»), а «Обрати
    резервний розрахунок» розширює його у разі відсутності підтвердження («extend»); «Скасувати місію» розширює
    «Супроводжувати місію».'
- figure:
    id: uc1
    src: lab5/diagrams/01_usecase_combat.png
    caption: 'Діаграма варіантів використання: бойове управління'
- p: Діаграма забезпечення та адміністрування (рис. {fig:uc2}) охоплює облік техніки і запасів, звітність та адміністрування;
    прецеденти керування користувачами та перегляду журналу аудиту включають багатофакторну автентифікацію.
- figure:
    id: uc2
    src: lab5/diagrams/02_usecase_support.png
    caption: 'Діаграма варіантів використання: забезпечення та адміністрування'
- p: Специфікацію ключового прецедента «Призначити розрахунок» наведено в табл. {tab:spec}.
- table:
    id: spec
    caption: Специфікація прецедента «Призначити розрахунок»
    header:
    - Розділ
    - Зміст
    widths:
    - 3.6
    - 12.4
    font: 12
    rows:
    - - Основний актор
      - Офіцер бойового управління
    - - Передумови
      - Ціль підтверджено оперативним черговим; є щонайменше один розрахунок у стані «Готовий».
    - - Основний потік
      - - 1. Офіцер обирає підтверджену ціль у черзі призначень.
        - 2. Система виконує прецедент «Перевірити деконфлікцію» (зони заборони, плани польотів).
        - 3. Система формує список розрахунків-кандидатів, ранжований за часом перехоплення.
        - 4. Офіцер обирає розрахунок; система створює місію у стані «Запропонована».
        - 5. Система передає місію оперативному черговому для санкціонування.
    - - Альтернативні потоки
      - - 2а. Виявлено конфлікт — система блокує призначення і пропонує погодження з ПС ЗСУ.
        - 4а. Розрахунок не підтвердив завдання за 15 с — розширення «Обрати резервний розрахунок».
    - - Постумови
      - Створено місію з призначеним розрахунком; подію записано до журналу аудиту.
- h2: 3. Діаграма діяльності
  new_page: true
- p: Діаграма діяльності описує бізнес-процес перехоплення з розподілом дій за доріжками-виконавцями. Через обсяг
    її подано двома частинами. Частина 1 (рис. {fig:act1}) охоплює класифікацію, підтвердження цілі, деконфлікцію
    та цикл «обрати розрахунок — розглянути пуск», що повторюється, доки пуск не буде дозволено. Частина 2 (рис.
    {fig:act2}) починається з передачі бойового завдання; після прийняття завдання підготовка маршруту та передпольотний
    контроль виконуються паралельно (fork/join), а перед наведенням оператор підтверджує ціль.
- figure:
    id: act1
    src: lab5/diagrams/03_activity_a.puml
    caption: 'Діаграма діяльності, частина 1: ідентифікація цілі та санкціонування пуску'
- figure:
    id: act2
    src: lab5/diagrams/04_activity_b.puml
    caption: 'Діаграма діяльності, частина 2: виконання місії перехоплення'
- h2: 4. Діаграма послідовності
  new_page: true
- p: 'Діаграма послідовності (рис. {fig:seq}) деталізує прецедент «Призначити розрахунок» (табл. {tab:spec}). Учасники
    позначені стереотипами: межа — «Інтерфейс КП», управління — «Сервіс призначень» і «Гео-сервіс», сутність — «Місія»;
    актори — офіцер бойового управління (ОБУ) та оперативний черговий. Об’єкт «Місія» створюється під час взаємодії
    (повідомлення create()), а фрагмент alt моделює два варіанти: підтвердження розрахунком протягом 15 с або тайм-аут
    із пропозицією резервного розрахунку.'
- figure:
    id: seq
    src: lab5/diagrams/05_sequence.puml
    caption: Діаграма послідовності прецедента «Призначити розрахунок»
- h2: 5. Діаграма класів
  new_page: true
- p: Діаграму класів подано двома фрагментами одного пакета. Фрагмент «Ситуаційна обізнаність» (рис. {fig:cls1})
    показує, що сенсор формує виявлення, а повітряний трек агрегує виявлення (виявлення існує і без треку) та може
    бути ціллю кількох місій. Фрагмент «Місії та ресурси» (рис. {fig:cls2}) містить абстрактний клас «Користувач»
    з нащадками, композицію «Місія — ПодіяМісії» (події не існують без місії), асоціації з кратностями та агрегацію
    розрахунків і перехоплювачів вогневою позицією. Обґрунтування типів відношень наведено в табл. {tab:rel}.
- figure:
    id: cls1
    src: lab5/diagrams/06_class_a.puml
    caption: Діаграма класів, фрагмент «Ситуаційна обізнаність»
- figure:
    id: cls2
    src: lab5/diagrams/07_class_b.puml
    caption: Діаграма класів, фрагмент «Місії та ресурси»
- table:
    id: rel
    caption: Відношення на діаграмі класів
    header:
    - Відношення
    - Приклад
    - Обґрунтування
    widths:
    - 3.4
    - 5.6
    - 7
    font: 12
    rows:
    - - Асоціація (з кратністю)
      - Розрахунок 1 — * Місія
      - Розрахунок виконує багато місій, місія — одним розрахунком
    - - Агрегація
      - ПовітрянийТрек ◇— Виявлення
      - Виявлення зберігається і після видалення треку
    - - Композиція
      - Місія ◆— ПодіяМісії
      - Події місії знищуються разом із місією
    - - Узагальнення
      - Користувач ◁— ОперативнийЧерговий
      - Спадкування атрибутів і автентифікації
    - - Залежність
      - ОперативнийЧерговий ⇢ Місія
      - Черговий використовує місію (санкціонує), не зберігаючи зв’язку
- h2: 6. Аналіз призначення діаграм
  new_page: true
- p: Призначення кожного виду діаграми та його роль у проєктуванні платформи «Щит-Лінк» наведено в табл. {tab:purpose}.
- table:
    id: purpose
    caption: Призначення діаграм UML
    header:
    - Діаграма
    - Група
    - Призначення
    - Використання в проєкті
    widths:
    - 3
    - 2.6
    - 5.2
    - 5.2
    font: 12
    rows:
    - - Варіантів використання
      - Поведінкова
      - 'Концептуальна модель функціональних вимог: хто і для чого використовує систему'
      - Перелік функцій і ролей для ТЗ, матриця прав доступу (RBAC)
    - - Діяльності
      - Поведінкова
      - Логіка бізнес-процесу, розгалуження, паралелізм, виконавці
      - Узгодження процесу перехоплення із замовником, вимоги до часових обмежень
    - - Послідовності
      - Взаємодії
      - Упорядкований у часі обмін повідомленнями між об’єктами в межах сценарію
      - Специфікація API між інтерфейсом, сервісами та застосунком розрахунку
    - - Класів
      - Структурна
      - 'Статична логічна модель: класи, атрибути, операції, відношення'
      - Основа схеми бази даних і програмних модулів
- h1: Графічна частина
- p: 'Діаграми розміщено у відповідних підрозділах ходу виконання роботи:'

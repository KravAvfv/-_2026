  - рис. {fig:act1}, {fig:act2} — діаграма діяльності (частини 1 і 2);
  - рис. {fig:seq} — діаграма послідовності;
  - рис. {fig:cls1}, {fig:cls2} — діаграма класів (два фрагменти).
- h1: Висновки
  new_page: true
- p: У лабораторній роботі вивчено мову UML і побудовано концептуальну модель IoT-платформи «Щит-Лінк» для умовного
    РЦПДО «Щит-Північ». Діаграми варіантів використання визначають 13 акторів-ролей (зокрема 3 актори-системи) і
    22 прецеденти з відношеннями узагальнення, «include» та «extend»; для ключового прецедента «Призначити розрахунок»
    складено текстову специфікацію.
- p: Діаграма діяльності описує процес перехоплення з розподілом дій між п’ятьма ролями, циклом санкціонування та
    паралельною підготовкою до пуску; діаграма послідовності деталізує взаємодію семи учасників під час призначення
    розрахунку, включно з альтернативою тайм-ауту. Діаграма класів містить 11 класів з атрибутами, операціями та
    всіма основними типами відношень.
- p: Аналіз показав, що діаграми варіантів використання і діяльності фіксують вимоги та процеси, діаграма послідовності
    — інтерфейси між компонентами, а діаграма класів — структуру даних; разом вони є основою для проєктування архітектури
    IoT-системи в наступній лабораторній роботі.

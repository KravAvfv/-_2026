- h1: 3. DFD-модель
  new_page: true
- h2: 3.1. DFD рівня 0
- p: 'DFD (Data Flow Diagram) описує рух інформації між процесами; основні елементи — зовнішні сутності, процеси, сховища
    даних і потоки [1]. Діаграми побудовано в нотації Йордона — Де Марко, як у прикладі методичних матеріалів: процес — коло,
    сховище — циліндр, зовнішня сутність — прямокутник [4]. Пунктирні рамки на рис. {fig:dfd0} — зони довіри; потік, що перетинає
    рамку, перетинає межу довіри.'
- figure:
    id: dfd0
    src: ts_work/pract2/diagrams/02_dfd0.png
    caption: DFD рівня 0 корпоративної мережі із зонами довіри
- p: Модель рівня 0 містить 6 процесів, 6 сховищ і 19 потоків даних (табл. {tab:proc}). Центральний процес 2 «Контроль міжсегментного
    доступу» реалізують Firewall і комутатор ядра — через нього проходять усі потоки між зонами.

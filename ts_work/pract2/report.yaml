- p: 'Файл 1_CORE-SW.txt:'
- code: "enable\nconfigure terminal\nhostname CORE-SW\nno ip domain-lookup\nip routing\nvlan 10\n name HR\nvlan 20\n name\
    \ FINANCE\nvlan 30\n name ADMINISTRATION\nvlan 99\n name SERVERS\nvlan 999\n name PARKING\n exit\ninterface range fastEthernet\
    \ 0/1 - 2\n switchport mode access\n switchport access vlan 10\n switchport nonegotiate\n exit\ninterface range fastEthernet\
    \ 0/3 - 4\n switchport mode access\n switchport access vlan 20\n switchport nonegotiate\n exit\ninterface fastEthernet\
    \ 0/5\n switchport mode access\n switchport access vlan 30\n switchport nonegotiate\n exit\ninterface fastEthernet 0/6\n\
    \ switchport mode access\n switchport access vlan 99\n switchport nonegotiate\n exit\ninterface range fastEthernet 0/7\
    \ - 24\n switchport mode access\n switchport access vlan 999\n shutdown\n exit\ninterface vlan 10\n ip address 192.168.10.1\
    \ 255.255.255.0\n no shutdown\ninterface vlan 20\n ip address 192.168.20.1 255.255.255.0\n no shutdown\ninterface vlan\
    \ 30\n ip address 192.168.30.1 255.255.255.0\n no shutdown\ninterface vlan 99\n ip address 192.168.99.1 255.255.255.0\n\
    \ no shutdown\ninterface gigabitEthernet 0/1\n no switchport\n ip address 10.0.0.2 255.255.255.252\n no shutdown\n exit\n\
    ip route 0.0.0.0 0.0.0.0 10.0.0.1\nend\n"
  size: 9
- p: 'Файл 2_CORE-SW_ACL.txt:'
- code: "configure terminal\nip access-list extended HR_IN\n permit udp 192.168.10.0 0.0.0.255 host 192.168.99.10 eq 53\n\
    \ permit tcp 192.168.10.0 0.0.0.255 host 192.168.99.10 eq 88\n permit tcp 192.168.10.0 0.0.0.255 host 192.168.99.10 eq\
    \ 389\n permit tcp 192.168.10.0 0.0.0.255 host 192.168.99.10 eq 445\n permit icmp 192.168.10.0 0.0.0.255 host 192.168.99.10\
    \ echo\n permit icmp 192.168.10.0 0.0.0.255 192.168.30.0 0.0.0.255 echo-reply\n deny ip 192.168.10.0 0.0.0.255 192.168.0.0\
    \ 0.0.255.255\n permit ip 192.168.10.0 0.0.0.255 any\n exit\nip access-list extended FIN_IN\n permit udp 192.168.20.0\
    \ 0.0.0.255 host 192.168.99.10 eq 53\n permit tcp 192.168.20.0 0.0.0.255 host 192.168.99.10 eq 88\n permit tcp 192.168.20.0\
    \ 0.0.0.255 host 192.168.99.10 eq 389\n permit tcp 192.168.20.0 0.0.0.255 host 192.168.99.10 eq 445\n permit icmp 192.168.20.0\
    \ 0.0.0.255 host 192.168.99.10 echo\n permit icmp 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255 echo-reply\n deny ip 192.168.20.0\
    \ 0.0.0.255 192.168.0.0 0.0.255.255\n permit ip 192.168.20.0 0.0.0.255 any\n exit\ninterface vlan 10\n ip access-group\
    \ HR_IN in\ninterface vlan 20\n ip access-group FIN_IN in\n end\ncopy running-config startup-config\n\nshow ip interface\
    \ brief\nshow access-lists\n"
  size: 9
- p: 'Файл 3_FW-ASA.txt:'
- code: "enable\nconfigure terminal\nhostname FW-ASA\ninterface gigabitEthernet 1/2\n nameif inside\n security-level 100\n\
    \ ip address 10.0.0.1 255.255.255.252\n no shutdown\ninterface gigabitEthernet 1/1\n nameif outside\n security-level 0\n\
    \ ip address 203.0.113.1 255.255.255.252\n no shutdown\nroute outside 0.0.0.0 0.0.0.0 203.0.113.2\nroute inside 192.168.0.0\
    \ 255.255.0.0 10.0.0.2\nobject network LAN\n subnet 192.168.0.0 255.255.0.0\n nat (inside,outside) dynamic interface\n\
    access-list OUTSIDE_IN extended permit icmp any any echo-reply\naccess-list OUTSIDE_IN extended deny ip any any\naccess-group\
    \ OUTSIDE_IN in interface outside\npolicy-map global_policy\n class inspection_default\n  inspect icmp\nend\nwrite memory\n"
  size: 9

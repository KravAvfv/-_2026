blocks:
- h1: 1. Тема, мета та завдання роботи
  new_page: true
- p: Мета роботи — освоїти методи системного моделювання телекомунікаційних систем (ТКС) і застосування моделей для аналізу
    інформаційної безпеки [1].
- p: 'Об’єкт моделювання — варіант № 8 додатка А методичних матеріалів «Корпоративна мережа підприємства»: VLAN HR, VLAN Finance,
    VLAN Administration, сервер Active Directory і Firewall; особливість варіанта — сегментація мережі [1]. Для повноти моделі
    додано необхідну інфраструктуру: комутатор ядра рівня 3 і серверний сегмент VLAN 99 (табл. {tab:vlan}).'

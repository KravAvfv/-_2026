- h1: 5. Модель порушника
  new_page: true
- p: Порушника описано кортежем M = {A, K, R}, де A — доступ до ресурсів, K — знання та навички, R — ресурси [1]. Для варіанта
    виділено три класи порушників (табл. {tab:intr}).
- table:
    font: 12
    id: intr
    caption: Модель порушника
    header:
    - Параметр
    - П1 — Зовнішній
    - П2 — Внутрішній
    - П3 — Привілейований
    widths:
    - 3.1
    - 4.5
    - 4.5
    - 4.4
    rows:
    - - Хто
      - кіберзлочинець, що атакує підприємства заради фінансів
      - працівник відділу кадрів або фінвідділу
      - системний адміністратор або підрядник з обслуговування
    - - Мотивація
      - 'фінансова вигода: підміна платежів, викуп за дані'
      - корисливість, помста, цікавість; ненавмисні помилки
      - корисливість, тиск ззовні, приховування власних помилок
    - - A — доступ
      - немає доступу до ЛОМ; доступ через Інтернет до периметра й пошти працівників
      - легітимний доступ до своєї VLAN і своїх ресурсів; фізичний доступ до ПК
      - 'повний: адміністративні облікові записи AD, Firewall, комутаторів'
    - - K — знання
      - 'середній — високий: фішингові кампанії, готові експлойти, програми-вимагачі'
      - 'низький — середній: користувач ПК, може знайти інструкції в Інтернеті'
      - 'високий: знає архітектуру, правила МЕ, паролі служб'
    - - R — ресурси
      - ботнет, фішинговий набір, орендована інфраструктура
      - робоче місце, знімні носії, власний смартфон
      - адміністративні інструменти, віддалений доступ
    - - Сценарії атак
      - фішинг (T1) → закріплення на ПК фінвідділу → підміна платежу (T6) або вимагач (T8); DoS (T9)
      - спроба доступу до фінансової БД з VLAN HR (T5); копіювання персональних даних (T7); ARP-спуфінг (T13)
      - зміна правил ACL / МЕ (T10), створення прихованого облікового запису (T3), видалення журналів (T11)
    - - Рівень небезпеки
      - високий
      - середній
      - високий
- p: Зовнішній порушник не має доступу до ЛОМ і діє через периметр і пошту; внутрішній має легітимний доступ до своєї VLAN,
    тому саме сегментація обмежує його можливості; привілейований порушник обходить технічні обмеження, тож проти нього потрібні
    організаційні заходи й незмінний журнал.

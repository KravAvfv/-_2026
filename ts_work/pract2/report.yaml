- h2: 3.2. DFD рівня 1
- p: 'Процес 2 деталізовано на рис. {fig:dfd1}: кадр робочої станції отримує тег VLAN, маршрутизується між SVI комутатора
    ядра, перевіряється списком контролю доступу (ACL), а трафік назовні фільтрується та транслюється (NAT) на Firewall; відхилені
    пакети реєструються в журналі [5].'

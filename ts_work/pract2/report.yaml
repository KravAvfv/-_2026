    \ DFD рівня 0\nPROC0 = [\n    (\"1\", \"Автентифікація та авторизація\"), (\"2\", \"Контроль міжсегментного доступу\"\
    ),\n    (\"3\", \"Обробка кадрових даних\"), (\"4\", \"Обробка фінансових операцій\"),\n    (\"5\", \"Документообіг адміністрації\"\
    ), (\"6\", \"Моніторинг і журналювання\"),\n]\nSTORES = [(\"D1\", \"Каталог AD\"), (\"D2\", \"Кадрова БД\"), (\"D3\",\
    \ \"Фінансова БД\"), (\"D4\", \"Файловий ресурс адміністрації\"),\n          (\"D5\", \"Журнал подій\"), (\"D6\", \"Правила\
    \ ACL і МЕ\")]\n# потоки рівня 0: (джерело, приймач, дані)\nFLOWS0 = [\n    (\"Е1\", \"1\", \"облікові дані\"), (\"Е2\"\
    , \"1\", \"облікові дані\"), (\"Е3\", \"1\", \"облікові дані\"),\n    (\"1\", \"D1\", \"перевірка облікового запису\"\
    ), (\"1\", \"2\", \"квиток Kerberos, група\"),\n    (\"Е1\", \"3\", \"кадрові дані\"), (\"3\", \"D2\", \"особові справи\"\
    ), (\"Е2\", \"4\", \"платежі\"), (\"4\", \"D3\", \"проводки\"),\n    (\"4\", \"2\", \"платіжні доручення\"), (\"2\", \"\
    Е5\", \"платежі (TLS)\"), (\"2\", \"Е6\", \"запити (NAT)\"),\n    (\"Е3\", \"5\", \"розпорядження\"), (\"5\", \"D4\",\
    \ \"документи\"), (\"2\", \"6\", \"події МЕ / ACL\"), (\"6\", \"D5\", \"записи журналу\"),\n    (\"Е4\", \"2\", \"налаштування\
    \ (SSH)\"), (\"6\", \"Е4\", \"тривоги\"), (\"2\", \"D6\", \"правила\"),\n]\n# DFD рівня 1 — декомпозиція процесу 2 «Контроль\
    \ міжсегментного доступу»\nPROC1 = [\n    (\"2.1\", \"Прийняти кадр і визначити VLAN (802.1Q)\"), (\"2.2\", \"Маршрутизувати\
    \ між VLAN (SVI)\"),\n    (\"2.3\", \"Перевірити ACL міжсегментного доступу\"), (\"2.4\", \"Фільтрувати й транслювати\
    \ (МЕ, NAT)\"),\n    (\"2.5\", \"Зареєструвати подію\"),\n]\nFLOWS1 = [\n    (\"Е1–Е3\", \"2.1\", \"кадри робочих станцій\"\
    ), (\"2.1\", \"2.2\", \"тегований трафік\"), (\"2.2\", \"2.3\", \"пакет до іншої VLAN\"),\n    (\"D6\", \"2.3\", \"правила\
    \ ACL\"), (\"2.3\", \"1\", \"дозволений запит до AD\"), (\"2.3\", \"2.4\", \"трафік до Інтернету / банку\"),\n    (\"\
    D6\", \"2.4\", \"політика МЕ\"), (\"2.4\", \"Е5, Е6\", \"дозволений зовнішній трафік\"), (\"2.3\", \"2.5\", \"відхилені\
    \ пакети\"),\n    (\"2.4\", \"2.5\", \"відхилені з’єднання\"), (\"2.5\", \"D5\", \"записи журналу\"), (\"Е4\", \"D6\"\
    , \"зміна правил (SSH)\"),\n]\n\n# ---------------------------------------------------------------- межі довіри\nTRUST\
    \ = [  # (код, межа, між чим, контроль на межі)\n    (\"TB1\", \"Периметр підприємства\", \"Інтернет / банк ↔ внутрішня\
    \ мережа\", \"Firewall: stateful-фільтрація, NAT\"),\n    (\"TB2\", \"Міжсегментна межа користувачів\", \"VLAN HR ↔ VLAN\
    \ Finance ↔ VLAN Administration\",\n     \"ACL на SVI комутатора ядра\"),\n    (\"TB3\", \"Межа серверного сегмента\"\
    , \"VLAN користувачів ↔ VLAN 99 (AD)\", \"ACL: лише DNS, Kerberos, LDAP, SMB\"),\n    (\"TB4\", \"Межа адміністрування\"\
    , \"робоча станція адміністратора ↔ мережеве обладнання, AD\",\n     \"SSH, окремі облікові записи, журнал\"),\n]\n\n\
    # ---------------------------------------------------------------- STRIDE (компонент → S T R I D E)\nSTRIDE = [   # за\
    \ STRIDE-per-element: зовнішня сутність — S, R; процес — усі 6; сховище — T, (R), I, D; потік — T, I, D\n    (\"Е2 Працівник\
    \ фінансового відділу\", \"+-+---\"),\n    (\"Процес 1. Автентифікація та авторизація\", \"++++++\"),\n    (\"Процес 2.\
    \ Контроль міжсегментного доступу\", \"++-+++\"),\n    (\"Процес 3. Обробка кадрових даних\", \"++++--\"),\n    (\"Процес\
    \ 4. Обробка фінансових операцій\", \"++++-+\"),\n    (\"Процес 5. Документообіг адміністрації\", \"+++++-\"),\n    (\"\
    Процес 6. Моніторинг і журналювання\", \"-++-+-\"),\n    (\"D1 Каталог AD\", \"-+-++-\"),\n    (\"D3 Фінансова БД\", \"\
    -+-++-\"),\n    (\"D5 Журнал подій\", \"-++++-\"),\n    (\"Потік «платежі» (2 → Е5)\", \"-+-++-\"),\n]\n\n# ----------------------------------------------------------------\
    \ загрози: (код, загроза, STRIDE, компонент / точка атаки, P, C грн, P після заходів)\nTHREATS = [\n    (\"T1\", \"Фішинг:\
    \ викрадення облікових даних працівника\", \"S\", \"Е1–Е3, процес 1\", 0.70, 60_000, 0.30),\n    (\"T2\", \"Підбір / розпилення\
    \ паролів до домену\", \"S\", \"процес 1, AD\", 0.40, 150_000, 0.10),\n    (\"T3\", \"Pass-the-Hash, Kerberoasting після\
    \ компрометації ПК\", \"E\", \"AD, D1\", 0.25, 400_000, 0.10),\n    (\"T4\", \"Обхід сегментації: VLAN hopping (switch\
    \ spoofing, double tagging)\", \"E\", \"комутатор, процес 2\",\n     0.15, 200_000, 0.03),\n    (\"T5\", \"Несанкціонований\
    \ доступ з VLAN HR до фінансової БД\", \"I\", \"процес 2, D3\", 0.30, 300_000, 0.05),\n    (\"T6\", \"Підміна платіжного\
    \ доручення (шкідливе ПЗ на ПК фінвідділу)\", \"T\", \"процес 4, потік до Е5\",\n     0.20, 800_000, 0.06),\n    (\"T7\"\
    , \"Витік персональних даних працівників\", \"I\", \"процес 3, D2\", 0.25, 250_000, 0.08),\n    (\"T8\", \"Програма-вимагач\
    \ у файловому ресурсі адміністрації\", \"D\", \"процес 5, D4\", 0.20, 500_000, 0.07),\n    (\"T9\", \"DoS на канал до\
    \ Інтернету / банку\", \"D\", \"Firewall, TB1\", 0.60, 30_000, 0.30),\n    (\"T10\", \"Підбір пароля / вразливість інтерфейсу\
    \ керування Firewall\", \"E\", \"Firewall, D6\", 0.15, 400_000, 0.04),\n    (\"T11\", \"Видалення або зміна журналів для\
    \ приховування дій\", \"R\", \"процес 6, D5\", 0.20, 100_000, 0.05),\n    (\"T12\", \"Відмова від виконаних фінансових\
    \ операцій\", \"R\", \"процес 4\", 0.15, 120_000, 0.04),\n    (\"T13\", \"ARP-спуфінг / підроблений DHCP-сервер у VLAN\
    \ користувачів\", \"T\", \"комутатор доступу, VLAN 10–30\",\n     0.30, 80_000, 0.05),\n]\n\n# ----------------------------------------------------------------\
    \ точки атак (завдання 3)\nATTACK_POINTS = [  # (компонент, потенційна атака, загрози)\n    (\"Firewall (інтерфейс керування)\"\
    , \"Підбір пароля, експлуатація вразливості ПЗ\", \"T10\"),\n    (\"Firewall / канал провайдера\", \"DoS (SYN flood, UDP\
    \ flood)\", \"T9\"),\n    (\"Комутатор ядра (trunk, SVI)\", \"VLAN hopping: switch spoofing (DTP), double tagging\", \"\
    T4\"),\n    (\"Комутатор доступу\", \"ARP-спуфінг, підроблений DHCP, MAC flooding\", \"T13\"),\n    (\"Сервер Active Directory\"\
    , \"Підбір паролів, Pass-the-Hash, Kerberoasting\", \"T2, T3\"),\n    (\"Робочі станції HR / Finance / Administration\"\
    , \"Фішинг, шкідливе ПЗ, програма-вимагач\", \"T1, T6, T8\"),\n    (\"Фінансова БД (D3)\", \"Несанкціонований доступ з\
    \ іншої VLAN\", \"T5\"),\n    (\"Кадрова БД (D2)\", \"Витік персональних даних\", \"T7\"),\n    (\"Журнал подій (D5)\"\
    , \"Видалення / модифікація записів\", \"T11\"),\n]\n\n# ----------------------------------------------------------------\
    \ модель порушника M = {A, K, R}\nINTRUDERS = [\n    dict(code=\"П1\", cls=\"Зовнішній\", who=\"кіберзлочинець, що атакує\
    \ підприємства заради фінансів\",\n         motive=\"фінансова вигода: підміна платежів, викуп за дані\",\n         A=\"\
    немає доступу до ЛОМ; доступ через Інтернет до периметра й пошти працівників\",\n         K=\"середній — високий: фішингові\
    \ кампанії, готові експлойти, програми-вимагачі\",\n         R=\"ботнет, фішинговий набір, орендована інфраструктура\"\
    ,\n         scen=\"фішинг (T1) → закріплення на ПК фінвідділу → підміна платежу (T6) або вимагач (T8); DoS (T9)\",\n \
    \        level=\"високий\"),\n    dict(code=\"П2\", cls=\"Внутрішній\", who=\"працівник відділу кадрів або фінвідділу\"\
    ,\n         motive=\"корисливість, помста, цікавість; ненавмисні помилки\",\n         A=\"легітимний доступ до своєї VLAN\
    \ і своїх ресурсів; фізичний доступ до ПК\",\n         K=\"низький — середній: користувач ПК, може знайти інструкції в\
    \ Інтернеті\",\n         R=\"робоче місце, знімні носії, власний смартфон\",\n         scen=\"спроба доступу до фінансової\
    \ БД з VLAN HR (T5); копіювання персональних даних (T7); ARP-спуфінг (T13)\",\n         level=\"середній\"),\n    dict(code=\"\
    П3\", cls=\"Привілейований\", who=\"системний адміністратор або підрядник з обслуговування\",\n         motive=\"корисливість,\
    \ тиск ззовні, приховування власних помилок\",\n         A=\"повний: адміністративні облікові записи AD, Firewall, комутаторів\"\
    ,\n         K=\"високий: знає архітектуру, правила МЕ, паролі служб\",\n         R=\"адміністративні інструменти, віддалений\
    \ доступ\",\n         scen=\"зміна правил ACL / МЕ (T10), створення прихованого облікового запису (T3), видалення журналів\
    \ (T11)\",\n         level=\"високий\"),\n]\n\n# ---------------------------------------------------------------- заходи\
    \ захисту\nMEASURES = [  # (захід, загрози, межа / рівень)\n    (\"Сегментація VLAN 10/20/30/99, вимкнення DTP, native\
    \ VLAN без користувачів, невикористані порти в окремій \"\n     \"VLAN і shutdown\", \"T4, T5\", \"TB2\"),\n    (\"ACL\
    \ на SVI: міжвідділовий трафік заборонено, до AD — лише DNS, Kerberos, LDAP, SMB\", \"T5, T7, T3\", \"TB2, TB3\"),\n \
    \   (\"Firewall: політика «заборонено все, що не дозволено», NAT, захист від SYN flood, керування лише з VLAN \"\n   \
    \  \"адміністратора по SSH\", \"T9, T10\", \"TB1, TB4\"),\n    (\"Багатофакторна автентифікація, блокування облікового\
    \ запису після 5 невдалих спроб, складні паролі (GPO)\",\n     \"T1, T2\", \"процес 1\"),\n    (\"Модель адміністрування\
    \ рівнями (tiering), окремі привілейовані облікові записи, LAPS, захист від \"\n     \"Kerberoasting (AES, довгі паролі\
    \ служб)\", \"T3\", \"D1, TB4\"),\n    (\"DHCP snooping, Dynamic ARP Inspection, Port Security на портах доступу\", \"\
    T13\", \"VLAN 10–30\"),\n    (\"Підтвердження платежів другою особою й КЕП, окремий ПК для «клієнт-банку»\", \"T6, T12\"\
    , \"процес 4\"),\n    (\"Резервне копіювання 3-2-1 з офлайн-копією, антивірус / EDR, навчання працівників протидії фішингу\"\
    ,\n     \"T1, T8\", \"D4, Е1–Е3\"),\n    (\"Централізований журнал (syslog / SIEM) з контролем цілісності, NTP, доступ\
    \ лише на читання\", \"T11, T12\",\n     \"процес 6, D5\"),\n    (\"Шифрування носіїв і DLP для персональних даних, мінімальні\
    \ права доступу до D2\", \"T7\", \"D2\"),\n]\n\n\ndef risk_table():\n    df = pd.DataFrame(THREATS, columns=[\"Код\",\
    \ \"Загроза\", \"STRIDE\", \"Компонент\", \"P\", \"C\", \"P після\"])\n    df[\"R\"] = df[\"P\"] * df[\"C\"]\n    df[\"\
    R після\"] = df[\"P після\"] * df[\"C\"]\n    return df\n\n\nDF = risk_table()\nR_TOTAL, R_AFTER = float(DF[\"R\"].sum()),\
    \ float(DF[\"R після\"].sum())\n\nassert len(THREATS) >= 10 and all(len(s) == 6 and set(s) <= {\"+\", \"-\"} for _, s\
    \ in STRIDE)\nassert {t[2] for t in THREATS} == set(\"STRIDE\"), \"загрози мають покривати всі 6 категорій STRIDE\"\n\
    assert all(any(t[0] in m[1] for m in MEASURES) for t in THREATS), \"кожна загроза має захід\"\n\nif __name__ == \"__main__\"\
    :\n    pd.set_option(\"display.width\", 160)\n    print(DF.sort_values(\"R\", ascending=False)[[\"Код\", \"Загроза\",\
    \ \"P\", \"C\", \"R\", \"P після\", \"R після\"]]\n          .to_string(index=False))\n    print(f\"Сумарний очікуваний\
    \ збиток: {R_TOTAL:,.0f} грн → після заходів {R_AFTER:,.0f} грн\")\n"

      - сервер Active Directory (контролер домену, DNS)
- p: 'Завдання роботи за методичними матеріалами та додатком А [1]:'
- numbered:
  - 'побудувати контекстну модель системи: межі, зовнішні сутності, входи й виходи (розділ 2);'
  - побудувати DFD рівнів 0 і 1, визначити активи, потоки даних і межі довіри (розділ 3);
  - визначити потенційні точки атак, провести STRIDE-аналіз і визначити не менше 10 загроз (розділ 4);
  - сформувати модель порушника (розділ 5);
  - оцінити ризик загроз за моделлю R = P × C (розділ 6);
  - запропонувати заходи захисту та реалізувати топологію в Cisco Packet Tracer (розділ 7);
  - відповісти на контрольні запитання (розділ 8).
- p: Розрахунок ризиків виконано програмно (Python, pandas) за прикладом методичних матеріалів; лістинг — у додатку А, команди
    налаштування обладнання — у додатку Б. Звіт оформлено за ДСТУ 3008:2015 [2].
- p: Примітка. Імовірності, збитки й параметри мережі є умовною навчальною моделлю для варіанта № 8.
- h1: 2. Контекстна модель системи
  new_page: true
- p: Контекстна модель описує систему як єдиний об’єкт і відображає її взаємодію із зовнішнім середовищем [1; 3]. Межа системи
    — корпоративна мережа підприємства від порту Firewall у бік провайдера до робочих станцій і сервера AD включно; провайдер,
    банк і зовнішні сервіси лежать поза межею. Контекстну діаграму наведено на рис. {fig:ctx}, зовнішні сутності та їхні входи
    й виходи — у табл. {tab:ext}.

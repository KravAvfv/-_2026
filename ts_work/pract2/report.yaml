- h1: 8. Відповіді на контрольні запитання
  new_page: true
- p: 1. Що таке системна модель? — Спрощене формалізоване відображення об’єкта, яке дає змогу аналізувати його властивості
    без впливу на реальну систему (тут — контекстна модель, DFD, модель порушника).
- p: 2. Для чого використовується DFD? — Щоб показати, як дані рухаються між процесами, сховищами й зовнішніми сутностями;
    на DFD видно, де потоки перетинають межі довіри — там і шукають загрози.
- p: 3. Які основні елементи контекстної діаграми? — Система як один об’єкт, зовнішні сутності та потоки входів і виходів
    між ними (рис. {fig:ctx}).
- p: '4. Що таке модель порушника? — Опис можливого зловмисника: категорія, мотивація, доступ A, знання K, ресурси R і сценарії
    атак (табл. {tab:intr}).'
- p: 5. Як обчислюється ризик? — R = P × C — добуток імовірності реалізації загрози на величину збитку.
- p: 6. У чому полягає методологія STRIDE? — Систематичний перебір шести категорій загроз (S, T, R, I, D, E) для кожного елемента
    DFD.
- p: 7. Які точки атак можуть існувати в ТКС? — Інтерфейси керування мережевим обладнанням, магістральні порти комутаторів,
    сервери автентифікації, робочі станції користувачів, бездротові мережі, канал до провайдера (табл. {tab:ap}).
- p: 8. Чим відрізняється зовнішній та внутрішній порушник? — Зовнішній не має доступу до ЛОМ і атакує через периметр; внутрішній
    уже має легітимний доступ і може перевищувати повноваження, тому небезпечніший.
- p: 9. Які переваги системного моделювання в кібербезпеці? — Повнота (усі елементи й потоки враховано), кількісна оцінка
    ризиків, обґрунтований вибір заходів і перевірка без впливу на робочу мережу.
- p: 10. Як використовується Cisco Packet Tracer під час аналізу безпеки мереж? — Для побудови моделі топології, налаштування
    засобів захисту (VLAN, ACL, NAT) і перевірки їх ефективності тестами зв’язності та в режимі симуляції — як у розділі 7.2.
- h1: Висновки
  new_page: true
- p: 1. Побудовано контекстну модель корпоративної мережі з шістьма зовнішніми сутностями та DFD рівнів 0 і 1; визначено сім
    активів і чотири межі довіри, ключова з яких — контроль міжсегментного доступу.
- p: 2. STRIDE-аналіз і перелік точок атак дали 13 загроз, що охоплюють усі категорії STRIDE; модель порушника виділила зовнішнього,
    внутрішнього та привілейованого порушників.
- p: 3. За моделлю R = P × C найбільший ризик — підміна платежів (160 000 грн); сумарний очікуваний збиток 784 500 грн після
    заходів знижується до 235 800 грн.
- p: '4. Топологія в Cisco Packet Tracer підтвердила дієвість сегментації: відділи ізольовані ACL, доступ до AD обмежено службовими
    протоколами, вихід в Інтернет — лише через NAT на Firewall.'

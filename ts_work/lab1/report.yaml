      - Дахова сонячна електростанція 60 кВт з гібридними інверторами
      - джерело / виконавчий пристрій
      - генерація; регулювання активної й реактивної потужності за уставками контролера
    - - Н2
      - Установка зберігання енергії (УЗЕ) 100 кВт·год із системою керування батареєю (BMS)
      - накопичувач / виконавчий пристрій
      - зрізання піків, резервне живлення, острівний режим
    - - Н3
      - Зарядні станції електромобілів (4 шт.)
      - керовані навантаження
      - зарядка з регульованою потужністю
    - - Н4
      - Розумні реле керованих навантажень (бойлери, насоси, освітлення)
      - виконавчі пристрої
      - відкладення та обмеження навантаження за сигналами керування попитом
    - - Н5
      - Комутаційний апарат у точці спільного приєднання (ТСП) з релейним захистом
      - виконавчий пристрій
      - від’єднання від мережі ОСР (острівний режим) і повторна синхронізація
    - - Н6
      - Датчики інсоляції, температури та якості електроенергії
      - сенсори
      - вхідні дані для прогнозу генерації й контролю режиму
    - - Н7
      - Контролер мікромережі (локальна система керування енергією)
      - контролер
      - функції диспетчеризації та переходу між режимами (IEEE 2030.7), балансування в реальному часі
    - - Н8
      - Периферійний шлюз безпеки (сегментація, VPN, міжмережевий екран)
      - засіб зв’язку та захисту
      - ізоляція технологічної мережі, захищений канал до хмари
    - - Н9
      - Хмарна платформа керування енергією з модулями штучного інтелекту
      - сервер (хмара)
      - прогноз споживання й генерації, оптимізація розкладу УЗЕ, звітність
    - - Н10
      - Цифровий двійник мікромережі
      - модель (хмара)
      - перевірка уставок і сценаріїв до їх застосування
    - - Н11
      - Центр моніторингу кібербезпеки (SIEM)
      - засіб захисту
      - кореляція подій, виявлення аномалій
    - - Н12
      - Інтерфейси з агрегатором і ОСР
      - зовнішні зв’язки
      - участь у керуванні попитом і допоміжних послугах, обмін графіками
- p: 'Нові зв’язки: двобічна шина 0,4 кВ будинку, по якій енергія тече від СЕС і УЗЕ до споживачів і назад у мережу ОСР; швидкі
    (секундні) двобічні канали між пристроями й контролером мікромережі; захищений канал периферія — хмара; зовнішні інтерфейси
    з агрегатором, метеосервісом і ОСР. Структурну схему розвиненої системи наведено на рис. {fig:developed}.'

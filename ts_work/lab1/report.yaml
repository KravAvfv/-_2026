- p: 'Порівняно з рис. {fig:initial} на рис. {fig:developed} з’являється рівень локального керування з контролером мікромережі,
    хмарний рівень із прогнозуванням і цифровим двійником, а інформаційні зв’язки стають двобічними (двобічні стрілки): вимірювання
    передаються вгору, уставки й команди — вниз. Нові функції системи:'
- bullets:
  - прогнозування генерації СЕС за метеоданими та споживання будинку на добу вперед (моделі машинного навчання);
  - оптимальне планування заряду й розряду УЗЕ за тарифами й прогнозами;
  - балансування потужності в реальному часі (секундні цикли контролера мікромережі);
  - автоматичний перехід в острівний режим при зникненні напруги ОСР і повторна синхронізація;
  - 'керування попитом: відкладення зарядки електромобілів і нагріву води за сигналами системи;'
  - надання агрегатору гнучкості будинку (зменшення або збільшення навантаження за запитом);
  - моделювання сценаріїв на цифровому двійнику до зміни уставок;
  - безперервний моніторинг подій безпеки та виявлення аномалій у телеметрії.
- h2: 3.3. Неефективність традиційних підходів до інформаційної безпеки
- p: 'У початковому стані інформаційну безпеку забезпечували переважно ізоляцією: закритою шиною RS-485, приватною точкою
    доступу оператора, пломбуванням лічильників і ручною звіркою. Для розвиненої системи ці підходи стають неефективними з
    трьох причин. По-перше, зникає периметр: до системи підключаються хмара, мобільні застосунки, агрегатор і сервісні організації.
    По-друге, змінюється наслідок атаки: підміна команди інвертору чи комутаційному апарату має фізичні наслідки — знеструмлення
    будинку або пошкодження обладнання. По-третє, зростає темп: у секундних циклах балансування немає часу на ручний аналіз.'
- p: Настанови NISTIR 7628 наголошують на тому, що для розумних мереж поряд із конфіденційністю й цілісністю критичною стає
    доступність, а детальні профілі споживання є персональними даними, що потребують захисту приватності [10]. Для захисту
    обміну даними в енергосистемах призначена серія стандартів IEC 62351 [11]. Зміну підходів підсумовано в табл. {tab:shift}.
- table:
    font: 12
    id: shift
    caption: Чому традиційні підходи до інформаційної безпеки неефективні в розвиненій системі
    header:
    - Традиційний підхід (початковий стан)
    - Чому неефективний після розвитку
    - Що потрібно натомість
    widths:
    - 5.2
    - 6.0
    - 5.3
    rows:
    - - 'Захист периметром: закрита шина RS-485 і приватна точка доступу оператора'
      - з’являються хмара, мобільні застосунки, агрегатор, віддалений сервіс — периметра як єдиної межі немає
      - 'модель нульової довіри: автентифікація кожного пристрою й сервісу'
    - - Пломбування і фізичний захист лічильників
      - атака на інвертор чи контролер виконується дистанційно, без доступу до шафи
      - сертифікати пристроїв, підписане мікропрограмне забезпечення, контроль конфігурацій
    - - Пріоритет конфіденційності й цілісності показів
      - 'головним стає своєчасність і достовірність команд керування: їх підміна спричиняє фізичні наслідки'
      - пріоритет доступності й цілісності команд, перевірка уставок на цифровому двійнику
    - - Пакетна передача раз на добу, ручна звірка небалансу
      - секундні цикли не залишають часу на ручний аналіз; помилка за хвилини знеструмлює будинок
      - автоматичне виявлення аномалій, SIEM, локальні блокування небезпечних команд
    - - Одна організація — один обліковий запис адміністратора
      - кілька незалежних учасників із різними правами (ОСББ, ОСР, агрегатор, сервіс)
      - рольове розмежування, федеративна автентифікація, журнали дій
    - - Дані — покази за місяць
      - посекундні профілі виявляють присутність і розпорядок мешканців
      - мінімізація й агрегування даних, захист приватності за NISTIR 7628
    - - Залежність від одного каналу зв’язку
      - втрата хмари не повинна зупиняти енергозабезпечення
      - автономна робота контролера, резервні канали, безпечний стан за замовчуванням
    - - Захист «один раз» при встановленні
      - ШІ-моделі можна отруїти підробленими даними телеметрії
      - контроль якості й походження даних, перевірка прогнозів правилами
- h1: 4. Ключові системні властивості
  new_page: true
- p: Системні властивості — це властивості, якими володіє система як ціле і які пояснюють її поведінку [3]. Методичні вказівки
    вимагають визначити цілісність, емерджентність, ієрархічність і адаптивність [1]; у табл. {tab:props} їх доповнено відкритістю
    й цілеспрямованістю, що суттєві для енергомережі, і для кожної властивості показано прояв в обох станах системи.
- table:
    font: 12
    id: props
    caption: Системні властивості в початковому стані та в стані розвитку
    header:
    - Властивість
    - Зміст
    - Прояв у початковому стані
    - Прояв у стані розвитку
    widths:
    - 2.9
    - 4.0
    - 4.6
    - 5.0
    rows:
    - - Цілісність
      - властивості системи не зводяться до суми властивостей елементів; зміна одного елемента впливає на інші
      - покази 75 лічильників разом із ввідним утворюють баланс будинку, якого немає в жодному окремому лічильнику
      - 'відмова УЗЕ змінює режим усіх інших елементів: інвертори обмежують генерацію, реле відключають навантаження'
    - - Емерджентність
      - поява в системі нових властивостей, відсутніх в елементів
      - виявлення небалансу (крадіжки, несправності) можливе лише при зіставленні всіх показів
      - 'здатність будинку живитися в острівному режимі й зрізати піки: жоден елемент — ні СЕС, ні УЗЕ, ні контролер — окремо
        цього не забезпечує'
    - - Ієрархічність
      - система є елементом надсистеми й складається з підсистем, кожна з яких є системою
      - 'три рівні: вимірювання → збір і передавання → застосування; надсистема — мережа ОСР'
      - 'п’ять рівнів: пристрої → зв’язок → локальне керування → хмара → ринок; надсистема — об’єднана енергосистема'
    - - Адаптивність
      - здатність змінювати поведінку або структуру у відповідь на зміни середовища
      - 'майже відсутня: розклад опитування і тарифні зони задаються вручну'
      - автоматичне перебудування режиму за прогнозом погоди, тарифом, станом мережі ОСР і запитом агрегатора
    - - Відкритість
      - обмін речовиною, енергією та інформацією із середовищем
      - енергія надходить лише ззовні; інформація передається назовні
      - двобічний обмін енергією й інформацією, участь у ринку
    - - Цілеспрямованість
      - підпорядкованість функціонування меті
      - мета — достовірний облік
      - мета — надійність, економія, стійкість до відключень
- p: 'Порівняння показує, що розвиток системи посилює всі її системні властивості: кількість рівнів ієрархії зростає з трьох
    до п’яти, адаптивність з’являється як нова якість, а емерджентна властивість змінюється від інформаційної (виявлення небалансу)
    до енергетичної (живлення будинку в острівному режимі).'
- h1: 5. Системне представлення об’єкта
  new_page: true
- p: 'Системне представлення описує об’єкт моделлю «входи — система — виходи»: що система отримує із середовища, що вона повертає
    в середовище і заради якої мети перетворює входи у виходи [3]. Представлення складено для розвиненої системи, оскільки
    вона охоплює й усі входи та виходи початкового стану.'

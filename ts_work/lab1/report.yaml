blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — застосувати методологію системного аналізу до предметної області з технологіями Інтернету речей, визначити
    структуру системи, її елементи й зовнішнє середовище та змоделювати еволюційний розвиток об’єкта захисту [1].
- p: Індивідуальний варіант № 8 — «Розумна енергомережа (Smart Grid)». Початковий стан за варіантом — автоматизовані лічильники
    обліку електроенергії (АСКОЕ — автоматизована система комерційного обліку електроенергії) у багатоквартирному будинку;
    розвиток — перехід до розподіленої енергомережі з підтримкою мікромереж (microgrid), управлінням альтернативними джерелами
    енергії та балансуванням навантаження в реальному часі [1].
- p: 'Завдання роботи відповідно до методичних вказівок [1]:'
- numbered:
  - обрати індивідуальний варіант предметної області (розділ 1);
  - 'здійснити декомпозицію предметної області для її початкового стану: виділити основні елементи, підсистеми, канали зв’язку
    та межі із зовнішнім середовищем (розділ 2);'
  - провести аналіз вектору розвитку — еволюційного переходу системи до більш складної форми (розділ 3);
  - 'визначити ключові системні властивості: цілісність, емерджентність, ієрархічність, адаптивність (розділ 4);'
  - 'скласти системне представлення об’єкта: входи, виходи та ціль функціонування системи забезпечення інформаційної безпеки
    (розділ 5);'
  - сформувати структурно-функціональну схему системи (розділ 6).
- p: Відповіді на контрольні питання — у розділі 7; схеми додано також у форматі draw.io. Звіт оформлено за ДСТУ 3008:2015
    [2].
- p: Примітка. Об’єкт дослідження — умовний дев’ятиповерховий багатоквартирний будинок на 72 квартири під управлінням ОСББ;
    кількість і параметри обладнання є умовною навчальною моделлю.
- h1: 2. Опис предметної області у початковому стані
  new_page: true
- h2: 2.1. Назва та характеристика системи
- p: Системою називають сукупність взаємопов’язаних елементів, що взаємодіють між собою та із середовищем і утворюють цілісність,
    спрямовану на досягнення спільної мети [3]. Л. фон Берталанфі визначав систему як комплекс елементів, що перебувають у
    взаємодії [4]. Тому досліджувати систему означає описати не лише її елементи, а й зв’язки між ними, межу із середовищем
    і мету функціонування.
- p: Система в початковому стані — «АСКОЕ багатоквартирного будинку». Це інформаційно-вимірювальна система, що автоматично
    збирає покази 72 квартирних і 3 загальнобудинкових лічильників, зберігає їх, розраховує баланс споживання будинку й передає
    дані для комерційних розрахунків. Порядок комерційного обліку й обміну даними на ринку електричної енергії встановлюють
    Закон України «Про ринок електричної енергії» [5] і Кодекс комерційного обліку електричної енергії [6].
- p: 'Мета функціонування системи в початковому стані — достовірний і своєчасний облік спожитої електроенергії. Система є
    переважно вимірювальною: енергія надходить лише від мережі оператора системи розподілу (ОСР), а керувальні можливості
    обмежуються рідкісними командами реле навантаження.'
- h2: 2.2. Основні елементи системи
- p: 'Декомпозицію системи виконано за типами елементів, названими в методичних вказівках: сенсори, виконавчі пристрої, контролери,
    локальні сервери й користувацькі додатки [1]. Склад наведено в табл. {tab:el0}: 9 типів елементів, разом 152 пристрої
    без урахування застосунків мешканців.'

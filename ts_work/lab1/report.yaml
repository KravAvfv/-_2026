    - - Е5
      - Пристрій збору та передавання даних (УЗПД, концентратор)
      - контролер
      - '1'
      - циклічне опитування лічильників, буферизація показів, синхронізація часу
    - - Е6
      - Маршрутизатор із GSM/LTE-модемом
      - засіб зв’язку
      - '1'
      - передавання показів на сервер постачальника послуг комерційного обліку (ППКО)
    - - Е7
      - Локальний сервер АСКОЕ ОСББ з базою даних показів
      - локальний сервер
      - '1'
      - зберігання показів, розрахунок балансу будинку й розподілу витрат на загальні потреби
    - - Е8
      - Автоматизоване робоче місце (АРМ) управителя ОСББ
      - користувацький додаток
      - '1'
      - звіти, контроль небалансу, виявлення несправних лічильників
    - - Е9
      - Мобільний застосунок і веб-кабінет мешканця
      - користувацький додаток
      - до 72
      - перегляд показів і споживання за періодами
- p: 'Елементи групуються у три підсистеми, що водночас утворюють рівні ієрархії: підсистему вимірювання (Е1–Е4), підсистему
    збору та передавання даних (Е5, Е6) і підсистему обробки та застосувань (Е7–Е9).'
- h2: 2.3. Зв’язки між елементами
- p: Зв’язки між елементами поділено на енергетичні (передавання електричної енергії) та інформаційні (провідні й бездротові).
    Для засобів обліку обмін даними стандартизовано набором протоколів DLMS/COSEM серії IEC 62056 [7]. Перелік зв’язків наведено
    в табл. {tab:links0}, структурну схему початкового стану — на рис. {fig:initial}.

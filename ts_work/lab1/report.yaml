    - - Мета функціонування
      - облік спожитої енергії та розрахунки
      - надійне й економне енергозабезпечення будинку з власною генерацією
    - - Напрям енергетичних потоків
      - 'однобічний: мережа ОСР → споживачі'
      - 'двобічний: мережа ↔ будинок, генерація, заряд і розряд УЗЕ'
    - - Напрям інформаційних потоків
      - переважно знизу вгору (покази)
      - 'двобічний: вимірювання вгору, уставки й команди вниз'
    - - Темп обміну даними
      - 30–60 хв (опитування), раз на добу (передавання)
      - секунди — для балансування
    - - Керування
      - ручне, рідкісні команди реле
      - автоматичне, прогнозне, з участю ШІ
    - - Режими роботи
      - один (паралельно з мережею)
      - паралельний з мережею, острівний, перехідний
    - - Рівні ієрархії
      - три (вимірювання, збір, застосування)
      - п’ять (пристрої, зв’язок, локальне керування, хмара, ринок)
    - - Учасники
      - ОСББ, ОСР, ППКО, постачальник
      - також агрегатор, хмарний провайдер, сервісні організації
    - - Наслідки збою
      - втрата або затримка показів
      - знеструмлення будинку, пошкодження обладнання
- h2: 3.2. Нові елементи, зв’язки та функції
- p: На етапі розвитку з’являється 12 нових елементів (табл. {tab:el1}); елементи початкового стану зберігаються, а лічильники
    стають джерелом даних для керування, а не лише для розрахунків.

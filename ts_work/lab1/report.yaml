      - цілісність, автентичність
      - контролер виконує лише підписані команди від автентифікованих джерел у допустимих межах
    - - Ц2. Безперервність енергозабезпечення
      - доступність
      - при втраті хмари чи каналу зв’язку контролер переходить у безпечний автономний режим
    - - Ц3. Достовірність даних обліку й телеметрії (X1–X3)
      - цілісність
      - покази захищені від підміни; розбіжності з балансом виявляються автоматично
    - - Ц4. Конфіденційність профілів споживання мешканців
      - конфіденційність
      - назовні передаються лише агреговані дані; доступ до індивідуальних — за роллю
    - - Ц5. Підзвітність усіх учасників
      - підзвітність
      - кожна дія ОСББ, ОСР, агрегатора й сервісу фіксується в захищеному журналі
    - - Ц6. Своєчасне виявлення та реагування на інциденти
      - спостережуваність
      - аномалії телеметрії й події доступу корелюються в SIEM; є план реагування
- h1: 6. Структурно-функціональна схема системи
  new_page: true
- p: Структурно-функціональна схема поєднує структурну декомпозицію (з яких підсистем складається система) з функціональною
    (які функції виконує кожна підсистема). На рис. {fig:structfunc} систему розкладено на 6 основних підсистем П1–П6 і наскрізну
    забезпечувальну підсистему П7 — СЗІБ.
- figure:
    id: structfunc
    src: ts_work/lab1/diagrams/04_structfunc.png
    caption: Структурно-функціональна схема мікромережі багатоквартирного будинку
    note: Штрихові лінії — підсистеми П1–П6, які забезпечує наскрізна підсистема П7.
- p: 'Підсистеми П1–П3 відповідають рівню пристроїв, П4 — рівню локального керування, П5 — хмарному рівню, П6 — взаємодії
    з користувачами й ринком (рис. {fig:developed}). Підсистема П7 не утворює окремого рівня: її функції (автентифікація пристроїв,
    сегментація і VPN, журналювання і SIEM, резервування, захист приватності) вбудовані в усі рівні, тому на схемі вона охоплює
    всі інші підсистеми. Такий розподіл відповідає принципу ієрархічності: кожна підсистема є системою нижчого рівня зі своєю
    метою, підпорядкованою меті мікромережі.'
- h1: 7. Відповіді на контрольні питання
  new_page: true
- p: Питання 1. Що таке система та чим вона відрізняється від простої сукупності елементів?
- p: 'Відповідь. Система — це сукупність взаємопов’язаних елементів, що взаємодіють між собою та із середовищем і утворюють
    цілісність, спрямовану на спільну мету [3]. Від простої сукупності вона відрізняється наявністю зв’язків, структури, мети
    й емерджентних властивостей: 75 окремих лічильників — це сукупність, а АСКОЕ з концентратором, сервером і балансом будинку
    — система, бо дає інформацію про небаланс, якої немає в жодному лічильнику.'
- p: Питання 2. Які головні відмінності існують між початковим станом вашої системи та станом її еволюційного розвитку?
- p: 'Відповідь. У початковому стані система вимірювальна: енергія тече однобічно від ОСР, дані — знизу вгору раз на добу,
    керування ручне, рівнів ієрархії три. У стані розвитку система кіберфізична: власна генерація й накопичення, двобічні
    енергетичні й інформаційні потоки, секундне автоматичне балансування, острівний режим, хмарне прогнозування з ШІ, п’ять
    рівнів ієрархії та нові учасники — агрегатор і хмарний провайдер (табл. {tab:compare}).'
- p: Питання 3. Що таке емерджентність і як вона проявляється у вашій предметній області?
- p: 'Відповідь. Емерджентність — поява в системі властивостей, яких немає в жодного з її елементів. У мікромережі будинку
    емерджентна властивість — здатність живити будинок під час відключення мережі ОСР і зрізати піки споживання: СЕС без накопичувача
    не працює вночі, УЗЕ без генерації швидко розряджається, а без контролера мікромережі вони не узгоджені з навантаженням.
    Лише разом вони дають цю властивість (табл. {tab:props}).'
- p: Питання 4. Які межі зовнішнього середовища можна виділити для вашої IoT/ІСТ системи?
- p: 'Відповідь. Виділено три межі (підрозділ 2.4): енергетичну — точка спільного приєднання до мережі ОСР; інформаційну —
    інтерфейси з ППКО, ОСР, агрегатором, метеосервісом і хмарним провайдером; організаційну — інтерфейси мешканців, управителя
    й сервісних організацій. У стані розвитку інформаційна межа розширюється до хмари, тому межа системи вже не збігається
    з фізичними межами будинку.'
- h1: Висновки
  new_page: true
- p: У лабораторній роботі методологію системного аналізу застосовано до розумної енергомережі багатоквартирного будинку (варіант
    № 8).
- numbered:
  - 'Декомпозовано систему в початковому стані — АСКОЕ будинку: 9 типів елементів у трьох підсистемах, 7 зв’язків і 8 чинників
    зовнішнього середовища; побудовано структурну схему (рис. {fig:initial}).'
  - Проаналізовано вектор розвитку — перехід до мікромережі з власною генерацією, накопиченням і балансуванням у реальному
    часі; визначено 12 нових елементів і 8 нових функцій (рис. {fig:developed}).
  - 'Обґрунтовано, чому захист ізоляцією, пломбуванням і ручною звіркою стає неефективним: зникає периметр, атаки мають фізичні
    наслідки, а темп керування виключає ручний аналіз (табл. {tab:shift}).'
  - Визначено прояви цілісності, емерджентності, ієрархічності, адаптивності, відкритості та цілеспрямованості в обох станах
    системи (табл. {tab:props}).
  - 'Складено системне представлення: 9 входів, 8 виходів і ціль СЗІБ, декомпоновану на 6 підцілей; сформовано структурно-функціональну
    схему із семи підсистем (рис. {fig:structfunc}).'
- p: 'Специфіка системного аналізу IoT-системи енергомережі полягає в тому, що її доводиться розглядати одночасно у двох площинах
    — енергетичній та інформаційній, — і саме зв’язки між ними визначають поведінку системи. Тому межа системи, її ієрархія
    та мета СЗІБ залежать від стадії розвитку: для системи обліку достатньо захищати дані, а для мікромережі головним стає
    захист команд керування й доступності, від яких залежить енергозабезпечення мешканців.'

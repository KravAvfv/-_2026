    - - Оператор системи розподілу (ОСР)
      - джерело живлення, зовнішня мережа
      - живить будинок від ТП 10/0,4 кВ; приймає дані розрахункового обліку; графіки відключень визначають режими роботи будинку
    - - Постачальник електричної енергії
      - оператор ринку
      - виставляє рахунки мешканцям за даними обліку
    - - Постачальник послуг комерційного обліку (ППКО)
      - оператор даних
      - приймає й верифікує покази, передає їх учасникам ринку відповідно до Кодексу комерційного обліку
    - - Мобільний оператор та Інтернет-провайдер
      - зовнішня мережа
      - забезпечує канали З3, З4, З6; їхня недоступність перериває передавання показів
    - - Мешканці 72 квартир
      - користувачі
      - формують навантаження; отримують інформацію про споживання
    - - Управитель (правління ОСББ)
      - оператор системи
      - налаштовує систему, аналізує небаланс, ухвалює рішення
    - - Регулятор (НКРЕКП) і законодавство
      - нормативне середовище
      - вимоги до засобів обліку, точності, порядку обміну даними
    - - Кліматичні умови і стан енергосистеми
      - природне й техногенне середовище
      - сезонні піки навантаження, аварійні та планові відключення, пошкодження мереж
- h1: 3. Аналіз еволюційного розвитку системи
  new_page: true
- h2: '3.1. Стан розвитку: трансформація в кіберфізичну систему'
- p: Вектор розвитку за варіантом — перехід від системи обліку до розподіленої енергомережі будинку з мікромережею, власними
    відновлюваними джерелами, накопиченням енергії й балансуванням навантаження в реальному часі [1]. Державну політику в
    цьому напрямі визначає Концепція впровадження «розумних мереж» в Україні до 2035 року [8].
- p: Мікромережа — це група взаємопов’язаних навантажень і розподілених енергетичних ресурсів, яка діє як єдиний керований
    об’єкт щодо мережі та може працювати як паралельно з нею, так і в острівному режимі. Ключовий елемент — контролер мікромережі,
    функції якого (диспетчеризація та перехід між режимами) специфікує стандарт IEEE 2030.7-2017 [9].
- p: 'Унаслідок розвитку система стає кіберфізичною: інформаційні рішення контролера безпосередньо змінюють фізичні енергетичні
    потоки, а стан фізичних процесів у реальному часі визначає рішення. Порівняння двох станів системи наведено в табл. {tab:compare}.'
- table:
    font: 12
    id: compare
    caption: Порівняння початкового стану та стану розвитку системи
    header:

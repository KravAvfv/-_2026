- figure:
    id: initial
    src: ts_work/lab1/diagrams/01_initial.png
    caption: Структурна схема АСКОЕ багатоквартирного будинку (початковий стан)
- p: На структурних схемах товста лінія — енергетичний зв’язок, тонка суцільна — провідний інформаційний зв’язок, штрихова
    — бездротовий, заокруглені блоки — суб’єкти та навантаження.
- p: 'Схема на рис. {fig:initial} побудована за рівнями: знизу — рівень вимірювання та електроустановок, вище — рівень збору
    та передавання, угорі — рівень застосувань. Енергія рухається лише в одному напрямку — від ОСР через ввідний лічильник
    і шини ВРП до квартир та загальнобудинкових споживачів. Інформація рухається переважно знизу вгору: покази надходять від
    лічильників до УЗПД, далі на локальний сервер і через модем до постачальника послуг комерційного обліку (ППКО).'
- h2: 2.4. Зовнішнє середовище та межі системи
- p: До зовнішнього середовища належать суб’єкти та чинники, які впливають на систему, але не входять до неї і не керуються
    нею (табл. {tab:env0}). Межа системи проходить по точці приєднання будинку до мережі ОСР (енергетична межа), по інтерфейсах
    передавання даних ППКО й мобільному оператору (інформаційна межа) та по інтерфейсах користувачів — мешканців і управителя
    (організаційна межа).

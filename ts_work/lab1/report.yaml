- h2: 5.3. Ціль функціонування системи забезпечення інформаційної безпеки
- p: 'Ціль функціонування СЗІБ мікромережі будинку — забезпечити таку захищеність інформаційних ресурсів і процесів керування
    мікромережею, за якої жоден інцидент інформаційної безпеки не призводить до знеструмлення будинку, пошкодження обладнання,
    фінансових утрат мешканців або розкриття їхніх персональних даних. Ця ціль підпорядкована меті системи загалом (надійне
    й економне енергозабезпечення): СЗІБ не є самоціллю, а захищає саме ті входи й виходи, підміна або недоступність яких
    порушує енергозабезпечення. Декомпозицію цілі на підцілі з критеріями досягнення наведено в табл. {tab:szib}.'

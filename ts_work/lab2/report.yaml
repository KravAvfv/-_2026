    (0,202) мають нижчий пріоритет. Для мікромережі, яка керує енергозабезпеченням будинку, захист команд і безперервність
    живлення важливіші за вартість. Узгодженість думок експертів щодо критеріїв перевірено в ПР1 (коефіцієнт конкордації Кендалла
    W = 0,724) [5].
- h1: 3. Багатокритеріальний аналіз альтернатив
  new_page: true
- h2: 3.1. Альтернативи розвитку системи
- p: 'Щоб застосувати ваги до вибору рішення, ті самі експерти оцінили 7 альтернатив — початковий стан і варіанти архітектури
    мікромережі з різним рівнем захисту (табл. {tab:alts}). Варіанти A2–A4 відповідають варіантам «А», «Б», «В» аналізу «вартість
    — ризик» з ПР1, A5 і A6 — архітектурні крайнощі: без хмари і без автономного режиму.'

- h1: 4. Матриця кореляцій критеріїв
  new_page: true
- h2: 4.1. Розрахунок за методикою вказівок
- p: 'Коефіцієнт кореляції Пірсона між критеріями j і l обчислюється функцією np.corrcoef() [6]:'
- eq: r_{jl} = \frac{\sum_{k}(s_{jk}-\bar{s}_j)(s_{lk}-\bar{s}_l)}{\sqrt{\sum_{k}(s_{jk}-\bar{s}_j)^2}\,\sqrt{\sum_{k}(s_{lk}-\bar{s}_l)^2}},
    \qquad -1 \le r_{jl} \le 1 .
  id: r
- p: 'У шаблоні програми вказівок [1] кореляцію рахують по рядках матриці «критерій × експерт», тобто лише за n = 3 спостереженнями
    (рис. {fig:corr}, а). Для n = 3 критичне значення |r| на рівні значущості 0,05 дорівнює 0,997, а результат відображає
    розбіжність думок окремих експертів, а не зв’язок критеріїв: наприклад, $r_{12}$ = −1,00 лише тому, що експерт 2 поставив
    надійності найнижчий, а захищеності — найвищий бал. Тому для змістовного аналізу кореляцію обчислено за оцінками альтернатив.'

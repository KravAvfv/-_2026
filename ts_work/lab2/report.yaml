    - 8.9
    - 2.7
    rows:
    - - C1
      - Надійність
      - стійкість апаратної та програмної частини до збоїв, робота при відключеннях ОСР
      - більше — краще
    - - C2
      - Захищеність
      - протидія несанкціонованому доступу й підміні команд керування
      - більше — краще
    - - C3
      - Масштабованість
      - здатність додавати джерела, УЗЕ, зарядні станції, інші будинки
      - більше — краще
    - - C4
      - Вартість / ефективність
      - співвідношення витрат на розгортання й захист та економії
      - більше — краще
- p: Критерій C4 оцінюється так, що більший бал означає менші витрати або кращу економічну віддачу; завдяки цьому всі критерії
    мають однаковий напрям «більше — краще» і їх можна згортати зваженою сумою.
- h2: 2.2. Експертне оцінювання і вагові коефіцієнти
- p: 'Оцінювання змодельовано для групи з 3 експертів: інженер-енергетик ОСББ, фахівець з кібербезпеки і представник ОСР.
    Це та сама група й ті самі бали, що в практичній роботі № 1, тож вагові коефіцієнти в обох роботах узгоджені. Кожен експерт
    оцінив важливість критерію за шкалою від 1 до 10. Середній бал і нормалізований ваговий коефіцієнт обчислено за формулами:'
- eq: \bar{s}_j = \frac{1}{m}\sum_{k=1}^{m} s_{jk}, \qquad W_j = \frac{\bar{s}_j}{\sum_{i=1}^{n} \bar{s}_i}, \qquad \sum_{j=1}^{n}
    W_j = 1,
  id: w
- p: де $s_{jk}$ — бал k-го експерта для j-го критерію; m = 3 — кількість експертів; n = 4 — кількість критеріїв. Результати
    наведено в табл. {tab:w}.

blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — освоїти методологію багатокритеріального аналізу, застосувати методи експертних оцінок для ранжування критеріїв
    захищеності та ефективності системи, побудувати матрицю кореляцій між критеріями та структурно-функціональні моделі об’єкта
    захисту з урахуванням його еволюційного розвитку [1].
- p: 'Об’єкт аналізу — індивідуальний варіант № 8 «Розумна енергомережа (Smart Grid)», досліджений у лабораторній роботі №
    1 і практичній роботі № 1: умовний дев’ятиповерховий багатоквартирний будинок на 72 квартири під управлінням ОСББ. Початковий
    стан — АСКОЕ багатоквартирного будинку, стан розвитку — мікромережа будинку («розумна» енергомережа) з хмарною платформою
    та системою забезпечення інформаційної безпеки (СЗІБ). Як вимагають методичні вказівки, аналіз безпеки виконано на основі
    результатів попередніх робіт [1].'
- p: 'Завдання роботи:'
- numbered:
  - етап 1 — визначити 4 критерії оцінки безпеки та ефективності, провести експертне оцінювання з участю 3 експертів (бали
    від 1 до 10), розрахувати середні бали й нормалізовані вагові коефіцієнти (розділ 2);
  - виконати багатокритеріальний аналіз альтернатив розвитку системи методом зваженої суми (розділ 3);
  - етап 2 — побудувати матрицю кореляцій між критеріями, проаналізувати коефіцієнти та виділити конфліктні критерії (розділ
    4);
  - етап 3 — побудувати двоетапну структурну модель системи (початковий стан → еволюційний розвиток) у Mermaid.js з урахуванням
    результатів багатокритеріального аналізу та оцінити ризик методом ієрархічної адитивної згортки (розділ 5);
  - відповісти на контрольні запитання (розділ 6).
- p: Розрахунки виконано мовою Python (numpy, pandas, scipy) за шаблоном методичних вказівок; лістинг програми наведено в
    додатку А, вихідні тексти схем Mermaid — у додатку Б. Звіт оформлено за ДСТУ 3008:2015 [2].
- p: Примітка. Бали експертів, імовірності атак і частки збитку є умовною навчальною моделлю для варіанта № 8.
- h1: 2. Критерії та експертне оцінювання
  new_page: true
- h2: 2.1. Критерії оцінки безпеки та ефективності
- p: Багатокритеріальний аналіз застосовують, коли альтернативи або стани системи оцінюються за кількома суперечливими критеріями
    і жоден із них не можна оптимізувати без погіршення інших [3]. Для мікромережі будинку обрано 4 критерії (табл. {tab:crit});
    вони збігаються з критеріями прикладу вказівок, але конкретизовані для енергосистеми [1; 4].
- table:
    font: 12
    id: crit
    caption: Критерії оцінки безпеки та ефективності мікромережі
    header:

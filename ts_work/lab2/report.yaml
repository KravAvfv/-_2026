- h1: Додаток А. Лістинг програми розрахунків
  new_page: true
- p: 'Файл mcda_l2.py (Python 3; numpy, pandas, scipy). Запуск: python mcda_l2.py — друкує всі таблиці звіту.'
- code: "#!/usr/bin/env python3\n\"\"\"ЛР2 «Багатокритеріальний аналіз та експертне оцінювання у системному моделюванні об'єктів\
    \ інформаційної\nбезпеки ТКС» — дисципліна «Теорія систем», варіант 8 «Розумна енергомережа (Smart Grid)».\n\nОб'єкт —\
    \ той самий, що в ЛР1 і ПР1: АСКОЕ багатоквартирного будинку (початковий стан) → мікромережа будинку\n(еволюційний розвиток).\
    \ Скрипт виконує етапи 1–2 методичних вказівок (експертні ваги критеріїв, матриця кореляцій)\nі розрахунок ієрархічного\
    \ адитивного ризику з прикладу вказівок. Числові вихідні дані (бали експертів,\nімовірності, частки збитку) — умовна навчальна\
    \ модель. Запуск:  python mcda_l2.py\n\"\"\"\nimport numpy as np\nimport pandas as pd\nfrom scipy import stats\n\n# =======================================================================\
    \ Етап 1. Критерії та експертні ваги\nCRITERIA = [\"Надійність\", \"Захищеність\", \"Масштабованість\", \"Вартість/Ефективність\"\
    ]\nEXPERTS = [\"Інженер-енергетик ОСББ\", \"Фахівець з кібербезпеки\", \"Представник ОСР\"]\n# Бали важливості критеріїв\
    \ (1–10), ті самі експерти й оцінки, що в ПР1 (розділ 7)\nexpert_1 = [9, 8, 6, 7]\nexpert_2 = [7, 10, 7, 6]\nexpert_3\
    \ = [9, 8, 7, 5]\nSCORES = np.array([expert_1, expert_2, expert_3]).T          # рядки — критерії, стовпці — експерти\n\
    MEAN = SCORES.mean(axis=1)\nW = MEAN / MEAN.sum()                                         # нормалізовані вагові коефіцієнти,\
    \ ΣW = 1\n\n# Кореляція критеріїв за методикою вказівок: np.corrcoef по рядках «критерій × експерт» (n = 3 спостереження)\n\
    CORR_BRIEF = np.corrcoef(SCORES)\n\n# ======================================================================= Етап 2.\
    \ Альтернативи та кореляції\n# Щоб коефіцієнти кореляції мали статистичний зміст, ті самі експерти оцінили 7 альтернатив\
    \ (станів і варіантів\n# архітектури) за 4 критеріями. Шкала 1–10, більший бал — краще (для C4 — дешевше / вигідніше).\n\
    ALTS = [\n    (\"A0\", \"Початковий стан: АСКОЕ без змін\"),\n    (\"A1\", \"Мікромережа лише з вбудованим захистом протоколів\"\
    ),\n    (\"A2\", \"A1 + базовий захист (сегментація, VPN, міжмережевий екран)\"),\n    (\"A3\", \"A1 + комплексний захист\
    \ (A2 + сертифікати пристроїв, підпис команд, SIEM)\"),\n    (\"A4\", \"A1 + максимальний захист (A3 + цілодобовий SOC,\
    \ резервний контролер)\"),\n    (\"A5\", \"Локальне керування без хмари + базовий захист\"),\n    (\"A6\", \"Хмарне керування\
    \ без автономного режиму + комплексний захист\"),\n]\n# ALT_SCORES[експерт][альтернатива] = [C1, C2, C3, C4]\nALT_SCORES\
    \ = np.array([\n    [[6, 4, 3, 8], [7, 3, 8, 8], [8, 6, 7, 7], [9, 8, 8, 6], [10, 9, 7, 3], [8, 6, 4, 7], [6, 7, 9, 6]],\n\
    \    [[5, 3, 3, 9], [6, 2, 8, 9], [7, 6, 8, 7], [9, 9, 8, 5], [9, 10, 6, 2], [8, 7, 4, 6], [5, 8, 9, 6]],\n    [[6, 4,\
    \ 2, 8], [7, 3, 7, 8], [8, 5, 7, 7], [8, 8, 8, 6], [10, 9, 7, 3], [7, 6, 5, 7], [6, 7, 8, 5]],\n], dtype=float)\nALT_MEAN\
    \ = ALT_SCORES.mean(axis=0)                            # узгоджена (середня) матриця 7 × 4\nCORR = np.corrcoef(ALT_MEAN.T)\
    \                                # Пірсон між критеріями по 7 альтернативах\nN_ALT = len(ALTS)\n_t = stats.t.ppf(0.975,\
    \ N_ALT - 2)                          # критичне |r| (α = 0,05, двобічний)\nR_CRIT = float(_t / np.sqrt(_t ** 2 + N_ALT\
    \ - 2))\n_t3 = stats.t.ppf(0.975, 1)\nR_CRIT3 = float(_t3 / np.sqrt(_t3 ** 2 + 1))                  # для n = 3 (методика\
    \ вказівок)\nP_VAL = np.array([[stats.pearsonr(ALT_MEAN[:, i], ALT_MEAN[:, j])[1] if i != j else 0.0 for j in range(4)]\n\
    \                  for i in range(4)])\nSPEARMAN = stats.spearmanr(ALT_MEAN).statistic                 # ранговий контроль\n\
    \n# Адитивна згортка (метод зваженої суми) та стійкість до ваг\nUTIL = ALT_MEAN @ W\nUTIL_BY_EXPERT = ALT_SCORES @ W \
    \                              # 3 × 7\nBEST = int(UTIL.argmax())\n\n\ndef pareto(M):\n    \"\"\"Індекси недомінованих\
    \ альтернатив (усі критерії — «більше краще»).\"\"\"\n    keep = []\n    for i in range(len(M)):\n        if not any(np.all(M[j]\
    \ >= M[i]) and np.any(M[j] > M[i]) for j in range(len(M)) if j != i):\n            keep.append(i)\n    return keep\n\n\
    \nPARETO = pareto(ALT_MEAN)\n\n\ndef sensitivity(delta=0.2):\n    \"\"\"Переможець при зміні кожної ваги на ±delta (з\
    \ повторною нормалізацією).\"\"\"\n    out = []\n    for j in range(4):\n        for s in (-1, 1):\n            w = W.copy();\
    \ w[j] *= 1 + s * delta; w /= w.sum()\n            out.append((CRITERIA[j], s * delta, int((ALT_MEAN @ w).argmax())))\n\
    \    return out\n\n\nSENS = sensitivity()\n\n\ndef kendall(R):\n    \"\"\"Коефіцієнт конкордації Кендалла для матриці\
    \ оцінок m експертів × n об'єктів (без зв'язків).\"\"\"\n    m, n = R.shape\n    ranks = np.vstack([stats.rankdata(-r)\
    \ for r in R])\n    s = float(((ranks.sum(axis=0) - m * (n + 1) / 2) ** 2).sum())\n    w = 12 * s / (m ** 2 * (n ** 3\
    \ - n))\n    return w, m * (n - 1) * w\n\n\nW_KEND_ALT, CHI2_ALT = kendall(UTIL_BY_EXPERT)\nCHI2_CRIT_ALT = float(stats.chi2.ppf(0.95,\
    \ N_ALT - 1))\n\n# ======================================================================= Ієрархічна адитивна згортка\
    \ ризику\n# Рівні декомпозиції ТКС: вага рівня W_l (бали 3 експертів 1–10 → нормалізація), елементи з вагою w (Σw = 1\
    \ у\n# межах рівня) та ризиком r = p · c, де p — імовірність успішної атаки на елемент за рік, c — частка\n# максимального\
    \ збитку системи. R_sub = Σ w·r, R_sys = Σ W_l · R_sub.\nLEVELS = [\"1. Рівень збору даних і виконання\", \"2. Рівень\
    \ комунікації та мережі\",\n          \"3. Рівень хмарної обробки та застосунків\"]\nLEVEL_SCORES = np.array([[7, 8, 7],\
    \ [8, 9, 9], [9, 8, 9]])    # рядки — рівні, стовпці — експерти\nW_LEVEL = LEVEL_SCORES.mean(axis=1) / LEVEL_SCORES.mean(axis=1).sum()\n\
    \n# (назва, w, p, c)\nSTAGE0 = {   # початковий стан — АСКОЕ\n    LEVELS[0]: [(\"Лічильники (75), DLMS/COSEM\", 0.60,\
    \ 0.30, 0.40), (\"УЗПД\", 0.40, 0.35, 0.60)],\n    LEVELS[1]: [(\"Шина RS-485 без шифрування\", 0.50, 0.50, 0.40), (\"\
    Канал LTE до ППКО (APN)\", 0.30, 0.20, 0.50),\n                (\"Ethernet УЗПД — сервер (TCP)\", 0.20, 0.40, 0.40)],\n\
    \    LEVELS[2]: [(\"Сервер АСКОЕ (локальний)\", 0.50, 0.30, 0.60), (\"АРМ управителя (HTTP)\", 0.30, 0.45, 0.40),\n  \
    \              (\"Застосунок мешканця (HTTPS)\", 0.20, 0.20, 0.30)],\n}\nSTAGE1 = {   # еволюційний розвиток — мікромережа\
    \ до впровадження СЗІБ (вхідні дані ЛР3)\n    LEVELS[0]: [(\"Лічильники, DLMS/COSEM HLS\", 0.20, 0.25, 0.40), (\"Датчики\
    \ середовища, Modbus RTU\", 0.15, 0.50, 0.30),\n                (\"Інвертори й УЗЕ, Modbus TCP\", 0.30, 0.55, 0.80), (\"\
    Контролер мікромережі\", 0.35, 0.45, 0.90)],\n    LEVELS[1]: [(\"Шлюз безпеки (межа сегментів)\", 0.35, 0.50, 0.90), (\"\
    MQTT/TLS у VPN: оптика + LTE\", 0.25, 0.30, 0.70),\n                (\"Технологічний Ethernet (Modbus TCP)\", 0.25, 0.70,\
    \ 0.80), (\"Zigbee та OCPP (бездротові)\", 0.15, 0.40, 0.50)],\n    LEVELS[2]: [(\"Хмарна платформа і цифровий двійник\"\
    , 0.40, 0.45, 0.90), (\"API агрегатора (OpenADR)\", 0.25, 0.40, 0.70),\n                (\"Застосунок і АРМ (HTTPS, OAuth\
    \ 2.0)\", 0.20, 0.50, 0.50), (\"SIEM\", 0.15, 0.30, 0.40)],\n}\n\n\ndef hierarchy(stage):\n    rows, total = [], 0.0\n\
    \    for wl, (lvl, elems) in zip(W_LEVEL, stage.items()):\n        assert abs(sum(e[1] for e in elems) - 1) < 1e-9, lvl\n\
    \        r_sub = sum(w * p * c for _, w, p, c in elems)\n        total += wl * r_sub\n        rows.append(dict(level=lvl,\
    \ W=wl, R_sub=r_sub, contrib=wl * r_sub,\n                         elems=[(n, w, p, c, p * c) for n, w, p, c in elems]))\n\
    \    for r in rows:\n        r[\"share\"] = r[\"contrib\"] / total\n    return rows, total\n\n\nH0, R_SYS0 = hierarchy(STAGE0)\n\
    H1, R_SYS1 = hierarchy(STAGE1)\n\n# ======================================================================= Самоперевірки\
    \ моделі\nassert abs(W.sum() - 1) < 1e-12 and abs(W_LEVEL.sum() - 1) < 1e-12\nassert CORR[0, 1] > 0.5 and CORR[1, 3] <\
    \ -0.5, \"очікувані знаки зв'язків C1–C2 (+) і C2–C4 (−)\"\nassert BEST == 3 and BEST in PARETO and all(b == BEST for\
    \ *_, b in SENS)\nassert R_SYS1 > R_SYS0 and max(H1, key=lambda r: r[\"contrib\"])[\"level\"] == LEVELS[1]\n\n\ndef report():\n\
    \    pd.set_option(\"display.width\", 140)\n    df = pd.DataFrame({\"Критерій\": CRITERIA, \"Експерт 1\": expert_1, \"\
    Експерт 2\": expert_2, \"Експерт 3\": expert_3,\n                       \"Середній бал\": MEAN.round(3), \"Ваговий коефіцієнт\"\
    : W.round(4)})\n    print(\"--- РЕЗУЛЬТАТИ ЕКСПЕРТНОГО ОЦІНЮВАННЯ ---\")\n    print(df.to_string(index=False))\n    print(\"\
    \\n--- МАТРИЦЯ КОРЕЛЯЦІЙ (методика вказівок, n = 3) ---\")\n    print(pd.DataFrame(CORR_BRIEF, index=CRITERIA, columns=CRITERIA).round(2).to_string())\n\
    \    print(f\"критичне |r| (α = 0,05; n = 3) = {R_CRIT3:.3f}\")\n    print(\"\\n--- УЗГОДЖЕНІ ОЦІНКИ АЛЬТЕРНАТИВ І ЗВАЖЕНА\
    \ СУМА ---\")\n    da = pd.DataFrame(ALT_MEAN.round(2), index=[a for a, _ in ALTS], columns=CRITERIA)\n    da[\"U = Σ\
    \ W·s\"] = UTIL.round(3)\n    print(da.to_string())\n    print(f\"найкраща альтернатива: {ALTS[BEST][0]}; Парето-множина:\
    \ {[ALTS[i][0] for i in PARETO]}\")\n    print(f\"конкордація експертів щодо альтернатив W = {W_KEND_ALT:.3f}, χ² = {CHI2_ALT:.2f}\
    \ \"\n          f\"(χ²крит = {CHI2_CRIT_ALT:.2f})\")\n    print(\"\\n--- МАТРИЦЯ КОРЕЛЯЦІЙ КРИТЕРІЇВ (по 7 альтернативах)\
    \ ---\")\n    print(pd.DataFrame(CORR, index=CRITERIA, columns=CRITERIA).round(2).to_string())\n    print(f\"критичне\
    \ |r| (α = 0,05; n = {N_ALT}) = {R_CRIT:.3f}\")\n    for name, H, R in ((\"ПОЧАТКОВИЙ СТАН\", H0, R_SYS0), (\"ЕВОЛЮЦІЙНИЙ\
    \ РОЗВИТОК (до СЗІБ)\", H1, R_SYS1)):\n        print(\"\\n\" + \"=\" * 75 + f\"\\n РОЗРАХУНОК РИЗИКІВ: {name}\\n\" + \"\
    =\" * 75)\n        for r in H:\n            print(f\"[{r['level']}] (вага рівня {r['W']:.4f})\")\n            for n, w,\
    \ p, c, rr in r[\"elems\"]:\n                print(f\"  - {n}: w = {w}, p = {p}, c = {c}, r = {rr:.3f}\")\n          \
    \  print(f\"  --> R_sub = {r['R_sub']:.4f}; внесок W·R_sub = {r['contrib']:.4f} ({r['share']:.1%})\")\n        print(f\"\
    ІНТЕГРОВАНИЙ РИЗИК R_sys = {R:.4f} ({R:.1%})\")\n\n\nif __name__ == \"__main__\":\n    report()\n"

    Для таких пар не існує рішення, найкращого за обома критеріями одночасно, і вибір потребує компромісу (згортки з вагами,
    як у розділі 3, або оптимізації).
- h1: 5. Структурне моделювання та оцінка безпеки
  new_page: true
- h2: 5.1. Ієрархічна адитивна згортка ризику
- p: 'Для оцінки безпеки систему декомпоновано на 3 рівні за прикладом вказівок [1]: збір даних і виконання, комунікація та
    мережа, хмарна обробка та застосунки. Вагу рівня $W_l$ визначили ті самі 3 експерти (бали важливості 1–10 з нормалізацією,
    табл. {tab:lw}), ризик елемента — як добуток імовірності успішної атаки на елемент протягом року p на частку максимального
    збитку c, яку спричиняє така атака:'
- eq:
  - r_{lj} = p_{lj} \cdot c_{lj}, \qquad R_{sub,l} = \sum_{j} w_{lj}\, r_{lj}, \quad \sum_j w_{lj} = 1,
  - R_{sys} = \sum_{l=1}^{3} W_l \, R_{sub,l} .
  id: rsys
- p: На відміну від прикладу вказівок, ваги елементів у межах рівня нормалізовано до одиниці, тому $R_{sub}$ — середньозважений
    ризик елементів рівня, а $R_{sys}$ лежить у межах від 0 до 1.

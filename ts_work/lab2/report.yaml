- h1: 6. Відповіді на контрольні запитання
  new_page: true
- p: 1. Що є основною метою багатокритеріального аналізу при проєктуванні СЗІБ? — Обрати рішення (склад заходів захисту, архітектуру),
    яке є найкращим компромісом між суперечливими критеріями — захищеністю, надійністю, масштабованістю й вартістю, — коли
    жодне рішення не найкраще за всіма критеріями одночасно (у роботі — альтернатива A3).
- p: '2. У яких випадках доцільно застосовувати експертні оцінки замість точних статистичних вимірювань? — Коли статистики
    немає або вона нерепрезентативна: нова система (мікромережа ще не експлуатувалась), рідкісні події (цільові кібератаки),
    якісні критерії (важливість, наслідки).'
- p: 3. Як розраховуються нормалізовані вагові коефіцієнти Wi? — Середній бал критерію за всіма експертами ділиться на суму
    середніх балів усіх критеріїв (формула {eq:w}); сума ваг дорівнює 1.
- p: '4. Що характеризує матриця кореляцій критеріїв? — Тісноту й напрям лінійних зв’язків між критеріями: додатні коефіцієнти
    — критерії змінюються разом, від’ємні — конфліктують. Вона показує, які критерії дублюють один одного, а які потребують
    компромісу.'
- p: 5. Як інтерпретувати сильну додатну кореляцію між «Надійністю» та «Захищеністю»? — Заходи, що підвищують захищеність
    (перевірка команд, сегментація, автономний режим), одночасно підвищують стійкість до збоїв; ці критерії поліпшуються разом
    і не конфліктують.
- p: 6. Чому між «Захищеністю» та «Вартістю/Ефективністю» виникає обернена кореляція? — Кожен додатковий захід (SIEM, SOC,
    сертифікати) потребує витрат на впровадження та супровід, тому вищий рівень захисту знижує економічну оцінку; у роботі
    r = −0,92.
- p: 7. Що таке системна декомпозиція і яке її значення для ієрархічних моделей? — Розчленування системи на підсистеми та
    елементи за обраною ознакою (тут — рівні збору, комунікації, обробки). Вона дає змогу оцінювати складну систему поелементно
    і згортати оцінки знизу вгору.
- p: 8. Які переваги дає Mermaid.js для візуалізації архітектури? — Схема описується текстом, тому її легко версіонувати,
    генерувати з моделі програмно (як у цій роботі), швидко змінювати й однаково відтворювати; рендеринг автоматичний.
- p: '9. Як співвідносяться початковий стан і стан еволюційного розвитку? — Стан розвитку зберігає елементи початкового (лічильники,
    УЗПД) і додає нові: виконавчі пристрої, контролер, хмару, цифровий двійник; разом із функціональністю зростають поверхня
    атак і ризик.'
- p: '10. Чому локальні підходи до кібербезпеки неефективні в екосистемах IoT? — Периметра більше немає: пристрої керуються
    дистанційно через хмару й зовнішні API, протоколи технологічного рівня (Modbus) не мають автентифікації, а наслідки атак
    стають фізичними.'
- p: 11. За якою формулою обчислюється локальний ризик підсистеми $R_{sub}$? — $R_{sub}$ = $\sum_j w_j r_j$ — зважена сума
    ризиків елементів рівня (формула {eq:rsys}).
- p: 12. Як визначається інтегрований ризик системи $R_{sys}$? — $R_{sys}$ = $\sum_l W_l$ · $R_{sub,l}$ — адитивна згортка
    ризиків рівнів з їхніми вагами.
- p: '13. Який рівень зазвичай має найбільший внесок у ризик і чому? — Рівень комунікації (40,1 % у роботі): він об’єднує
    всі потоки, містить бездротові канали й шлюзи на межі довіри, а технологічні протоколи передають дані без захисту.'
- p: 14. Які вимоги висуваються до системних моделей для оцінки кіберризиків? — Адекватність (модель відображає суттєві властивості
    об’єкта), повнота (враховано всі значущі елементи й загрози), точність (оцінки достатньо точні для прийняття рішень).
- p: 15. Як автоматизований розрахунок і діаграми допомагають ОПР? — Показують, які рівні дають найбільший внесок у ризик
    і де вкладення дадуть найбільший ефект, дозволяють швидко перерахувати варіанти при зміні оцінок; це основа для розподілу
    бюджету в ЛР3.
- h1: Висновки
  new_page: true
- p: '1. Для мікромережі будинку визначено 4 критерії й проведено експертне оцінювання (3 експерти): найвищі ваги мають захищеність
    (0,292) і надійність (0,281), нижчі — масштабованість (0,225) і вартість / ефективність (0,202).'
- p: 2. Багатокритеріальний аналіз 7 альтернатив методом зваженої суми визначив найкращою альтернативу A3 — комплексний захист
    (U = 7,813); вибір стійкий до зміни ваг на ±20 % і збігається з результатом аналізу «вартість — ризик» у ПР1.
- p: 3. Матриця кореляцій за оцінками альтернатив виявила критичний конфлікт «захищеність — вартість» (r = −0,92, значущий
    за α = 0,05) і додатний зв’язок надійності з захищеністю (r = 0,68). Кореляція за трьома експертами (методика вказівок)
    статистично незначуща й відображає розбіжність експертів, а не зв’язок критеріїв.
- p: 4. Двоетапна структурна модель у Mermaid і ієрархічна згортка показали зростання інтегрованого ризику з 15,8 % до 33,3
    % при переході до мікромережі без додаткового захисту; найбільший внесок (40,1 %) дає рівень комунікації, тому саме він
    має бути пріоритетом розподілу бюджету СЗІБ у ЛР3.

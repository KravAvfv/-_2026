- h1: 5. Відповіді на контрольні запитання
  new_page: true
- p: '1. Яку роль відіграє цільова функція у задачах оптимізаційного моделювання систем? — Вона кількісно зв’язує змінні керування
    (вкладення в рівні) з показником якості (ризиком) і є критерієм порівняння рішень: оптимальним вважається розподіл, що
    мінімізує $R_{sys}$ (формула {eq:obj}).'
- p: 2. Чому ефект від інвестування в захист описується нелінійними (спадно-експоненційними) залежностями? — Спочатку впроваджують
    найдешевші й найефективніші заходи (закриття відкритих портів, сегментація), далі кожен захід дорожчий і закриває менше
    загроз; ризик не може стати від’ємним і наближається до нуля асимптотично — це закон спадної віддачі [4].
- p: 3. Які обмеження найчастіше враховуються при оптимізації ресурсів СЗІБ? — Загальний бюджет ($\sum x_i$ = B або ≤ B),
    мінімальні вимоги до захисту кожного елемента ($x_i$ ≥ $x_{i,\min}$, наприклад нормативні), невід’ємність змінних, а також
    обмеження часу, персоналу й сумісності обладнання.
- h1: Висновки
  new_page: true
- p: 1. Поставлено задачу оптимального розподілу бюджету СЗІБ мікромережі будинку між трьома рівнями з цільовою функцією інтегрованого
    ризику зі спадною експоненційною віддачею, обмеженням-рівністю на бюджет і мінімальними вимогами до рівнів; показано,
    що задача опукла.
- p: 2. Метод SLSQP дав оптимальний розподіл 34 989 / 62 673 / 52 339 грн; найбільша частка (41,8 %) — мережевому рівню. Ризик
    знижується з 33,3 % до 14,1 %; розв’язок підтверджено умовами ККТ і запуском з різних початкових точок.
- p: 3. Оптимальний розподіл кращий за рівномірний і пропорційний, але виграш малий (1,7 %) через пологість цільової функції;
    для коректної роботи SLSQP змінні потрібно масштабувати.
- p: 4. Мінімум сумарних витрат «вкладення + очікувані втрати» досягається при бюджеті ≈ 170 000 грн, тож бюджет 150 000 грн
    обґрунтований; зниження ризику до 10 % потребує 217 206 грн.

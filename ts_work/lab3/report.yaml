    вкладень. Жодне обмеження $x_i$ ≥ $x_{i,\min}$ в оптимумі не активне.'
- h2: 3.2. Аналітична перевірка (умови Каруша — Куна — Таккера)
- p: 'Для функції Лагранжа $L = R_{sys}(x) + \lambda (\sum x_i - B)$ умова оптимальності для внутрішнього розв’язку — рівність
    граничних ефектів вкладень на всіх рівнях [5]:'
- eq:
  - W_i R_{i0} k_i e^{-k_i x_i} = \lambda, \quad i = 1, 2, 3,
  - x_i^{*} = \max\left( x_{i,\min},\; \frac{1}{k_i} \ln \frac{W_i R_{i0} k_i}{\lambda} \right) .
  id: kkt
- p: 'Множник λ знайдено бісекцією з умови $\sum x_i$ = B: λ = 7,250·10⁻⁷ 1/грн. Це гранична ефективність бюджету: кожна додаткова
    тисяча гривень знижує мінімальний ризик приблизно на 0,00073. Аналітичний розв’язок збігається з SLSQP з точністю до 1
    грн (табл. {tab:kkt}), а запуск SLSQP з 4 різних початкових точок дає той самий розподіл, що підтверджує глобальність
    мінімуму.'

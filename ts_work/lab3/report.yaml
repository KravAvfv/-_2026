- h1: Додаток А. Лістинг програми оптимізації
  new_page: true
- p: 'Файл optim_l3.py (Python 3; numpy, scipy). Запуск: python optim_l3.py.'
- code: "#!/usr/bin/env python3\n\"\"\"ЛР3 «Оптимізаційне моделювання та розподіл ресурсів у задачах забезпечення інформаційної\
    \ безпеки ТКС» —\nдисципліна «Теорія систем», варіант 8 «Розумна енергомережа (Smart Grid)».\n\nВихідні дані — результати\
    \ ЛР2 (mcda_l2.py): ваги рівнів W_i і ризики рівнів R_i0 мікромережі до впровадження\nСЗІБ; бюджет — вартість обраного\
    \ в ПР1 варіанта комплексного захисту. Ефект вкладень — спадна експонента\n(закон спадної віддачі): R_i(x_i) = R_i0 ·\
    \ exp(−k_i · x_i), k_i = ln 2 / h_i, де h_i — «напівперіод» вкладень\n(сума, що вдвічі знижує ризик рівня; експертна оцінка).\
    \ Розв'язок — SLSQP (scipy.optimize) і для контролю —\nаналітичні умови Каруша — Куна — Таккера. Числові вихідні дані\
    \ — умовна навчальна модель. Запуск: python optim_l3.py\n\"\"\"\nimport numpy as np\nimport scipy.optimize as opt\n\n\
    LEVELS = [\"Рівень 1 (збір даних і виконання)\", \"Рівень 2 (комунікація та мережа)\",\n          \"Рівень 3 (хмарна обробка\
    \ та застосунки)\"]\nW = np.array([22, 26, 26]) / 74                 # ваги рівнів з ЛР2 (середні бали експертів 7,33;\
    \ 8,67; 8,67)\nR0 = np.array([0.31625, 0.38, 0.30])            # R_sub рівнів з ЛР2 (стан розвитку до СЗІБ)\nH = np.array([60_000,\
    \ 30_000, 45_000])          # напівперіод вкладень h_i, грн\nK = np.log(2) / H                               # коефіцієнти\
    \ ефективності k_i, 1/грн\nX_MIN = np.array([15_000, 20_000, 15_000])      # мінімальні вимоги до захисту рівнів, грн\n\
    B_TOTAL = 150_000                               # загальний бюджет СЗІБ, грн (варіант «Б» з ПР1)\nLOSS = 1_500_000   \
    \                             # максимальний збиток системи, грн (ПР1)\n\n\ndef risk(x):\n    \"\"\"Цільова функція: інтегрований\
    \ зважений ризик системи R_sys(x1, x2, x3).\"\"\"\n    return float(np.sum(W * R0 * np.exp(-K * np.asarray(x))))\n\n\n\
    def grad(x):\n    return -W * R0 * K * np.exp(-K * np.asarray(x))\n\n\ndef solve_slsqp(budget=B_TOTAL, x0=None):\n   \
    \ \"\"\"SLSQP у тисячах гривень (масштабування: градієнт у гривнях ~1e-6 зупиняє метод на старті).\"\"\"\n    s = 1000.0\n\
    \    cons = ({\"type\": \"eq\", \"fun\": lambda y: np.sum(y) - budget / s, \"jac\": lambda y: np.ones(3)},)\n    bounds\
    \ = [(m / s, budget / s) for m in X_MIN]\n    y0 = np.full(3, budget / 3 / s) if x0 is None else np.asarray(x0) / s\n\
    \    res = opt.minimize(lambda y: risk(y * s), y0, jac=lambda y: grad(y * s) * s, method=\"SLSQP\",\n                \
    \       bounds=bounds, constraints=cons, options={\"ftol\": 1e-14, \"maxiter\": 500})\n    assert res.success, res.message\n\
    \    res.x = res.x * s\n    return res\n\n\ndef solve_kkt(budget=B_TOTAL):\n    \"\"\"Аналітичний розв'язок: x_i = max(x_min,i,\
    \ ln(W_i·R_i0·k_i / λ) / k_i), λ — з умови Σx_i = B (бісекція).\"\"\"\n    a = W * R0 * K\n\n    def x_of(lam):\n    \
    \    return np.maximum(X_MIN, np.log(a / lam) / K)\n\n    lo, hi = 1e-15, a.max()\n    for _ in range(200):\n        mid\
    \ = np.sqrt(lo * hi)\n        lo, hi = (mid, hi) if x_of(mid).sum() > budget else (lo, mid)\n    lam = np.sqrt(lo * hi)\n\
    \    return x_of(lam), lam\n\n\nRES = solve_slsqp()\nX_OPT, R_OPT = RES.x, RES.fun\nX_KKT, LAM = solve_kkt()\nR_START\
    \ = risk(np.zeros(3))                                          # без вкладень (= R_sys ЛР2)\nX_EQ = np.full(3, B_TOTAL\
    \ / 3)\nR_EQ = risk(X_EQ)                                                    # рівномірний розподіл\nX_PROP = B_TOTAL\
    \ * W * R0 / np.sum(W * R0)                           # пропорційно внеску рівня в ризик\nR_PROP = risk(X_PROP)\nMARGINAL\
    \ = W * R0 * K * np.exp(-K * X_OPT)                           # −∂R/∂x_i в оптимумі (≈ λ для внутрішніх)\nLEVEL_RISK =\
    \ R0 * np.exp(-K * X_OPT)                                 # залишковий ризик кожного рівня\n\n# Перевірка глобальності:\
    \ задача опукла (сума опуклих експонент, лінійні обмеження) — старт з різних точок\nSTARTS = [np.array(s, float) for s\
    \ in ([15_000, 20_000, 115_000], [115_000, 20_000, 15_000],\n                                       [15_000, 115_000,\
    \ 20_000], [50_000, 50_000, 50_000])]\nMULTI = [solve_slsqp(x0=s).x for s in STARTS]\n\n# Чутливість до бюджету: R*(B)\
    \ і двокритеріальна згортка «вкладення + очікувані втрати» Z(B) = B + L·R*(B)\nBUDGETS = np.arange(50_000, 400_001, 10_000)\n\
    CURVE = [(b, *solve_kkt(b)) for b in BUDGETS]\nR_CURVE = np.array([risk(x) for _, x, _ in CURVE])\nZ_CURVE = BUDGETS +\
    \ LOSS * R_CURVE\nB_BEST = int(BUDGETS[Z_CURVE.argmin()])\n\n# Обернена задача: мінімальний бюджет, за якого R_sys ≤ R_target\n\
    R_TARGET = 0.10\n\n\ndef min_budget(target=R_TARGET):\n    lo, hi = X_MIN.sum(), 2_000_000\n    for _ in range(100):\n\
    \        mid = (lo + hi) / 2\n        lo, hi = (mid, hi) if risk(solve_kkt(mid)[0]) > target else (lo, mid)\n    return\
    \ hi\n\n\nB_TARGET = min_budget()\n\n# ======================================================================= самоперевірки\n\
    assert abs(X_OPT.sum() - B_TOTAL) < 1e-3 and np.all(X_OPT >= X_MIN - 1e-6)\nassert np.allclose(X_OPT, X_KKT, atol=5.0),\
    \ (X_OPT, X_KKT)\nassert all(np.allclose(m, X_OPT, atol=5.0) for m in MULTI)\nassert R_OPT < R_PROP < R_START and R_OPT\
    \ < R_EQ\nassert int(np.argmax(X_OPT)) == 1                                    # найбільша частка — мережевий рівень\n\
    \n\ndef report():\n    print(\"=\" * 65 + \"\\n    РЕЗУЛЬТАТИ ОПТИМІЗАЦІЙНОГО МОДЕЛЮВАННЯ СЗІБ\\n\" + \"=\" * 65)\n  \
    \  print(f\"Загальний виділений бюджет: {B_TOTAL} грн\")\n    print(f\"Ризик без вкладень: {R_START:.4f} ({R_START:.1%})\"\
    )\n    print(\"Оптимальний розподіл інвестицій по рівнях системи (SLSQP):\")\n    for name, x, xk, r in zip(LEVELS, X_OPT,\
    \ X_KKT, LEVEL_RISK):\n        print(f\" - {name}: {x:10.2f} грн (ККТ: {xk:10.2f}); залишковий ризик рівня {r:.4f}\")\n\
    \    print(f\"Мінімальний досяжний залишковий ризик: {R_OPT:.4f} ({R_OPT:.1%}); λ = {LAM:.3e} 1/грн\")\n    print(f\"\
    Рівномірний розподіл: {R_EQ:.4f}; пропорційний внеску: {R_PROP:.4f}\")\n    print(f\"Бюджет мінімуму Z(B) = B + L·R*(B):\
    \ {B_BEST} грн; бюджет для R_sys ≤ {R_TARGET}: {B_TARGET:.0f} грн\")\n    print(\"=\" * 65)\n\n\nif __name__ == \"__main__\"\
    :\n    report()\n"
  size: 8

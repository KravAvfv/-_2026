blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — вивчити методи оптимізаційного моделювання в системному аналізі, набути навичок формалізації та розв’язання
    задачі розподілу обмеженого бюджету для мінімізації ризиків кіберзагроз методами математичного програмування з використанням
    бібліотеки scipy.optimize [1].
- p: 'Об’єкт захисту — індивідуальний варіант № 8 «Розумна енергомережа (Smart Grid)»: мікромережа багатоквартирного будинку
    (стан еволюційного розвитку з ЛР1, ПР1 і ЛР2). Вихідні дані взято з ЛР2: декомпозиція системи на 3 рівні, експертні ваги
    рівнів і ризики рівнів до впровадження СЗІБ. Загальний бюджет — 150 000 грн, тобто вартість варіанта комплексного захисту
    «Б», обраного в ПР1 і підтвердженого багатокритеріальним аналізом у ЛР2 (альтернатива A3).'
- p: 'Завдання роботи:'
- numbered:
  - 'етап 1 — поставити оптимізаційну задачу: визначити змінні керування x1, x2, x3, загальний бюджет і мінімальні вимоги
    до захисту кожного рівня (розділ 2);'
  - етап 2 — побудувати цільову функцію сумарного ризику системи з урахуванням спадної експоненційної залежності ефекту від
    вкладень (розділ 2);
  - етап 3 — розв’язати задачу методом послідовного квадратичного програмування SLSQP і перевірити розв’язок аналітично, порівняти
    з неоптимальними розподілами (розділ 3);
  - дослідити чутливість до бюджету, визначити економічно обґрунтований бюджет і розв’язати обернену задачу (розділ 4); відповісти
    на контрольні запитання (розділ 5).
- p: Лістинг програми наведено в додатку А. Звіт оформлено за ДСТУ 3008:2015 [2].
- p: Примітка. Коефіцієнти ефективності, мінімальні вимоги й бюджет є умовною навчальною моделлю для варіанта № 8.
- h1: 2. Постановка оптимізаційної задачі
  new_page: true
- h2: 2.1. Змінні керування та обмеження
- p: 'Оптимізація в системному аналізі — пошук найкращого рішення за визначеним критерієм ефективності за наявності обмежень
    на ресурси [3]. Змінні керування — обсяги коштів (грн), що виділяються на захист рівнів мікромережі:'
- bullets:
  - x1 — рівень 1 «Збір даних і виконання» (лічильники, датчики, інвертори й УЗЕ, контролер мікромережі);
  - x2 — рівень 2 «Комунікація та мережа» (шлюз безпеки, технологічний Ethernet, канали до хмари, бездротові мережі);
  - x3 — рівень 3 «Хмарна обробка та застосунки» (хмарна платформа і цифровий двійник, API агрегатора, застосунки, SIEM).
- p: 'Обмеження моделі: сума вкладень дорівнює загальному бюджету СЗІБ, а кожен рівень отримує не менше за мінімальну суму,
    без якої неможливо виконати обов’язкові заходи (табл. {tab:in}):'
- eq:
  - x_1 + x_2 + x_3 = B_{total} = 150\,000 \text{ грн},
  - x_i \ge x_{i,\min}, \quad i = 1, 2, 3 .
  id: cons
- h2: 2.2. Цільова функція ризику
- p: 'Ефект від вкладень у захист описано спадною експонентою: кожна наступна гривня знижує ризик менше за попередню (закон
    спадної віддачі). Таку форму залежності ймовірності інциденту від інвестицій використовує модель Гордона — Лоеба [4] і
    шаблон програми методичних вказівок [1]. Цільова функція — інтегрований зважений ризик системи, як у ЛР2:'
- eq:
  - R_{sys}(x_1, x_2, x_3) = \sum_{i=1}^{3} W_i \, R_{i0} \, e^{-k_i x_i} \;\rightarrow\; \min,
  - k_i = \frac{\ln 2}{h_i} ,
  id: obj
- p: 'де $W_i$ — вага рівня (ЛР2, табл. 2.7); $R_{i0}$ — ризик рівня до вкладень ($R_{sub}$ з ЛР2, табл. 2.9); $k_i$ — коефіцієнт
    ефективності інвестицій; $h_i$ — «напівперіод» вкладень, тобто сума, яка вдвічі знижує ризик рівня. Напівперіод оцінено
    експертно за вартістю типових заходів рівня: найдешевше знизити ризик мережевого рівня (налаштування сегментації, ACL
    і VPN на наявному обладнанні), найдорожче — рівня пристроїв (заміна або доукомплектування великої кількості польових пристроїв).'

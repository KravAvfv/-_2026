- h1: 3. Програмна реалізація та результати
  new_page: true
- h2: 3.1. Розв’язання методом SLSQP
- p: 'Задачу розв’язано функцією scipy.optimize.minimize з методом SLSQP (Sequential Least Squares Programming) — різновидом
    послідовного квадратичного програмування, який підтримує обмеження-рівності, нерівності та межі змінних [6; 7]. Програма
    побудована за шаблоном методичних вказівок з двома уточненнями:'
- bullets:
  - 'змінні масштабовано до тисяч гривень: у гривнях градієнт цільової функції має порядок 10⁻⁶ і метод зупиняється на початковій
    точці, вважаючи її оптимальною (перевірено експериментально);'
  - задано аналітичний градієнт ∂R/∂$x_i$ = −$W_i$ $R_{i0}$ $k_i$ e^(−$k_i$ $x_i$) і межі $x_i$ ≥ $x_{i,\min}$ замість нижньої
    межі 0 шаблону.
- p: 'Результат: метод збігся за 22 ітерацій; розподіл подано в табл. {tab:opt}.'

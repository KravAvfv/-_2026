- h2: 3.3. Порівняння з неоптимальними розподілами
- p: 'Оптимальний розподіл порівняно з двома простими правилами, які часто застосовують на практиці: рівномірним (по 50 000
    грн на рівень) і пропорційним внеску рівня в ризик (рис. {fig:alloc}).'
- figure:
    id: alloc
    src: ts_work/lab3/diagrams/02_alloc.png
    caption: Розподіл бюджету за трьома правилами та залишковий ризик
- p: 'Оптимальний розподіл дає найменший ризик: на 1,7 % менший за рівномірний (0,1436) і на 0,3 % — за пропорційний (0,1416).
    Виграш невеликий, бо поблизу оптимуму цільова функція полога (граничні ефекти рівнів близькі); практичний висновок — розподіл,
    пропорційний внеску в ризик, є добрим наближенням, а оптимізація уточнює його на користь мережевого рівня.'
- h1: 4. Аналіз чутливості та обґрунтування бюджету
  new_page: true
- h2: 4.1. Залежність мінімального ризику від бюджету
- p: 'Задачу розв’язано для бюджетів від 50 000 грн (сума мінімальних вимог) до 400 000 грн із кроком 10 000 грн (рис. {fig:bud}).
    Мінімальний ризик спадає опукло: подвоєння бюджету не подвоює ефект.'
- h2: 4.2. Двокритеріальна задача «вкладення — очікувані втрати»
- p: 'Бюджет і ризик — суперечливі критерії (ЛР2: кореляція «захищеність — вартість» −0,92). Їх згорнуто в один критерій сумарних
    витрат, як в аналізі «вартість — ризик» ПР1, де L — максимальний збиток системи (1 500 000 грн):'
- eq: Z(B) = B + L \cdot R^{*}_{sys}(B) \;\rightarrow\; \min_B .
  id: z
- figure:
    id: bud
    src: ts_work/lab3/diagrams/03_budget.png
    caption: Мінімальний ризик і сумарні витрати залежно від бюджету СЗІБ
- p: Мінімум Z(B) досягається при B ≈ 170 000 грн (Z = 361 141 грн); для обраного бюджету 150 000 грн Z = 361 813 грн, тобто
    лише на 671 грн (0,2 %) більше. Отже, бюджет варіанта «Б» економічно обґрунтований; збільшувати його понад ≈ 170 000 грн
    невигідно, бо гранична гривня вкладень зменшує очікувані втрати менш ніж на гривню.
- h2: 4.3. Обернена задача
- p: 'Обернена постановка — мінімальний бюджет, за якого ризик не перевищує цільового рівня $R_{ціль}$ = 0,10 (10 %): розв’язок
    B = 217 206 грн. Різниця з обраним бюджетом (67 206 грн) — ціна зниження ризику з 14,1 % до 10 %, що дорожче за економічно
    обґрунтований рівень; таке рішення має сенс лише за додаткових вимог (наприклад, регуляторних).'
- h2: 4.4. Рекомендації щодо реалізації
- p: Оптимальний розподіл визначає склад заходів кожного рівня (табл. {tab:meas}); заходи мережевого рівня (сегментація VLAN,
    ACL, шифрування бездротових каналів) практично перевіряються в ПР3 у Cisco Packet Tracer.

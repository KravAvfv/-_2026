- h1: Додаток А. Команди налаштування обладнання
  new_page: true
- p: 'Файл 1_R-GW_вразливий.txt:'
- code: "enable\nconfigure terminal\nhostname R-GW\nno ip domain-lookup\ninterface gigabitEthernet 0/0\n description FIELD-FLAT\n\
    \ ip address 192.168.10.1 255.255.255.0\n no shutdown\ninterface gigabitEthernet 0/1\n description CLOUD\n ip address\
    \ 192.168.99.1 255.255.255.0\n no shutdown\n end\ncopy running-config startup-config\n\n"
  size: 9
- p: 'Файл 2_SW-FIELD_захищений.txt:'
- code: "enable\nconfigure terminal\nhostname SW-FIELD\nno ip domain-lookup\nvlan 10\n name SENSORS\nvlan 20\n name WIFI\n\
    vlan 999\n name PARKING\n exit\ninterface range fastEthernet 0/1 - 3\n switchport mode access\n switchport access vlan\
    \ 10\n switchport nonegotiate\n exit\ninterface fastEthernet 0/4\n switchport mode access\n switchport access vlan 20\n\
    \ switchport nonegotiate\n exit\ninterface range fastEthernet 0/5 - 24\n switchport mode access\n switchport access vlan\
    \ 999\n shutdown\n exit\ninterface gigabitEthernet 0/1\n switchport mode trunk\n switchport trunk native vlan 999\n switchport\
    \ trunk allowed vlan 10,20\n exit\nend\ncopy running-config startup-config\n\n"
  size: 9
- p: 'Файл 3_R-GW_захищений.txt:'
- code: "configure terminal\ninterface gigabitEthernet 0/0\n no ip address\ninterface gigabitEthernet 0/0.10\n description\
    \ SENSORS\n encapsulation dot1Q 10\n ip address 192.168.10.1 255.255.255.0\ninterface gigabitEthernet 0/0.20\n description\
    \ WIFI\n encapsulation dot1Q 20\n ip address 192.168.20.1 255.255.255.0\n exit\naccess-list 100 deny tcp 192.168.10.0\
    \ 0.0.0.255 host 192.168.99.10 eq 80\naccess-list 100 permit tcp 192.168.10.0 0.0.0.255 host 192.168.99.10 eq 443\naccess-list\
    \ 100 permit icmp 192.168.10.0 0.0.0.255 host 192.168.99.10\naccess-list 100 deny ip any any\naccess-list 120 deny ip\
    \ 192.168.20.0 0.0.0.255 192.168.99.0 0.0.0.255\naccess-list 120 deny ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255\n\
    access-list 120 permit ip 192.168.20.0 0.0.0.255 any\naccess-list 10 permit 192.168.99.0 0.0.0.255\ninterface gigabitEthernet\
    \ 0/0.10\n ip access-group 100 in\ninterface gigabitEthernet 0/0.20\n ip access-group 120 in\nline vty 0 4\n access-class\
    \ 10 in\n end\ncopy running-config startup-config\n\n"
  size: 9

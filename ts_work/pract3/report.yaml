- h1: 3. Імітація вразливого стану
  new_page: true
- p: У початковому стані всі пристрої технологічного сегмента та бездротові клієнти перебувають в одній плоскій мережі 192.168.10.0/24,
    точка доступу працює без автентифікації й шифрування (SSID «Default»), а сервер приймає дані за HTTP. Зловмисник з планшетом
    приєднується до відкритої Wi-Fi, отримує адресу в тій самій мережі й безперешкодно досягає лічильника SM-1 і хмарного
    сервера (рис. {fig:atk0}).
- figure:
    id: atk0
    src: ts_work/pract3/diagrams/03_pt_before_attack.png
    caption: 'Вразливий стан: зловмисник з відкритої Wi-Fi досягає лічильника й сервера'
    width_cm: 14.5
- p: 'У режимі Simulation (фільтр HTTP/HTTPS) запит SM-1 до сервера й відповідь проходять через комутатор і шлюз у відкритому
    вигляді: у PDU видно порт 80, IP-адреси й вміст HTTP-відповіді (рис. {fig:http}). Будь-який вузол на шляху може прочитати
    або змінити такі дані [4].'
- figure:
    id: http
    src: ts_work/pract3/diagrams/04_pt_http_plain.png
    caption: 'Simulation Mode: HTTP-відповідь сервера передається відкритим текстом'
    orientation: landscape
- h1: 4. Застосування заходів захисту
  new_page: true
- p: 'Заходи обрано відповідно до розподілу бюджету ЛР3: основна частина припадає на мережевий рівень (табл. {tab:meas}).'
- table:
    font: 12
    id: meas
    caption: Заходи захисту та їх зв’язок з результатами оптимізації
    header:
    - Рівень (ЛР3)
    - Бюджет, грн
    - Захід у Packet Tracer
    widths:
    - 4.0
    - 2.4
    - 10.1
    rows:
    - - Збір даних
      - 34 989
      - пристрої — в окремій VLAN 10, доступ лише до сервера
    - - Мережевий
      - 62 673
      - VLAN 10/20, магістраль 802.1Q з native VLAN 999, вимкнені вільні порти, ACL 100/120 на шлюзі, WPA2-PSK (AES)
    - - Хмарний
      - 52 339
      - вимкнено HTTP, лише HTTPS; керування шлюзом (VTY) — лише з серверного сегмента (стандартний ACL 10)
- h2: 4.1. Сегментація VLAN
- p: Пристрої технологічного сегмента перенесено у VLAN 10 SENSORS, точку доступу — у VLAN 20 WIFI; магістраль до шлюзу передає
    лише VLAN 10 і 20, native VLAN — невикористовувана 999; вільні порти вимкнено [5].
- h2: 4.2. Списки контролю доступу
- p: 'На підінтерфейсах шлюзу застосовано розширені ACL: 100 — з VLAN 10 до сервера дозволено лише HTTPS і ICMP, HTTP заборонено;
    120 — бездротовим клієнтам заборонено доступ до серверного сегмента й до пристроїв VLAN 10. Стандартний ACL 10 обмежує
    віддалене керування шлюзом серверним сегментом (рис. {fig:acl}) [6]. Це прямий аналог прикладу з методичних матеріалів
    «deny tcp … eq 80» [1].'
- figure:
    id: acl
    src: ts_work/pract3/diagrams/05_pt_acl.png
    caption: Списки контролю доступу на маршрутизаторі-шлюзі R-GW
- h2: 4.3. Захист каналів зв’язку
- p: 'Бездротову мережу переведено на WPA2-PSK із шифруванням AES і новим SSID «SG-FIELD» (рис. {fig:wpa}); на сервері вимкнено
    HTTP і залишено HTTPS (рис. {fig:https}) [7]. IPsec VPN не налаштовувався: шлюз і сервер у моделі з’єднано напряму, а
    WPA2 закриває головний вразливий канал — бездротовий.'
- figure:
    id: wpa
    src: ts_work/pract3/diagrams/06_pt_wpa2.png
    caption: Налаштування WPA2-PSK (AES) на точці доступу AP-FIELD
    width_cm: 14.0
- figure:
    id: https
    src: ts_work/pract3/diagrams/09_pt_https.png
    caption: 'Сервер CLOUD-SRV: HTTP вимкнено, HTTPS увімкнено'
    width_cm: 12.0
- h1: 5. Перевірка ефективності
  new_page: true
- p: 'Після налаштування легітимний лічильник SM-1 і далі обмінюється з сервером (рис. {fig:legit}), а планшет зловмисника
    без ключа WPA2 не може приєднатися до точки доступу: бездротовий зв’язок на схемі зник (рис. {fig:t1}), і ping до лічильника
    та сервера не проходить (рис. {fig:atk1}). Підсумок — у табл. {tab:res}.'
- figure:
    id: legit
    src: ts_work/pract3/diagrams/08_pt_after_legit.png
    caption: 'Після захисту: SM-1 → CLOUD-SRV працює'
    width_cm: 12.0
- figure:
    id: t1
    src: ts_work/pract3/diagrams/02_pt_after_topology.png
    caption: Топологія після застосування заходів захисту
    orientation: landscape
- figure:
    id: atk1
    src: ts_work/pract3/diagrams/07_pt_after_attack.png
    caption: 'Після захисту: зловмисник не досягає лічильника й сервера'
    width_cm: 14.5
- table:
    font: 12
    id: res
    caption: Результати перевірки до і після застосування заходів
    header:
    - Перевірка
    - До
    - Після
    widths:
    - 8.5
    - 4.0
    - 4.0
    rows:
    - - ATTACKER → SM-1 (ping)
      - проходить
      - не проходить
    - - ATTACKER → CLOUD-SRV (ping)
      - проходить
      - не проходить
    - - SM-1 → CLOUD-SRV (ping)
      - проходить
      - проходить
    - - Вміст HTTP між SM-1 і сервером
      - читається відкрито
      - HTTP вимкнено, лише HTTPS
    - - Приєднання до Wi-Fi без ключа
      - можливе
      - неможливе (WPA2-PSK)
- h1: 6. Відповіді на контрольні питання
  new_page: true
- p: '1. Чому на початковому етапі пакети від датчиків перехоплюються безперешкодно? — Бо мережа плоска, Wi-Fi відкрита, а
    дані передаються HTTP без шифрування: будь-хто в тій самій мережі бачить і може змінити пакети (рис. {fig:http}).'
- p: '2. Як результати оптимізаційного моделювання впливають на вибір обладнання й налаштувань? — Вони показують, де вкладення
    дають найбільше зниження ризику: мережевий рівень отримав 42 % бюджету, тому основні заходи — VLAN, ACL і WPA2 на комутаторі,
    шлюзі й точці доступу.'
- p: '3. Для чого застосовується VLAN при проєктуванні безпечної архітектури ТКС? — Щоб розділити пристрої за рівнем довіри:
    трафік між сегментами проходить лише через шлюз, де його можна перевірити ACL; компрометація одного сегмента не дає прямого
    доступу до інших.'
- p: 4. Яку роль відіграють ACL у захисті критичних вузлів? — Вони дозволяють лише потрібні протоколи до сервера (HTTPS) і
    блокують усе інше, зокрема спроби з бездротового сегмента та віддалене керування шлюзом з недовірених мереж.
- h1: Висновки
  new_page: true
- p: 1. Побудовано мережну модель мікромережі в Cisco Packet Tracer із зонами сенсорів, мережі та сервера.
- p: 2. Імітація вразливого стану показала, що зловмисник з відкритої Wi-Fi досягає пристроїв і сервера, а HTTP-дані передаються
    відкритим текстом.
- p: '3. Відповідно до розподілу бюджету ЛР3 застосовано заходи мережевого рівня: VLAN, розширені й стандартний ACL, WPA2-PSK
    (AES) і перехід на HTTPS.'
- p: '4. Перевірка підтвердила ефективність заходів: легітимний обмін зберігся, а несанкціонований доступ заблоковано.'

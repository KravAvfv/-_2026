blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — перевірити й практично випробувати результати оптимізаційного моделювання (розподілу ресурсів на захист)
    побудовою віртуальної мережної топології в Cisco Packet Tracer, налаштуванням засобів безпеки (ACL, шифрування, сегментація
    VLAN) та імітацією атак на незахищену мережу [1].
- p: 'Об’єкт — індивідуальний варіант № 8 «Розумна енергомережа (Smart Grid)»: технологічний сегмент мікромережі будинку (лічильник,
    контролер інвертора, система керування УЗЕ), бездротова точка доступу, шлюз і хмарна платформа [2]. Результат оптимізації
    з лабораторної роботи № 3 — розподіл бюджету 150 000 грн: рівень збору даних — 34 989 грн (23 %), мережевий рівень — 62
    673 грн (42 %), хмарний — 52 339 грн (35 %). Найбільшу частку отримав мережевий рівень, тому практичні заходи цієї роботи
    зосереджено саме на ньому.'
- p: 'Етапи роботи за методичними матеріалами [1]:'
- numbered:
  - 'етап 1 — побудова мережної моделі з трьома зонами: сенсори й контролери, мережевий сегмент, серверний сегмент (розділ
    2);'
  - 'етап 2 — імітація вразливого стану: відкрита Wi-Fi, плоска мережа, HTTP без шифрування (розділ 3);'
  - 'етап 3 — застосування заходів: VLAN, стандартні й розширені ACL, WPA2, HTTPS (розділ 4);'
  - 'етап 4 — перевірка ефективності: ping між легітимними вузлами й блокування зловмисника (розділ 5);'
  - відповіді на контрольні питання (розділ 6).
- p: Файл топології — ПР3_Варіант_8_Кравченко.pkt; команди — у додатку А. Звіт оформлено за ДСТУ 3008:2015 [3].
- p: Примітка. Об’єкт — умовний багатоквартирний будинок (навчальна модель варіанта № 8); пристрої технологічного сегмента
    змодельовано вузлами PC-PT, адреси й паролі — навчальні.
- h1: 2. Мережна модель об’єкта
  new_page: true
- p: Топологію (рис. {fig:t0}) поділено на зони відповідно до рівнів оптимізаційної моделі ЛР3; склад вузлів — у табл. {tab:dev}.

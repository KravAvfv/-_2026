    захист команд і безперервність живлення важливіші за масштабованість, на відміну від прикладу брифу.'
  - Масштабованість (22,5 %) і вартість / ефективність (20,2 %) мають нижчий пріоритет, тож економити на СЗІБ коштом надійності
    недоцільно, що узгоджується з вибором варіанта Б у розділі 5.2.
  - Думки експертів узгоджені ($W_K$ = 0,724), але для статистичної значущості на рівні 0,05 потрібно більше експертів.
- h1: Висновки
  new_page: true
- p: '1. Побудовано теоретико-множинну модель мікромережі будинку S = (T, U, X, Y, F, G): 13 входів, з них 4 загрози, 9 виходів
    і 5 станів захищеності; граф переходів показав, що критичного стану можна досягти лише через режим деградації, тому саме
    на цьому переході потрібна найсильніша перевірка команд.'
- p: 2. Двоетапна графова модель у Mermaid показала, що розвиток системи збільшує граф з 10 до 17 вершин, робить його зв’язним
    і підвищує частку захищених каналів з 12 % до 56 %, але створює нові точки зчленування — контролер мікромережі та шлюз
    безпеки.
- p: 3. Оцінка адекватності показала, що модель етапу 2 придатна для аналізу ризиків кібератак після переходу до хмари; її
    обмеження — недеталізовані ланцюг оновлень, внутрішня архітектура хмари й людський чинник.
- p: 4. Імовірність безвідмовної та безпечної роботи зростає з 0,759 до 0,938 (ризик знижується з 24,1 % до 6,2 %); за критерієм
    «вартість — ризик» оптимальний комплексний захист Б (сумарні витрати 195 000 грн); марковська модель дає скорочення частки
    часу в критичному стані з 25,5 % до 2,5 %.
- p: 5. Імітаційне моделювання підтвердило зниження ризику успішної атаки з 69,4 % до 3,8 % (у середньому за 200 запусків),
    а експертне оцінювання визначило захищеність і надійність як пріоритетні критерії розвитку системи.

- h2: 5.2. Оцінка заходів захисту за критерієм «вартість — ризик» (приклад 2)
- p: 'Збитки від критичного інциденту (знеструмлення будинку, пошкодження інверторів і УЗЕ, відновлення) оцінено в L = 1 500

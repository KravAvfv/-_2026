- h2: 2.4. Множина станів X
- p: 'Стани описують рівень захищеності системи (табл. {tab:x}). Крім двох станів із прикладу брифу (нормальний режим і несанкціоноване
    втручання), для мікромережі важливі проміжні стани: деградація, коли атака лише виявлена, і автономний безпечний режим,
    у якому контролер продовжує живити будинок без хмари [5].'
- eq: X = \{x_0, x_1, x_2, x_3, x_4\}, \quad X_{\text{доп}} = \{x_0, x_1, x_2\}, \quad X_{\text{крит}} = \{x_3, x_4\}.

- code: "\"\"\"Імітаційне моделювання накопичення інцидентів безпеки мікромережі будинку (варіант 8, Smart Grid).\n\nАдаптація\
    \ лістингу інфографіки з методичних вказівок ПР1: ті самі кроки (генерація входів, два стани системи,\nнакопичення зломів,\
    \ звіт, графік), параметри — для умовної моделі варіанта (sa_model.SIM).\nЗапуск окремо:  .venv/bin/python ts_work/pract1/sim.py\
    \   (друкує звіт і зберігає графік)\n\"\"\"\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nSEED,\
    \ HOURS = 8, 1000\nP_ATTACK = 0.06          # імовірність атаки або аномалії за годину\nP_BREACH0 = 0.70         # початковий\
    \ стан: RS-485/Modbus без шифрування, пароль за замовчуванням\nP_BREACH1 = 0.04         # стан розвитку: сегментація,\
    \ MQTT поверх TLS, підпис команд, SIEM\n\n\ndef simulate(seed=SEED, hours=HOURS, p_attack=P_ATTACK, p0=P_BREACH0, p1=P_BREACH1):\n\
    \    rng = np.random.default_rng(seed)\n    # 1. Вхідні впливи: телеметрія (потужність будинку, кВт) і потік атак\n  \
    \  load_kw = rng.normal(loc=55, scale=12, size=hours)          # u1–u2: дані лічильників та інверторів\n    attacks =\
    \ rng.choice([0, 1], size=hours, p=[1 - p_attack, p_attack])   # u10–u13: загрози\n    # 2. Два стани системи: однакові\
    \ атаки, різна ймовірність успіху\n    breach0 = np.where(attacks == 1, rng.choice([1, 0], size=hours, p=[p0, 1 - p0]),\
    \ 0)\n    breach1 = np.where(attacks == 1, rng.choice([1, 0], size=hours, p=[p1, 1 - p1]), 0)\n    # 3. Динаміка накопичення\n\
    \    df = pd.DataFrame({\"Година\": np.arange(1, hours + 1), \"Навантаження, кВт\": load_kw, \"Атаки\": attacks,\n   \
    \                    \"Зломи (початковий)\": breach0, \"Зломи (розвиток)\": breach1})\n    df[\"Накопичені (початковий)\"\
    ] = df[\"Зломи (початковий)\"].cumsum()\n    df[\"Накопичені (розвиток)\"] = df[\"Зломи (розвиток)\"].cumsum()\n    a,\
    \ b0, b1 = int(attacks.sum()), int(breach0.sum()), int(breach1.sum())\n    return df, dict(attacks=a, b0=b0, b1=b1, r0=b0\
    \ / a, r1=b1 / a, eff=1 - b1 / b0)\n\n\ndef report(s):\n    line = \"=\" * 60\n    return \"\\n\".join([line, \"   ЗВІТ\
    \ СИСТЕМНОГО АНАЛІЗУ БЕЗПЕКИ МІКРОМЕРЕЖІ БУДИНКУ\", line,\n                      f\"Всього зафіксовано атак/аномалій:\
    \           {s['attacks']}\",\n                      f\"Успішних зломів (початковий стан):          {s['b0']} (ризик {s['r0']:.1%})\"\
    ,\n                      f\"Успішних зломів (стан розвитку, СЗІБ):      {s['b1']} (ризик {s['r1']:.1%})\",\n         \
    \             f\"Ефективність впровадження СЗІБ:             {s['eff']:.1%} зниження ризику\", line])\n\n\ndef plot(df,\
    \ path):\n    import matplotlib\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n    plt.rcParams.update({\"\
    font.family\": \"Times New Roman\", \"font.size\": 12})\n    fig, ax = plt.subplots(figsize=(6.3, 3.4), dpi=300)\n   \
    \ ax.plot(df[\"Година\"], df[\"Накопичені (початковий)\"], color=\"black\", lw=1.6,\n            label=\"Початковий стан\
    \ (АСКОЕ без шифрування)\")\n    ax.plot(df[\"Година\"], df[\"Накопичені (розвиток)\"], color=\"black\", lw=1.6, ls=\"\
    --\",\n            label=\"Стан розвитку (мікромережа + СЗІБ)\")\n    ax.set_xlabel(\"Час, год\")\n    ax.set_ylabel(\"\
    Кількість успішних атак\")\n    ax.grid(True, color=\"#BBBBBB\", lw=0.6)\n    ax.legend(loc=\"upper left\", frameon=True)\n\
    \    ax.set_xlim(0, len(df))\n    ax.set_ylim(bottom=0)\n    fig.tight_layout()\n    fig.savefig(path, dpi=300)\n    plt.close(fig)\n\
    \n\nif __name__ == \"__main__\":\n    df, s = simulate()\n    print(report(s))\n    out = Path(__file__).resolve().parent\
    \ / \"diagrams\" / \"05_simulation.png\"\n    out.parent.mkdir(exist_ok=True)\n    plot(df, out)\n    print(\"→\", out)\n"

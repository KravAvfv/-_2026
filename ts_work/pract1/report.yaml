    обрив каналу відрізає частину системи; шифрується лише 12 % каналів. На етапі 2 граф зв’язний, частка захищених каналів
    зросла до 56 %, а канал до хмари перестав бути мостом завдяки резервуванню. Водночас з’явився центральний вузол — контролер
    мікромережі Н7 зі степенем 8: він і шлюз безпеки Н8 стали головними точками зчленування, що враховано в аналізі «вузьких

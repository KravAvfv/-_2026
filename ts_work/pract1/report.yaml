- h2: 4.3. Висновок про адекватність моделі при переході до хмарної архітектури
- p: 'Модель етапу 1 адекватна для задачі обліку: вона відображає всі канали й показує головний ризик — відсутність шифрування
    та єдину точку збору (УЗПД). Для оцінки ризиків кібератак після переходу до хмари модель етапу 1 неадекватна, бо в ній
    немає каналів керування, а наслідки атак обмежені втратою даних. Модель етапу 2 адекватніше відображає реальні ризики:
    у ній є керуючі виходи y1–y3, хмарні облікові записи як окрема точка компрометації (u13), резервний канал і автономний
    режим x2. Обмеження моделі: не деталізовано ланцюг постачання оновлень, внутрішню архітектуру хмари та людський чинник
    (помилки адміністраторів), а ймовірності переходів є експертними, а не статистичними.'
- h1: 5. Кількісна оцінка надійності, ризику та станів системи

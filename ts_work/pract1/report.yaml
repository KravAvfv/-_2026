- p: 'Лістинг інфографіки з методичних матеріалів [1] адаптовано до варіанта (додаток Б): моделюється 1000 годин роботи; щогодини
    з імовірністю 0,06 відбувається атака або аномалія, яка в початковому стані (RS-485 і Modbus без шифрування, паролі за

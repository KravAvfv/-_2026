- h1: 3. Структурно-функціональна та графова моделі
  new_page: true
- h2: 3.1. Узагальнена модель «вхід — система — вихід»
- p: 'Узагальнену модель за прикладом брифу [1] наведено на рис. {fig:bb}: система перетворює входи U на виходи Y, а загрози
    $U_{\text{загр}}$ діють на неї як окремий небажаний вхід. Схеми побудовано мовою Mermaid (тип graph LR) [2].'
- figure:
    id: bb
    src: ts_work/pract1/diagrams/01_blackbox.png
    caption: Узагальнена модель «вхід — система — вихід» мікромережі будинку
- h2: 3.2. Етап 1 — початковий стан
- p: Графова модель задається графом Γ = (V, E), де вершини — пристрої, контролери, сервери та зовнішні суб’єкти, а ребра
    — канали зв’язку з протоколами [1]. Модель початкового стану (рис. {fig:st0}) має 10 вершин і 8 ребер. Лічильники обмінюються
    даними за протоколами DLMS/COSEM [6] по шині RS-485, що в початковому стані працює без шифрування. Типи ліній пояснено
    в легенді під рисунком.
- figure:
    id: st0
    src: ts_work/pract1/diagrams/02_stage0.png
    caption: Графова модель АСКОЕ будинку — етап 1 (початковий стан)
- p: 'Умовні позначення на рис. {fig:st0}, {fig:st1a} і {fig:st1b}: товста лінія — канал із шифруванням, суцільна — частковий
    захист (автентифікація без шифрування або захист засобами оператора), пунктир — канал без шифрування; товста рамка — точка
    зчленування графа.'
- h2: 3.3. Етап 2 — еволюційний розвиток
- p: 'Модель стану розвитку має 17 вершин і 18 ребер, тому для читабельності її подано двома рисунками, що стикуються по вершині
    Н8 (шлюз безпеки): технологічний сегмент (рис. {fig:st1a}) і хмарний рівень із зовнішніми зв’язками (рис. {fig:st1b}).
    З’являються виконавчі пристрої (інвертори, УЗЕ, зарядні станції, реле, апарат у точці спільного приєднання), контролер
    мікромережі, шлюз безпеки, хмарна платформа з цифровим двійником, SIEM і зв’язки з агрегатором та ОСР.'
- figure:
    id: st1a
    src: ts_work/pract1/diagrams/03_stage1_local.png
    caption: 'Графова модель мікромережі — етап 2, частина 1: технологічний сегмент'
- p: Усі виконавчі пристрої підключені до контролера Н7, який диспетчеризує режими мікромережі [5]. Modbus TCP і Modbus RTU
    не мають власного захисту, тому технологічний сегмент відокремлено від решти мережі шлюзом Н8; повідомлення GOOSE апарата
    ТСП автентифікуються за IEC 62351-6 [7].
- figure:
    id: st1b
    src: ts_work/pract1/diagrams/03_stage1_cloud.png

- h2: 5.1. Імовірність безвідмовної роботи та ризик (приклад 1)
- p: 'За прикладом 1 брифу [1] критичні елементи початкового стану з’єднані послідовно: відмова або злом будь-якого з них
    призводить до інциденту. Тоді ймовірність безвідмовної та безпечної роботи й ризик:'
- eq: P_{\text{сист}} = \prod_{i=1}^{n} P(E_i), \qquad R = 1 - P_{\text{сист}}.

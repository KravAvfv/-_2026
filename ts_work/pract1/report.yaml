- p: 'Канал до хмари продубльовано: основний оптичний і резервний LTE, обидва у VPN, тому ребро Н8 — Н9 кратне. Усі зовнішні
    суб’єкти, крім ППКО, взаємодіють із будинком лише через шлюз Н8 або хмару Н9.'

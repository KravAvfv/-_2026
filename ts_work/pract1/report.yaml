- h2: 7.2. Узгодженість думок експертів
- p: 'Середні бали мають сенс лише за узгоджених думок експертів, тому додатково обчислено коефіцієнт конкордації Кендалла
    [9]. Оцінки кожного експерта переведено в ранги (більший бал — ранг 1, однакові бали отримують середній ранг), Rᵢ — сума
    рангів критерію:'
- eq:
  - W_K = \frac{12\, S}{m^2 (n^3 - n) - m \sum_{j} T_j}, \qquad S = \sum_{i=1}^{n} \bigl(R_i - R̄\bigr)^2,
  - \chi^2 = m\,(n-1)\,W_K,
  id: kendall
- p: 'де m = 3 — кількість експертів, n = 4 — кількість критеріїв, $T_j$ = Σ(t³ − t) — поправка на однакові ранги j-го експерта.
    Суми рангів: 4,5, 5,0, 9,5, 11,0; S = 31,50; $W_K$ = 0,724; χ² = 6,52. Значення $W_K$ > 0,7 свідчить про високу узгодженість.
    Проте за трьох експертів статистика χ² = 6,52 не перевищує критичного значення 7,815 (рівень значущості 0,05, три ступені
    вільності) і перевищує лише значення 6,251 для рівня 0,10. Тому узгодженість значуща на рівні 0,10; для рівня 0,05 групу
    експертів слід розширити до п’яти — семи осіб.'

blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: 'Мета роботи — набути навичок побудови моделей у системному аналізі: формалізованого теоретико-множинного опису «вхід
    — стан — вихід», структурно-функціональних і графових моделей системи на двох етапах її розвитку, а також оцінювання адекватності
    моделі й кількісних показників надійності та ризику інформаційної безпеки [1].'
- p: 'Об’єкт моделювання — індивідуальний варіант № 8 «Розумна енергомережа (Smart Grid)», той самий, що в лабораторній роботі
    № 1: умовний дев’ятиповерховий багатоквартирний будинок на 72 квартири під управлінням ОСББ. Початковий стан — АСКОЕ багатоквартирного
    будинку, стан розвитку — мікромережа будинку («розумна» енергомережа) з власною сонячною електростанцією, установкою зберігання
    енергії (УЗЕ), керованими навантаженнями, хмарною платформою та системою забезпечення інформаційної безпеки (СЗІБ).'
- p: 'Завдання роботи відповідно до методичних матеріалів [1]:'
- numbered:
  - 'задача 1 — теоретико-множинна формалізація системи: множини входів U, виходів Y, станів X та оператори переходу F і виходу
    G (розділ 2);'
  - задача 2 — двоетапна структурно-функціональна модель (початковий стан → еволюційний розвиток) і графова модель зв’язків
    у форматі Mermaid (розділ 3);
  - 'задача 3 — оцінка адекватності моделі (повнота, точність) та аналіз загроз: канали передачі даних, «вузькі місця», перехід
    до хмарної архітектури (розділ 4);'
  - 'кількісні оцінки за прикладами 1–3: імовірність безвідмовної роботи й ризик, критерій «вартість — ризик», матриця переходів
    станів (розділ 5);'
  - імітаційне моделювання накопичення інцидентів і експертне оцінювання критеріїв безпеки та ефективності (розділи 6, 7).
- p: Розрахунки виконано програмно (Python, numpy, scipy, pandas), схеми побудовано у Mermaid [2]; вихідні тексти схем наведено
    в додатку А, лістинг імітаційної моделі — у додатку Б. Звіт оформлено за ДСТУ 3008:2015 [3].
- p: Примітка. Імовірності, вартості та оцінки експертів є умовною навчальною моделлю для варіанта № 8.
- h1: 2. Теоретико-множинна формалізація системи
  new_page: true
- h2: 2.1. Формальна модель «вхід — стан — вихід»
- p: 'У теоретико-множинному підході система розглядається як перетворювач вхідних впливів у вихідні результати з урахуванням
    внутрішнього стану [4]. Для дискретного часу t = 0, 1, 2, … мікромережу будинку описано кортежем:'
- eq: S = \langle T,\; U,\; X,\; Y,\; F,\; G \rangle,
  id: tuple
- eq:
  - 'x(t+1) = F\bigl(x(t),\, u(t)\bigr), \quad F: X \times U \to X,'
  - 'y(t) = G\bigl(x(t),\, u(t)\bigr), \quad G: X \times U \to Y,'
  id: fg
- p: 'де T — множина моментів часу (крок 1 год для оцінок безпеки, 1 с для балансування); U, X, Y — множини входів, станів
    і виходів; F — оператор переходу, G — оператор виходу. Модель охоплює обидва етапи: елементи, що з’являються лише при
    розвитку системи, позначено в таблицях окремо.'
- h2: 2.2. Множина входів U
- p: 'Множина входів U містить 13 елементів (табл. {tab:u}): інформаційні потоки від датчиків, зовнішні дані й запити, команди,
    енергетичний вхід і 4 загрози — потенційні кібератаки, які за брифом також є входами системи [1]:'
- eq: U = \{u_1, u_2, \ldots, u_{13}\} = U_{\text{інф}} \cup U_{\text{загр}}, \quad U_{\text{загр}} = \{u_{10}, \ldots, u_{13}\}.
  id: u

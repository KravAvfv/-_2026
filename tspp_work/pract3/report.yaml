- h2: 2.5. Обчислювальна платформа периферійного шлюзу
- p: Периферійний шлюз виконує адаптацію протоколів, локальне злиття треків, буферизацію до 4 год і аналіз відео, тому потрібна
    продуктивна платформа з апаратним прискоренням нейромереж. Характеристики кандидатів наведено в табл. {tab:cps}, оцінки
    — в табл. {tab:cpe}.
- p: '**Raspberry Pi 5** — чотириядерний Cortex-A76 2,4 ГГц, 1–16 ГБ LPDDR4X, Gigabit Ethernet, PCIe 2.0, живлення 5 В / 5
    А [28]; ціна 80 дол. за 8 ГБ [29]. Апаратного прискорення нейромереж немає, промислового температурного діапазону виробник
    не заявляє.'
- p: '**NVIDIA Jetson Orin Nano Super** — шестиядерний Cortex-A78AE, графічний процесор Ampere на 1024 ядра з 32 тензорними
    ядрами, 8 ГБ пам’яті, режими живлення 7–25 Вт; після оновлення в грудні 2024 р. продуктивність зросла в 1,7 раза, а ціна
    набору розробника знизилася з 499 до 249 дол. [30].'
- p: '**Siemens SIMATIC IOT2050** — промисловий шлюз на процесорі TI ARM (2 або 4 ядра), 1–2 ГБ DDR4, 2 × Gigabit Ethernet,
    RS-232/485, mPCIe, живлення 24 В, діапазон −20…+50 °C, кріплення на DIN-рейку, захищене завантаження [31]. Надійний, але
    продуктивності недостатньо для аналізу відео.'

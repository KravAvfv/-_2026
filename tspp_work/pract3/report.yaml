blocks:
- h1: Вступ
  new_page: true
- p: Мета роботи — розглянути існуючі програмні та апаратні рішення, які можуть вважатися аналогами або джерелами ідей для
    власного програмного продукту, порівняти їх за обраними критеріями та сформулювати загальне рішення з погляду апаратної
    й програмної частин [1].
- p: 'Програмний продукт — IoT-платформа «Щит-Лінк» на тему «Розподілена IoT-система цілевказівки та координації дронів для
    перехоплення повітряних цілей». Вимоги до продукту визначено в практичній роботі № 1 [2], а чотирирівневу архітектуру
    IoT-рішення (рівні датчиків, мережевий, обробки даних і застосунків) — у практичній роботі № 2 [3]. Робота складається
    з двох розділів: аналізу п’яти програмних аналогів, зокрема з інших предметних областей, і порівняння апаратних засобів
    чотирьох категорій з вибором за методом зважених оцінок. Звіт оформлено відповідно до ДСТУ 3008:2015 [4].'
- p: '*Примітка: РЦПДО «Щит-Північ» і IoT-платформа «Щит-Лінк» є навчальними умовними моделями; описані аналоги та обладнання
    — реальні продукти, дані про які взято з наведених публічних джерел.*'
- h1: 1. Аналіз існуючих програмних рішень
  new_page: true
- p: Для аналізу обрано п’ять програмних рішень. Два з них належать до тієї самої предметної області (система ситуаційної
    обізнаності та платформа виявлення дронів), три — до інших областей (цивільне відстеження повітряних суден, універсальна
    IoT-платформа, наземна станція управління БпЛА), але містять складові, які можна застосувати в «Щит-Лінк».
- h2: 1.1. Система ситуаційної обізнаності DELTA
- p: 'DELTA — національна військова система ситуаційної обізнаності Сил безпеки та оборони України, яка поєднує сенсори, мережі
    зв’язку й аналітику даних для обробки інформації в реальному часі та ухвалення рішень [5]. Система працює у вебпереглядачі
    після автентифікації користувача та має модулі: Monitor (цифрова карта положення своїх військ і противника), Delta Mobile
    (мобільний застосунок з роботою без мережі), Vezha (аналіз відео з захищеною передачею), Target Hub (управління цілями)
    і Mission Control (планування й синхронізація засобів розвідки), а також захищений чат, файлове сховище та інтеграцію
    з іншими бойовими системами [5].'
- p: Система широко запроваджена з серпня 2022 р.; її серверна частина працює в хмарному середовищі, а клієнти — на звичайних
    комп’ютерах, планшетах і смартфонах; дані надходять від дронів, мереж сенсорів, супутникових знімків і розвідувальних
    підрозділів, розробка ведеться в координації з НАТО [6].
- p: '**Що зацікавило:** модульна побудова навколо єдиної цифрової карти, у якій кожен модуль відповідає за окрему функцію;
    мобільний клієнт, що працює без зв’язку; окремий модуль планування місій. Для «Щит-Лінк» ці ідеї використано в структурі
    рівня застосунків: АРМ командного пункту з картою обстановки, мобільний застосунок розрахунку з автономною роботою та
    сервіс «Призначення і місії». Хмарне розміщення ядра натомість не підходить регіональному центру з вимогою захисту інформації
    на власних серверах [2].'
- h2: 1.2. Платформа виявлення дронів DedroneTracker.AI
- p: DedroneTracker.AI — комерційна програмна платформа захисту повітряного простору від дронів. Вона поєднує датчики чотирьох
    типів — радіочастотні, радіолокаційні, відео- та акустичні, а рушій злиття сенсорних даних визначає місцеположення як
    дрона, так і його оператора [7]. Модуль штучного інтелекту аналізує поведінку, зображення та політні дані, формує цілі
    за пріоритетом ризику й розпізнає близько 300 моделей дронів; система одночасно супроводжує кілька дронів, відокремлює
    дружні та надсилає автоматичні сповіщення працівникам у полі й до центру безпеки [7]. Платформа постачається для стаціонарних
    об’єктів, мобільних причепів і портативних комплектів, має відкритий API та понад 20 партнерів з інтеграції обладнання,
    зокрема виробників радарів і камер [7].
- p: '**Що зацікавило:** рушій злиття різнотипних датчиків, база сигнатур для класифікації, автоматичні сповіщення в поле
    та відкритий API для підключення обладнання різних виробників. У «Щит-Лінк» ці ідеї реалізовано в сервісах злиття треків
    і класифікації та в адаптерах протоколів периферійного шлюзу; принцип обов’язкового рішення людини відповідає санкціонуванню
    пуску оперативним черговим [2].'
- h2: 1.3. Мережа відстеження повітряних суден Flightradar24
- p: Flightradar24 — сервіс цивільного відстеження повітряних суден, який поєднує дані ADS-B, мультилатерації (MLAT) і радарів
    з розкладами авіакомпаній та аеропортів [8]. Для визначення положення літака без ADS-B методом мультилатерації потрібно
    щонайменше чотири приймачі мережі, що прийняли сигнал того самого борту [8]. Основу системи становить розподілена мережа
    понад 50 000 приймачів, більшість із яких встановили самі користувачі [9]; власникам підходящих місць компанія безкоштовно
    надсилає готові комплекти приймача, щоб розширити покриття [10].
- p: '**Що зацікавило:** масова мережа недорогих однотипних приймачів, що разом дають покриття, недосяжне для окремих дорогих
    станцій; визначення координат за різницею часу приходу сигналу кількома приймачами; об’єднання кількох джерел даних в
    одну картину. Аналогічно в «Щит-Лінк» 120 недорогих акустичних вузлів визначають координати цілі тріангуляцією пеленгів
    кількох вузлів, що вимагає точної синхронізації часу вузлів.'
- h2: 1.4. IoT-платформа ThingsBoard
- p: ThingsBoard — платформа Інтернету речей із відкритим кодом (ліцензія Apache 2.0) для керування пристроями, збору, обробки
    та візуалізації даних. Компонент ThingsBoard Edge обробляє та зберігає дані локальних пристроїв незалежно від сервера,
    працює без зв’язку з ним і після відновлення з’єднання автоматично синхронізує дані без втрат; підтримуються протоколи
    MQTT, HTTP, CoAP, конструктор ланцюжків правил обробки та панелі реального часу, а один екземпляр Edge обслуговує до 1000
    пристроїв [11].
- p: '**Що зацікавило:** модель «периферійний вузол — центральний сервер» з автономною роботою та автоматичною синхронізацією,
    конструктор правил для сповіщень і відкритий код. Саме така модель покладена в основу периферійного шлюзу позиції «Щит-Лінк»
    з буфером відкладеної передачі [3]. Водночас універсальна платформа не має предметної логіки злиття треків і супроводу
    місій, тому її доцільно розглядати як еталон, а не як основу продукту.'
- h2: 1.5. Наземна станція управління QGroundControl
- p: QGroundControl — наземна станція управління з відкритим кодом (ліцензії Apache 2.0 і GPLv3) для протоколу MAVLink, що
    підтримує автопілоти PX4 і ArduPilot та будь-які апарати з MAVLink, усі типи апаратів (мультикоптери, літаки, VTOL) і
    працює в Windows, macOS, Linux, iOS та Android [12]. Застосунок відображає апарат на карті з індикатором положення, планує
    місії з точками маршруту, геозонами та точками повернення, показує відео з камери апарата [13].
- p: '**Що зацікавило:** робота з протоколом MAVLink незалежно від виробника автопілота, відображення телеметрії та відео
    в реальному часі, кросплатформний клієнт. У «Щит-Лінк» MAVLink 2 використовується для отримання телеметрії перехоплювачів
    через НСУ розрахунку, а мобільний застосунок відображає телеметрію разом із треком цілі. Керування польотом залишається
    функцією НСУ та не входить до меж продукту [2].'
- h2: 1.6. Порівняльний аналіз програмних рішень
- p: 'Аналоги згруповано за чотирма групами критеріїв: дані та сенсори, обробка даних, розгортання та відкритість, взаємодія
    з користувачем (табл. {tab:sw}). Позначки: «+» — властивість реалізовано повністю, «±» — частково, «−» — відсутня; підсумковий
    бал обчислено як суму (+ = 1, ± = 0,5).'

- p: Найбільше властивостей, потрібних «Щит-Лінк», мають ThingsBoard (6,5 бала) і DedroneTracker.AI (6,5 бала), проте жоден
    аналог не покриває всіх груп критеріїв. Системи тієї самої предметної області (DELTA, DedroneTracker.AI) сильні в злитті
    даних і роботі з користувачем, але закриті й прив’язані до хмари або комерційної ліцензії. Рішення з інших областей (ThingsBoard,
    QGroundControl) відкриті, розгортаються на власних серверах і працюють без зв’язку, але не мають предметної логіки. Flightradar24
    найкраще демонструє масову мережу недорогих датчиків і мультилатерацію, але є закритим онлайн-сервісом.
- p: 'Отже, створення власного продукту обґрунтоване: «Щит-Лінк» поєднує предметні функції спеціалізованих систем із відкритістю,
    автономністю та розгортанням на власних серверах, притаманними відкритим IoT-рішенням. Конкретні запозичені рішення та
    місце їх застосування в архітектурі наведено в табл. {tab:take}.'

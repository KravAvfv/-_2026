    виконує Raspberry Pi 5 акустичного вузла. Підсумкова оцінка обраного виробу — 4,50.'
- h2: 2.3. Радіолокаційні станції
- p: Малогабаритна РЛС сектора виявляє низьколетючі малі цілі на дальності кількох кілометрів, передає треки через Ethernet
    і повинна швидко розгортатися. Характеристики кандидатів наведено в табл. {tab:rds}, оцінки — в табл. {tab:rde}.
- p: '**Echodyne EchoGuard** — компактна РЛС з електронним скануванням: сектор 120° × 80°, дальність щодо DJI Phantom 4 понад
    1 км, оновлення треків до 10 Гц, маса 1,25 кг, споживання до 50 Вт, захист IP67, інтерфейс Gigabit Ethernet [19]. Добре
    підходить для захисту окремої позиції, але дальність і сектор замалі для покриття сектора центру.'
- p: '**Robin Radar IRIS** — FMCW-радар X-діапазону з круговим оглядом 360° × 60°, інструментальною дальністю 5 км (12 км
    у режимі великої дальності), класифікацією за мікродоплерівськими ознаками з глибокою нейромережею, API для систем управління
    та роботою в русі [20]; маса 29 кг. Нідерланди передали Україні 51 стаціонарну та ще 51 мобільну РЛС IRIS [21], тобто
    радар має підтверджений досвід експлуатації саме в умовах атак дронів.'
- p: '**Blighter A800** — тримодова FMCW AESA РЛС Ku-діапазону без рухомих частин: сектор 90° × 40°, інструментальна дальність
    3,5, 10 або 20 км, споживання 130 Вт, маса близько 31 кг, IP66, два захищені інтерфейси Gigabit Ethernet і набір SDK [22];
    мікро-БпЛА виявляє на дальності понад 2 км [23]. Вузький сектор потребує кількох РЛС на одну зону.'

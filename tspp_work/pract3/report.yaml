- h1: Висновки
  new_page: true
- p: У роботі розглянуто п’ять програмних аналогів і дванадцять апаратних виробів чотирьох категорій та сформульовано загальне
    рішення для IoT-платформи «Щит-Лінк».
- numbered:
  - 'Програмні аналоги DELTA, DedroneTracker.AI, Flightradar24, ThingsBoard і QGroundControl порівняно за 9 критеріями чотирьох
    груп. Жоден з них не задовольняє всіх вимог: спеціалізовані системи закриті та прив’язані до хмари чи комерційної ліцензії,
    а відкриті платформи не мають предметної логіки. Це обґрунтовує створення власного продукту.'
  - 'Від аналогів запозичено: модульну побудову навколо карти обстановки та офлайн-клієнт (DELTA), злиття різнотипних датчиків
    і відкритий API обладнання (DedroneTracker.AI), мережу недорогих датчиків з визначенням координат кількома вузлами (Flightradar24),
    периферійний вузол з автосинхронізацією (ThingsBoard), роботу з протоколом MAVLink (QGroundControl).'
  - 'Методом зважених оцінок обрано обладнання: мікрофонні решітки miniDSP UMA-16 v2 з модулями Raspberry Pi 5 для акустичних
    вузлів, РЛС Robin Radar IRIS, тепловізійні модулі FLIR Hadron 640R для постів ОЕП і платформу Jetson Orin Nano Super для
    периферійних шлюзів.'
- p: '**Загальне рішення.** Апаратна частина — 120 акустичних вузлів на мікрофонних решітках, 4 РЛС кругового огляду, 12 постів
    ОЕП з подвійними тепловізійно-видимими модулями та 9 периферійних шлюзів з апаратним прискоренням нейромереж. Програмна
    частина — власна IoT-платформа з подієво-орієнтованим ядром на власних серверах, периферійними шлюзами, що працюють автономно,
    сервісами злиття треків, класифікації та супроводу місій, веб-АРМ і мобільним застосунком. Обладнання підключається через
    стандартні інтерфейси (USB Audio, Ethernet API, MAVLink 2), тому заміна виробника потребує лише нового адаптера протоколу
    на шлюзі.'

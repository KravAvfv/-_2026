- h1: 2. Аналіз апаратних рішень
  new_page: true
- h2: 2.1. Склад апаратної частини та методика вибору
- p: 'Відповідно до архітектури ПР2 [3] апаратна частина рівня датчиків і мережевого рівня складається з чотирьох категорій
    обладнання: акустичних сенсорів (мікрофонних решіток) для 120 вузлів, малогабаритних РЛС для 4 секторів, тепловізійних
    модулів для 12 оптико-електронних постів і обчислювальних платформ для 9 периферійних шлюзів. Для кожної категорії розглянуто
    три вироби різних виробників або лінійок.'
- p: Вибір виконано методом зважених оцінок. Для категорії визначено 5–6 критеріїв з вагами w_i (сума ваг дорівнює 1), кожен
    виріб оцінено за шкалою від 1 (найгірше) до 5 (найкраще) на підставі характеристик з джерел, підсумкова оцінка S = Σ w_i
    · b_i. Обирається виріб з найбільшим S; оцінки обґрунтовано в тексті кожного підрозділу.
- h2: 2.2. Акустичні сенсори (мікрофонні решітки)
- p: Акустичний вузол визначає пеленг на джерело звуку двигуна повітряної цілі. Для цього потрібна решітка з кількох мікрофонів
    із синхронною дискретизацією та цифровим інтерфейсом до обчислювального модуля вузла. Характеристики кандидатів наведено
    в табл. {tab:acs}, оцінки — в табл. {tab:ace}.
- p: '**ReSpeaker 6-Mic** — плата розширення для Raspberry Pi з круговою решіткою із шести мікрофонів і двома АЦП AC108; частота
    дискретизації до 48 кГц, відношення сигнал/шум 59 дБ [14]. Рішення дешеве (39,90 дол.), але на сайті виробника позначене
    як зняте з виробництва й відсутнє на складі [15], що неприйнятно для серійних 120 вузлів.'
- p: '**ReSpeaker USB Mic Array v2.0** — чотири цифрові мікрофони та процесор XMOS XVF-3000 з апаратним визначенням напрямку
    приходу звуку, придушенням шуму й луни; живлення від USB 5 В, 180 мА [16]. Обмеження — максимальна частота дискретизації
    16 кГц і алгоритми, налаштовані на голос у радіусі до 5 м [16].'
- p: '**miniDSP UMA-16 v2** — рівномірна прямокутна решітка з 16 мікрофонів Knowles SPH1668LM4H (сигнал/шум 65 дБ, перевантаження
    120 дБ SPL), інтерфейс XMOS із передаванням усіх 16 «сирих» каналів через USB Audio Class 2.0 з роздільністю 24 біт і
    частотою до 48 кГц [17]. Виробник позиціонує її для розроблення алгоритмів формування діаграми спрямованості та акустичних
    камер [17], ціна — 199 дол. [18].'

- h2: 2.4. Тепловізійні та оптико-електронні модулі
- p: Оптико-електронний пост підтверджує ціль уночі та в денних умовах, тому потрібен тепловізійний модуль достатньої роздільної
    здатності, бажано з видимим каналом, і захищений конструктив. Характеристики кандидатів наведено в табл. {tab:eos}, оцінки
    — в табл. {tab:eoe}.
- p: '**FLIR Lepton 3.5** — мікромодуль 160 × 120 пікселів з чутливістю < 50 мК, частотою 8,7 Гц, споживанням 150 мВт, інтерфейсами
    SPI та I²C [24]; ціна 172 дол. [25]. Низька роздільна здатність і частота кадрів не дозволяють розпізнати малу ціль на
    дальності сотень метрів.'
- p: '**FLIR Boson+ 640** — тепловізійне ядро 640 × 512 пікселів із чутливістю ≤ 20 мК, частотою 60 Гц, споживанням від 500
    мВт, масою 7,5 г, вибором об’єктивів від 5,5° до 95° та інтерфейсами USB, CMOS або MIPI [26]. Найкращі параметри тепловізійного
    каналу, але ядро потребує власного корпусу та окремої денної камери.'
- p: '**FLIR Hadron 640R** — подвійний модуль: тепловізійний канал на ядрі Boson+ 640 × 512 і видима камера 64 Мп, відеовихід
    60 Гц через USB або MIPI, маса 56 г, споживання 1,8 Вт, захист IP54 [27]; ціна модуля — від 3 992 дол. [27].'

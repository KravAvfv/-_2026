- h2: 2.6. Підсумковий склад апаратної частини
- p: Обрані вироби та їх розміщення на рівнях архітектури ПР2 показано на рис. {fig:hw} і в табл. {tab:hwsum}. Канали зв’язку
    (mesh-радіо, LTE, супутник) та модулі ГНСС для синхронізації часу вузлів обираються на етапі детального проектування разом
    з адміністраторами мережі центру.

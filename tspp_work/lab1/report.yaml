- h2: 4.4. Нормалізація моделі
- p: Модель перевірено на відповідність трьом нормальним формам.
- p: '**1НФ.** Усі атрибути атомарні: координати зберігаються окремими атрибутами широти й довготи, позивний, номер і стан
    — окремими полями, повторюваних груп немає (наприклад, кілька подій місії — це кілька записів сутності «Подія місії»,
    а не список у місії). Атрибути типу «документ» — межа зони, профіль калібрування, дані події, підтвердження, деталі аудиту
    — система обробляє як одне ціле значення і не виконує за їх частинами з’єднань, тому вони не порушують 1НФ. Кожна сутність
    має первинний ключ.'
- p: '**2НФ.** Складені ключі мають лише дві сутності. У «Праві ролі» єдиний неключовий атрибут — дата надання — залежить
    від пари «роль + право». У «Кадрі телеметрії» координати, висота, швидкість, заряд і якість зв’язку, а також місія залежать
    від пари «перехоплювач + час», бо в інший момент той самий перехоплювач має інші значення. Часткових залежностей немає.'
- p: '**3НФ.** Транзитивні залежності усунуто винесенням довідників (табл. {tab:nf}).'

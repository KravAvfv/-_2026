      - NOT NULL
      - Опис права. Зрозумілий користувачу опис операції
- p: 'Таблиця **role_permission** («Право ролі») — асоціативна таблиця зв’язку «багато-до-багатьох» між ролями та правами.
    Обсяг: ≈ 180 записів; заповнює: адміністратор (зміна — після затвердження начальником центру). Структуру наведено в табл.
    {tab:t_role_permission}.'

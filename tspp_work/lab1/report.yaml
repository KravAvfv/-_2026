- p: 'Таблиця **interceptor_model** («Модель перехоплювача») — тактико-технічні межі моделей дронів-перехоплювачів для перевірки
    здійсненності місії. Обсяг: 4 записи; заповнює: логіст. Структуру наведено в табл. {tab:t_interceptor_model}. Обмеження
    рівня таблиці: CHECK (max_speed_kmh > 0); CHECK (range_km > 0); CHECK (endurance_min > 0).'

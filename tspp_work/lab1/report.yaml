- p: 'Таблиця **detection** («Виявлення») — первинні виявлення, отримані від сенсорів. Обсяг: ≈ 50 000 записів / добу; заповнює:
    периферійний шлюз (автоматично). Структуру наведено в табл. {tab:t_detection}. Обмеження рівня таблиці: CHECK (confidence
    BETWEEN 0 AND 1); CHECK (bearing_deg IS NULL OR bearing_deg BETWEEN 0 AND 360); CHECK (received_at >= detected_at).'
- table:
    font: 11
    id: t_detection
    caption: Структура таблиці detection

- p: 'Таблиця **sector** («Сектор») — зони відповідальності, заборони ураження, коридори дружньої авіації. Обсяг: 12 записів;
    заповнює: офіцер бойового управління. Структуру наведено в табл. {tab:t_sector}. Обмеження рівня таблиці: CHECK (valid_to
    IS NULL OR valid_to > valid_from).'

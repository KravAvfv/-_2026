- h1: 4. Логічна модель бази даних
  new_page: true
- h2: 4.1. Склад сутностей
- p: 'Логічна модель містить 18 сутностей. Їх розподілено за двома ознаками. За характером даних виділено три рівні, як у
    кваліфікаційних роботах кафедри [8]: довідникові (5) — відносно постійні класифікатори, що рідко змінюються; основні (6)
    — головні об’єкти предметної області; операційні (7) — дані, що постійно додаються під час роботи системи. За предметною
    ознакою сутності згруповано в 4 підсистеми, кожну з яких показано на окремій ER-діаграмі. Склад сутностей наведено в табл.
    {tab:ent}; у стовпці «Група» вказано номер підсистеми.'

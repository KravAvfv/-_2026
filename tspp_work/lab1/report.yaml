blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** закріпити знання з організації баз даних на прикладі власного програмного продукту: побудувати та описати
    контекстну, логічну та фізичну моделі бази даних, описати таблиці з типами даних і сформулювати функціональні вимоги до
    програмної реалізації бази даних.'
- p: '**Завдання роботи** [1]:'
- numbered:
  - створити та описати контекстну модель бази даних — розділ 3;
  - створити та описати логічну модель бази даних — розділ 4;
  - створити та описати фізичну модель бази даних, описати таблиці бази даних з типами даних — розділ 5;
  - сформулювати висновки з функціональними вимогами до програмної реалізації бази даних, яку буде реалізовано й проілюстровано
    в лабораторній роботі 2, — розділ «Висновки».
- p: 'Об’єкт моделювання — база даних IoT-платформи «Щит-Лінк» на тему «Розподілена IoT-система цілевказівки та координації
    дронів для перехоплення повітряних цілей». Вимоги до продукту та попередній перелік таблиць визначено в практичній роботі
    № 1 [2], діаграму класів фізичного рівня для фрагмента схеми — у практичній роботі № 4 [3]. У цій роботі модель даних
    розширено до повного складу: 18 таблиць, 139 атрибутів, 26 зв’язків. Звіт оформлено відповідно до ДСТУ 3008:2015 [4].'
- p: '*Примітка: РЦПДО «Щит-Північ» і IoT-платформа «Щит-Лінк» є навчальними умовними моделями; усі назви, дані та показники
    наведено суто з навчально-ілюстративною метою.*'
- h1: 2. Теоретичні відомості
  new_page: true
- h2: 2.1. База даних, СКБД і рівні опису даних
- p: 'База даних (БД) — сукупність взаємопов’язаних даних, організованих за певними правилами, що описують структуру, впорядкованість
    і зв’язки даних. Система керування базою даних (СКБД) надає мову визначення даних, якою описують структуру БД, і мову
    маніпулювання даними, якою дані додають, змінюють, видаляють і вибирають [5]. Для реляційних СКБД обидві мови об’єднано
    в SQL: оператори CREATE, ALTER, DROP належать до мови визначення даних, оператори INSERT, UPDATE, DELETE, SELECT — до
    мови маніпулювання даними.'
- p: 'Трирівнева архітектура СКБД розрізняє три рівні опису даних [5]:'
- bullets:
  - '**зовнішній рівень** (зовнішні схеми) — подання даних з точки зору окремих користувачів і застосунків, кожен з яких бачить
    лише потрібну йому частину БД;'
  - '**концептуальний рівень** (концептуальна схема) — єдина модель предметної області, що об’єднує всі зовнішні подання і
    не залежить від способу зберігання;'
  - '**внутрішній рівень** (внутрішня схема) — фізичне розміщення даних у файлах операційної системи: типи, індекси, способи
    доступу.'
- p: СКБД підтримує відображення «концептуальний — зовнішній» і «концептуальний — внутрішній», завдяки чому зміна зберігання
    не потребує зміни застосунків (фізична незалежність даних), а зміна концептуальної схеми — лише зміни відображень (логічна
    незалежність). Моделі, які вимагає завдання, відповідають цим рівням (табл. {tab:levels}).
- table:
    font: 12
    id: levels
    caption: Відповідність моделей бази даних рівням архітектури СКБД
    header:
    - Модель

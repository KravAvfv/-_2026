      - air_track.identity
    - - mission_state
      - запропонована; відхилена; санкціонована; перепризначена; прийнята; виконується; скасована; закрита
      - mission.state
    - - mission_event_type
      - зміна стану; втрата зв’язку; відновлення зв’язку; оновлення цілі; підтвердження оператора; команда скасування
      - mission_event.event_type
    - - engagement_assessment
      - влучання; промах; скасовано
      - engagement_report.assessment
    - - actor_type
      - користувач; сервіс; пристрій
      - audit_log.actor_type
- h2: 5.4. Опис таблиць бази даних
- p: 'Нижче описано всі 18 таблиць: призначення, очікуваний обсяг, хто заповнює, стовпці з типами даних та обмеженнями. У
    стовпці «Обмеження» вказано: PK — первинний ключ; FK — зовнішній ключ із таблицею, на яку він посилається; UNIQUE — унікальність;
    NOT NULL / NULL — обов’язковість; DEFAULT — значення за замовчуванням; gen_random_uuid() або IDENTITY — спосіб генерації
    ключа.'
- h3: 5.4.1. Довідникові таблиці
- p: 'Таблиця **role** («Роль») — ролі користувачів для розмежування доступу (RBAC). Обсяг: 13 записів; заповнює: адміністратор.
    Структуру наведено в табл. {tab:t_role}.'
- table:
    font: 11
    id: t_role
    caption: Структура таблиці role
    header:

    - - code
      - VARCHAR(10)
      - UNIQUE, NOT NULL
      - Умовний код ролі. Код за матрицею ролей, наприклад «R-03»
    - - name
      - VARCHAR(100)
      - UNIQUE, NOT NULL
      - Назва ролі. Посада або функція, наприклад «Офіцер бойового управління»
    - - combat_rights
      - BOOLEAN
      - NOT NULL, DEFAULT false
      - Ознака бойових прав. Чи може роль санкціонувати місії; у адміністратора завжди false
    - - description
      - TEXT
      - 'NULL'
      - Опис ролі. Довільний опис обов’язків
- p: 'Таблиця **permission** («Право доступу») — елементарні права на операції в системі. Обсяг: ≈ 40 записів; заповнює: адміністратор.
    Структуру наведено в табл. {tab:t_permission}.'

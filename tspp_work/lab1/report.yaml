- p: 'Підсистеми: 1 — «Територія, сенсори та повітряна обстановка», 2 — «Вогневі ресурси», 3 — «Бойові завдання», 4 — «Користувачі,
    доступ і аудит».'
- h2: 4.2. ER-діаграми підсистем
- p: На діаграмах кожна сутність зображена прямокутником, у верхній частині якого — первинний ключ «PK», у нижній — інші атрибути;
    позначка «FK» вказує зовнішній ключ, «U» — унікальний атрибут, зірочка — обов’язковий атрибут. Сутності інших підсистем,
    на які є посилання, показано скорочено (лише ключ) зі стереотипом «група N». Біля ліній зв’язку наведено назву зв’язку
    з боку батьківської сутності.
- h3: 4.2.1. Підсистема «Територія, сенсори та повітряна обстановка»
- p: 'Підсистема (рис. {fig:lg1}) описує, де і що спостерігає центр. «Сектор» містить об’єкти прикриття та охоплює сенсори
    (зв’язки 1 : 0..∗). «Сенсор» формує множину виявлень; кожне «Виявлення» належить рівно одному сенсору, але до зіставлення
    з треком не має треку, тому зв’язок «Повітряний трек — Виявлення» необов’язковий з боку треку (0..1 : 0..∗). «Повітряний
    трек» може посилатися на об’єкт прикриття, до якого прямує ціль, і на користувача, що підтвердив класифікацію; обидва
    зв’язки необов’язкові, бо заповнюються лише після аналізу.'
- figure:
    id: lg1
    src: tspp_work/lab1/diagrams/02_logical_g1.png
    caption: 'Логічна модель: підсистема «Територія, сенсори та повітряна обстановка»'
- h3: 4.2.2. Підсистема «Вогневі ресурси»
- p: 'Підсистема (рис. {fig:lg2}) описує вогневі ресурси. «Вогнева позиція» належить сектору і розміщує розрахунки та зберігає
    перехоплювачі. «Модель перехоплювача» винесено в окрему довідникову сутність: тактико-технічні межі (швидкість, дальність,
    тривалість польоту, граничний вітер) залежать від моделі, а не від екземпляра, тому їх зберігання в «Перехоплювачі» порушило
    б 3НФ. Зв’язок «Позиція — Перехоплювач» необов’язковий: перехоплювач на складі центру не прив’язаний до позиції.'
- figure:
    id: lg2
    src: tspp_work/lab1/diagrams/03_logical_g2.png
    caption: 'Логічна модель: підсистема «Вогневі ресурси»'
- h3: 4.2.3. Підсистема «Бойові завдання»
- p: 'Центральна сутність підсистеми (рис. {fig:lg3}) — «Місія». Вона обов’язково пов’язана з треком-ціллю, розрахунком-виконавцем
    і користувачем, що запропонував місію; перехоплювач і користувач, що санкціонував пуск, заповнюються пізніше, тому ці
    зв’язки необов’язкові. Два зв’язки з «Користувачем» (пропонує, санкціонує) реалізують правило двох осіб. Від місії залежать
    «Подія місії» (хронологія, 1 : 0..∗), «Кадр телеметрії» (1 : 0..∗) і «Звіт про перехоплення» — зв’язок 1 : 0..1, оскільки
    місія має не більше одного звіту. «Кадр телеметрії» має складений ключ «код перехоплювача + час кадру»: перехоплювач у
    кожний момент часу передає не більше одного кадру.'
- figure:
    id: lg3
    src: tspp_work/lab1/diagrams/04_logical_g3.png
    caption: 'Логічна модель: підсистема «Бойові завдання»'
- h3: 4.2.4. Підсистема «Користувачі, доступ і аудит»
- p: Підсистема (рис. {fig:lg4}) реалізує розмежування доступу за ролями. Зв’язок «багато-до-багатьох» між «Роллю» і «Правом
    доступу» розкладено асоціативною сутністю «Право ролі» зі складеним ключем. «Користувач» має рівно одну роль і може входити
    до розрахунку (зв’язок необов’язковий — офіцери КП і адміністратори до розрахунків не входять). «Запис журналу аудиту»
    посилається на користувача лише тоді, коли дію виконала людина; для дій сервісів і пристроїв ключ порожній, а тип суб’єкта
    задає атрибут.
- figure:
    id: lg4
    src: tspp_work/lab1/diagrams/05_logical_g4.png
    caption: 'Логічна модель: підсистема «Користувачі, доступ і аудит»'
- h2: 4.3. Зв’язки між сутностями
- p: Логічна модель містить 26 зв’язків «один-до-багатьох» або «один-до-одного»; зв’язок «багато-до-багатьох» між ролями і
    правами розкладено на два зв’язки «один-до-багатьох». Повний перелік зв’язків з кратністю та атрибутом зовнішнього ключа
    наведено в табл. {tab:rel}. Кратність «1» з боку батьківської сутності означає обов’язковий зовнішній ключ, «0..1» — необов’язковий;
    кратність «0..1» з боку дочірньої сутності означає унікальний зовнішній ключ.

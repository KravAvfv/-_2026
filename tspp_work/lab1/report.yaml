- h3: 5.4.2. Основні таблиці
- p: 'Таблиця **protected_object** («Об’єкт прикриття») — критична інфраструктура, яку прикриває центр. Обсяг: ≈ 40 записів;
    заповнює: офіцер бойового управління. Структуру наведено в табл. {tab:t_protected_object}. Обмеження рівня таблиці: CHECK
    (lat BETWEEN -90 AND 90); CHECK (lon BETWEEN -180 AND 180).'

      - Сутність «Модель перехоплювача», у «Перехоплювачі» — лише код моделі
    - - Користувач → роль → назва ролі, ознака бойових прав
      - Сутність «Роль»
    - - Розрахунок → позиція → сектор
      - Сектор розрахунку не зберігається, визначається через позицію

- h2: 5.5. Індекси
- p: 'Крім індексів, які СКБД автоматично створює для первинних ключів і обмежень UNIQUE, фізична модель містить 10 індексів
    для типових запитів (табл. {tab:ix}). Індекс ix_air_track_active є частковим: він охоплює лише активні треки, тому залишається
    малим, хоча таблиця накопичує тисячі закритих треків.'
- table:
    font: 11
    id: ix
    caption: Індекси фізичної моделі
    header:
    - Індекс
    - Таблиця (стовпці)
    - Призначення
    widths:
    - 4.4
    - 4.8
    - 6.8
    rows:
    - - ix_detection_sensor_time
      - detection (sensor_id, detected_at DESC)
      - Вибірка останніх виявлень сенсора, контроль його працездатності
    - - ix_detection_track
      - detection (track_id)
      - Перелік виявлень, що сформували трек
    - - ix_air_track_active
      - air_track (threat_score DESC)
      - 'Черга загроз: лише активні треки (частковий індекс WHERE state IN (''підтверджений'', ''класифікований'', ''перехоплюється''))'
    - - ix_mission_track
      - mission (track_id)
      - Місії за ціллю, контроль повторного призначення
    - - ix_mission_crew_state
      - mission (crew_id, state)
      - Поточні завдання розрахунку
    - - ix_mission_event_mission
      - mission_event (mission_id, event_at)
      - Хронологія місії
    - - ix_telemetry_mission
      - telemetry_frame (mission_id, ts)
      - Траєкторія перехоплювача в межах місії
    - - ix_personnel_role
      - personnel (role_id)
      - Перелік користувачів ролі
    - - ix_audit_entity
      - audit_log (entity, entity_id)
      - Історія змін конкретного запису
    - - ix_audit_time
      - audit_log (logged_at)
      - Вибірка журналу за період
- h2: 5.6. SQL-скрипт створення бази даних і перевірка моделі
- p: 'Фізичну модель, діаграми та таблиці опису полів сформовано з одного опису моделі, тому вони узгоджені між собою. З того
    самого опису згенеровано SQL-скрипт schema.sql: розширення pgcrypto, 14 операторів CREATE TYPE, 18 операторів CREATE TABLE
    у порядку залежностей (таблиця, на яку посилається зовнішній ключ, створюється раніше), 10 операторів CREATE INDEX і коментарі
    до таблиць. Фрагмент скрипту для таблиці mission наведено на рис. {fig:ddl}.'
- figure:
    id: ddl
    src: tspp_work/lab1/diagrams/10_ddl_mission.png
    caption: 'Фрагмент SQL-скрипту: перелічуваний тип mission_state і таблиця mission'
- p: Скрипт виконано в СКБД PostgreSQL 18.6 без помилок; системний каталог підтвердив 18 таблиць, 26 зовнішніх ключів і 23
    обмеження CHECK. Після вставлення тестових записів (сектор, сенсор, позиція, розрахунок, дві ролі, два користувачі, трек,
    місія) перевірено, що обмеження цілісності працюють так, як задумано в логічній моделі (табл. {tab:tests}).
- table:
    font: 12
    id: tests
    caption: Перевірка обмежень цілісності фізичної моделі
    header:
    - №
    - Перевірка
    - Очікуваний результат
    - Фактичний результат
    widths:
    - 0.8
    - 8.2
    - 3.5
    - 3.5
    rows:
    - - '1'
      - Санкція місії тим самим користувачем, що її запропонував (правило двох осіб)
      - відмова
      - відмова
    - - '2'
      - Санкція місії іншим користувачем
      - успіх
      - успіх
    - - '3'
      - Скасування місії без зазначення причини
      - відмова
      - відмова
    - - '4'
      - Значення стану, якого немає в переліку mission_state
      - відмова
      - відмова
    - - '5'
      - Перший звіт про перехоплення для місії
      - успіх
      - успіх
    - - '6'
      - Другий звіт про ту саму місію
      - відмова
      - відмова
    - - '7'
      - Виявлення з достовірністю 1,5
      - відмова
      - відмова
    - - '8'
      - Повторний номер треку в межах тієї самої доби
      - відмова
      - відмова
    - - '9'
      - Видалення розрахунку, на який посилається місія
      - відмова
      - відмова
- p: 'Усі дев’ять перевірок дали очікуваний результат: правило двох осіб, обов’язковість причини скасування, допустимі стани,
    відношення 1 : 0..1 між місією та звітом, діапазон достовірності, унікальність номера треку в межах доби та посилальна
    цілісність забезпечуються самою СКБД, незалежно від застосунку.'
- h1: Висновки
  new_page: true
- p: У лабораторній роботі спроектовано базу даних IoT-платформи «Щит-Лінк» на трьох рівнях.
- numbered:
  - Контекстна модель визначила межі БД, вісім зовнішніх сутностей і потоки даних між ними та БД; для кожної сутності визначено
    таблиці, з якими вона працює, що є основою зовнішніх схем.
  - Логічна модель містить 18 сутностей (5 довідникових, 6 основних, 7 операційних) у чотирьох підсистемах і 26 зв’язків;
    модель нормалізовано до 3НФ, зв’язок «багато-до-багатьох» розкладено асоціативною сутністю.
  - Фізична модель для PostgreSQL описує 18 таблиць і 139 стовпців з типами даних, 14 перелічуваних типів, 23 обмеження CHECK
    і 10 індексів; SQL-скрипт виконано в СКБД PostgreSQL 18.6, а дев’ять перевірок підтвердили роботу обмежень цілісності.
- p: '**Функціональні вимоги до програмної реалізації бази даних** (будуть реалізовані й проілюстровані в лабораторній роботі
    2):'
- numbered:
  - 'ФВ-БД-01. Створення БД виконанням скрипту schema.sql у PostgreSQL: перелічувані типи, 18 таблиць, обмеження, індекси,
    коментарі.'
  - 'ФВ-БД-02. Наповнення БД тестовими даними: довідники — повним складом, основні таблиці — не менше 10 записів, операційні
    — не менше 20 записів кожна, з дотриманням зовнішніх ключів.'
  - 'ФВ-БД-03. Операції CRUD (створення, читання, оновлення, видалення) для довідників і основних таблиць: секторів, об’єктів
    прикриття, сенсорів, позицій, розрахунків, моделей і екземплярів перехоплювачів, користувачів; відмова у видаленні запису,
    на який є посилання.'
  - ФВ-БД-04. Реєстрація виявлення та його зіставлення з повітряним треком з оновленням часу останнього оновлення треку.
  - 'ФВ-БД-05. Запит «Черга загроз»: активні треки, впорядковані за оцінкою загрози, з прогнозованим об’єктом прикриття і
    часом підльоту.'
  - 'ФВ-БД-06. Ведення життєвого циклу місії: пропозиція, санкція іншим користувачем (правило двох осіб), прийняття, пуск,
    закриття або скасування з причиною.'
  - ФВ-БД-07. Тригер контролю допустимих переходів стану місії відповідно до діаграми станів і автоматичний запис кожної зміни
    стану до таблиці mission_event.
  - ФВ-БД-08. Реєстрація звіту про перехоплення (не більше одного на місію) з автоматичним оновленням стану та лічильника
    вильотів перехоплювача.
  - 'ФВ-БД-09. Представлення (VIEW) готовності ресурсів: розрахунки за позиціями та кількість готових перехоплювачів кожної
    позиції.'
  - 'ФВ-БД-10. Аналітичні запити за період: кількість місій за результатами, частка влучань, середній час «пропозиція — санкція»
    і «санкція — пуск».'
  - 'ФВ-БД-11. Журнал аудиту: тригерний запис змін у таблицях mission, personnel і role_permission з ланцюжком хешів SHA-256
    та заборона змінення й видалення записів журналу.'

- p: 'Таблиця **air_track** («Повітряний трек») — повітряні цілі: стан, належність, оцінка загрози. Обсяг: ≈ 600 записів /
    добу; заповнює: ioT-ядро (злиття), аналітик (класифікація). Структуру наведено в табл. {tab:t_air_track}. Обмеження рівня
    таблиці: UNIQUE (track_number, track_date); CHECK (threat_score BETWEEN 0 AND 100); CHECK (last_update_at >= first_seen_at).'

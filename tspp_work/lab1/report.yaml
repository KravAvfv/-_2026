      - Діаграма таблиць, опис полів, SQL-скрипт
- h2: 2.2. Модель даних і реляційна модель
- p: Модель даних — логічна структура даних, що представляє притаманні цим даним властивості, незалежні від апаратного й програмного
    забезпечення і не пов’язані з функціонуванням комп’ютера. Інформаційна модель даних визначається точкою зору користувача
    в його термінах; засобами опису є сутності, атрибути та зв’язки, а результатом — вихідні дані для визначення зовнішньої
    схеми БД. Структуру даних утворюють об’єкт, властивість об’єкта та значення властивості [5].
- p: Розрізняють ієрархічну, мережеву та реляційну моделі даних. В ієрархічній моделі взаємозв’язки жорстко зафіксовані, і
    зміна зв’язку призводить до реорганізації структури; мережева модель допускає різноманітніші зв’язки, але ускладнює внесення
    змін. У реляційній моделі таблиці незалежні, зв’язки повністю змінні, а модель просто розширюється [5]. Тому для системи
    «Щит-Лінк», модель якої розвиватиметься разом із вимогами, обрано реляційну модель.
- p: 'Для подання логічної моделі використовують діаграми «сутність — зв’язок» (Entity-Relationship Diagrams, ERD) — одну
    з базових моделей структурного аналізу й проектування ІС [6]. У роботі застосовано нотацію інформаційної інженерії (IE,
    «пташина лапка») [7]: риска позначає «рівно один», коло — необов’язковість (нуль), розгалуження — «багато». Такий самий
    порядок «концептуальна модель → логічна і фізична модель → таблиця полів з типами даних» використано в кваліфікаційних
    роботах кафедри [8].'
- h2: 2.3. Нормалізація відношень
- p: 'Нормалізація — послідовне перетворення відношень, що усуває надлишковість даних і аномалії вставлення, оновлення та
    видалення. Для проектування БД програмних продуктів курсу вимагається нормалізація до третьої нормальної форми [9]:'
- bullets:
  - '**перша нормальна форма (1НФ)** — кожен атрибут містить одне неподільне значення, у відношенні немає груп, що повторюються,
    кожен рядок ідентифікується первинним ключем;'
  - '**друга нормальна форма (2НФ)** — відношення в 1НФ, у якому кожен неключовий атрибут залежить від усього первинного ключа,
    а не від його частини (актуально для складених ключів);'
  - '**третя нормальна форма (3НФ)** — відношення в 2НФ, у якому неключові атрибути не залежать один від одного (немає транзитивних
    залежностей через неключовий атрибут).'
- h1: 3. Контекстна модель бази даних
  new_page: true
- h2: 3.1. Призначення та межі бази даних
- p: 'База даних IoT-платформи «Щит-Лінк» є єдиним сховищем оперативних і облікових даних регіонального центру протидронової
    оборони. Вона зберігає: структуру зон відповідальності й об’єктів прикриття; склад і стан сенсорної мережі; первинні виявлення
    та сформовані з них повітряні треки; вогневі ресурси — позиції, розрахунки, перехоплювачі; бойові завдання (місії) з хронологією
    подій, телеметрією та звітами; користувачів, ролі та права; незмінний журнал аудиту.'
- p: 'До меж БД не входять: відеозаписи та сирі сигнали сенсорів (зберігаються в об’єктному сховищі, у БД — лише посилання
    в полі evidence), картографічні підкладки та алгоритми злиття й оцінки загрози (реалізуються сервісами IoT-ядра, БД зберігає
    лише їх результати). Таке розмежування утримує обсяг БД у межах, придатних для резервного копіювання, а структуру — стабільною.'
- h2: 3.2. Контекстна діаграма
- p: 'Контекстну модель (рис. {fig:ctx}) побудовано в стилі контекстної діаграми потоків даних: у центрі — база даних як єдине
    ціле, навколо — зовнішні сутності, що є джерелами або споживачами даних. Технічні джерела (сенсорні вузли, наземні станції,
    національна система) показано білими прямокутниками, групи користувачів — сірими; підписи стрілок називають групи даних,
    а напрям стрілки — напрям потоку.'
- figure:
    id: ctx
    src: tspp_work/lab1/diagrams/01_context.png
    caption: Контекстна модель бази даних IoT-платформи «Щит-Лінк»
- p: Сенсорні вузли через периферійні шлюзи лише записують дані (виявлення, контрольні сигнали стану) — це найінтенсивніший
    потік, близько 50 тисяч записів на добу. Наземні станції розрахунків записують телеметрію перехоплювачів і підтвердження
    завдань та отримують бойові завдання. Аналітик обстановки, офіцер бойового управління, розрахунки, технік і логіст, адміністратор
    та офіцер кібербезпеки працюють з даними в обох напрямах через свої автоматизовані робочі місця, кожен — зі своєю частиною
    БД, що відповідає зовнішній схемі в термінах трирівневої архітектури. Національна система ситуаційної обізнаності лише
    отримує донесення про треки та результати перехоплень.
- h2: 3.3. Зовнішні сутності та потоки даних
- p: Детальний перелік зовнішніх сутностей, потоків даних і таблиць, з якими вони пов’язані, наведено в табл. {tab:ctx}. Таблиця
    є вихідними даними для визначення зовнішніх схем (представлень і прав доступу) на фізичному рівні.

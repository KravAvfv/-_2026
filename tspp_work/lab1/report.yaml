- p: 'Таблиця **mission** («Місія») — бойові завдання на перехоплення та їх життєвий цикл. Обсяг: ≈ 400 записів / міс.; заповнює:
    офіцер бойового управління, розрахунок. Структуру наведено в табл. {tab:t_mission}. Обмеження рівня таблиці: CHECK (approved_by
    IS NULL OR approved_by <> proposed_by); CHECK (approved_at IS NULL OR approved_at >= proposed_at); CHECK (launched_at
    IS NULL OR approved_at IS NOT NULL); CHECK (state <> ''скасована'' OR abort_reason IS NOT NULL).'

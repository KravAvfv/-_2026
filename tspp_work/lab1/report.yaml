      - Асоціативна сутність «Право ролі»
- p: 'Свідомим винятком є журнал аудиту: пара «таблиця об’єкта + ідентифікатор об’єкта» посилається на запис будь-якої таблиці
    і не є зовнішнім ключем. Такий поліморфний зв’язок обрано тому, що журнал є незмінним (записи лише додаються) і має зберігати
    історію навіть для видалених об’єктів.'
- h1: 5. Фізична модель бази даних
  new_page: true
- h2: 5.1. Вибір СКБД і відображення типів даних
- p: 'Фізичну модель побудовано для СКБД PostgreSQL. Вибір обумовлено: підтримкою перелічуваних типів (ENUM) [10], що дає
    змогу зберігати стани українською мовою з контролем допустимих значень; двійковим типом JSONB для документних атрибутів
    [11]; вбудованою генерацією UUID [12]; повною підтримкою обмежень цілісності PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL
    і CHECK [13]; можливістю розподіленого розгортання, потрібною IoT-системі з периферійними вузлами. Правила відображення
    доменів логічної моделі на типи PostgreSQL [14] наведено в табл. {tab:types}.'
- table:
    font: 12
    id: types
    caption: Відображення доменів логічної моделі на типи даних PostgreSQL
    header:
    - Домен (приклад атрибута)
    - Тип PostgreSQL
    - Обґрунтування
    widths:
    - 4.6
    - 3.4
    - 8.0
    rows:
    - - Ключ основної та операційної сутності
      - UUID
      - Генерується на периферійних вузлах без звернення до центру — ключі не конфліктують під час синхронізації
    - - Ключ довідника (роль, право, модель)
      - SMALLINT IDENTITY
      - Довідник малий (до сотень записів), ключ займає 2 байти
    - - Ключ високочастотного журналу (виявлення, подія, аудит)
      - BIGINT IDENTITY
      - Мільйони записів; послідовність зберігає порядок надходження
    - - Умовні номери, позивні, логіни
      - VARCHAR(n)
      - Обмежена довжина контролює коректність введення
    - - Стан, тип, належність, оцінка
      - ENUM
      - Лише допустимі значення; порядок значень відповідає життєвому циклу
    - - Координати
      - DECIMAL(9,6)
      - Точність 10⁻⁶ градуса (≈ 0,1 м) без похибок округлення
    - - Висота, швидкість, оцінка загрози
      - DECIMAL(p,s)
      - Точне подання дробових значень
    - - Лічильники, радіус, відсотки
      - INTEGER, SMALLINT
      - Цілі значення з контролем діапазону CHECK
    - - Моменти часу
      - TIMESTAMPTZ
      - Час з часовим поясом, однозначний для розподілених вузлів
    - - Дати (допуск, надходження)
      - DATE
      - Час доби не потрібен
    - - Ознаки
      - BOOLEAN
      - Два значення
    - - Документні атрибути
      - JSONB
      - Змінна структура, індексування за потреби
    - - Хеш запису аудиту
      - CHAR(64)
      - SHA-256 у шістнадцятковому записі має фіксовану довжину
- h2: 5.2. Діаграми фізичної моделі
- p: Діаграми фізичної моделі (рис. {fig:pg1}–{fig:pg4}) мають ту саму структуру, що й логічні, але сутності замінено таблицями
    з іменами латиницею, атрибути — стовпцями з типами PostgreSQL. Позначення PK, FK, U та зірочка (NOT NULL) збережені.

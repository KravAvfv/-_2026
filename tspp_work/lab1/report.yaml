- p: 'Порівняно з логічною моделлю на фізичному рівні додано: генерацію значень ключів (DEFAULT gen_random_uuid() або GENERATED
    ALWAYS AS IDENTITY); значення за замовчуванням для станів і часу створення (наприклад, нова місія отримує стан «запропонована»
    і час now()); обмеження CHECK; індекси для типових запитів.'
- h2: 5.3. Перелічувані типи
- p: Фізична модель визначає 14 перелічуваних типів (табл. {tab:enum}). Значення типів mission_state, air_track_identity,
    interceptor_state, crew_status та engagement_assessment збігаються з визначеними в практичній роботі № 4 [3]; значення
    mission_state відповідають станам діаграми станів сутності «Місія».

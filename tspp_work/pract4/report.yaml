- h1: 2. Проектування системи
  new_page: true
- h2: 2.1. Моделювання області застосування в нотації BPMN
- p: Нотація BPMN (Business Process Model and Notation) описує бізнес-процес як послідовність подій, дій і логічних операторів
    (шлюзів), розподілених за учасниками. Пул відображає учасника процесу, доріжки всередині пулу — ролі або підсистеми; суцільні
    стрілки позначають потік управління всередині пулу, пунктирні — потоки повідомлень між пулами. Нижче наведено дві моделі
    «як буде» (TO-BE), у яких IoT-платформа «Щит-Лінк» виконує частину дій автоматично, а рішення залишаються за людьми.
- h3: 2.1.1. Процес формування повітряної обстановки
- p: 'Процес формування повітряної обстановки (рис. {fig:bpmn1}) розпочинається стартовою подією-повідомленням «Виявлення
    надійшло»: згорнутий пул «Сенсорна мережа» надсилає повідомлення «Виявлення». Пул центру має три доріжки: «Периферійний
    шлюз», «IoT-ядро» та «Аналітик обстановки». Сервісне завдання шлюзу «Перевірити джерело й нормалізувати» автентифікує
    сенсор за сертифікатом і перетворює дані в канонічну модель. Виключний шлюз «Дані коректні?» відкидає некоректні повідомлення
    (кінцева подія «Відхилено»), а коректні передає до IoT-ядра.'
- figure:
    id: bpmn1
    src: tspp_work/pract4/diagrams/01_bpmn_picture.png
    caption: BPMN-модель процесу формування повітряної обстановки
- p: 'У доріжці «IoT-ядро» сервісне завдання «Злити виявлення в трек» оновлює повітряний трек і записує його до сховища треків
    (об’єкт даних), після чого завдання «Запропонувати тип і оцінити загрозу» формує підказку класифікатора та оцінку загрози.
    Рішення про належність цілі ухвалює людина: користувацьке завдання «Підтвердити класифікацію» в доріжці аналітика завершується
    шлюзом «Ворожа ціль?». Ворожа ціль потрапляє в чергу на перехоплення (кінцева подія-повідомлення «Ціль у черзі»), інші
    треки залишаються під спостереженням. Модель реалізує функціональні вимоги FR-02, FR-04, FR-05 та FR-06 [4].'
- h3: 2.1.2. Процес призначення розрахунку та санкціонування пуску
- p: Другий процес (рис. {fig:bpmn2}) запускається повідомленням «Ціль у черзі», яке формує попередній процес. IoT-ядро автоматично
    підбирає розрахунки-кандидати та перевіряє деконфлікцію з планами польотів дружньої авіації і зонами заборони ураження.
    Офіцер бойового управління виконує користувацьке завдання «Обрати розрахунок», після чого оперативний черговий виконує
    завдання «Санкціонувати пуск».
- figure:
    id: bpmn2
    src: tspp_work/pract4/diagrams/02_bpmn_tasking.png
    caption: BPMN-модель процесу призначення розрахунку та санкціонування пуску
- p: 'Шлюз «Санкцію надано?» розділяє потік: за відмови процес завершується подією «Місію відхилено», а після санкції проміжна
    подія-повідомлення «Завдання надіслано» передає бойове завдання до згорнутого пулу «Розрахунок перехоплювачів». Від розрахунку
    надходить телеметрія, яку використовує сервісне завдання «Супроводжувати місію»; процес завершується подією «Місію закрито».
    Розподіл дій між доріжками відображає принцип «людина в контурі»: система готує рішення, а обирає розрахунок і санкціонує
    пуск персонал (вимоги FR-08–FR-12, NFR-16 [4]).'
- h2: 2.2. Функціональна модель системи в нотації IDEF0
- p: 'IDEF0 — методологія функціонального моделювання, в основі якої лежить поняття блоку, що відображає функцію; ліва сторона
    блоку означає вхід, права — вихід, верхня — управління, нижня — механізм [9]. Модель будується за принципами функціональної
    декомпозиції, обмеження складності (від двох до шести блоків на діаграмі) та контексту: спочатку будується контекстна
    діаграма з одним блоком, що фіксує межі системи [9]. Діаграми верхнього рівня називають батьківськими, а діаграми декомпозиції
    — дочірніми [10]. На відміну від моделі організації, тут модель побудовано з точки зору архітектора системи: механізмами
    є вузли самої системи.'
- h3: 2.2.1. Контекстна діаграма
- p: 'Контекстна діаграма (рис. {fig:ctx}) містить один блок A-0 «Забезпечити обмін телеметрією та координацію перехоплення».
    Входами системи є дані сенсорів і телеметрія перехоплювачів, а також рішення персоналу КП (класифікація, вибір розрахунку,
    санкції). Управління задають правила застосування, плани польотів дружньої авіації та вимоги захисту інформації. Виходи
    — повітряна обстановка, бойові завдання розрахункам, звіти та сповіщення. Механізмами є три групи вузлів архітектури ПР2
    [5]: периферійні шлюзи, IoT-ядро та застосунки. У текстовому блоці зафіксовано мету моделювання та точку зору.'
- figure:
    id: ctx
    src: tspp_work/pract4/diagrams/03_idef0_ctx.png
    caption: Контекстна діаграма IDEF0 системи «Щит-Лінк»
- p: 'Розподіл межових стрілок за сторонами блоку визначає межі відповідальності системи. Стрілки входу відображають те, що
    система перетворює: потік повідомлень від сенсорів і перехоплювачів надходить без участі людини, тоді як рішення персоналу
    КП вводяться через автоматизовані робочі місця (АРМ). Стрілки управління не змінюються під час виконання функції, а лише
    обмежують її: правила застосування задають умови, за яких ціль може бути призначена на перехоплення, плани польотів дружньої
    авіації — простір, у якому призначення заборонене, вимоги захисту інформації — порядок автентифікації джерел і доступу
    користувачів. Стрілки виходу описують результати, що споживаються поза межами системи: повітряну обстановку переглядає
    персонал КП, бойові завдання отримують розрахунки перехоплювачів, звіти й сповіщення надходять до командування, техніків
    і логістів.'
- p: 'Рамка діаграми містить службові поля, прийняті в нотації IDEF0: у верхній частині — автора, назву проекту, дату, стан
    розроблення («робочий») і читача, тобто особу, що рецензує модель; у нижній частині — вузол A-0, назву діаграми та її
    порядковий номер. Нумерація вузла A-0 свідчить, що діаграма є контекстною, тобто розташованою над діаграмою верхнього
    рівня A0.'
- h3: 2.2.2. Діаграма декомпозиції першого рівня
- p: 'Декомпозиція A0 (рис. {fig:a0}) розкриває чотири функції системи, розташовані за ступенями відповідно до порядку їх
    виконання:'
- bullets:
  - '**A1 «Зібрати й нормалізувати дані»** отримує дані сенсорів і телеметрію (I1) під управлінням вимог захисту інформації
    (C3) та виконується периферійними шлюзами (M1); виходи — нормалізовані події для A2 і телеметрія місій для A3;'
  - '**A2 «Сформувати повітряну обстановку»** під управлінням правил застосування (C1) формує повітряну обстановку (O1) та
    чергу цілей для A3; механізм — IoT-ядро (M2);'
  - '**A3 «Координувати місії перехоплення»** отримує цілі в черзі, телеметрію місій і рішення персоналу КП (I2), враховує
    правила застосування та плани польотів (C1, C2), видає бойові завдання розрахункам (O2) та закриті місії для A4; виконується
    IoT-ядром і застосунками (M2, M3);'
  - '**A4 «Облікувати ресурси та звітувати»** на основі закритих місій під управлінням вимог захисту інформації формує звіти
    та сповіщення (O3).'
- figure:
    id: a0
    src: tspp_work/pract4/diagrams/04_idef0_a0.png
    caption: Діаграма декомпозиції A0 системи «Щит-Лінк»
- p: Стрілки управління C1 і C3 та механізм M2 розгалужуються до кількох блоків (точки розгалуження). Діаграма показує, що
    периферійний шлюз відповідає лише за прийом і нормалізацію даних, а вся логіка обстановки та місій зосереджена в ядрі,
    що відповідає архітектурі ПР2 [5]. Кожна межова стрілка діаграми A0 має відповідник на контекстній діаграмі (коди I, C,
    O, M), що забезпечує узгодженість моделі.
- h2: 2.3. Концептуальна модель системи в нотації UML
- p: Візуальне моделювання в UML виконується як поступовий перехід від концептуальної моделі до логічної, а потім до фізичної
    [2]. Концептуальна модель описує функціональне призначення системи (діаграма прецедентів), поведінку ключової сутності
    (діаграма станів) і словник предметної області (діаграма класів).
- h3: 2.3.1. Діаграма прецедентів
- p: 'Діаграма прецедентів (варіантів використання) визначає функціональне призначення системи: що система повинна робити,
    не розкриваючи, як саме вона це робить [2]. Діаграма (рис. {fig:uc}) побудована в практичній роботі № 1 [4] і є вихідною
    концептуальною моделлю системи. Прямокутник позначає межу системи «IoT-платформа «Щит-Лінк»: збір даних і бойове управління»;
    актори розташовані поза нею, прецеденти — всередині. Лінія асоціації між актором і прецедентом означає, що актор ініціює
    прецедент або бере участь у ньому.'
- figure:
    id: uc
    src: tspp_work/pract1/diagrams/06_uc_combat.png
    caption: 'Діаграма прецедентів: збір даних і бойове управління (з ПР1)'
- p: 'На діаграмі визначено шість акторів-людей і двох акторів-систем:'
- bullets:
  - '**Персонал КП** — абстрактний актор, що узагальнює ролі командного пункту; відношення узагальнення від аналітика обстановки,
    оперативного чергового та офіцера бойового управління означає, що кожна з цих ролей успадковує його прецедент «UC-02 Переглянути
    повітряну обстановку»;'
  - '**Аналітик обстановки** веде повітряні треки та ініціює прецедент «UC-03 Класифікувати ціль»: підтверджує або змінює
    тип і належність цілі, запропоновані класифікатором;'
  - '**Оперативний черговий** ініціює прецедент «UC-07 Санкціонувати пуск» — без цього прецедента жодне бойове завдання не
    може бути надіслане розрахунку;'
  - '**Офіцер бойового управління** ініціює прецедент «UC-04 Призначити розрахунок», обираючи розрахунок для цілі з черги
    на перехоплення;'
  - '**Командир розрахунку** бере участь у прецедентах «UC-08 Прийняти бойове завдання» та «UC-11 Доповісти про результат»;'
  - '**Оператор перехоплювача** бере участь у прецеденті «UC-09 Супроводжувати місію» і підтверджує ціль на фазі наведення;'
  - '**Сенсорний вузол** (актор-система) ініціює прецедент «UC-01 Передати виявлення» за протоколами MQTT або ASTERIX без
    участі людини;'
  - '**НСУ розрахунку** (наземна станція управління, актор-система) передає телеметрію перехоплювача в межах прецедента «UC-09
    Супроводжувати місію».'
- p: 'Між прецедентами встановлено три залежності. Відношення включення («include») від «UC-04 Призначити розрахунок» до «UC-05
    Перевірити деконфлікцію» означає, що перевірка відсутності конфлікту з дружньою авіацією та зонами заборони ураження виконується
    за кожного призначення без винятків. Відношення розширення («extend») від «UC-06 Обрати резервний розрахунок» до «UC-04»
    описує альтернативний потік: резервний розрахунок обирається лише тоді, коли основний не підтвердив завдання протягом
    15 с. Друге відношення розширення — від «UC-10 Скасувати місію» до «UC-09 Супроводжувати місію» — застосовується за командою
    скасування під час виконання місії.'
- p: Прецеденти діаграми утворюють наскрізний ланцюжок «виявлення — класифікація — призначення — санкціонування — прийняття
    завдання — супровід — доповідь», який далі деталізують діаграми станів, діяльності, послідовності та кооперації. Специфікації
    основних прецедентів (короткий опис, основний і альтернативні потоки, передумови та постумови) наведено в ПР1 [4]; прецеденти
    забезпечення (облік техніки й запасів, звітність, адміністрування) винесено на окрему діаграму ПР1 і в цьому розділі не
    деталізуються.
- h3: 2.3.2. Діаграма станів
- p: Діаграма станів моделює зміни стану прецедента як реакцію на зовнішні події [2]. Для «Щит-Лінк» найскладнішу поведінку
    має сутність «Місія» (рис. {fig:state}). Місія створюється в стані «Запропонована»; за відмови оперативного чергового
    переходить у стан «Відхилена», після санкції — у стан «Санкціонована». Якщо розрахунок не підтвердив завдання протягом
    15 с, місія стає «Перепризначеною» і повертається до стану «Запропонована» з новим кандидатом. Після підтвердження місія
    переходить до станів «Прийнята» та «Виконується» (подія «пуск»), звідки завершується станом «Закрита» за доповіддю про
    результат або «Скасована» за командою скасування. Стани «Відхилена», «Скасована» й «Закрита» є кінцевими.
- figure:
    id: state
    src: tspp_work/pract4/diagrams/06_state.puml
    caption: Діаграма станів сутності «Місія»
- p: 'Кожен перехід позначено подією, що його спричиняє, а ініціатор події відповідає актору діаграми прецедентів: створення
    місії — офіцеру бойового управління (UC-04), санкція або відмова — оперативному черговому (UC-07), підтвердження — командиру
    розрахунку (UC-08), доповідь про результат — прецеденту UC-11, скасування — прецеденту UC-10. Перехід «немає підтвердження
    15 с» ініціює сама система за таймером; він реалізує розширення «UC-06 Обрати резервний розрахунок». Цикл «Санкціонована
    — Перепризначена — Запропонована» гарантує, що зміна розрахунку потребує нової санкції оперативного чергового, тобто призначення
    не обходить людину. Перелік станів діаграми безпосередньо використано як множину допустимих значень стовпця state таблиці
    mission фізичної моделі (п. 2.6).'
- h3: 2.3.3. Діаграма класів концептуального рівня
- p: 'На концептуальному рівні класи використовуються для складання словника системи: виділяються класи, їх внутрішня структура
    та взаємозв’язки [2]. Діаграма (рис. {fig:cls1}) містить вісім класів:'
- figure:
    id: cls1
    src: tspp_work/pract4/diagrams/07_class_concept.puml
    caption: Діаграма класів концептуального рівня
- bullets:
  - '**Сенсор** — тип, координати, стан; операція надіслатиВиявлення() формує об’єкти класу «Виявлення» (асоціація 1 — *);'
  - '**Виявлення** — час, пеленг, достовірність; об’єкти агрегуються в «Повітряний трек» (агрегація);'
  - '**ПовітрянийТрек** — номер, належність, оцінка загрози; операція класифікувати() фіксує рішення аналітика; один трек
    може бути ціллю кількох місій (0..*);'
  - '**Місія** — номер, стан, результат; операції санкціонувати() і скасувати() реалізують переходи діаграми станів (рис.
    {fig:state});'
  - '**Розрахунок** — позивний, стан; операція прийнятиЗавдання(); один розрахунок виконує багато місій;'
  - '**Перехоплювач** — серійний номер, стан; у кожній місії застосовується не більше одного перехоплювача;'
  - '**Користувач** — ПІБ, роль; оперативний черговий санкціонує місії;'
  - '**ЗвітПроПерехоплення** — оцінка результату, докази; пов’язаний з місією композицією (0..1), тобто не існує без місії.'
- p: 'Між класами встановлено відношення трьох видів. Направлена асоціація «формує» від класу «Сенсор» до класу «Виявлення»
    з кратністю 1 — * означає, що кожне виявлення має рівно одне джерело, а один сенсор формує необмежену кількість виявлень;
    напрямок вказує, що виявлення не знає про подальшу обробку. Агрегація (незафарбований ромб) між класами «ПовітрянийТрек»
    і «Виявлення» відображає відношення «ціле — частина», за якого частини існують незалежно: виявлення зберігаються для аналізу
    навіть після закриття треку. Композиція (зафарбований ромб) між класами «Місія» і «ЗвітПроПерехоплення» є сильнішою формою
    агрегації: звіт створюється лише для конкретної місії та видаляється разом з нею.'
- p: 'Клас «Місія» є центральним: він пов’язаний асоціаціями з п’ятьма іншими класами. Кратність 0..* на боці місії в асоціації
    «ціль» з класом «ПовітрянийТрек» допускає трек без місій (ціль під спостереженням) і повторне призначення на ту саму ціль
    після промаху. Кратність 0..1 на боці класу «Перехоплювач» означає, що до пуску перехоплювач місії не визначено, а після
    пуску застосовується рівно один. Асоціація «санкціонує» з класом «Користувач» фіксує персональну відповідальність посадової
    особи за кожен пуск. Атрибути класів наведено без типів, оскільки на концептуальному рівні важливий склад даних, а не
    спосіб їх зберігання; типи визначаються у фізичній моделі (рис. {fig:cls2}).'
- h2: 2.4. Логічна модель системи
- p: Логічна модель уточнює концептуальну у вигляді, зручному для подальшої реалізації, але без прив’язки до конкретної платформи
    [2]. Для ключового сценарію «Призначення розрахунку» побудовано діаграми діяльності, послідовності та кооперації.
- h3: 2.4.1. Діаграма діяльності
- p: 'Діаграма діяльності деталізує алгоритмічну логіку операцій: перехід до наступної дії відбувається лише після завершення
    попередньої [2]. Діаграма (рис. {fig:act}) розділена на чотири доріжки: офіцер бойового управління (ОБУ), платформа, оперативний
    черговий (ОЧ) і розрахунок. ОБУ обирає ціль; платформа підбирає кандидатів і перевіряє деконфлікцію — у разі невдачі процес
    завершується блокуванням призначення. Далі ОБУ обирає розрахунок, платформа створює місію, а ОЧ ухвалює рішення про санкцію.
    Після санкції платформа надсилає завдання, і розрахунок має прийняти його протягом 15 с; інакше платформа пропонує резервний
    розрахунок. Сценарій завершується супроводом місії.'
- figure:
    id: act
    src: tspp_work/pract4/diagrams/08_activity.puml
    caption: Діаграма діяльності сценарію «Призначення розрахунку»
    width_cm: 15.2
- p: 'Діаграма побудована з таких елементів: початкового вузла (зафарбоване коло), дій (прямокутники із заокругленими кутами),
    вузлів розгалуження (ромби з умовою та гілками «так» / «ні») і кінцевих вузлів (коло з обідком). Доріжки (swimlanes) показують,
    хто відповідає за кожну дію, тому перехід потоку управління між доріжками означає передачу відповідальності між учасниками.
    Послідовність дій така:'
- numbered:
  - Дія «Обрати ціль» у доріжці ОБУ — офіцер обирає повітряний трек із черги на перехоплення.
  - Дія «Підібрати кандидатів, деконфлікція» у доріжці платформи — сервіс призначення формує перелік розрахунків, здатних
    досягти цілі, і перевіряє відсутність конфлікту з дружньою авіацією.
  - 'Розгалуження «Пройдено?»: за наявності конфлікту виконується кінцевий вузол — призначення блокується і місія не створюється.'
  - Дія «Обрати розрахунок» у доріжці ОБУ — офіцер обирає одного з запропонованих кандидатів.
  - Дія «Створити місію» у доріжці платформи — місія отримує стан «Запропонована».
  - 'Розгалуження «Санкція?» у доріжці ОЧ: за відмови сценарій завершується, місія переходить у стан «Відхилена».'
  - Дія «Надіслати завдання» у доріжці платформи — бойове завдання доставляється на планшет розрахунку.
  - 'Розгалуження «Прийнято за 15 с?» у доріжці розрахунку: гілка «так» веде до дії «Прийняти завдання», гілка «ні» — до дії
    платформи «Резервний розрахунок», після якої поточний сценарій завершується і запускається повторно з новим кандидатом.'
  - Дія «Супроводжувати місію» у доріжці платформи та кінцевий вузол завершують основний потік.
- p: 'Діаграма містить чотири кінцеві вузли, кожен з яких відповідає окремому результату сценарію. Така структура дає змогу
    безпосередньо отримати з діаграми тестові сценарії: по одному на кожен шлях від початкового до кінцевого вузла.'
- h3: 2.4.2. Діаграма послідовності
- p: 'Діаграма послідовності відображає динаміку взаємодії об’єктів у часі; на ній показано лише об’єкти, які безпосередньо
    беруть участь у взаємодії [2]. Ініціатором послідовності (рис. {fig:seq}) є актор «ОБУ», описаний на діаграмі прецедентів.
    Під час взаємодії виконуються такі операції:'
- bullets:
  - '**обратиЦіль()** — ОБУ обирає ціль на АРМ КП;'
  - '**кандидати()** — АРМ запитує в сервісу «Призначення і місії» перелік розрахунків-кандидатів;'
  - '**деконфлікція()** — сервіс синхронно перевіряє в геосервісі відсутність конфлікту з дружньою авіацією та зонами заборони
    ураження й отримує відповідь «дозволено»;'
  - '**призначити(розрахунок)**, **створитиМісію()** — ОБУ призначає розрахунок, сервіс створює місію та публікує подію «місію
    запропоновано» в шину подій;'
  - '**санкціонувати()** — ОЧ, отримавши місію через шину подій, надає санкцію; сервіс публікує подію «місію санкціоновано»,
    і шина доставляє бойове завдання на планшет;'
  - '**прийнято()** — розрахунок підтверджує прийняття; подія «завдання прийнято» повертається до сервісу, який оновлює стан
    місії на АРМ.'
- figure:
    id: seq
    src: tspp_work/pract4/diagrams/09_sequence.puml
    caption: Діаграма послідовності сценарію «Призначення розрахунку»
- p: 'Учасники взаємодії розташовані горизонтально в порядку першої участі: актор «ОБУ», об’єкти «АРМ КП» (інтерфейс користувача),
    «Призначення і місії» (сервіс, що керує сценарієм) і «Геосервіс», черга «Шина подій», актор «ОЧ» та «Планшет» розрахунку.
    Вертикальні пунктирні лінії (лінії життя) відображають існування об’єктів протягом сценарію; час на діаграмі плине згори
    донизу. Суцільні стрілки із зафарбованим наконечником позначають виклики операцій, пунктирні — повернення результату (відповіді
    «дозволено», «кандидати», «стан місії»). Повідомлення, взяті в лапки («місію запропоновано», «місію санкціоновано», «завдання
    прийнято»), є подіями, які публікуються в шину і доставляються підписникам.'
- p: 'Синхронні виклики з очікуванням відповіді використовуються лише всередині ядра — між АРМ, сервісом призначення та геосервісом,
    — оскільки результат деконфлікції потрібен до продовження сценарію. Взаємодія з ОЧ і планшетом відбувається асинхронно
    через шину подій: сервіс призначення не очікує санкції, а реагує на подію, коли вона надходить. Такий розподіл відповідає
    подієво-орієнтованій архітектурі ПР2 [5] і дає змогу планшету отримати завдання навіть після тимчасової втрати зв’язку,
    оскільки подія зберігається в шині до доставки.'
- h3: 2.4.3. Діаграма кооперації
- p: 'Діаграма кооперації описує взаємодію об’єктів, абстрагуючись від часу; порядок повідомлень задано нумерацією [2]. Центральним
    об’єктом (рис. {fig:comm}) обрано анонімний об’єкт класу «Місія», який приймає та генерує такі повідомлення:'
- bullets:
  - '**1: створити(трек, розрахунок)** — ініціатор ОБУ; вхідні параметри — ідентифікатори треку й розрахунку; результат —
    місія в стані «Запропонована»;'
  - '**2: отриматиОцінкуЗагрози()** і **3: перевіритиДеконфлікцію()** — генерує «Місія»; власники операцій — об’єкти «ПовітрянийТрек»
    і «Геосервіс»; результат — пріоритет цілі та дозвіл на призначення;'
  - '**4: санкціонувати()** — ініціатор ОЧ; результат — стан «Санкціонована»;'
  - '**5: надіслатиЗавдання()** — генерує «Місія»; власник — «Планшет», який передає **6: прийнятиЗавдання()** об’єкту «Розрахунок»;'
  - '**7: підтвердити()** — розрахунок підтверджує прийняття; результат — стан «Прийнята».'
- figure:
    id: comm
    src: tspp_work/pract4/diagrams/10_communication.puml
    caption: Діаграма кооперації з центральним об’єктом «Місія»
- p: 'Об’єкти діаграми позначено в нотації «ім’я : клас»: іменовані об’єкти «ОБУ : Офіцер» та «ОЧ : Оперативний черговий»
    відповідають акторам діаграми прецедентів, анонімні об’єкти (з двокрапкою перед іменем класу) — екземплярам класів концептуальної
    моделі та сервісам ядра. Лінії між об’єктами є зв’язками (links), тобто екземплярами асоціацій діаграми класів; уздовж
    кожного зв’язку показано номер, напрямок і назву повідомлення.'
- p: 'На відміну від діаграми послідовності, яка робить наочним порядок повідомлень у часі, діаграма кооперації показує структуру
    зв’язків: з неї видно, що об’єкт «Місія» має шість зв’язків і є єдиною точкою узгодження сценарію, тоді як «Розрахунок»
    взаємодіє з місією лише опосередковано — через планшет. Повідомлення 2 і 3 генерує сама місія, тобто перевірка загрози
    та деконфлікції інкапсульована в класі «Місія», а не покладена на користувача. Обидві діаграми взаємодії описують той
    самий сценарій і можуть бути перетворені одна в одну.'
- h2: 2.5. Фізична модель системи
- p: Фізична модель визначає способи розміщення даних і компонентний склад системи з точки зору реалізації на конкретній технічній
    базі [2].
- h3: 2.5.1. Діаграма класів фізичного рівня
- p: 'Фізична діаграма класів описує структуру даних у термінах платформи реалізації — СКБД PostgreSQL (рис. {fig:cls2}).
    Кожен клас відповідає таблиці (стереотип «table»), атрибути мають типи СКБД (UUID, VARCHAR, ENUM, DECIMAL, TIMESTAMPTZ,
    BOOL), первинні ключі позначено PK, зовнішні — FK. Центральна таблиця mission містить зовнішні ключі на трек (track_id),
    розрахунок (crew_id), перехоплювач (interceptor_id, може бути порожнім до пуску) і користувача, що санкціонував пуск (approved_by).
    Таблиця engagement_report пов’язана з mission відношенням 1 : 0..1. Повна схема бази даних з 11 таблиць наведена в ПР1
    [4].'
- figure:
    id: cls2
    src: tspp_work/pract4/diagrams/11_class_physical.puml
    caption: Діаграма класів фізичного рівня (фрагмент схеми бази даних)
- p: 'Перехід від концептуальної моделі до фізичної виконано за такими правилами:'
- bullets:
  - кожен клас предметної області, екземпляри якого зберігаються, перетворено на таблицю з англомовним ідентифікатором (клас
    «Місія» — таблиця mission, «ПовітрянийТрек» — air_track, «Користувач» — personnel тощо);
  - кожна таблиця отримала сурогатний первинний ключ типу UUID, що генерується без звернення до центрального лічильника і
    тому придатний для розподіленої системи з кількома ЦОД;
  - 'асоціації з кратністю «1 — багато» перетворено на зовнішні ключі на боці «багато»: таблиця mission містить track_id,
    crew_id, interceptor_id та approved_by;'
  - 'кратність 0..1 перетворено на стовпець, що допускає порожнє значення (interceptor_id до пуску), а композицію «Місія —
    Звіт» — на зовнішній ключ mission_id у таблиці engagement_report з обмеженням унікальності, що забезпечує відношення 1
    : 0..1;'
  - атрибути з обмеженою множиною значень (належність треку, стан місії, оцінка результату) отримали тип ENUM; перелік станів
    місії збігається зі станами діаграми на рис. {fig:state};
  - моменти часу зберігаються в типі TIMESTAMPTZ з часовим поясом, оскільки події надходять від вузлів, розташованих у різних
    місцях, а журнал має бути однозначно впорядкований.
- p: Зовнішні ключі position_id і role_id посилаються на таблиці «Позиція» та «Роль», які не наведені у фрагменті, щоб діаграма
    залишалася читабельною.
- h3: 2.5.2. Діаграма компонентів
- p: Діаграма компонентів моделює статичний вигляд системи з точки зору реалізації [2]. Компоненти (рис. {fig:comp}) згруповано
    в три пакети. Пакет «Периферійний шлюз» містить адаптери протоколів, локальний брокер MQTT і компонент «Буфер і міст до
    ядра». Пакет «IoT-ядро» містить шину подій, сервіси реального часу, бізнес-сервіси, API-шлюз і сховища PostgreSQL та TimescaleDB.
    Пакет «Застосунки» містить веб-АРМ і мобільний застосунок, які звертаються до ядра лише через API-шлюз. Пунктирна залежність
    від мобільного застосунку до локального брокера показує роботу планшета через шлюз позиції без зв’язку з ядром.
- figure:
    id: comp
    src: tspp_work/pract4/diagrams/12_components.puml
    caption: Діаграма компонентів системи «Щит-Лінк»
- p: 'Стрілки залежностей на діаграмі показують напрямок звернення одного компонента до іншого і разом утворюють такі маршрути
    даних:'
- bullets:
  - '**висхідний потік телеметрії:** адаптери протоколів приймають повідомлення сенсорів і перетворюють їх у єдиний формат,
    локальний брокер MQTT розподіляє їх на позиції, а компонент «Буфер і міст до ядра» зберігає повідомлення під час втрати
    зв’язку та передає їх до шини подій ядра;'
  - '**обробка в ядрі:** шина подій доставляє події двом групам підписників — сервісам реального часу (злиття треків, оцінка
    загрози) та бізнес-сервісам (призначення, місії, облік ресурсів); обидві групи зберігають дані в реляційному сховищі PostgreSQL
    і часовому сховищі TimescaleDB;'
  - '**доступ користувачів:** веб-АРМ і мобільний застосунок звертаються лише до API-шлюзу, який перевіряє права доступу й
    маршрутизує запити до сервісів; прямого звернення застосунків до бази даних немає.'
- p: 'Така структура реалізує принцип слабкої зв’язаності: компоненти периферійного шлюзу не залежать від компонентів ядра,
    крім єдиної точки входу — шини подій, а застосунки залежать лише від інтерфейсу API-шлюзу. Заміна або масштабування окремого
    сервісу ядра не потребує змін у шлюзах і застосунках.'
- h3: 2.5.3. Діаграма розгортання
- p: 'Діаграма розгортання (рис. {fig:depl}) подає конфігурацію та топологію розподіленої системи:'
- bullets:
  - вузол «Позиція» (9 екземплярів) містить периферійний шлюз на платформі NVIDIA Jetson Orin Nano, обраній у ПР3 [6], і планшет
    розрахунку на Android, з’єднаний зі шлюзом через Wi-Fi із шифруванням TLS;
  - сенсори сектора передають дані на шлюз за протоколами MQTT і ASTERIX;
  - шлюз з’єднаний з кластером ядра в основному ЦОД через VPN із взаємною автентифікацією (mTLS);
  - кластер ядра працює з базою даних і реплікує дані до резервного ЦОД;
  - АРМ командного пункту звертаються до ядра через HTTPS.
- figure:
    id: depl
    src: tspp_work/pract4/diagrams/13_deployment.puml
    caption: Діаграма розгортання системи «Щит-Лінк»
- p: 'Вузли діаграми розгортання є фізичними обчислювальними ресурсами, на яких виконуються компоненти (рис. {fig:comp}):
    пакет «Периферійний шлюз» розгортається на вузлі «Периферійний шлюз Jetson Orin Nano», пакет «IoT-ядро» — на вузлі «Кластер
    ядра» з базою даних, мобільний застосунок — на планшеті Android, а веб-АРМ — у браузері робочих місць командного пункту.
    Вкладеність вузлів означає фізичне розміщення: шлюз і планшет перебувають на тій самій позиції та з’єднані локальною мережею
    Wi-Fi, тому планшет розрахунку продовжує отримувати дані сенсорів сектора через локальний брокер шлюзу навіть за тимчасової
    відсутності каналу до ЦОД.'
- p: 'Підписи на з’єднаннях між вузлами задають протоколи та засоби захисту каналів. Усі канали, що виходять за межі позиції
    або ЦОД, захищені: між шлюзом і ядром — віртуальна приватна мережа з взаємною автентифікацією за сертифікатами, між АРМ
    і ядром — протокол HTTPS. Реплікація даних до резервного ЦОД підтримує вимоги до доступності ядра (NFR-05, не менше 99,95
    % на місяць) і відновлення (NFR-06, RPO не більше 5 с, RTO не більше 60 с), а розміщення шлюзу на позиції — вимогу автономної
    роботи шлюзу протягом не менше 4 год без зв’язку з ядром (FR-03, NFR-06) [4].'
- p: Взаємозв’язок вузлів і модулів, показаний на діаграмах компонентів і розгортання, узгоджується з IDEF0-моделлю (механізми
    M1–M3 на рис. {fig:a0}) і з BPMN-моделями (доріжки «Периферійний шлюз» та «IoT-ядро» на рис. {fig:bpmn1}, {fig:bpmn2}).
- h2: 2.6. Реалізація моделей у CASE-засобах
- p: 'CASE-засоби (Computer-Aided Software Engineering) автоматизують аналіз і проектування програмних систем: побудову діаграм,
    перевірку їх узгодженості, підготовку проектної документації та генерацію програмного коду з моделей [2]. До засобів проектування
    та моделювання належать UML-інструменти (StarUML, Enterprise Architect) та інструменти для створення архітектури (Draw.io,
    Lucidchart); окрему категорію становлять системи керування версіями (Git), що відстежують зміни та зберігають історію
    [11].'
- p: 'Для моделей розділу застосовано підхід «модель як код»: кожна діаграма зберігається у вигляді текстового опису моделі
    у стандартному або відкритому форматі, а зображення формуються автоматично. Перевагою підходу є можливість зберігати моделі
    в репозиторії Git разом з іншими артефактами проекту, порівнювати їх версії рядок за рядком і повторно формувати всі рисунки
    після зміни моделі без ручного перемальовування. Склад використаних засобів наведено в табл. {tab:case}.'
- table:
    font: 12
    id: case
    caption: Засоби моделювання, використані в розділі
    widths:
    - 2.6
    - 4.0
    - 4.4
    - 5.0
    rows:
    - - BPMN
      - bpmn-js — засіб перегляду та редагування моделей BPMN 2.0 [12]
      - XML-файл *.bpmn за специфікацією BPMN 2.0.2 [13] з розділом графічного подання (координати елементів)
      - Модель відкривається для перегляду та редагування в будь-якому засобі, сумісному з BPMN 2.0
    - - IDEF0
      - Генератор діаграм IDEF0 на мові Python в оформленні AllFusion Process Modeler
      - Перелік блоків і стрілок з кодами ICOM (вхід, управління, вихід, механізм)
      - Автоматична маршрутизація стрілок, розгалуження, рамка з полями вузла, назви й номера
    - - UML
      - PlantUML — засіб із відкритим кодом, що будує UML-діаграми з текстового опису [14]
      - Текстові файли *.puml
      - Діаграми станів, класів, діяльності, послідовності, кооперації, компонентів і розгортання; формати SVG і PNG
    - - Схема БД
      - Генератор SQL DDL (пряме проектування)
      - Діаграма класів фізичного рівня *.puml
      - Скрипт створення таблиць, ключів і переліків для СКБД PostgreSQL
    header:
    - Нотація
    - Засіб
    - Формат моделі
    - Можливості
- p: 'Послідовність обробки моделей показано на рис. {fig:tools}. Вихідні моделі трьох нотацій зберігаються в репозиторії
    Git. Засоби bpmn-js, генератор IDEF0 та PlantUML формують з них векторні та растрові зображення, після чого кожне зображення
    проходить автоматичний контроль читабельності: розмір шрифту на сторінці звіту має бути не менше 10 пт, а роздільна здатність
    — не менше 300 dpi. Рисунки, що пройшли контроль, включаються до проектної документації. Діаграма класів фізичного рівня,
    крім того, передається генератору SQL DDL.'
- figure:
    id: tools
    src: tspp_work/pract4/diagrams/14_toolchain.mmd
    caption: Схема обробки моделей проектування
- p: 'Найважливішою властивістю CASE-засобу є можливість генерувати програмний код з побудованої моделі [2]. Для системи «Щит-Лінк»
    пряме проектування (forward engineering) виконано для схеми бази даних: генератор зчитує діаграму класів фізичного рівня
    (рис. {fig:cls2}) і діаграму станів (рис. {fig:state}) та формує скрипт мовою SQL для СКБД PostgreSQL за такими правилами:'
- bullets:
  - клас зі стереотипом «table» перетворюється на оператор CREATE TABLE, атрибут з позначкою PK — на первинний ключ із генерацією
    значення UUID;
  - атрибут з позначкою FK перетворюється на зовнішній ключ (REFERENCES); таблиця, на яку він посилається, визначається за
    збігом імені стовпця з первинним ключем або, якщо імена відрізняються (approved_by), за асоціацією діаграми;
  - 'кратність 0..1 на боці таблиці, на яку посилається ключ, дозволяє порожнє значення, а кратність 0..1 на боці таблиці
    з ключем додає обмеження унікальності (UNIQUE), що реалізує відношення 1 : 0..1;'
  - тип ENUM перетворюється на оператор CREATE TYPE; значення типу mission_state беруться безпосередньо зі станів діаграми
    станів сутності «Місія»;
  - таблиці впорядковуються так, щоб таблиця, на яку посилається зовнішній ключ, створювалася раніше.
- p: 'Фрагмент згенерованого скрипту наведено на рис. {fig:ddl}; повний скрипт містить п’ять типів-переліків і шість таблиць.
    Скрипт перевірено виконанням у СКБД PostgreSQL 18: усі оператори виконано без помилок, а структура таблиці mission відповідає
    діаграмі — чотири зовнішні ключі, з яких interceptor_id і approved_by допускають порожнє значення до пуску та санкції
    відповідно.'
- figure:
    id: ddl
    src: tspp_work/pract4/diagrams/15_ddl_fragment.png
    caption: Фрагмент SQL-скрипту, згенерованого з діаграми класів фізичного рівня
- p: Повторна генерація після зміни діаграми оновлює скрипт автоматично, тому фізична модель і схема бази даних не розходяться.
    Зв’язок між діаграмою станів і типом mission_state забезпечує, що новий стан місії, доданий до моделі поведінки, одразу
    стає допустимим значенням у базі даних. Таким чином, результати моделювання перетворюються не лише на проектну документацію,
    а й на програмний артефакт, придатний для використання на етапі реалізації.
- h1: Висновки
  new_page: true
- p: У практичній роботі виконано проектування IoT-платформи «Щит-Лінк» засобами трьох нотацій.
- numbered:
  - У нотації BPMN побудовано моделі «як буде» двох ключових процесів області застосування — формування повітряної обстановки
    та призначення розрахунку з санкціонуванням пуску; моделі показують розподіл дій між периферійним шлюзом, IoT-ядром і
    персоналом та обмін повідомленнями із сенсорною мережею й розрахунками.
  - У нотації IDEF0 побудовано контекстну діаграму та декомпозицію першого рівня з чотирма функціями системи; механізмами
    моделі є вузли системи (периферійні шлюзи, IoT-ядро, застосунки), що пов’язує функціональну модель з архітектурою.
  - У нотації UML побудовано концептуальну (прецедентів, станів, класів), логічну (діяльності, послідовності, кооперації)
    та фізичну (класів, компонентів, розгортання) моделі; вони описують призначення системи, життєвий цикл місії, взаємодію
    об’єктів у сценарії призначення розрахунку, схему даних, модулі та вузли.
  - Моделі реалізовано в CASE-засобах за підходом «модель як код» (bpmn-js, PlantUML, генератор IDEF0) під керуванням версій
    Git; з діаграми класів фізичного рівня автоматично згенеровано SQL-скрипт схеми бази даних для PostgreSQL, працездатність
    якого перевірено виконанням у СКБД.
  - 'Моделі узгоджені між собою та з результатами попередніх практичних робіт: вимогами ПР1, архітектурою ПР2 і обладнанням
    ПР3.'
- p: Отримані моделі є основою для реалізації програмного продукту відповідно до обраної комбінованої моделі життєвого циклу.
- h1: Список використаних джерел
  new_page: true
- refs:
  - 'Практична робота 4. Проектування системи : завдання з дисципліни «Технології створення програмних продуктів». Київ :
    КНУ імені Тараса Шевченка, 2026.'
  - 'Розробка UML-моделі інформаційної системи «Овочева база» : приклад опису діаграм курсової роботи. Київ, 2020. 18 с.'

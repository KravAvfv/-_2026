blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** виконати проектування програмної системи засобами нотацій BPMN, IDEF0 та UML: описати область застосування,
    бізнес-процеси й функції системи, а також структуру та взаємозв’язок її вузлів і модулів на концептуальному, логічному
    та фізичному рівнях.'
- p: '**Завдання роботи** [1]: підготувати розділ «Проектування системи» проектної роботи з діаграмами BPMN, UML та IDEF,
    що описують область застосування системи та взаємозв’язок вузлів і модулів; кожен рисунок детально описати технічною мовою
    від третьої особи. Структуру розділу побудовано за зразком опису діаграм [2]: від концептуальної моделі предметної області
    до логічної та фізичної моделей. Поєднання нотацій UML, BPMN та IDEF0 для проектування IoT-систем застосовують і в роботах
    кафедри [3].'
- p: Об’єкт проектування — IoT-платформа «Щит-Лінк» на тему «Розподілена IoT-система цілевказівки та координації дронів для
    перехоплення повітряних цілей». Вимоги до системи визначено в практичній роботі № 1 [4], архітектуру IoT-рішення — у практичній
    роботі № 2 [5], склад обладнання — у практичній роботі № 3 [6]. Звіт оформлено відповідно до ДСТУ 3008:2015 [7].
- p: '*Примітка: РЦПДО «Щит-Північ» і IoT-платформа «Щит-Лінк» є навчальними умовними моделями; усі назви, процеси та показники
    наведено суто з навчально-ілюстративною метою.*'
- p: Склад моделей розділу наведено в табл. {tab:models}. Відповідно до технології RUP діаграми прецедентів визначають функції
    системи, діаграми діяльності — сценарії роботи користувача, діаграми класів — модель даних, діаграми послідовності й кооперації
    — модель проекту, діаграми компонентів і розгортання — моделі реалізації та розміщення [8].

blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** описати програмну реалізацію системи — мету програмного продукту, вхідні й вихідні дані, системні вимоги,
    програмні засоби реалізації, алгоритм роботи основних модулів та інтерфейс — і продемонструвати реалізацію функціональних
    вимог до бази даних, сформульованих у лабораторній роботі 1.'
- p: '**Завдання роботи** [1]:'
- numbered:
  - чітко сформулювати мету програмного продукту — розділ 2;
  - виписати вхідні та вихідні дані програмного продукту — розділ 3;
  - виписати системні вимоги до програмного забезпечення, що забезпечать злагоджену роботу програми — розділ 4;
  - коротко описати програмні засоби реалізації програмного продукту з обґрунтуванням технічною мовою, чому їх обрано, — розділ
    5;
  - описати алгоритм роботи програмного продукту, зобразити блок-схеми роботи основних модулів — розділ 6;
  - описати інтерфейс програмного продукту — розділ 7.
- p: Додатково в розділі 8 показано, як реалізовано та перевірено функціональні вимоги ФВ-БД-01 — ФВ-БД-13 до програмної реалізації
    бази даних, виписані у висновках лабораторної роботи 1 [2]. Структура опису відповідає розділу «Опис програмної реалізації»
    кваліфікаційних робіт кафедри [3]. Звіт оформлено відповідно до ДСТУ 3008:2015 [4].
- p: '*Примітка: РЦПДО «Щит-Північ» і IoT-платформа «Щит-Лінк» є навчальними умовними моделями; усі назви, дані та показники
    наведено суто з навчально-ілюстративною метою.*'
- h1: 2. Мета програмного продукту
  new_page: true
- p: 'Програмний продукт — IoT-платформа «Щит-Лінк» на тему «Розподілена IoT-система цілевказівки та координації дронів для
    перехоплення повітряних цілей». Вона призначена для регіонального центру протидронової оборони, якому потрібно за лічені
    хвилини перетворити потік виявлень від розподіленої сенсорної мережі на обґрунтоване рішення: яку ціль, яким розрахунком
    і яким перехоплювачем уражати, — і при цьому зберегти повний, незмінний слід кожного рішення.'
- p: '**Мета програмного продукту** — скоротити час від виявлення повітряної цілі до призначення розрахунку й підвищити частку
    успішних перехоплень за рахунок автоматизації: приймання та зіставлення виявлень у треки, оцінки загрози з урахуванням
    об’єктів прикриття, підбору готового розрахунку, контрольованого життєвого циклу бойового завдання з правилом двох осіб
    і незмінного журналу аудиту.'
- p: 'Реалізована версія продукту охоплює ядро системи: базу даних PostgreSQL з серверною логікою, веб-застосунок автоматизованих
    робочих місць (АРМ) для п’яти груп користувачів і REST API для периферійних шлюзів. Вона безпосередньо реалізує вимоги
    до програмної реалізації БД з лабораторної роботи 1 і функціональні вимоги практичної роботи № 1 щодо формування обстановки,
    призначення та санкціонування місій, обліку ресурсів, аналітики й аудиту [5]. Функції, що потребують реального обладнання
    (обмін із сенсорами за MQTT, телеметрія MAVLink), подано програмним імітатором шлюзу та тестовими даними.'
- p: 'Очікувані результати застосування: кожне виявлення потрапляє в трек протягом однієї транзакції; черга загроз упорядковується
    автоматично; жодна місія не може бути виконана без санкції іншої особи; будь-яку зміну бойових даних можна відстежити
    й перевірити на цілісність; керівник отримує показники ефективності за довільний період.'

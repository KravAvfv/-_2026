- h1: 4. Системні вимоги
  new_page: true
- p: 'Вимоги до програмного забезпечення поділяють на функціональні, нефункціональні та бізнес-вимоги [6]; системні вимоги
    належать до нефункціональних і визначають апаратне й програмне середовище, у якому продукт працює злагоджено. Вимоги сформульовано
    для трьох вузлів: сервера застосунку й СКБД, АРМ користувача та периферійного шлюзу (табл. {tab:req}). Вони узгоджені
    з нефункціональними вимогами практичної роботи № 1 [5]: затримка «сенсор — екран АРМ» до 2 с (NFR-01), доставка завдання
    розрахунку до 1 с (NFR-02), двофакторний вхід, журналювання всіх дій. Наведені вимоги стосуються реалізованого ядра для
    одного центру; цільова конфігурація з резервуванням і шиною подій описана в технічних вимогах SRS практичної роботи №
    1.'

- h2: 6.2. Загальний алгоритм обробки запиту
- p: 'Блок-схеми виконано символами ISO 5807 [17]: «термінатор» — початок і кінець, паралелограм — введення й виведення даних,
    прямокутник — процес, ромб — рішення, прямокутник з подвійними бічними лініями — визначений процес (підпрограма), коло
    — з’єднувач, що продовжує схему в іншому стовпці.'
- p: Загальний алгоритм (рис. {fig:req}) однаковий для всіх сторінок АРМ. Якщо сеанс не встановлено, користувач потрапляє
    на сторінку входу. Далі застосунок завантажує обліковий запис і права; за відсутності права на розділ повертається відповідь
    403. Кожна дія виконується в окремій транзакції, на початку якої в СКБД передається ідентифікатор користувача. Якщо функція
    чи тригер БД відхиляє дію, транзакцію відкочують, а користувач бачить зрозуміле повідомлення про причину; інакше транзакцію
    фіксують і формують сторінку.
- figure:
    id: req
    src: tspp_work/lab2/diagrams/02_request.png
    caption: Блок-схема загального алгоритму обробки запиту користувача
- h2: 6.3. Модуль прийому виявлень
- p: Модуль прийому виявлень (рис. {fig:ing}) — функція fn_ingest_detection, яку викликає REST API. Після перевірки ключа
    шлюзу функція перевіряє, що сенсор зареєстрований і перебуває в мережі, оновлює час його останнього сигналу. Виявлення
    з координатами зіставляється з найближчим активним треком, оновленим не раніше ніж 20 с тому, у радіусі 3 км; якщо такого
    немає, створюється новий попередній трек з номером ЩП-NNNN у межах доби. Після трьох виявлень від двох різних сенсорів
    трек стає «підтвердженим». Насамкінець підпрограма fn_eval_threat визначає найближчий об’єкт прикриття, час підльоту за
    поточною швидкістю й оцінку загрози з урахуванням категорії об’єкта.
- figure:
    id: ing
    src: tspp_work/lab2/diagrams/03_ingest.png
    caption: Блок-схема модуля прийому виявлень
- h2: 6.4. Модуль керування місією
- p: Модуль керування місією (рис. {fig:mis}) реалізовано тригерами trg_mission_guard і trg_mission_after. Кожну зміну стану
    перевіряють за таблицею mission_transition, що містить вісім допустимих переходів діаграми станів «Місії» з практичної
    роботи № 4 [18], і за правом користувача на перехід. Обмеження CHECK забороняє санкцію автором пропозиції (правило двох
    осіб), а перехід у стан «виконується» можливий лише з готовим перехоплювачем. Після успішної перевірки тригер записує
    часові мітки, оновлює стани розрахунку, перехоплювача й треку та додає подію в хронологію; будь-яка відмова скасовує всю
    транзакцію. Фрагмент тригерної функції наведено на рис. {fig:guard}.
- figure:
    id: mis
    src: tspp_work/lab2/diagrams/04_mission.png
    caption: Блок-схема модуля керування місією
- figure:
    id: guard
    src: tspp_work/lab2/diagrams/21_guard.png
    caption: Фрагмент тригерної функції trg_mission_guard
- h2: 6.5. Модуль журналу аудиту
- p: Модуль журналу аудиту (рис. {fig:aud}) складається з двох алгоритмів. Тригер trg_audit на таблицях mission, personnel,
    role_permission і engagement_report формує стан запису до і після зміни, отримує блокування для послідовного запису, читає
    хеш попереднього запису й обчислює SHA-256 від нього разом із часом, суб’єктом, дією та даними. Функція fn_audit_verify
    проходить журнал за зростанням номера, перераховує хеші й рахує порушення. Оскільки кожен хеш залежить від попереднього,
    зміна будь-якого запису розриває ланцюжок і виявляється перевіркою.
- figure:
    id: aud
    src: tspp_work/lab2/diagrams/05_audit.png
    caption: Блок-схема модуля журналу аудиту
- h1: 7. Опис інтерфейсу програмного продукту
  new_page: true
- p: 'Інтерфейс АРМ — веб-сторінки з однаковою структурою: верхня панель з назвою системи, меню розділів і даними користувача
    (ім’я, код і назва ролі, позивний розрахунку), область повідомлень і робоча область. Меню формується за правами ролі:
    користувач бачить лише ті розділи, на які має право. Нижче описано сценарій роботи, пройдений на тестовому стенді.'
- h2: 7.1. Вхід до системи
- p: 'Сторінка входу (рис. {fig:s1}) у навчальному стенді імітує єдиний вхід з двофакторною автентифікацією: користувач обирає
    обліковий запис зі списку, згрупованого за ролями. Після входу відкривається перший розділ, на який користувач має право.'
- figure:
    id: s1
    src: tspp_work/lab2/diagrams/scr_01_login.png
    caption: Сторінка входу до АРМ
- h2: 7.2. Повітряна обстановка
- p: Сторінка «Обстановка» (рис. {fig:s2}) — головний екран аналітика, офіцера бойового управління та оперативного чергового.
    Чотири картки показують кількість активних треків, місій у роботі, готових розрахунків і сенсорів у мережі. Таблиця черги
    загроз упорядкована за оцінкою загрози (смуга й число), ворожі цілі виділено червоним; для кожного треку видно час підльоту,
    об’єкт під загрозою та активну місію.
- figure:
    id: s2
    src: tspp_work/lab2/diagrams/scr_02_situation.png
    caption: 'Сторінка «Обстановка»: черга загроз'
- p: 'Номер треку відкриває картку треку (рис. {fig:s3}): належність, оцінка загрози, остання позиція, хто класифікував, останні
    виявлення від різних сенсорів. Аналітик бачить форму класифікації, офіцер бойового управління — список розрахунків-кандидатів,
    упорядкованих за досяжністю й відстанню, і кнопку «Запропонувати місію».'
- figure:
    id: s3
    src: tspp_work/lab2/diagrams/scr_03_track.png
    caption: Картка треку з пропозицією місії
- h2: 7.3. Життєвий цикл місії
- p: Після пропозиції відкривається картка місії у стані «запропонована» (рис. {fig:s4}). Офіцер бойового управління не має
    права санкції, тому дій для нього немає — це наочний прояв правила двох осіб.
- figure:
    id: s4
    src: tspp_work/lab2/diagrams/scr_04_proposed.png
    caption: Картка місії після пропозиції
- p: Оперативний черговий відкриває ту саму місію й натискає «Санкціонувати» (рис. {fig:s5}); у картці з’являються його ім’я
    та час санкції, а в хронології — нова подія. Перелік місій з фільтром за станом наведено на рис. {fig:s6}.
- figure:
    id: s5
    src: tspp_work/lab2/diagrams/scr_05_approved.png
    caption: Картка місії після санкції оперативного чергового
- figure:
    id: s6
    src: tspp_work/lab2/diagrams/scr_06_missions.png
    caption: Перелік місій перехоплення
- p: 'Командир призначеного розрахунку приймає завдання (рис. {fig:s7}); для пуску він обирає готовий перехоплювач своєї позиції
    зі списку. Після пуску й доповіді про результат місія закривається (рис. {fig:s8}): хронологія містить усі п’ять змін
    стану з виконавцями, а перехоплювач і трек отримують нові стани автоматично.'
- figure:
    id: s7
    src: tspp_work/lab2/diagrams/scr_07_accepted.png
    caption: Картка місії, прийнятої розрахунком
- figure:
    id: s8
    src: tspp_work/lab2/diagrams/scr_08_closed.png
    caption: Закрита місія М-1011-03 з повною хронологією
- h2: 7.4. Ресурси
- p: Сторінка «Ресурси» (рис. {fig:s9}) показує готовність за позиціями й перелік перехоплювачів обраної позиції. Логіст може
    додати перехоплювач, змінити його дані (рис. {fig:s10}) або видалити. Спроба видалити перехоплювач, уже використаний у
    місіях, відхиляється обмеженням зовнішнього ключа, і користувач бачить пояснення (рис. {fig:s11}).
- figure:
    id: s9
    src: tspp_work/lab2/diagrams/scr_09_resources.png
    caption: 'Сторінка «Ресурси»: готовність позицій і перехоплювачі'
- figure:
    id: s10
    src: tspp_work/lab2/diagrams/scr_10_edit.png
    caption: Форма зміни даних перехоплювача
- figure:
    id: s11
    src: tspp_work/lab2/diagrams/scr_11_delete_refused.png
    caption: Відмова у видаленні використаного перехоплювача
- h2: 7.5. Аналітика та журнал аудиту
- p: 'Сторінка «Аналітика» (рис. {fig:s12}) для обраного періоду показує кількість місій, частку влучань, середній час від
    пропозиції до санкції і від санкції до пуску, розподіл результатів і рейтинг розрахунків. Сторінка «Аудит» (рис. {fig:s13})
    доступна лише офіцеру кібербезпеки: вона перевіряє ланцюжок хешів і показує останні записи журналу.'
- figure:
    id: s12
    src: tspp_work/lab2/diagrams/scr_12_analytics.png
    caption: Сторінка «Аналітика»
- figure:
    id: s13
    src: tspp_work/lab2/diagrams/scr_13_audit.png
    caption: Сторінка «Аудит» з перевіркою ланцюжка хешів
- h2: 7.6. Програмний інтерфейс для шлюзів
- p: 'Периферійні шлюзи працюють з продуктом через REST API: POST /api/v1/detections приймає виявлення, GET /api/v1/threats
    повертає чергу загроз у форматі JSON. Обмін для одного виявлення показано на рис. {fig:api}: сервер зіставив виявлення
    з існуючим треком і повернув його номер. Запит від сенсора «AC-0008», що перебуває поза мережею, отримує відповідь 422
    з причиною, а запит з невірним ключем — 401.'
- figure:
    id: api
    src: tspp_work/lab2/diagrams/20_api.png
    caption: Обмін з REST API під час передавання виявлення

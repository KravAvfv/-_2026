    даними за 30 діб (651 виявлень, 30 місії, 282 записів аудиту) триває 0,3 с; обробка одного виявлення через REST API займає
    в медіані 7,8 мс (95-й процентиль — 9,8 мс, максимум — 9,8 мс), тобто становить менше 1 % бюджету затримки NFR-01. Повна
    резервна копія БД має обсяг 174 КБ.'
- h1: 5. Програмні засоби реалізації та обґрунтування вибору
  new_page: true
- p: 'Засоби розробки обрано за категоріями інструментів, розглянутими в лекції 7: мова й фреймворк, система керування базами
    даних, засоби керування версіями, автоматизації та тестування [7]. Критеріями були: надійність зберігання даних і виконання
    правил на рівні БД, мінімальна кількість залежностей, швидкість розроблення та можливість автоматичної перевірки. Перелік
    засобів наведено в табл. {tab:tools}.'

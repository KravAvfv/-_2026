- h2: 5.1. СКБД PostgreSQL
- p: PostgreSQL обрано ще на етапі фізичного моделювання [2]; на етапі реалізації вирішальними стали процедурна мова PL/pgSQL
    і тригери [8]. Усі критичні правила предметної області — допустимі переходи стану місії, правило двох осіб, узгодження
    станів ресурсів, журнал аудиту — виконуються всередині СКБД. Тому їх неможливо обійти ні через інтерфейс, ні через API,
    ні прямим SQL-запитом. Вбудована функція sha256 [9] дає змогу будувати ланцюжок хешів без зовнішніх бібліотек, оператор
    GRANT [10] — розмежувати доступ на рівні таблиць і стовпців, утиліти pg_dump і pg_restore [11] — виконувати резервне копіювання.
- h2: 5.2. Python і Flask
- p: Python забезпечує короткий і читабельний код та має зрілий драйвер PostgreSQL. Flask — мікрофреймворк, що надає лише
    маршрутизацію, сеанси й обробку запитів [12]; для продукту, де бізнес-логіка зосереджена в БД, цього достатньо, а відсутність
    ORM дає змогу викликати функції й представлення PostgreSQL напряму. Увесь веб-застосунок займає 291 рядків коду. Шаблонізатор
    Jinja2 [13] автоматично екранує дані, що захищає від міжсайтових сценаріїв, а psycopg [14] передає параметри окремо від
    тексту запиту, що виключає SQL-ін’єкції.
- h2: 5.3. Засоби автоматизації та перевірки
- p: 'Розгортання, наповнення, демонстрація і перевірка автоматизовані одним скриптом: він піднімає тимчасовий кластер PostgreSQL,
    виконує схему ЛР1 і серверну логіку, наповнює БД, запускає застосунок, проходить сценарій інтерфейсу в браузері без графічного
    вікна за допомогою бібліотеки Puppeteer [15] і перевіряє кожну функціональну вимогу. Тому всі знімки екрана в розділі
    7 отримано з працюючої програми, а результати в розділі 8 відтворюються одним запуском.'
- h1: 6. Алгоритм роботи програмного продукту
  new_page: true
- h2: 6.1. Структура програмного продукту
- p: 'Продукт побудовано за багаторівневою архітектурою (Layered Architecture) з розподілом відповідальності за шаблоном MVC
    [16]: модель — це БД з таблицями, функціями та тригерами; подання — HTML-шаблони; контролер — обробники маршрутів Flask.
    Структуру показано на рис. {fig:struct}. Користувачі звертаються до застосунку з браузера, периферійні шлюзи — до REST
    API; застосунок працює з СКБД через psycopg і в кожній транзакції передає ідентифікатор користувача, за яким тригери перевіряють
    права і ведуть аудит.'
- figure:
    id: struct
    src: tspp_work/lab2/diagrams/01_structure.png
    caption: Структура програмного продукту
- p: 'Склад модулів наведено в табл. {tab:mod}. Реакцію БД на зміни реалізовано за подієвим принципом: тригер спрацьовує на
    подію зміни запису й виконує пов’язані дії, як спостерігач (Observer) у поведінкових шаблонах [16].'
- table:
    font: 11
    id: mod
    caption: Модулі програмного продукту
    header:
    - Модуль (файл)

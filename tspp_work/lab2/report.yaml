- p: 'Окремо перевірено стійкість журналу аудиту до підробки. Від імені суперкористувача було вимкнено тригер незмінності
    й змінено поле даних одного запису. Повторна перевірка виявила порушення саме в цьому записі (№ 40): хеш, перерахований
    з даних, більше не збігається зі збереженим, а ланцюжок посилань розірвано. Отже, навіть адміністратор СКБД не може непомітно
    змінити історію рішень.'
- p: 'Статистику тестових даних за 30 діб наведено на сторінці «Аналітика»: 31 місій, 20 влучань, 5 промахів, 2 скасувань
    і 2 відхилених санкцій; середній час від пропозиції до санкції — 33,5 с, від санкції до пуску — 38,7 с.'
- h1: Висновки
  new_page: true
- p: У лабораторній роботі описано програмну реалізацію IoT-платформи «Щит-Лінк».
- numbered:
  - Сформульовано мету програмного продукту — скорочення часу від виявлення цілі до призначення розрахунку та підвищення частки
    успішних перехоплень за рахунок автоматизації обстановки, контрольованого життєвого циклу місії з правилом двох осіб і
    незмінного журналу аудиту.
  - Визначено вісім груп вхідних і вісім груп вихідних даних з джерелами, каналами, отримувачами та відповідними таблицями
    й представленнями БД.
  - 'Сформульовано системні вимоги до сервера, АРМ, периферійного шлюзу й мережі; їх достатність підтверджено на стенді: обробка
    виявлення займає в медіані 7,8 мс за бюджету затримки 2 с.'
  - 'Обґрунтовано вибір засобів: PostgreSQL з PL/pgSQL — для виконання правил предметної області всередині СКБД; Python і
    Flask — для компактного веб-застосунку без ORM; Jinja2 і psycopg — для захисту від міжсайтових сценаріїв і SQL-ін’єкцій;
    Puppeteer — для автоматизованої перевірки інтерфейсу.'
  - Описано алгоритм роботи продукту та побудовано блок-схеми структури, загального алгоритму обробки запиту, модулів прийому
    виявлень, керування місією та журналу аудиту.
  - Описано інтерфейс АРМ на тринадцяти знімках екрана працюючої програми — від входу до аудиту — та REST API для шлюзів.
  - Реалізовано й автоматично перевірено всі тринадцять функціональних вимог до БД з лабораторної роботи 1.
- p: 'Отриманий програмний продукт є працюючим ядром системи, придатним для подальшого розвитку: підключення реальних протоколів
    сенсорів і телеметрії, картографічного подання обстановки та розгортання в контейнерах.'

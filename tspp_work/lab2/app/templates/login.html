{% extends "base.html" %}{% block title %}Вхід{% endblock %}
{% block body %}
<div class="login card">
  <h1>Вхід до АРМ</h1>
  <p class="muted">Навчальний стенд: вхід імітує єдиний вхід OIDC з двофакторною автентифікацією — оберіть обліковий запис.</p>
  <form method="post" class="inline">
    <label for="login">Користувач</label>
    <select name="login" id="login">
      {% for u in users %}<option value="{{ u.login }}">{{ u.code }} · {{ u.role }} — {{ u.full_name }}</option>{% endfor %}
    </select>
    <button type="submit">Увійти</button>
  </form>
</div>
{% endblock %}

      - Дублі й суперечливі треки, втрачені секунди
      - Єдиний прийом через шлюзи та злиття треків (FR-02, FR-04)
    - - Голосове цілевказання розрахункам
      - Затримка 30–90 с, помилки сприйняття
      - Цифрове завдання на планшет ≤ 1 с (FR-11, NFR-02)
    - - Немає актуальної картини готовності розрахунків і перехоплювачів
      - Призначення не того розрахунку, простій резерву
      - Облік готовності в реальному часі (FR-08, FR-14)
    - - Телеметрія не зберігається централізовано
      - Неможливий аналіз місій
      - Архів телеметрії, відтворення місій (FR-12, FR-17)
    - - Ризик ураження дружньої авіації
      - Загроза людям і техніці
      - Обов’язкова деконфлікція та санкція людини (FR-07, FR-10, NFR-16)
    - - Подавлення зв’язку засобами РЕБ
      - Втрата обстановки на позиції
      - Автономність шлюзу ≥ 4 год (FR-03, NFR-06)
    - - Паперова звітність про результати й витрату
      - Повільне поповнення, спірні результати
      - Автоматичні звіти та облік витрати (FR-13, FR-15)
- h2: 5.3. Бізнес-модель
- p: Система підтримує бізнес-модель цілодобового бойового чергування центру. Ключові бізнес-процеси та функціональні вимоги,
    якими система їх підтримує, наведено в табл. {tab:bp}. Межі системи та її інформаційні зв’язки з користувачами й зовнішніми
    системами показано на контекстній схемі (рис. {fig:ctx}).

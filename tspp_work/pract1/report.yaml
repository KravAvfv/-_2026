      - Безпека людини
      - Принцип «людина в контурі»
      - 0 пусків без санкції оперативного чергового
- h2: 4.4. Аналіз вимог
- p: 'Аналіз вимог виконано за критеріями лекції [5] — коректність, повнота, узгодженість, пріоритети, конфлікти й дублювання:'
- bullets:
  - '**коректність і однозначність:** кожна вимога сформульована як «Система повинна…» з одним дієсловом дії; нефункціональні
    вимоги мають числові критерії (табл. {tab:nfr});'
  - '**повнота:** кожна функціональна вимога, крім FR-22, трасується щонайменше до одного з 23 варіантів використання (табл.
    {tab:fr}); FR-22 (тренувальний режим) свідомо віднесено до майбутнього інкременту і зафіксовано як відкладену;'
  - '**узгодженість:** виявлено п’ять конфліктів і випадків дублювання, способи їх розв’язання наведено в табл. {tab:conf};'
  - '**пріоритети:** вимоги, від яких залежить безпека людей і своєчасність рішення, мають високий пріоритет і реалізуються
    в перших інкрементах; аналітика й експорт — середній і низький.'

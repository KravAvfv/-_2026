    widths:
    - 3.6
    - 12.4
    rows:
    - - Актори
      - Оперативний черговий
    - - Короткий опис
      - Людське рішення на пуск перехоплювача за запропонованою місією.
    - - Передумови
      - Місія має стан «Запропонована»; оперативний черговий автентифікований (2FA).
    - - Основний потік
      - - 1. Система показує місію, ціль, обраний розрахунок і прогнозну точку перехоплення.
        - 2. Оперативний черговий перевіряє обстановку і підтверджує санкцію.
        - 3. Система переводить місію в стан «Санкціонована» і надсилає завдання розрахунку.
    - - Альтернативні потоки
      - - '1а. Точка перехоплення поблизу зони заборони ураження — діє правило двох осіб: санкціонує особа, відмінна від автора
          пропозиції.'
        - 2а. Оперативний черговий відхиляє місію — стан «Відхилена», ціль повертається в чергу.
    - - Постумови
      - Завдання надіслано розрахунку або місію відхилено; рішення зафіксовано в журналі аудиту.
    - - Вимоги
      - FR-10, FR-11, FR-20, NFR-16
- table:
    font: 12
    id: spec4
    caption: Специфікація варіанта використання «UC-08 Прийняти бойове завдання»
    header:
    - Елемент
    - Зміст
    widths:
    - 3.6
    - 12.4
    rows:
    - - Актори
      - Командир розрахунку
    - - Короткий опис
      - Прийняття розрахунком бойового завдання на планшеті.
    - - Передумови
      - Місія санкціонована; планшет розрахунку з’єднаний із периферійним шлюзом.
    - - Основний потік
      - - 1. Система доставляє завдання з даними цілевказання на планшет (≤ 1 с).
        - 2. Командир переглядає завдання і підтверджує прийняття.
        - 3. Система фіксує час підтвердження і переводить розрахунок у стан «Призначений».
    - - Альтернативні потоки
      - - 2а. Технічна несправність — командир відхиляє завдання із зазначенням причини; система пропонує наступного кандидата.
        - 2б. Немає відповіді 15 с — автоматична ескалація (UC-06).
    - - Постумови
      - Завдання прийнято або перепризначено; оперативний черговий бачить актуальний стан.
    - - Вимоги
      - FR-11, FR-16, NFR-02
- h1: 5. Специфікація системних вимог IoT-платформи «Щит-Лінк»
  new_page: true
- p: Специфікацію складено за структурою SRS із теоретичного матеріалу практичної роботи [1] (підрозділ 2.3). Розділи 5.1–5.10
    відповідають розділам 1–10 цієї структури.
- h2: 5.1. Вступ
- h3: 5.1.1. Мета
- p: 'Документ визначає функціональні, системні та нефункціональні вимоги до IoT-платформи «Щит-Лінк» версії 1.0. Цільова
    аудиторія: замовник (командування центру), майбутні користувачі, бізнес-аналітик, архітектор, розробники, тестувальники
    та фахівці із захисту інформації. Документ є основою для проєктування (практичні роботи 2 і 4), планування інкрементів
    і розроблення тестів.'
- h3: 5.1.2. Сфера застосування
- p: '**Система охоплює:** реєстрацію сенсорних вузлів і шлюзів; прийом і нормалізацію виявлень і телеметрії; злиття треків
    і повітряну обстановку; підтримку класифікації та оцінки загрози; деконфлікцію; призначення розрахунків, санкціонування
    пуску й доставку завдань; супровід місій; фіксацію результатів і звіти; облік готовності, обслуговування й запасів; сповіщення;
    аналітику KPI; інтеграцію із зовнішніми системами; управління доступом і аудит.'
- p: '**Система не охоплює:** автопілоти та прошивки дронів (взаємодія лише через протокол телеметрії), алгоритми наведення,
    засоби радіоелектронної боротьби, національні системи ситуаційної обізнаності та оповіщення населення (лише інтеграція
    з ними), складський облік матеріально-технічних засобів поза перехоплювачами й АКБ.'
- h3: 5.1.3. Визначення, акроніми та скорочення
- table:
    font: 12
    id: terms
    caption: Визначення, акроніми та скорочення
    header:
    - Термін
    - Визначення
    widths:
    - 3.6
    - 12.4
    rows:
    - - АКБ
      - Акумуляторна батарея перехоплювача
    - - АРМ
      - Автоматизоване робоче місце
    - - Деконфлікція
      - Перевірка відсутності конфлікту з дружньою авіацією та зонами заборони ураження
    - - КП
      - Командний пункт центру
    - - КСЗІ
      - Комплексна система захисту інформації
    - - Місія
      - Бойове завдання розрахунку на перехоплення конкретної цілі
    - - НСУ
      - Наземна станція управління розрахунку
    - - Периферійний шлюз
      - Обчислювальний вузол на позиції, що агрегує дані сенсорів і НСУ та працює автономно при втраті зв’язку
    - - Повітряний трек
      - Сукупність виявлень, що належать одній повітряній цілі, з її кінематикою
    - - Розрахунок
      - Група з 2–4 осіб, що обслуговує перехоплювачі на позиції
    - - Цілевказання
      - Передавання розрахунку даних про ціль для виконання місії
    - - 2FA
      - Двофакторна автентифікація
    - - KPI
      - Ключовий показник ефективності (Key Performance Indicator)
    - - RBAC
      - Рольове управління доступом (Role-Based Access Control)
    - - SRS
      - Специфікація вимог до програмного забезпечення
- h3: 5.1.4. Посилання та огляд документа
- p: Документ ґрунтується на лекціях дисципліни [2; 5; 6], теоретичному матеріалі практичної роботи [1], посібниках [3; 4;
    9; 10] і стандарті якості ISO/IEC 25010 [8]; оформлення — за ДСТУ 3008:2015 [11]. Розділ 5.2 пояснює причини створення
    системи, 5.3 — бізнес-контекст, 5.4 — ієрархію функціональних і системних вимог, 5.5 — випадки використання, 5.6–5.7 —
    технічні вимоги та системні якості, 5.8 — обмеження й припущення, 5.9 — критерії прийняття, 5.10 — додатки.
- h2: 5.2. Драйвери бізнесу
- p: Потреба в системі зумовлена проблемами поточного (ручного) способу роботи центру та можливостями, які дає автоматизація
    (табл. {tab:drv}). Головна бізнес-мета — скоротити цикл «виявлення — рішення — перехоплення» з хвилин до десятків секунд
    за збереження людського контролю над кожним пуском.
- table:
    font: 12
    id: drv
    caption: 'Драйвери бізнесу: проблеми та можливості'
    header:

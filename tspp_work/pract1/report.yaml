    id: ctx
    src: tspp_work/pract1/diagrams/03_context.mmd
    caption: Контекстна схема IoT-платформи «Щит-Лінк»
- p: Вхідні потоки системи — виявлення й стан сенсорних вузлів, телеметрія перехоплювачів, плани польотів дружньої авіації,
    метеодані; вихідні — цілевказання і бойові завдання розрахункам, сповіщення про загрозу, донесення до національної системи;
    двобічний обмін ведеться з персоналом КП (обстановка, рішення, санкції), розрахунками, службами забезпечення та національною
    системою.
- h2: 5.4. Функціональні та системні вимоги
- p: Відповідно до структури SRS [1] функціональні вимоги верхнього рівня (табл. {tab:fr}) деталізовано до 30 системних вимог,
    що описують дані, реакції та поведінку системи. Системні вимоги згруповано за чотирма підсистемами (табл. {tab:sr1}–{tab:sr4});
    код SR-x.y однозначно ідентифікує вимогу, а стовпець «FR» забезпечує трасування до вимоги верхнього рівня.

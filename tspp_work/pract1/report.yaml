- h1: 4. Збір і аналіз вимог
  new_page: true
- h2: 4.1. Зацікавлені сторони та методи збору вимог
- p: 'Збір вимог розпочато з визначення зацікавлених сторін і вибору для кожної з них методу збору з переліку лекції [5]:
    інтерв’ю, опитування, наради, спостереження; додатково застосовано аналіз документів (журналів обліку, специфікацій протоколів),
    що рекомендує посібник [4]. Результати наведено в табл. {tab:stake}; коди ЗС-1…ЗС-8 використовуються далі як джерела вимог.'

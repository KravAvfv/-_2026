    узагальнено абстрактним актором «Персонал КП»: аналітик обстановки, оперативний черговий і офіцер бойового управління
    успадковують прецедент «Переглянути повітряну обстановку». Сенсорний вузол, наземна станція управління (НСУ) і національна
    система ситуаційної обізнаності позначені стереотипом «система» — це машинна взаємодія, характерна для IoT-систем.'

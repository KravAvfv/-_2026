blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** вивчити методи збору вимог від замовників і кінцевих користувачів, навчитися класифікувати, аналізувати
    та документувати функціональні й нефункціональні вимоги, побудувати діаграму варіантів використання (Use Case Diagram)
    і скласти специфікацію системних вимог (SRS) для власного програмного продукту з використанням інтернету речей.'
- p: '**Завдання роботи** [1]:'
- numbered:
  - обрати власну тему для створення програмного продукту з використанням інтернету речей (окремий додаток, мобільний застосунок
    або веб-орієнтована система) з дружнім інтерфейсом і базою даних не менш ніж із 5–6 зв’язаних наповнених таблиць — розділ
    3;
  - зібрати функціональні та нефункціональні вимоги, створити діаграму варіантів використання — розділ 4;
  - описати специфікацію системних вимог із використанням теоретичного матеріалу — розділ 5;
  - створити звіт і сформулювати висновки до роботи — цей звіт, розділ «Висновки».
- p: '**Тема програмного продукту:** «Розподілена IoT-система цілевказівки та координації дронів для перехоплення повітряних
    цілей». Програмний продукт — IoT-платформа «Щит-Лінк» для регіонального центру протидронової оборони РЦПДО «Щит-Північ».'
- p: '*Примітка: РЦПДО «Щит-Північ» і IoT-платформа «Щит-Лінк» є навчальними умовними моделями; усі назви, процеси та показники
    наведено суто з навчально-ілюстративною метою.*'
- p: 'Предмет моделювання обмежено рівнем інформаційної системи: які дані збираються, хто і які рішення ухвалює, які функції
    та якості повинна мати програмна система. Алгоритми керування польотом і засоби ураження не розглядаються; рішення на
    застосування завжди ухвалює людина.'
- h1: 2. Теоретичні відомості
  new_page: true
- h2: 2.1. Життєвий цикл програмного продукту та його моделі
- p: 'Життєвий цикл програмного продукту (Software Development Life Cycle, SDLC) — процес, що охоплює всі етапи розроблення
    програмного забезпечення від початкового планування до підтримки після релізу [2]. Лекційний матеріал виділяє сім етапів:
    планування, аналіз вимог, проєктування системи, реалізацію (кодування), тестування, впровадження та підтримку [2]. Саме
    на етапі аналізу вимог визначають функціональні та нефункціональні вимоги — тобто те, які задачі повинна виконувати система.'
- p: 'Модель життєвого циклу визначає підхід до розроблення: порядок етапів, наявність ітерацій і способи контролю. Розглядають
    шість основних моделей [2; 3]: каскадну (Waterfall) — послідовне проходження етапів, придатну за чітких і стабільних вимог;
    спіральну — ітерації, кожна з яких починається з аналізу ризиків і планування; V-модель — розширення каскадної з паралельним
    плануванням тестування для кожного етапу; Agile — ітеративно-інкрементний підхід із гнучким реагуванням на зміни; інкрементну
    модель — поступове нарощування функцій, що дозволяє впроваджувати продукт частинами; DevOps — поєднання розроблення та
    експлуатації з безперервною інтеграцією (CI), безперервним розгортанням, тестуванням і моніторингом.'
- h2: '2.2. Вимоги до програмного забезпечення: збір, аналіз, управління'
- p: 'Вимога — умова або можливість, яку визначив користувач для розв’язання проблеми чи досягнення мети і якій повинна відповідати
    система або її компонент [4]. Розрізняють бізнес-вимоги, вимоги користувачів, функціональні вимоги (що повинна робити
    система) і нефункціональні вимоги (як добре вона повинна це робити: продуктивність, надійність, безпека, зручність тощо)
    [4; 5]. Приклад функціональної вимоги з лекції: «Користувач повинен мати змогу увійти в систему за допомогою ідентифікатора
    та пароля» [5].'
- p: 'Робота з вимогами складається з послідовних, але взаємопов’язаних кроків (рис. {fig:reqproc}) [5]. **Збір вимог** спирається
    на джерела (клієнти, бізнес-аналітики, технічні фахівці) і методи: інтерв’ю, опитування, наради, спостереження. **Аналіз
    вимог** оцінює їх коректність, повноту та узгодженість, визначає пріоритети, виявляє конфлікти й дублювання; за посібником
    [4] він також встановлює межі (scope) проєкту і деталізує системні вимоги до програмних. **Управління вимогами** забезпечує
    контроль змін, версійність і відстеження за допомогою інструментів Jira, Trello, IBM Rational DOORS [5]. Типові проблеми
    — неповні або нечіткі вимоги, зміни після початку розроблення та брак комунікації між командами [5].'
- figure:
    id: reqproc
    src: tspp_work/pract1/diagrams/01_req_process.mmd
    caption: Процес роботи з вимогами до програмного забезпечення
    width_cm: 13.0
- h2: 2.3. Специфікація системних вимог (SRS)
- p: Специфікація вимог до програмного забезпечення (Software Requirements Specification, SRS) — документ, що визначає функції,
    продуктивність і обмеження системи та слугує контрактом між замовником і розробником [1]. Посібник [4] розрізняє специфікацію
    вимог користувачів (концепцію), специфікацію системних вимог, що описує систему в контексті системної інженерії (програмні
    й апаратні компоненти, персонал), і специфікацію програмних вимог. На відміну від специфікації бізнес-вимог (BRS), яку
    готує бізнес-аналітик на дуже високому рівні, SRS походить від BRS, описує і функціональні, і технічні характеристики
    та містить таблиці й випадки використання [1].
- p: 'Добре написана SRS вирівнює очікування зацікавлених сторін, є основою планування, зменшує ризики (розповзання обсягу,
    прогалини у функціях), слугує планом для проєктування, полегшує тестування, покращує комунікацію команд, забезпечує дотримання
    норм і спрощує супровід [1]. Структура SRS, якої дотримано в розділі 5, містить десять розділів: вступ (мета, сфера застосування,
    визначення, посилання, огляд); драйвери бізнесу; бізнес-модель; функціональні та системні вимоги; випадки використання
    системи; технічні вимоги; системні якості; обмеження та припущення; критерії прийняття; додатки [1]. Кожна вимога повинна
    бути однозначно ідентифікована для відстеження [1].'
- h2: 2.4. Діаграма варіантів використання
- p: 'Діаграма прецедентів (варіантів використання, use case diagram) — узагальнена модель функціонування системи в навколишньому
    середовищі [6]. У технології RUP вона є основним засобом визначення функцій системи на етапі «Визначення вимог» [6]. Актор
    — роль користувача або зовнішньої системи; прецедент (еліпс) — послідовність дій, що дає акторові значущий результат.
    Властивості прецедента [6]: він описує, ЩО потрібно робити, а не ЯК; описує дії з погляду виконавця; повертає виконавцю
    деяке повідомлення; послідовність дій усередині прецедента є одним неподільним ланцюгом.'
- p: Між прецедентами використовують відношення включення «include» (базовий прецедент завжди виконує включений) і розширення
    «extend» (додаткова поведінка за певної умови), між акторами — узагальнення. Текстову специфікацію прецедента, за прикладом
    опису діаграм [7], складають із короткого опису, основного потоку подій, альтернативних потоків, передумов і постумов.
- h1: 3. Вибір теми та концепція програмного продукту
  new_page: true
- h2: 3.1. Тема і призначення програмного продукту
- p: 'Обрано тему «Розподілена IoT-система цілевказівки та координації дронів для перехоплення повітряних цілей». Програмний
    продукт — IoT-платформа «Щит-Лінк», розподілена інформаційно-управляюча система реального часу, що збирає дані від мережі
    сенсорних вузлів (акустичних датчиків, малогабаритних РЛС, оптико-електронних постів) і телеметрію дронів-перехоплювачів,
    формує єдину повітряну обстановку та координує розрахунки перехоплювачів: передає їм цілевказання, фіксує санкціонування,
    хід і результат кожної місії.'
- p: 'Продукт поєднує всі три форми реалізації, передбачені завданням [1]: веб-орієнтовану систему (автоматизовані робочі
    місця (АРМ) командного пункту, аналітики, логістики та адміністрування), мобільний застосунок (планшет командира розрахунку)
    та окремий додаток периферійного шлюзу на позиції. Використання інтернету речей полягає в машинній взаємодії (M2M) сенсорів,
    шлюзів і наземних станцій управління з ядром платформи за протоколами MQTT 5, ASTERIX і MAVLink 2. Дружній інтерфейс забезпечують
    карта обстановки з умовними знаками APP-6, нічна тема та підтвердження ключових дій однією-двома діями (вимога NFR-10).'
- h2: 3.2. Об’єкт автоматизації та користувачі
- p: Об’єкт автоматизації — діяльність умовного РЦПДО «Щит-Північ» з виявлення, супроводу й перехоплення повітряних цілей
    у зоні відповідальності (3 райони області, 14 об’єктів критичної інфраструктури, 120 акустичних сенсорів, 4 РЛС, 12 оптико-електронних
    постів, 18 розрахунків на 9 позиціях, близько 160 осіб особового складу). Наразі виявлення надходять різними каналами,
    цілевказання передають голосом, облік готовності та звітність ведуть вручну — ці проблеми детально розглянуто в підрозділі
    5.2. Користувачами системи є 11 людських ролей і 3 зовнішні системи-актори (табл. {tab:actors}).
- h2: 3.3. Вибір моделі життєвого циклу
- p: 'Модель життєвого циклу обрано порівнянням шести моделей лекції [2] за критеріями, суттєвими для проєкту: стабільність
    вимог, критичність помилок (рішення впливають на безпеку людей), потреба в ранньому отриманні корисних функцій, інтенсивність
    змін під час експлуатації та обсяг документації (табл. {tab:lc}).'
- table:
    font: 12
    id: lc
    caption: Порівняння моделей життєвого циклу для IoT-платформи «Щит-Лінк»
    header:
    - Модель
    - Переваги для проєкту
    - Обмеження для проєкту
    - Висновок
    widths:
    - 2.6
    - 5.2
    - 5.2
    - 3.0
    rows:
    - - Каскадна
      - Чіткий порядок, повна документація
      - Вимоги до тактики й інтеграцій змінюються; продукт з’являється лише наприкінці
      - Не підходить у чистому вигляді
    - - Спіральна
      - Явний аналіз ризиків на кожному витку
      - Висока вартість і тривалість витків, потреба в експертах з ризиків
      - Аналіз ризиків запозичено
    - - V-модель
      - Кожному рівню вимог відповідає рівень тестування — важливо для критичних функцій
      - Послідовна, слабо реагує на зміни
      - Застосовується всередині інкременту
    - - Agile
      - Гнучкість, тісна співпраця з користувачами
      - Недостатня формалізація для функцій безпеки та атестації КСЗІ
      - Практики спринтів — для інтерфейсів
    - - Інкрементна
      - Ранній запуск ядра, поетапне нарощування функцій
      - Потрібна стабільна архітектура з першого інкременту
      - Базова модель
    - - DevOps
      - CI/CD, моніторинг, швидкі оновлення на всіх вузлах
      - Потребує автоматизації інфраструктури та культури команди
      - Модель супроводу й випуску
- p: 'Обрано **комбіновану модель** (рис. {fig:lc}): спільні етапи планування, аналізу вимог і проєктування архітектури виконуються
    один раз, далі продукт створюється **інкрементами**, а в межах кожного інкременту дотримується **V-модель** — кожному
    рівню вимог SRS відповідає рівень тестування (модульне, інтеграційне, системне, приймальне). Випуск і супровід організовано
    за моделлю **DevOps**: безперервна інтеграція і тестування, безперервне розгортання на ядро та периферійні шлюзи, постійний
    моніторинг; відгуки користувачів і запити на зміну повертаються на етап планування наступного інкременту. Такий підхід
    поєднує раннє отримання цінності (інкрементна модель і DevOps) із суворою перевірюваністю критичних функцій (V-модель),
    як рекомендує порівняння моделей у лекції [2].'
- figure:
    id: lc
    src: tspp_work/pract1/diagrams/02_lifecycle.mmd
    caption: Обрана модель життєвого циклу IoT-платформи «Щит-Лінк»
- p: 'Розподіл функцій за інкрементами відповідає пріоритетам вимог (підрозділ 4.2): перший інкремент дає єдину повітряну
    обстановку, другий — повний цикл ухвалення рішення, третій — супровід місій і звітність, четвертий — облік ресурсів, аналітику
    та зовнішні інтеграції.'
- h2: 3.4. Попередня структура бази даних
- p: 'Завдання вимагає бази даних щонайменше з 5–6 зв’язаних наповнених таблиць [1]. Попередня концептуальна модель даних
    «Щит-Лінк» містить 11 таблиць, пов’язаних зовнішніми ключами (рис. {fig:er1}, {fig:er2}); для читабельності модель розділено
    на підсистему моніторингу повітряного простору та підсистему бойового управління, спільні сутності «Повітряний трек» і
    «Позиція» присутні на обох рисунках. Нотація — «сутність — зв’язок» із позначенням кратності «воронячою лапкою»: риска
    — «рівно один», коло — «нуль», розгалуження — «багато».'

- h2: 4.6. Специфікації основних варіантів використання
- p: 'Текстові специфікації складено для чотирьох прецедентів основного ланцюга ухвалення рішення (табл. {tab:spec1}–{tab:spec4})
    за структурою прикладу опису діаграм [7]: короткий опис, передумови, основний потік подій, альтернативні потоки, постумови.
    Кожна специфікація відповідає властивостям прецедента [6]: описує, що робить система, з погляду актора і завершується
    повідомленням акторові.'
- table:
    font: 12
    id: spec1
    caption: Специфікація варіанта використання «UC-03 Класифікувати ціль»
    header:
    - Елемент
    - Зміст
    widths:
    - 3.6
    - 12.4
    rows:
    - - Актори
      - Аналітик обстановки (основний); класифікатор (підсистема)
    - - Короткий опис
      - Аналітик підтверджує або виправляє автоматичну класифікацію підтвердженого повітряного треку.
    - - Передумови
      - Трек має стан «Підтверджений»; користувач автентифікований і має роль аналітика.
    - - Основний потік
      - - 1. Система показує трек у черзі на класифікацію разом із підказкою типу цілі та рівнем достовірності.
        - 2. Система звіряє трек із планами польотів дружньої авіації.
        - 3. Аналітик переглядає кінематику, джерела виявлень і відео.
        - 4. Аналітик підтверджує тип і належність цілі.
        - 5. Система обчислює оцінку загрози, присвоює пріоритет і ставить ціль у чергу.
    - - Альтернативні потоки
      - - 3а. Трек корелює з планом польоту дружньої авіації — система блокує призначення й позначає трек як дружній.
        - 4а. Належність неоднозначна — аналітик ескалює рішення оперативному черговому.
    - - Постумови
      - Трек має стан «Класифікований»; дію записано в журнал аудиту.
    - - Вимоги
      - FR-05, FR-06, FR-20
- table:
    font: 12
    id: spec2
    caption: Специфікація варіанта використання «UC-04 Призначити розрахунок»
    header:
    - Елемент
    - Зміст
    widths:
    - 3.6
    - 12.4
    rows:
    - - Актори
      - Офіцер бойового управління
    - - Короткий опис
      - Вибір розрахунку для перехоплення класифікованої ворожої цілі та створення місії.
    - - Передумови
      - Ціль має належність «ворожа» і перебуває в черзі; є щонайменше один розрахунок у стані «Готовий».
    - - Основний потік
      - - 1. Офіцер обирає ціль із черги.
        - 2. Система формує перелік кандидатів (готовність, допуск, ресурс перехоплювача й АКБ, метеоумови) і впорядковує
          його за прогнозним часом перехоплення.
        - 3. Система виконує UC-05 «Перевірити деконфлікцію» («include»).
        - 4. Офіцер приймає рекомендацію або обирає інший розрахунок.
        - 5. Система створює місію в стані «Запропонована» і передає її на санкціонування.
    - - Альтернативні потоки
      - - 2а. Немає жодного кандидата — система пропонує передати ціль суміжному центру.
        - 3а. Деконфлікцію не пройдено — призначення заблоковано з поясненням причини.
        - Розрахунок не підтвердив завдання за 15 с — виконується UC-06 «Обрати резервний розрахунок» («extend»).
    - - Постумови
      - Місія створена й очікує санкціонування; дію записано в журнал аудиту.
    - - Вимоги
      - FR-07, FR-08, FR-09, FR-20

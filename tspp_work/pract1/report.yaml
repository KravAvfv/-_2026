      - Робочі наради
      - Однозначні, перевірювані вимоги з трасуванням
- p: 'Інтерв’ю з ключовими зацікавленими сторонами (приклад збору вимог з лекції [5]) проводилися за структурованим планом.
    Типові питання:'
- bullets:
  - які дії під час відбиття атаки займають найбільше часу і де виникають помилки;
  - яку інформацію про ціль і розрахунок необхідно бачити для ухвалення рішення на пуск;
  - які рішення повинна ухвалювати лише людина, а які дії система може виконувати автоматично;
  - що відбувається при втраті зв’язку з позицією і як діє розрахунок у такому разі;
  - які звіти й показники потрібні командуванню та вищому органу управління і з якою періодичністю.
- p: 'Спостереження за роботою зміни командного пункту та опитування розрахунків дозволили виявити неявні вимоги, які користувачі
    не називали в інтерв’ю: наприклад, необхідність нічної теми інтерфейсу та підтвердження завдання однією дією в рукавицях
    на планшеті.'

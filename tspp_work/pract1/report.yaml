      - Інтерфейс українською, нічна тема, умовні знаки APP-6
      - Санкціонування / прийняття завдання — ≤ 2 дії
    - - NFR-11
      - Зручність використання
      - Навчуваність нового оператора
      - ≤ 8 год до самостійної роботи
    - - NFR-12
      - Супроводжуваність
      - Модульна структура, автоматизовані тести, CI/CD
      - Покриття тестами критичних модулів ≥ 80 %
    - - NFR-13
      - Сумісність
      - Клієнтські платформи

- h2: 4.3. Нефункціональні вимоги
- p: Нефункціональні вимоги згруповано за характеристиками якості (продуктивність, надійність, безпека, зручність використання,
    супроводжуваність, сумісність), що відповідає моделі якості ISO/IEC 25010 [8], на яку посилається посібник [4], і переліку
    системних якостей SRS [1]. Кожна вимога має вимірюваний критерій, що дозволяє перевірити її під час тестування (табл.
    {tab:nfr}).

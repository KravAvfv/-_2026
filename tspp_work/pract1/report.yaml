      - FR-03 ↔ FR-10
      - Локальне призначення лише у власному секторі; після відновлення зв’язку стан місій узгоджується за ядром
    - - Повнота телеметрії й відео проти пропускної здатності каналів
      - FR-12, NFR-14 ↔ NFR-03
      - 'Класи пріоритету: завдання > треки > телеметрія > відео; відео передається на вимогу'
    - - Дублювання функцій передачі звіту
      - FR-13 ↔ FR-18
      - 'Розмежовано: FR-13 — формування звіту, FR-18 — транспорт до зовнішніх систем'
- p: 'Управління вимогами передбачено за лекцією [5]: базову версію вимог зафіксовано після узгодження із замовником; зміни
    подаються як запити на зміну в системі Jira, кожен запит пов’язується з кодом вимоги, оцінюється за впливом на інкременти
    й затверджується замовником, а версія SRS збільшується.'
- h2: 4.5. Діаграма варіантів використання

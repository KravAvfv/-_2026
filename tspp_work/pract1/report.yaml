    - - Надійність
      - Функціонування при відмові вузла або каналу
      - Два майданчики ядра, реплікація потоків, автономні шлюзи
      - RPO ≤ 5 с; RTO ≤ 60 с
    - - Безпека
      - Захист даних і авторизований доступ
      - mTLS, 2FA, RBAC, журнал аудиту з ланцюжком хешів, КСЗІ
      - 0 критичних вразливостей
    - - Масштабованість
      - Зростання кількості сенсорів і користувачів
      - Горизонтальне масштабування сервісів реального часу, шина подій
      - ×2 навантаження без зміни коду
    - - Ремонтопридатність
      - Легкість оновлення та виправлення
      - Модульна архітектура, CI/CD, автоматизовані тести
      - Оновлення без простою ядра
    - - Доступність
      - Цілодобова робота
      - Резервування, моніторинг, оновлення без зупинки
      - ≥ 99,95 % на місяць
- h2: 5.8. Обмеження та припущення
- p: '**Обмеження**, визначені замовником і середовищем:'
- bullets:
  - рішення на пуск ухвалює лише людина — оперативний черговий (NFR-16); система не має функцій автоматичного застосування;
  - система обробляє службову інформацію і повинна отримати атестат КСЗІ (NFR-15); дані зберігаються лише на власних серверах
    центру, без публічних хмарних сервісів;
  - взаємодія з дронами — лише через стандартний протокол телеметрії MAVLink 2, без зміни їх прошивок;
  - канали зв’язку з позиціями мають обмежену пропускну здатність і можуть бути подавлені засобами РЕБ;
  - бюджет і строки визначають інкрементну поставку (підрозділ 3.3).
- p: '**Припущення** команди розробника:'
- bullets:
  - сенсорні вузли та НСУ підтримують протоколи MQTT 5, ASTERIX і MAVLink 2 або мають адаптери;
  - національна система ситуаційної обізнаності надає документований інтерфейс обміну;
  - на позиціях доступне електроживлення або резервні АКБ для шлюзів;
  - користувачі пройдуть навчання роботі з АРМ і планшетом до введення системи в дію;
  - часова синхронізація вузлів забезпечується приймачами ГНСС із резервним NTP.
- h2: 5.9. Критерії прийняття
- p: 'Система вважається завершеною і готовою до передавання замовнику після виконання критеріїв табл. {tab:acc}. Методи перевірки
    відповідають видам тестування лекції [12]: функціональне тестування методом «чорного ящика», нефункціональне (навантажувальне,
    безпеки, зручності) та приймальне тестування.'
- table:
    font: 12
    id: acc
    caption: Критерії прийняття
    header:
    - Код
    - Критерій
    - Метод перевірки
    widths:
    - 1.6
    - 8.8
    - 5.6
    rows:
    - - AC-01
      - Усі функціональні вимоги високого пріоритету виконано; тест-кейси для кожного варіанта використання пройдено
      - Функціональне тестування («чорний ящик»)
    - - AC-02
      - Затримка «сенсор — екран» ≤ 2 с і доставка завдання ≤ 1 с при 20 000 повідомлень/с
      - Навантажувальне тестування
    - - AC-03
      - Шлюз працює 4 год без зв’язку з ядром і синхронізує дані після відновлення без втрат
      - Системне тестування з імітацією відмови
    - - AC-04
      - Жоден пуск неможливий без санкції; правило двох осіб діє поблизу зон заборони ураження
      - Тестування безпеки, сценарні тести
    - - AC-05
      - 100 % команд і змін станів записано в журнал аудиту; спроба редагування виявляється
      - Тестування безпеки, аудит журналу
    - - AC-06
      - Оператори після 8 год навчання виконують типові сценарії без сторонньої допомоги
      - Тестування зручності використання
    - - AC-07
      - Отримано атестат відповідності КСЗІ; критичних вразливостей не виявлено
      - Державна експертиза, тестування на проникнення
    - - AC-08
      - Замовник підписав акт приймання за результатами дослідної експлуатації
      - Приймальне тестування
- h2: 5.10. Додатки
- p: 'До специфікації належать: концептуальна модель даних (рис. {fig:er1}, {fig:er2}, табл. {tab:db}); перелік визначень
    і скорочень (табл. {tab:terms}); діаграми та специфікації варіантів використання (підрозділи 4.5–4.6). Детальні робочі
    процеси (BPMN, UML-діаграми діяльності й послідовності) та архітектура IoT-рішення будуть розроблені в практичних роботах
    2 і 4.'
- h1: Висновки
  new_page: true
- p: У практичній роботі вивчено методи збору, аналізу та документування вимог до програмного забезпечення та застосовано
    їх до власного програмного продукту з використанням інтернету речей — IoT-платформи «Щит-Лінк» умовного РЦПДО «Щит-Північ».
- numbered:
  - 'Обрано тему «Розподілена IoT-система цілевказівки та координації дронів для перехоплення повітряних цілей». Продукт поєднує
    веб-орієнтовану систему, мобільний застосунок і додаток периферійного шлюзу; IoT-складова — машинна взаємодія сенсорів,
    шлюзів і наземних станцій управління з ядром. Спроєктовано базу даних з 11 зв’язаних таблиць із планом тестового наповнення.
    Обґрунтовано комбіновану модель життєвого циклу: інкрементна розробка з V-моделлю в кожному інкременті та випуском і супроводом
    за моделлю DevOps.'
  - Для 8 груп зацікавлених сторін визначено методи збору вимог (інтерв’ю, опитування, наради, спостереження, аналіз документів).
    Зібрано 22 функціональних вимог (високий пріоритет — 14) і 16 нефункціональних вимог із вимірюваними критеріями; під час
    аналізу виявлено й розв’язано 5 конфліктів і випадків дублювання.
  - Побудовано дві діаграми варіантів використання (23 прецеденти, 14 акторів, відношення «include», «extend» і узагальнення
    акторів) і специфікації чотирьох ключових прецедентів.
  - 'Складено специфікацію системних вимог за десятирозділовою структурою SRS: драйвери бізнесу, бізнес-модель із контекстною
    схемою, 30 системних вимог із трасуванням до функціональних, технічні вимоги, системні якості, обмеження, припущення та
    вісім критеріїв прийняття.'
- p: Отримана SRS забезпечує наскрізне трасування вимог і є вихідним документом для практичних робіт 2 і 4.

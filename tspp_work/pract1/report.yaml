- p: Призначення таблиць, ключові зв’язки та планований обсяг тестового наповнення наведено в табл. {tab:db}. Обсяги відповідають
    ресурсам умовного центру (підрозділ 3.2) і даним однієї доби інтенсивної роботи; телеметрію перехоплювачів зберігає окрема
    база даних часових рядів (TimescaleDB).

- h2: 5.5. Випадки використання системи
- p: Поведінку системи з погляду користувачів описано 23 варіантами використання для 14 акторів (підрозділ 4.5, рис. {fig:uc1},
    {fig:uc2}, табл. {tab:uclist}). Специфікації ключових прецедентів наведено в підрозділі 4.6. Кожен варіант використання
    трасується до функціональних вимог, а через них — до системних вимог розділу 5.4 і критеріїв прийняття розділу 5.9.

    - - NFR-07
      - Взаємна автентифікація пристроїв і сервісів, шифрування
      - mTLS, TLS 1.3, AES-256
      - Сертифікат X.509 для кожного пристрою, VPN
    - - NFR-15
      - Відповідність вимогам захисту інформації
      - Атестат відповідності КСЗІ
      - Власні сервери замість публічної хмари
- h2: 3.2. Вибір рівнів реалізації
- p: За основу взято чотирирівневу модель IoT-рішення (підрозділ 2.1). Для кожного рівня визначено, чи реалізується він у
    продукті, у якій формі та чим це зумовлено (табл. {tab:levels}). Головна відмінність від еталонної моделі [4] — частина
    обробки даних перенесена на **периферійні шлюзи** мережевого рівня, а рівень обробки даних розміщено не в публічній хмарі,
    а в **двох власних центрах обробки даних (ЦОД)** — через вимоги автономності (NFR-06) та захисту інформації (NFR-15).
- table:
    font: 12
    id: levels
    caption: Обрані рівні реалізації IoT-платформи «Щит-Лінк»
    header:
    - Рівень
    - Реалізація в продукті
    - Обґрунтування
    widths:
    - 3.6
    - 6.6
    - 5.8
    rows:
    - - Рівень датчиків (сприйняття)
      - Власні пристрої не розробляються; інтегруються акустичні вузли, РЛС, оптико-електронні пости, наземні станції управління
        (НСУ) перехоплювачів
      - Обладнання постачається сторонніми виробниками; продукт є програмною платформою (FR-01, FR-02)
    - - Мережевий рівень
      - Периферійний шлюз на кожній позиції (власне ПЗ), багатоканальний зв’язок (mesh-радіо, LTE, супутник), VPN
      - Різнорідні протоколи пристроїв, подавлення зв’язку, автономність ≥ 4 год (FR-03, NFR-06)
    - - Рівень обробки даних
      - 'IoT-ядро у двох ЦОД: шина подій, мікросервіси, PostgreSQL + PostGIS, TimescaleDB'
      - Обробка в реальному часі, доступність 99,95 %, захист інформації (NFR-01, NFR-05, NFR-15)
    - - Рівень застосунків
      - Веб-АРМ командного пункту і служб, мобільний застосунок планшета, інтеграційні інтерфейси
      - 'Три форми продукту з ПР1: веб-система, мобільний застосунок, окремий додаток шлюзу'
- p: 'Отже, у продукті реалізуються всі чотири рівні, але з різною глибиною: рівень датчиків — лише як інтеграція (адаптери
    протоколів), мережевий рівень і рівень обробки даних — як власне програмне забезпечення, рівень застосунків — як два клієнтські
    застосунки та інтеграційні інтерфейси.'
- h2: 3.3. Вибір архітектурного стилю
- p: Стилі лекції [7] порівняно за вимогами табл. {tab:drivers} (табл. {tab:styles}).
- table:
    font: 12
    id: styles
    caption: Порівняння архітектурних стилів для IoT-ядра
    header:
    - Стиль
    - Відповідність вимогам
    - Обмеження
    - Рішення
    widths:
    - 3.0
    - 5.0
    - 4.8
    - 3.2
    rows:
    - - Монолітна
      - Простота розробки й розгортання
      - Неможливо масштабувати лише сервіси реального часу; збій модуля зупиняє все ядро
      - Відхилено
    - - Мікросервісна
      - Незалежне масштабування злиття треків і телеметрії; ізоляція збоїв; оновлення без зупинки
      - Складність координації та тестування
      - Обрано для сервісів ядра
    - - SOA
      - Стандартизовані інтерфейси для зовнішніх систем
      - Централізована шина ESB — вузьке місце для 20 000 повідомлень/с
      - Ідеї взято для інтеграції
    - - EDA
      - Пристрої генерують потоки подій; асинхронна обробка в реальному часі
      - Складність відлагодження, порядок подій
      - Обрано як основу взаємодії
- p: 'Обрано **гібридний стиль**: подієво-орієнтована архітектура (EDA) як основа взаємодії — виявлення, треки, стани місій
    і телеметрія передаються як події через шину подій; сервіси ядра реалізовано як **мікросервіси**, кожен з яких є видавцем
    і/або підписником подій; взаємодія із зовнішніми системами ведеться через стандартизовані інтерфейси (принцип SOA) інтеграційного
    адаптера. Недоліки EDA компенсуються ключами впорядкування подій за треком і місією та наскрізними ідентифікаторами для
    трасування подій під час відлагодження.'
- h1: 4. Архітектура IoT-екосистеми «Щит-Лінк»
  new_page: true
- h2: 4.1. Загальна схема архітектури
- p: 'Архітектуру IoT-рішення побудовано за чотирирівневою моделлю у формі, прийнятій у публікаціях кафедри [4; 6]: колонки
    «пристрої та об’єкти — зв’язок — обробка даних — інтерфейси застосувань» відповідають рівням датчиків, мережевому, обробки
    даних і застосунків (рис. {fig:arch}).'
- figure:
    id: arch
    src: tspp_work/pract2/diagrams/02_architecture.png
    caption: Архітектура IoT-екосистеми «Щит-Лінк»
- p: 'Дані рухаються зліва направо: пристрої сектора передають виявлення й телеметрію на периферійний шлюз своєї позиції;
    шлюз перевіряє й нормалізує дані та через захищені канали передає їх до шини подій ядра; сервіси реального часу формують
    повітряну обстановку й керують місіями, бізнес-сервіси ведуть облік і звітність, сховища зберігають оперативні дані й
    часові ряди; API-шлюз надає дані застосункам і зовнішнім системам. Команди (призначення, санкції, завдання) рухаються
    у зворотному напрямку — від застосунків через ядро та шлюз до НСУ розрахунку, тому зв’язки між рівнями двобічні.'
- h2: 4.2. Рівень датчиків (сприйняття)
- p: 'Рівень датчиків утворюють пристрої, що спостерігають повітряний простір, і пристрої розрахунків (табл. {tab:dev}). Платформа
    не змінює їх вбудоване програмне забезпечення: взаємодія ведеться лише через стандартні протоколи, а кожен пристрій має
    власний сертифікат для автентифікації на шлюзі.'
- table:

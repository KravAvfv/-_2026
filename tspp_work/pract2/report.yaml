- p: Шина подій зберігає потоки подій у вигляді журналу, тому новий сервіс може під’єднатися до потоку без змін у видавцях
    (принцип відкритості/закритості), а після збою сервіс продовжує обробку з місця зупинки. Для швидкого відображення обстановки
    API-шлюз тримає в пам’яті актуальний стан треків і надсилає застосункам лише прирости.

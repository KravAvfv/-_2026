    втрата даних ≤ 5 с — NFR-06); автономна робота периферійних шлюзів щонайменше 4 год із локальним злиттям треків і подальшим
    узгодженням станів, у якому головним джерелом для станів місій є ядро; пріоритизація трафіку, що за перевантаження каналів
    першою обмежує передачу відео.'

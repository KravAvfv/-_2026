blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** вивчити багаторівневу архітектуру IoT-екосистеми та архітектурні стилі програмних систем, обрати рівні
    реалізації власного програмного продукту, побудувати й описати архітектуру IoT-рішення.'
- p: '**Завдання роботи** [1]: побудувати архітектуру IoT-рішення, обравши рівні реалізації власного програмного продукту;
    описати архітектуру. Відповідно до завдання у роботі:'
- numbered:
  - розглянуто еталонну архітектуру IoT-екосистеми та архітектурні стилі — розділ 2;
  - обрано рівні реалізації та архітектурний стиль програмного продукту з обґрунтуванням вимогами — розділ 3;
  - побудовано архітектуру IoT-рішення та описано кожен рівень, розміщення компонентів, потоки даних, безпеку і застосовані
    шаблони проектування — розділ 4;
  - сформульовано висновки — розділ «Висновки».
- p: '**Тема програмного продукту:** «Розподілена IoT-система цілевказівки та координації дронів для перехоплення повітряних
    цілей»; програмний продукт — IoT-платформа «Щит-Лінк», вимоги до якої визначено в практичній роботі № 1 [2]. Звіт оформлено
    відповідно до ДСТУ 3008:2015 [3].'
- p: '*Примітка: РЦПДО «Щит-Північ» і IoT-платформа «Щит-Лінк» є навчальними умовними моделями; усі назви, процеси та показники
    наведено суто з навчально-ілюстративною метою.*'
- h1: 2. Теоретичні відомості
  new_page: true
- h2: 2.1. IoT-екосистема та рівні архітектури IoT-рішення
- p: IoT-екосистема поєднує фізичні об’єкти з датчиками, засоби зв’язку, платформу обробки даних та інтерфейси користувачів.
    У публікаціях кафедри архітектуру IoT-рішення подають чотирма рівнями (рис. {fig:ref}) [4]. **Рівень сприйняття** (Perception
    Layer) збирає дані від датчиків, розміщених на об’єктах спостереження. **Мережевий рівень** (Network Layer) забезпечує
    швидку передачу даних далі — бездротовими мережами Wi-Fi, Bluetooth тощо. **Рівень проміжного програмного забезпечення**
    (Middleware Layer) використовує хмарне сховище для обробки та зберігання великих обсягів інформації й аналізу даних у
    реальному часі. **Рівень застосунків** (Application Layer) відображає оброблені дані та забезпечує взаємодію користувачів
    із ними на різних пристроях [4].
- figure:
    id: ref
    src: tspp_work/pract2/diagrams/01_reference.png
    caption: Узагальнена архітектура IoT-екосистеми (за [4])
- p: 'Тези кафедри [5] використовують ту саму структуру з українськими назвами рівнів: рівень датчиків (Sensing Layer), мережевий
    рівень із комунікацією через Wi-Fi, MQTT, LoRa, Bluetooth та IoT-шлюзами для обробки й передачі даних у хмару, рівень
    обробки даних і рівень застосунків. У статті про IoT-систему насосної станції [6] архітектуру також побудовано за схемою
    «пристрої — зв’язок — хмара — інтерфейс користувача»: дані датчиків проходять через бездротові мережі (Wi-Fi, Bluetooth,
    Zigbee, Z-Wave) та оптоволоконні медіаконвертери до бази даних, доступної оператору. Типовий склад рівнів узагальнено
    в табл. {tab:ref}.'
- table:
    font: 12
    id: ref
    caption: Рівні архітектури IoT-рішення та їх типові компоненти
    header:
    - Рівень
    - Призначення
    - Типові компоненти
    widths:
    - 3.8
    - 6.0
    - 6.2
    rows:
    - - Рівень датчиків (сприйняття)
      - Збір даних про стан об’єктів і середовища
      - Датчики, вимірювальні модулі, мікроконтролери, виконавчі пристрої
    - - Мережевий рівень
      - Передавання даних від пристроїв до платформи
      - Точки доступу Wi-Fi, LoRa, стільниковий зв’язок, IoT-шлюзи, протокол MQTT
    - - Рівень обробки даних (проміжного ПЗ)
      - Зберігання, обробка та аналіз даних у реальному часі
      - Хмарні або власні сервери, бази даних, брокери повідомлень, сервіси аналітики
    - - Рівень застосунків
      - Відображення даних і керування системою
      - Веб-застосунки, мобільні застосунки, панелі моніторингу, інтерфейси інших систем
- h2: 2.2. Архітектурні стилі програмних систем
- p: 'Проектування програмних систем — процес створення структури та архітектури ПЗ для забезпечення надійності, ефективності
    та масштабованості; одним з його етапів є вибір архітектурного стилю [7]. Лекція [7] розглядає чотири підходи:'
- bullets:
  - '**монолітна архітектура** — усі функції (інтерфейс, логіка, доступ до бази даних) в одному додатку й одному процесі;
    простота розробки й розгортання на ранніх етапах, але складність масштабування та тісна зв’язність модулів;'
  - '**мікросервісна архітектура** — набір незалежних сервісів, кожен з яких відповідає за конкретну функціональність і взаємодіє
    через API (REST, gRPC, черги повідомлень); незалежне масштабування й оновлення, стійкість до збоїв окремих сервісів, але
    складніші координація, тестування й мережеві витрати;'
  - '**сервіс-орієнтована архітектура (SOA)** — сервіси бізнес-функцій зі стандартизованими інтерфейсами, придатні до повторного
    використання; на відміну від мікросервісів, використовує централізовану шину (ESB) і є більш крупнозернистою;'
  - '**подієво-орієнтована архітектура (EDA)** — компоненти взаємодіють через обмін подіями: видавці подій, підписники та
    брокер подій (наприклад, Apache Kafka, RabbitMQ); асинхронність, відокремленість і обробка в реальному часі. Лекція прямо
    наводить Інтернет речей як приклад застосування EDA: пристрої IoT постійно генерують події, на які система реагує в реальному
    часі [7].'
- h2: 2.3. Шаблони проектування та принципи SOLID
- p: 'Структурні шаблони проектування допомагають організувати класи й об’єкти у великі структури: «Адаптер» узгоджує несумісні
    інтерфейси; «Міст» розділяє абстракцію та реалізацію; «Компонувальник» будує ієрархії; «Декоратор» динамічно додає функціональність;
    «Фасад» надає спрощений інтерфейс до складної підсистеми; «Проксі» контролює доступ до об’єкта (кешування, перевірка прав)
    [7]. Серед поведінкових шаблонів лекція виділяє «Спостерігач» і «Стратегію», серед твірних — «Одинак» і «Фабрику», серед
    структурних архітектурних — MVC і багаторівневу архітектуру. Принципи SOLID (єдиної відповідальності, відкритості/закритості,
    підстановки Лісков, розділення інтерфейсів, інверсії залежностей) роблять систему легкою для підтримки, розширення та
    масштабування [7].'
- h1: 3. Вибір рівнів реалізації програмного продукту
  new_page: true
- h2: 3.1. Вихідні вимоги до архітектури
- p: 'Вибір рівнів і стилю ґрунтується на специфікації вимог практичної роботи № 1 [2]: 22 функціональних і 16 нефункціональних
    вимог. Для архітектури визначальними є нефункціональні вимоги, наведені в табл. {tab:drivers}: саме вони відрізняють «Щит-Лінк»
    від типових IoT-систем моніторингу (теплиці, клініки, насосні станції [5; 6]), де допустимі затримки в секунди-хвилини
    й робота лише в хмарі.'

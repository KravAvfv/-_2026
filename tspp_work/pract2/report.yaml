- h2: 4.4. Рівень обробки даних
- p: 'Рівень обробки даних — IoT-ядро, побудоване за обраним гібридним стилем (рис. {fig:core}). Точками входу є шлюз прийому
    даних пристроїв, інтеграційний адаптер і API-шлюз; усі вони взаємодіють із **шиною подій**, яка виконує роль брокера подій
    EDA [7]. Дев’ять мікросервісів є видавцями й підписниками подій; сервіси реального часу (на схемі виділено сірим) масштабуються
    незалежно від бізнес-сервісів. Кожен сервіс має власні дані: оперативні та просторові — у PostgreSQL з розширенням PostGIS,
    часові ряди телеметрії та показників — у TimescaleDB.'

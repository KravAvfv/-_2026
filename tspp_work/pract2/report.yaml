- h1: Висновки
  new_page: true
- p: У практичній роботі побудовано та описано архітектуру IoT-рішення для програмного продукту IoT-платформа «Щит-Лінк» умовного
    РЦПДО «Щит-Північ».
- numbered:
  - 'За основу взято чотирирівневу модель IoT-рішення з публікацій кафедри: рівень датчиків (сприйняття), мережевий рівень,
    рівень обробки даних і рівень застосунків. Усі чотири рівні реалізовано в продукті: рівень датчиків — як інтеграція 154
    пристроїв чотирьох типів через стандартні протоколи, мережевий рівень — як власне ПЗ дев’яти периферійних шлюзів і багатоканальний
    захищений зв’язок, рівень обробки даних — як IoT-ядро у двох власних ЦОД, рівень застосунків — як веб-АРМ, мобільний застосунок
    і інтеграційні інтерфейси.'
  - 'Порівняно чотири архітектурні стилі лекції; обрано гібридний стиль: подієво-орієнтована архітектура з шиною подій як
    основа взаємодії та 9 мікросервісів ядра, а також стандартизовані інтерфейси інтеграції за принципом SOA. Монолітну архітектуру
    відхилено через неможливість незалежно масштабувати сервіси реального часу.'
  - 'Відмінності від еталонної моделі обґрунтовано вимогами ПР1: обчислення на периферійних шлюзах забезпечують автономність
    позиції щонайменше 4 год, а власні ЦОД замість публічної хмари — вимоги захисту інформації.'
  - Описано кожен рівень, фізичне розміщення компонентів, наскрізний потік даних з бюджетом затримок (≤ 2 с до екрана, ≤ 1
    с до планшета), заходи безпеки на кожному рівні, застосування шести шаблонів проектування й принципів SOLID; усі нефункціональні
    вимоги, що визначають архітектуру, трасовано до архітектурних рішень.
- p: Побудована архітектура є основою для опису існуючих програмних та апаратних рішень (практична робота № 3) і детального
    проектування системи засобами BPMN, UML та IDEF (практична робота № 4).

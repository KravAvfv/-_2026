- h2: 4.3. Мережевий рівень
- p: 'Мережевий рівень складається з периферійних шлюзів на дев’яти позиціях і каналів зв’язку між шлюзами та ядром (табл.
    {tab:links}). Шлюз (рис. {fig:edge}) виконує функції, які в еталонній моделі належать IoT-шлюзу [5], і додатково — обчислення
    на периферії:'
- figure:
    id: edge
    src: tspp_work/pract2/diagrams/03_edge_gateway.mmd
    caption: Структура периферійного шлюзу позиції
- bullets:
  - '**адаптери протоколів** перетворюють MQTT, ASTERIX, RTSP і MAVLink на єдину канонічну модель даних (шаблон «Адаптер»);'
  - '**перевірка даних** — автентифікація джерела за сертифікатом, контроль схеми й часової мітки, переведення в систему координат
    WGS-84 і час UTC;'
  - '**локальний брокер MQTT** розподіляє дані між внутрішніми компонентами шлюзу;'
  - '**локальне злиття треків** у деградованому режимі дозволяє позиції працювати при втраті зв’язку з ядром;'
  - '**буфер із відкладеною передачею** зберігає дані до 4 годин і передає їх після відновлення зв’язку з первинними мітками
    часу;'
  - '**міст до ядра** передає дані за класами пріоритету: завдання > треки > телеметрія > відео.'

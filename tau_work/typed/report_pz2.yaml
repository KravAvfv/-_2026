- h2: 3.5. Аналіз часових характеристик
- bullets:
  - 'вагова функція стрибком набуває значення $w(0)=0,2$ (вплив форсуючої ланки: чисельник і знаменник $pW(p)$ мають однаковий степінь) і за експонентою зі сталою часу $T=5$ с наближається до сталого значення $1$; за час $3T=15$ с експоненційна складова зменшується до $4,0$ % від початкової;'
  - 'перехідна функція не має усталеного значення: через інтегруючу ланку $\frac{1}{p}$ вихідна величина за сталого входу необмежено зростає;'
  - 'при $t\to\infty$ перехідна функція наближається до прямої $h_{\text{ас}}(t)=t-4$; зсув асимптоти дорівнює різниці сталих часу аперіодичної та форсуючої ланок: $T-\tau=5-1=4$ с, тобто елемент поводиться як інтегратор із запізненням реакції на 4 с.'
- h1: Висновки
  new_page: true
- p: 1. Для елемента варіанту 8 з передатною функцією $W(p)=\frac{p+1}{p(5p+1)}$ за допомогою розкладу на прості дроби та оберненого перетворення Лапласа отримано вагову функцію $w(t)=1-0,8e^{-0,2t}$ і перехідну функцію $h(t)=t-4+4e^{-0,2t}$.
- p: 2. Результати підтверджено граничними теоремами, співвідношенням $w(t)=h'(t)$, обчисленням коефіцієнтів через лишки та числовим моделюванням.
- p: 3. Вагова функція зростає від 0,2 до 1 зі сталою часу 5 с; перехідна функція внаслідок інтегруючої властивості елемента не має усталеного значення й асимптотично наближається до прямої $t-4$.

blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися визначати перехідну $h(t)$ та вагову (імпульсну перехідну) $w(t)$ функції ланок САУ за їх передатними функціями з використанням оберненого перетворення Лапласа.'
- p: '**Завдання:** визначити вагову $w(t)$ і перехідну $h(t)$ характеристики елемента системи за заданим рівнянням динаміки, де $x_1(t)$ і $x_2(t)$ — відповідно вхідна і вихідна величини, відповідно до варіанту згідно з табл. 1.1 методичних вказівок; побудувати їх графіки.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var} (фрагмент таблиці варіантів методичних вказівок).
- figure:
    id: var
    src: tau_work/assets/var8_p1.png
    caption: Вихідні дані варіанту 8 (табл. 1.1 методичних вказівок)
    orientation: portrait
    width_cm: 16
- p: 'Отже, для варіанту 8 задано:'
- eq: T\frac{d^2x_2(t)}{dt^2}+\frac{dx_2(t)}{dt}=\frac{dx_1(t)}{dt}+x_1(t),\qquad T=5\ \text{с}.
  num: true
  id: ode
- p: 'Передатна функція цього елемента визначена в практичній роботі №1:'
- eq: W(p)=\frac{p+1}{p\left(5p+1\right)}.
  num: true
  id: w
- h1: 2. Короткі теоретичні відомості
  new_page: true
- p: Динамічні властивості ланки в часовій області описують часові характеристики — реакції ланки на типові вхідні впливи за нульових початкових умов [1, 2].
- p: '**Перехідна функція** $h(t)$ — реакція ланки на одиничний ступінчастий вплив $x_1(t)=1(t)$. Оскільки $L\{1(t)\}=\frac{1}{p}$, зображення перехідної функції'
- eq: H(p)=\frac{W(p)}{p},\qquad h(t)=L^{-1}\left\{\frac{W(p)}{p}\right\}.
  num: true
  id: hdef
- p: '**Вагова (імпульсна перехідна) функція** $w(t)$ — реакція ланки на одиничний імпульс $x_1(t)=\delta(t)$ (дельта-функцію Дірака). Оскільки $L\{\delta(t)\}=1$,'
- eq:
  - w(t)=L^{-1}\left\{W(p)\right\},
  - w(t)=\frac{dh(t)}{dt},\qquad h(t)=\int_{0}^{t}w(\tau)d\tau.
  num: true
  id: wdef
- p: 'Для знаходження оригіналу дробово-раціональне зображення $F(p)=\frac{B(p)}{A(p)}$ розкладають на прості дроби (метод невизначених коефіцієнтів) і для кожного дробу беруть оригінал з таблиці відповідності (табл. {tab:lap}). Для простого кореня $p_i$ коефіцієнт розкладу можна знайти також як лишок: $A_i=\lim_{p\to p_i}\left(p-p_i\right)F(p)$.'
- table:
    id: lap
    caption: Зображення за Лапласом, що використовуються в роботі
    header:
    - Оригінал x(t)
    - Зображення X(p)
    - Оригінал x(t)
    - Зображення X(p)
    rows:
    - - $\delta(t)$
      - $1$
      - $e^{-at}$
      - $\frac{1}{p+a}$
    - - $1(t)$
      - $\frac{1}{p}$
      - $\frac{1}{T}e^{-t/T}$
      - $\frac{1}{Tp+1}$
    - - $t$
      - $\frac{1}{p^2}$
      - $1-e^{-t/T}$
      - $\frac{1}{p(Tp+1)}$
    font: 12
    align: center
    first_left: false
    widths:
    - 3.5
    - 4.5
    - 3.8
    - 4.7
- p: 'Правильність результату перевіряють граничними теоремами:'
- eq: f(0)=\lim_{p\to\infty}pF(p),\qquad f(\infty)=\lim_{p\to 0}pF(p).
  num: true
  id: lim
- h1: 3. Хід виконання роботи
  new_page: true
- h2: 3.1. Визначення вагової функції
- p: 'Згідно з ({eq:wdef}) $w(t)=L^{-1}\{W(p)\}$. Знаменник $W(p)$ має два прості корені $p_1=0$ і $p_2=-0,2$, тому розклад на прості дроби має вигляд:'
- eq: \frac{p+1}{p\left(5p+1\right)}=\frac{A}{p}+\frac{B}{5p+1}.
  num: true
  id: pf1
- p: 'Зведемо праву частину до спільного знаменника і прирівняємо чисельники:'
- eq: p+1=A\left(5p+1\right)+Bp=\left(5A+B\right)p+A.
  num: false
- p: 'Прирівнюючи коефіцієнти при однакових степенях $p$, отримаємо систему:'
- eq: \begin{cases} p^0:\ \ A=1,\\ p^1:\ \ 5A+B=1\end{cases}\ \Rightarrow\ A=1,\quad B=1-5=-4.
  num: false
- p: 'Перевірка через лишки: $A=\lim_{p\to 0}pW(p)=\frac{0+1}{0+1}=1$; $B=\lim_{p\to -0,2}\left(5p+1\right)W(p)=\frac{-0,2+1}{-0,2}=-4$ — збігається. Отже,'
- eq: W(p)=\frac{1}{p}-\frac{4}{5p+1}=\frac{1}{p}-0,8\cdot\frac{1}{p+0,2}.
  num: false
- p: 'За табл. {tab:lap} оригінал $\frac{1}{p}$ дорівнює $1(t)$, а оригінал $\frac{1}{p+0,2}$ — $e^{-0,2t}$. Вагова функція:'
- eq: w(t)=1-0,8e^{-0,2t},\qquad t\ge 0.
  num: true
  id: wres
- h2: 3.2. Визначення перехідної функції
- p: 'Згідно з ({eq:hdef}) зображення перехідної функції:'
- eq: H(p)=\frac{W(p)}{p}=\frac{p+1}{p^2\left(5p+1\right)}.
  num: false
- p: 'Знаменник має двократний корінь $p=0$ і простий корінь $p=-0,2$, тому розклад містить три дроби:'
- eq: \frac{p+1}{p^2\left(5p+1\right)}=\frac{A}{p^2}+\frac{B}{p}+\frac{C}{5p+1},
  num: true
  id: pf2
- eq: p+1=A\left(5p+1\right)+Bp\left(5p+1\right)+Cp^2=\left(5B+C\right)p^2+\left(5A+B\right)p+A.
  num: false
- eq: \begin{cases} p^0:\ \ A=1,\\ p^1:\ \ 5A+B=1\ \Rightarrow\ B=-4,\\ p^2:\ \ 5B+C=0\ \Rightarrow\ C=20.\end{cases}
  num: false
- eq: H(p)=\frac{1}{p^2}-\frac{4}{p}+\frac{20}{5p+1}=\frac{1}{p^2}-\frac{4}{p}+\frac{4}{p+0,2}.
  num: false
- p: 'За табл. {tab:lap}: $\frac{1}{p^2}\to t$, $\frac{1}{p}\to 1(t)$, $\frac{1}{p+0,2}\to e^{-0,2t}$. Перехідна функція:'
- eq: h(t)=t-4+4e^{-0,2t},\qquad t\ge 0.
  num: true
  id: hres
- h2: 3.3. Перевірка результатів
- p: 'Правильність розв''язання перевірено чотирма незалежними способами:'
- numbered:
  - 'початкове значення перехідної функції: $h(0)=0-4+4\cdot 1=0$, як і має бути для реакції на одиничний стрибок за нульових початкових умов;'
  - 'зв''язок ({eq:wdef}): $\frac{dh(t)}{dt}=1-4\cdot 0,2e^{-0,2t}=1-0,8e^{-0,2t}=w(t)$;'
  - 'теорема про початкове значення ({eq:lim}): $w(0)=\lim_{p\to\infty}pW(p)=\lim_{p\to\infty}\frac{p+1}{5p+1}=\frac{1}{5}=0,2$, а з ({eq:wres}) $w(0)=1-0,8=0,2$; теорема про кінцеве значення: $w(\infty)=\lim_{p\to 0}pW(p)=1$, з ({eq:wres}) $w(\infty)=1$;'
  - 'числове моделювання (scipy.signal: реакції ланки $W(p)$ на одиничний стрибок та імпульс на інтервалі 0–30 с): максимальне відхилення від аналітичних формул не перевищує $10^{-12}$.'
- h2: 3.4. Розрахунок значень і побудова графіків
- p: Значення часових характеристик, обчислені за формулами ({eq:wres}) і ({eq:hres}), наведено в табл. {tab:val}; графіки — на рис. {fig:w} і {fig:h}.

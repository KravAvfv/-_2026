blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися визначати усталені помилки САУ при сталому, лінійному та гармонійному задаючих впливах з використанням теореми про кінцеве значення та ЛАЧХ розімкненої системи.'
- p: '**Завдання:** визначити усталені помилки САК, якщо задано передатну функцію розімкненої системи і вигляд задаючого впливу, відповідно до варіанту згідно з табл. 5.1 методичних вказівок.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var} (фрагмент таблиці варіантів методичних вказівок).
- figure:
    id: var
    src: tau_work/assets/var8_p5.png
    caption: Вихідні дані варіанту 8 (табл. 5.1 методичних вказівок)
    orientation: portrait
    width_cm: 16
- p: 'Отже, для варіанту 8 задано:'
- eq: W_{\text{роз}}(p)=\frac{k_{\text{роз}}}{\left(T_1p+1\right)\left(T_2p+1\right)^2};
  num: true
  id: w
- eq: k_{\text{роз}}=25;\quad T_1=5\ \text{с};\quad T_2=0,1\ \text{с};
  num: false
- eq: x(t)=1,2\sin 0,5t\ \Rightarrow\ A_m=1,2;\quad \omega_x=0,5\ \text{с}^{-1}.
  num: true
  id: x
- p: Система замкнена одиничним від'ємним зворотним зв'язком; розімкнена система не містить інтегруючих ланок, тобто є статичною (порядок астатизму $\nu=0$).
- h1: 2. Короткі теоретичні відомості
  new_page: true
- p: Точність САУ оцінюють за **помилкою** $\delta(t)=x(t)-y(t)$ в усталеному режимі, тобто після завершення перехідного процесу [1, 2]. Зображення помилки $\delta(p)=Ф_\delta(p)X(p)$, де
- eq: Ф_\delta(p)=\frac{1}{1+W_{\text{роз}}(p)}.
  num: true
  id: phid
- p: 'Для сталого і лінійного впливів усталену помилку знаходять за теоремою про кінцеве значення:'
- eq: \delta_{\text{уст}}=\lim_{t\to\infty}\delta(t)=\lim_{p\to 0}pФ_\delta(p)X(p).
  num: true
  id: fvt
- p: При $x(t)=x_0$ це **статична** помилка $\delta_{\text{ст}}=\frac{x_0}{1+k}$ (для статичної системи) або нуль (для астатичної); при $x(t)=x_1t$ — **швидкісна** помилка, яка для статичної системи необмежено зростає, а для системи з астатизмом першого порядку дорівнює $\frac{x_1}{k}$.
- p: 'При **гармонійному** задаючому впливі $x(t)=A_m\sin\omega_xt$ усталена помилка лінійної стійкої системи також гармонійна з тією самою частотою:'
- eq:
  - \delta(t)=\delta_m\sin\left(\omega_xt+\varphi_\delta\right),
  - \delta_m=A_m\left|Ф_\delta(j\omega_x)\right|,\qquad \varphi_\delta=\arg Ф_\delta(j\omega_x).
  num: true
  id: harm
- p: Якщо частота $\omega_x$ лежить у низькочастотній області, де $|W_{\text{роз}}(j\omega_x)|\gg 1$, то $Ф_\delta(j\omega_x)\approx\frac{1}{W_{\text{роз}}(j\omega_x)}$ і
- eq: \delta_m\approx\frac{A_m}{\left|W_{\text{роз}}(j\omega_x)\right|}=\frac{A_m}{10^{L(\omega_x)/20}},
  num: true
  id: approx
- p: 'тобто амплітуду помилки можна визначити безпосередньо за ЛАЧХ розімкненої системи. Обернено: щоб помилка не перевищувала $\delta_m$, ЛАЧХ має проходити не нижче контрольної точки $L_k=20\lg\frac{A_m}{\delta_m}$ на частоті $\omega_x$. Оцінювати точність має сенс лише для стійкої системи.'
- h1: 3. Хід виконання роботи
  new_page: true
- h2: 3.1. Перевірка стійкості замкненої системи
- p: 'Знаменник розімкненої системи:'
- eq:
  - \left(5p+1\right)\left(0,1p+1\right)^2=\left(5p+1\right)\left(0,01p^2+0,2p+1\right)=
  - =0,05p^3+1,01p^2+5,2p+1.
  num: false
- p: 'Характеристичний поліном замкненої системи:'
- eq:
  - D(p)=\left(T_1p+1\right)\left(T_2p+1\right)^2+k_{\text{роз}}=
  - =0,05p^3+1,01p^2+5,2p+26.
  num: true
  id: d
- p: 'Усі коефіцієнти додатні, умова Гурвіца для $n=3$: $a_2a_1=1,01\cdot5,2=5,252>a_3a_0=0,05\cdot26=1,3$ — виконується. Корені: $−15,68$ і $−2,26\pm j5,30$. Система стійка, тож усталений режим існує.'
- h2: 3.2. Передатна функція за помилкою
- eq:
  - Ф_\delta(p)=\frac{1}{1+W_{\text{роз}}(p)}=\frac{\left(T_1p+1\right)\left(T_2p+1\right)^2}{\left(T_1p+1\right)\left(T_2p+1\right)^2+k_{\text{роз}}}=
  - =\frac{0,05p^3+1,01p^2+5,2p+1}{0,05p^3+1,01p^2+5,2p+26}.
  num: true
  id: phidn
- h2: 3.3. Модуль частотної характеристики на частоті вхідного впливу
- p: 'Підставимо $p=j\omega$ у ({eq:w}):'
- eq:
  - \left|W_{\text{роз}}(j\omega)\right|=\frac{k_{\text{роз}}}{\sqrt{1+T_1^2\omega^2}\left(1+T_2^2\omega^2\right)},
  - \varphi_W(\omega)=-\mathrm{arctg}\,T_1\omega-2\,\mathrm{arctg}\,T_2\omega.
  num: true
  id: aw
- p: 'На частоті $\omega_x=0,5\ \text{с}^{-1}$: $T_1\omega_x=5\cdot 0,5=2,5$; $T_2\omega_x=0,1\cdot 0,5=0,05$.'
- eq: \left|W_{\text{роз}}(j0,5)\right|=\frac{25}{\sqrt{1+6,25}\cdot\left(1+0,0025\right)}=\frac{25}{2,6926\cdot 1,0025}=9,26;
  num: false
- eq: \varphi_W(0,5)=-\mathrm{arctg}\,2,5-2\,\mathrm{arctg}\,0,05=-68,20°-5,72°=−73,92°.
  num: false
- p: $|W_{\text{роз}}(j\omega_x)|=9,26\gg 1$, тому наближена формула ({eq:approx}) застосовна.
- h2: 3.4. Визначення помилки за ЛАЧХ
- p: 'Побудуємо асимптотичну ЛАЧХ (рис. {fig:lach}): $20\lg k_{\text{роз}}=20\lg 25=27,96$ дБ; частоти спряження $\omega_1=\frac{1}{T_1}=0,2\ \text{с}^{-1}$ (нахил змінюється з 0 на −20 дБ/дек) і $\omega_2=\frac{1}{T_2}=10\ \text{с}^{-1}$ (ланка в квадраті — ще −40, разом −60 дБ/дек). Частота $\omega_x=0,5$ лежить між $\omega_1$ і $\omega_2$:'
- eq: L_{\text{ас}}(\omega_x)=27,96-20\lg\frac{0,5}{0,2}=27,96-7,96=20,0\ \text{дБ}.
  num: false
- eq:
  - L(\omega_x)=20\lg 25-10\lg\left(1+6,25\right)-20\lg 1,0025=
  - =27,96-8,60-0,02=19,33\ \text{дБ}.
  num: false
- figure:
    id: lach
    src: tau_work/typed/fig/p5_lach.png
    caption: ЛАЧХ розімкненої системи варіанту 8 і точка на частоті вхідного впливу
    orientation: portrait
- p: 'За формулою ({eq:approx}):'
- eq: \delta_m\approx\frac{A_m}{10^{L(\omega_x)/20}}=\frac{1,2}{10^{19,33/20}}=\frac{1,2}{9,26}=0,130.
  num: true
  id: dmapp
- p: За асимптотичною ЛАЧХ $L_{\text{ас}}(\omega_x)=20$ дБ, тобто $|W|\approx 10$ і $\delta_m\approx\frac{1,2}{10}=0,12$ — практично той самий результат.
- p: Фаза помилки в цьому наближенні $\varphi_\delta\approx-\varphi_W=+73,9°$ (помилка випереджає вхідний сигнал).
- h2: 3.5. Точний розрахунок усталеної помилки
- p: 'Обчислимо $Ф_\delta(j\omega_x)$ без наближення. В алгебраїчній формі:'
- eq: W_{\text{роз}}(j0,5)=9,262\left(\cos73,92°-j\sin73,92°\right)=2,565-j8,899;
  num: false
- eq: 1+W_{\text{роз}}(j0,5)=3,565-j8,899;\qquad \left|1+W_{\text{роз}}\right|=\sqrt{12,71+79,20}=9,587.
  num: false
- eq:
  - \delta_m=\frac{A_m}{\left|1+W_{\text{роз}}(j\omega_x)\right|}=\frac{1,2}{9,587}=0,1252;
  - \varphi_\delta=-\arg\left(1+W_{\text{роз}}\right)=\mathrm{arctg}\frac{8,899}{3,565}=68,2°.
  num: true
  id: dmex
- p: 'Усталена помилка:'
- eq: \delta_{\text{уст}}(t)=0,125\sin\left(0,5t+68,2°\right).
  num: true
  id: res
- p: 'Наближене значення $0,130$ відрізняється від точного $0,125$ на $3,5$ %, бо $|W_{\text{роз}}(j\omega_x)|\approx 9$ — не дуже велике порівняно з одиницею. Відносна амплітуда помилки: $\frac{\delta_m}{A_m}=10,4$ %.'
- h2: 3.6. Перевірка моделюванням
- p: Реакцію замкненої системи за помилкою $Ф_\delta(p)$ на вхід $x(t)=1,2\sin 0,5t$ отримано числовим інтегруванням (рис. {fig:sig}). Вільна складова визначається найближчою до уявної осі парою коренів $−2,26\pm j5,30$ і згасає за час $t_{\text{п}}\approx\frac{3}{2,26}\approx 1,3$ с. Для $t>5$ с розрахована помилка відрізняється від формули ({eq:res}) не більше ніж на $10^{-5}$, тобто усталений режим визначено правильно.
- figure:
    id: sig
    src: tau_work/typed/fig/p5_signals.png
    caption: Задаючий вплив і помилка замкненої системи (моделювання та усталений режим)
    orientation: portrait
- h2: 3.7. Помилки при сталому та лінійному впливах
- p: 'Для порівняння обчислимо за ({eq:fvt}) помилки при інших видах задаючого впливу. При сталому впливі $x(t)=x_0$, $X(p)=\frac{x_0}{p}$:'
- eq: \delta_{\text{ст}}=\lim_{p\to 0}p\cdot\frac{1}{1+W_{\text{роз}}(p)}\cdot\frac{x_0}{p}=\frac{x_0}{1+k_{\text{роз}}}=\frac{x_0}{26}\approx 0,038x_0.
  num: false
- p: 'При лінійному впливі $x(t)=x_1t$, $X(p)=\frac{x_1}{p^2}$:'
- eq: \delta_{\text{шв}}=\lim_{p\to 0}\frac{x_1}{p\left(1+W_{\text{роз}}(p)\right)}=\infty,
  num: false
- p: тобто статична система не відпрацьовує лінійний вплив.
- h1: Висновки
  new_page: true
- p: '1. Замкнена система варіанту 8 стійка (умова Гурвіца виконується), тому усталена помилка існує. При гармонійному впливі $x(t)=1,2\sin 0,5t$ вона також гармонійна: $\delta_{\text{уст}}(t)\approx 0,125\sin(0,5t+68,2°)$.'
- p: 2. За ЛАЧХ розімкненої системи $L(\omega_x)=19,3$ дБ, наближена амплітуда помилки $\delta_m\approx 0,13$ (за асимптотою 0,12); точний розрахунок дає $0,125$, тобто ≈ 10,4 % від амплітуди вхідного сигналу. Результат підтверджено моделюванням.
- p: 3. Оскільки система статична, при сталому впливі вона має статичну помилку $x_0/26$, а лінійний вплив не відпрацьовує. Для зменшення помилки потрібно підвищувати $L(\omega_x)$ — збільшувати коефіцієнт передачі (з контролем стійкості) або вводити інтегруючу ланку.

blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися оцінювати стійкість замкненої САУ за алгебраїчним критерієм стійкості Гурвіца.'
- p: '**Завдання:** оцінити стійкість САК, якщо задано передатну функцію розімкненої системи, відповідно до варіанту згідно з табл. 6.1 методичних вказівок (варіанти 1–12 — за критерієм Гурвіца).'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var} (фрагмент таблиці варіантів методичних вказівок).
- figure:
    id: var
    src: tau_work/assets/var8_p6.png
    caption: Передатна функція розімкненої системи варіанту 8 (табл. 6.1)
    orientation: portrait
    width_cm: 16
- p: 'Отже, для варіанту 8 задано:'
- eq: W_{\text{роз}}(p)=\frac{10}{\left(0,02p+1\right)\left(p+1\right)\left(0,5p+1\right)}.
  num: true
  id: w
- p: Система замкнена одиничним від'ємним зворотним зв'язком; розімкнена система — послідовне з'єднання підсилювальної ланки $k=10$ і трьох аперіодичних ланок зі сталими часу 0,02 с, 1 с і 0,5 с.
- h1: 2. Короткі теоретичні відомості
  new_page: true
- p: '**Стійкість** — властивість системи повертатися до стану рівноваги після припинення дії збурення [1, 2]. Лінійна САУ стійка, якщо всі корені її характеристичного рівняння мають від''ємні дійсні частини, тобто лежать у лівій півплощині комплексної змінної $p$. Для замкненої системи з одиничним зворотним зв''язком і $W_{\text{роз}}(p)=\frac{B(p)}{A(p)}$ характеристичне рівняння'
- eq: D(p)=a_np^n+a_{n-1}p^{n-1}+\ldots+a_1p+a_0=0.
  num: true
  id: d
- p: '**Алгебраїчний критерій Гурвіца.** Необхідна умова стійкості: усі коефіцієнти $a_i>0$. Достатня умова: при $a_n>0$ усі $n$ діагональних мінорів головного визначника Гурвіца додатні. Головний визначник складають так: по головній діагоналі записують коефіцієнти від $a_{n-1}$ до $a_0$; стовпці вгору від діагоналі заповнюють коефіцієнтами зі зменшенням індексів, вниз — зі збільшенням; на місці відсутніх коефіцієнтів пишуть нулі. Для $n=3$:'
- eq:
  - \Delta_3=\begin{vmatrix} a_2 & a_0 & 0\\ a_3 & a_1 & 0\\ 0 & a_2 & a_0\end{vmatrix};
  - \Delta_1=a_2,\qquad \Delta_2=a_2a_1-a_3a_0,\qquad \Delta_3=a_0\Delta_2.
  num: true
  id: hur
- p: Отже, система третього порядку стійка, якщо всі $a_i>0$ і $a_2a_1>a_3a_0$. Межа стійкості (коливальна) відповідає $\Delta_{n-1}=0$, аперіодична — $a_0=0$.
- p: '**Частотний критерій Михайлова** (використано для перевірки). Підставивши $p=j\omega$ у $D(p)$, отримують вектор $D(j\omega)=U(\omega)+jV(\omega)$. Система $n$-го порядку стійка, якщо годограф Михайлова починається на додатній дійсній півосі і при зміні $\omega$ від 0 до ∞ послідовно проходить проти годинникової стрілки $n$ квадрантів. Наслідок: корені рівнянь $U(\omega)=0$ і $V(\omega)=0$ мають бути дійсними й чергуватися: $0=\omega_0<\omega_1<\omega_2<\ldots$'
- h1: 3. Хід виконання роботи
  new_page: true
- h2: 3.1. Характеристичний поліном замкненої системи
- p: 'Для одиничного від''ємного зворотного зв''язку $D(p)=A(p)+B(p)$, де $B(p)=10$, а $A(p)$ — знаменник $W_{\text{роз}}(p)$. Розкриємо дужки:'
- eq: \left(p+1\right)\left(0,5p+1\right)=0,5p^2+1,5p+1;
  num: false
- eq:
  - \left(0,02p+1\right)\left(0,5p^2+1,5p+1\right)=
  - =0,01p^3+0,03p^2+0,02p+0,5p^2+1,5p+1=
  - =0,01p^3+0,53p^2+1,52p+1.
  num: false
- eq: D(p)=0,01p^3+0,53p^2+1,52p+11=0.
  num: true
  id: dn
- p: 'Коефіцієнти: $a_3=0,01$; $a_2=0,53$; $a_1=1,52$; $a_0=1+10=11$; порядок $n=3$.'
- h2: 3.2. Необхідна умова стійкості
- p: Усі коефіцієнти $a_3,a_2,a_1,a_0$ додатні — необхідна умова виконується.
- h2: 3.3. Визначники Гурвіца
- p: 'Головний визначник Гурвіца за правилом ({eq:hur}):'
- eq: \Delta_3=\begin{vmatrix} a_2 & a_0 & 0\\ a_3 & a_1 & 0\\ 0 & a_2 & a_0\end{vmatrix}=\begin{vmatrix} 0,53 & 11 & 0\\ 0,01 & 1,52 & 0\\ 0 & 0,53 & 11\end{vmatrix}.
  num: true
  id: h3
- p: 'Обчислимо діагональні мінори:'
- eq: \Delta_1=a_2=0,53>0;
  num: false
- eq:
  - \Delta_2=\begin{vmatrix} a_2 & a_0\\ a_3 & a_1\end{vmatrix}=a_2a_1-a_3a_0=0,53\cdot 1,52-0,01\cdot 11=
  - =0,8056-0,11=0,6956>0;
  num: false
- eq: \Delta_3=a_0\Delta_2=11\cdot 0,6956=7,6516>0.
  num: false
- p: Усі визначники Гурвіца додатні, отже **замкнена система стійка**.
- h2: 3.4. Граничний коефіцієнт передачі
- p: 'Нехай коефіцієнт передачі розімкненої системи $k$ змінюється, тоді $a_0=1+k$, а решта коефіцієнтів не залежить від $k$. Межа стійкості — $\Delta_2=0$:'
- eq:
  - a_2a_1-a_3\left(1+k_{\text{гр}}\right)=0\ \Rightarrow
  - k_{\text{гр}}=\frac{a_2a_1}{a_3}-1=\frac{0,8056}{0,01}-1=79,56.
  num: true
  id: kgr
- p: Заданий $k=10<k_{\text{гр}}=79,56$; запас стійкості за коефіцієнтом передачі $\frac{k_{\text{гр}}}{k}\approx 7,96$ раза, або $20\lg 7,96\approx 18,0$ дБ. Залежність $\Delta_2(k)$ наведено на рис. {fig:k}.
- figure:
    id: k
    src: tau_work/typed/fig/p6_k.png
    caption: Залежність визначника Δ₂ від коефіцієнта передачі k
    orientation: portrait
- h2: 3.5. Перевірка за критерієм Михайлова і коренями
- p: 'Підставимо $p=j\omega$ у ({eq:dn}):'
- eq:
  - D(j\omega)=\left(11-0,53\omega^2\right)+j\left(1,52\omega-0,01\omega^3\right)=
  - =U(\omega)+jV(\omega).
  num: true
  id: mikh
- p: 'Корені $U(\omega)=0$: $\omega_1=\sqrt{11/0,53}=4,556\ \text{с}^{-1}$; корені $V(\omega)=0$: $\omega_0=0$, $\omega_2=\sqrt{1,52/0,01}=12,329\ \text{с}^{-1}$. Вони чергуються: $0<4,56<12,33$, годограф починається в точці $(11;\ 0)$ і проходить проти годинникової стрілки три квадранти I → II → III (рис. {fig:mikh}) — система стійка.'
- figure:
    id: mikh
    src: tau_work/typed/fig/p6_mikh.png
    caption: Годограф Михайлова замкненої системи варіанту 8
    orientation: portrait
- p: 'Корені $D(p)=0$, знайдені числово (рис. {fig:roots}): $p_1=−50,42$, $p_{2,3}=−1,29\pm j4,49$ — усі дійсні частини від''ємні, що підтверджує висновок за критерієм Гурвіца.'
- figure:
    id: roots
    src: tau_work/typed/fig/p6_roots.png
    caption: Розташування коренів характеристичного рівняння на комплексній площині
    orientation: portrait
- h1: Висновки
  new_page: true
- p: '1. Характеристичний поліном замкненої системи варіанту 8: $D(p)=0,01p^3+0,53p^2+1,52p+11$; усі коефіцієнти додатні, тобто необхідна умова стійкості виконується.'
- p: 2. Визначники Гурвіца $\Delta_1=0,53$, $\Delta_2=0,6956$, $\Delta_3=7,65$ додатні, отже за критерієм Гурвіца замкнена система стійка. Висновок підтверджено критерієм Михайлова і обчисленням коренів.
- p: 3. Система залишається стійкою при $k<k_{\text{гр}}\approx 79,6$; запас за коефіцієнтом передачі ≈ 8,0 раза (18,0 дБ). Найменший запас дає коливальна пара коренів $-1,29\pm j4,49$, яка визначає характер перехідного процесу.

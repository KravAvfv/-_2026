- h2: 3.5. Аналіз частотних характеристик
- p: 'ЛФЧХ перетинає рівень $-180°$ на частоті $\omega_\pi=1,02\ \text{с}^{-1}$, де $L(\omega_\pi)=16,7$ дБ $>0$, а на частоті зрізу фаза $\varphi(\omega_{\text{зр}})=−226,4°$. Запас за фазою від''ємний:'
- eq: \gamma=180°+\varphi(\omega_{\text{зр}})=180°−226,4°=−46,4°<0.
  num: false
- p: За логарифмічним критерієм Найквіста замкнена система при $k=10\ \text{с}^{-1}$ нестійка, що узгоджується з коренями характеристичного рівняння, знайденими в практичній роботі №3. Щоб ЛАЧХ на частоті $\omega_\pi$ опустилася нижче 0 дБ, коефіцієнт передачі треба зменшити більш ніж у $10^{16,7/20}\approx 6,84$ раза; за умовою Гурвіца для $D(p)=p^3+(1,4+0,0002k)p^2+(1+0,03k)p+k$ граничне значення $k_{\text{гр}}\approx 1,46\ \text{с}^{-1}$.
- h1: Висновки
  new_page: true
- p: 1. Передатну функцію розімкненої системи подано як добуток підсилювальної, інтегруючої, коливальної та двох форсуючих ланок; частоти спряження $\omega_3=1$, $\omega_2=50$, $\omega_1=100\ \text{с}^{-1}$, ордината точки A — 20 дБ.
- p: 2. Асимптотична ЛАЧХ має нахили −20, −60, −40 і −20 дБ/дек; асимптотична частота зрізу $\omega_{\text{зр}}\approx 2,15\ \text{с}^{-1}$ (точна — $2,14\ \text{с}^{-1}$). Розбіжність асимптотичної і точної ЛАЧХ не перевищує 3 дБ, бо $\zeta=0,7$.
- p: 3. ЛФЧХ починається і закінчується на рівні −90°, у діапазоні частот від 1,02 до 69 с⁻¹ опускається нижче −180° (мінімум −246,5° на частоті ≈ 6,9 с⁻¹). Запас за фазою $\gamma\approx −46°$, тому замкнена система при $k=10\ \text{с}^{-1}$ нестійка; для стійкості потрібно зменшити $k$ нижче ≈ 1,46 с⁻¹ або застосувати корекцію.

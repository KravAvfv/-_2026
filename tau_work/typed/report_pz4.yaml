blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися будувати асимптотичну логарифмічну амплітудно-частотну (ЛАЧХ) і логарифмічну фазочастотну (ЛФЧХ) характеристики розімкненої САУ за її передатною функцією.'
- p: '**Завдання:** побудувати ЛАЧХ і ЛФЧХ розімкненої системи, використовуючи структурну схему і значення параметрів САК відповідно до варіанту згідно з табл. 3.1 методичних вказівок.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var} (фрагмент таблиці варіантів методичних вказівок).
- figure:
    id: var
    src: tau_work/assets/var8_p3.png
    caption: Структурна схема та параметри варіанту 8 (табл. 3.1)
    orientation: portrait
    width_cm: 16
- p: 'Отже, для варіанту 8 задано:'
- eq: k=10\ \text{с}^{-1};\quad T_1=0,01\ \text{с};\quad T_2=0,02\ \text{с};\quad T_3=1\ \text{с};\quad \zeta=0,7.
  num: false
- p: 'Передатна функція розімкненої системи визначена в практичній роботі №3:'
- eq:
  - W_{\text{роз}}(p)=\frac{k\left(T_1p+1\right)\left(T_2p+1\right)}{p\left(T_3^2p^2+2\zeta T_3p+1\right)}=
  - =\frac{10\left(0,01p+1\right)\left(0,02p+1\right)}{p\left(p^2+1,4p+1\right)}.
  num: true
  id: wroz
- h1: 2. Короткі теоретичні відомості
  new_page: true
- p: Якщо в передатній функції замінити $p=j\omega$, отримаємо частотну характеристику [1, 2]
- eq: W(j\omega)=U(\omega)+jV(\omega)=A(\omega)e^{j\varphi(\omega)},
  num: true
  id: fr
- p: 'де $A(\omega)=|W(j\omega)|$ — амплітудно-частотна, $\varphi(\omega)=\arg W(j\omega)$ — фазочастотна характеристики. **Логарифмічна амплітудно-частотна характеристика** (ЛАЧХ):'
- eq: L(\omega)=20\lg A(\omega),\ \ \text{дБ}.
  num: true
  id: ldef
- p: 'По осі абсцис частоту відкладають у логарифмічному масштабі: **декада** — інтервал, на якому частота змінюється в 10 разів. ЛФЧХ $\varphi(\omega)$ будують у тому самому масштабі частот під ЛАЧХ. Для послідовно з''єднаних ланок $W(p)=\prod W_i(p)$ характеристики додаються:'
- eq: L(\omega)=\sum_{i}L_i(\omega),\qquad \varphi(\omega)=\sum_{i}\varphi_i(\omega).
  num: true
  id: sum
- p: Асимптотичні ЛАЧХ типових ланок — відрізки прямих, нахил яких змінюється на **частотах спряження** $\omega_i=1/T_i$ (табл. {tab:typ}).
- table:
    id: typ
    caption: Асимптотичні ЛАЧХ і ЛФЧХ типових ланок
    header:
    - Ланка
    - W(p)
    - Зміна нахилу ЛАЧХ після ω = 1/T
    - φ(ω)
    rows:
    - - Інтегруюча
      - $\frac{k}{p}$
      - −20 дБ/дек на всіх частотах
      - $-90°$
    - - Аперіодична
      - $\frac{1}{Tp+1}$
      - −20 дБ/дек
      - $-\mathrm{arctg}\,T\omega$
    - - Форсуюча
      - $Tp+1$
      - +20 дБ/дек
      - $\mathrm{arctg}\,T\omega$
    - - Коливальна
      - $\frac{1}{T^2p^2+2\zeta Tp+1}$
      - −40 дБ/дек
      - $-\mathrm{arctg}\frac{2\zeta T\omega}{1-T^2\omega^2}$ (від 0 до −180°)
    font: 12
    align: center
    first_left: true
    widths:
    - 3.0
    - 3.6
    - 4.6
    - 5.3
- p: '**Методика побудови асимптотичної ЛАЧХ** розімкненої системи:'
- numbered:
  - подати $W_{\text{роз}}(p)$ у вигляді добутку типових ланок і знайти частоти спряження $\omega_i=1/T_i$, відкласти їх на осі частот;
  - на частоті $\omega=1\ \text{с}^{-1}$ відкласти ординату $20\lg k$ (точка A);
  - через точку A провести низькочастотну асимптоту з нахилом $-20\nu$ дБ/дек, де $\nu$ — порядок астатизму;
  - на кожній частоті спряження змінювати нахил відповідно до табл. {tab:typ};
  - для коливальної ланки при $\zeta<0,4$ вносять поправку на резонансний пік; при $0,4\le\zeta\le 0,7$ асимптота відрізняється від точної кривої не більше ніж на 3 дБ.
- p: Частота, на якій $L(\omega)=0$, — **частота зрізу** $\omega_{\text{зр}}$; частота, на якій $\varphi(\omega)=-180°$, позначається $\omega_\pi$. За логарифмічним критерієм Найквіста замкнена система, стійка в розімкненому стані (або астатична), стійка, якщо на частотах, де $L(\omega)>0$, ЛФЧХ не перетинає рівень $-180°$; запас стійкості за фазою $\gamma=180°+\varphi(\omega_{\text{зр}})$.
- h1: 3. Хід виконання роботи
  new_page: true
- h2: 3.1. Розклад передатної функції на типові ланки
- eq: W_{\text{роз}}(p)=k\cdot\frac{1}{p}\cdot\frac{1}{T_3^2p^2+2\zeta T_3p+1}\cdot\left(T_2p+1\right)\cdot\left(T_1p+1\right).
  num: true
  id: dec
- p: Розімкнена система — послідовне з'єднання підсилювальної ланки $k=10$, інтегруючої ланки $\frac{1}{p}$ (порядок астатизму $\nu=1$), коливальної ланки ($T_3=1$ с, $\zeta=0,7$) та двох форсуючих ланок ($T_2=0,02$ с і $T_1=0,01$ с).
- h2: 3.2. Частоти спряження і точка A
- eq:
  - \omega_3=\frac{1}{T_3}=\frac{1}{1}=1\ \text{с}^{-1};\qquad \omega_2=\frac{1}{T_2}=\frac{1}{0,02}=50\ \text{с}^{-1};
  - \omega_1=\frac{1}{T_1}=\frac{1}{0,01}=100\ \text{с}^{-1}.
  num: true
  id: wsp
- p: 'Ордината точки A на частоті $\omega=1\ \text{с}^{-1}$: $20\lg k=20\lg 10=20$ дБ. Перша частота спряження $\omega_3$ збігається з частотою точки A.'
- h2: 3.3. Побудова асимптотичної ЛАЧХ
- p: 'Нахили асимптотичної ЛАЧХ на ділянках між частотами спряження:'
- bullets:
  - '$\omega<1$: $-20$ дБ/дек (інтегруюча ланка, $\nu=1$);'
  - '$1<\omega<50$: $-20-40=-60$ дБ/дек (додається коливальна ланка);'
  - '$50<\omega<100$: $-60+20=-40$ дБ/дек (форсуюча ланка $T_2$);'
  - '$\omega>100$: $-40+20=-20$ дБ/дек (форсуюча ланка $T_1$).'
- p: 'Контрольні точки асимптоти:'
- eq: L(0,1)=20+20=40\ \text{дБ};\quad L(50)=20-60\lg 50=20-101,9=-81,9\ \text{дБ};
  num: false
- eq: L(100)=-81,9-40\lg 2=-93,9\ \text{дБ};\quad L(1000)=-93,9-20=-113,9\ \text{дБ}.
  num: false
- p: 'Частота зрізу асимптотичної ЛАЧХ (вісь 0 дБ перетинається на ділянці з нахилом −60 дБ/дек):'
- eq:
  - 20-60\lg\omega_{\text{зр}}=0\ \Rightarrow\ \lg\omega_{\text{зр}}=\frac{1}{3};
  - \omega_{\text{зр}}=10^{1/3}\approx 2,15\ \text{с}^{-1}.
  num: true
  id: wc
- p: Для порівняння обчислено точну ЛАЧХ $L(\omega)=20\lg|W_{\text{роз}}(j\omega)|$, де
- eq: '|W_{\text{роз}}(j\omega)|=\frac{k\sqrt{1+T_1^2\omega^2}\sqrt{1+T_2^2\omega^2}}{\omega\sqrt{\left(1-T_3^2\omega^2\right)^2+\left(2\zeta T_3\omega\right)^2}}.'
  num: true
  id: aex
- p: Значення наведено в табл. {tab:lach}, графіки — на рис. {fig:lach}. Найбільша розбіжність (−2,9 дБ) — на частоті спряження коливальної ланки, де точне значення дорівнює $-20\lg(2\zeta)=-20\lg 1,4=-2,92$ дБ відносно асимптоти. Точна частота зрізу $\omega_{\text{зр}}=2,14\ \text{с}^{-1}$, асимптотична — $2,15\ \text{с}^{-1}$.

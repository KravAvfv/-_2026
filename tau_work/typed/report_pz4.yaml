- h2: 3.4. Побудова ЛФЧХ
- p: 'Згідно з ({eq:sum}) фаза розімкненої системи — сума фаз типових ланок (підсилювальна ланка фазу не змінює):'
- eq: \varphi(\omega)=-90°-\mathrm{arctg}\frac{2\zeta T_3\omega}{1-T_3^2\omega^2}+\mathrm{arctg}\,T_2\omega+\mathrm{arctg}\,T_1\omega.
  num: true
  id: phi
- p: 'Фаза коливальної ланки змінюється від $0$ до $-180°$ і дорівнює $-90°$ на частоті $\omega_3=1\ \text{с}^{-1}$; при $\omega>1$ знаменник під арктангенсом від''ємний, тому кут береться в третій чверті. Граничні значення: $\varphi(0)=-90°$, $\varphi(\infty)=-90°-180°+90°+90°=-90°$. Результати розрахунку — у табл. {tab:lfch}, графік — на рис. {fig:lfch}.'

blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися визначати передатні функції елементів систем автоматичного управління (САУ) за заданими рівняннями динаміки з використанням перетворення Лапласа.'
- p: '**Завдання:** визначити передатну функцію $W(p)$ елемента системи за заданим рівнянням динаміки, де $x_1(t)$ і $x_2(t)$ — відповідно вхідна і вихідна величини, відповідно до варіанту згідно з табл. 1.1 методичних вказівок.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var} (фрагмент таблиці варіантів методичних вказівок).
- figure:
    id: var
    src: tau_work/assets/var8_p1.png
    caption: Вихідні дані варіанту 8 (табл. 1.1 методичних вказівок)
    orientation: portrait
    width_cm: 16
- p: 'Отже, для варіанту 8 задано:'
- eq: T\frac{d^2x_2(t)}{dt^2}+\frac{dx_2(t)}{dt}=\frac{dx_1(t)}{dt}+x_1(t),\qquad T=5\ \text{с}.
  num: true
  id: ode
- p: Рівняння ({eq:ode}) — лінійне диференціальне рівняння другого порядку відносно вихідної величини $x_2(t)$ з правою частиною, що містить вхідну величину $x_1(t)$ та її першу похідну.
- h1: 2. Короткі теоретичні відомості
  new_page: true
- p: У теорії автоматичного управління елементи систем з погляду їх динамічних властивостей зображують динамічними ланками [1, 2]. **Динамічна ланка** — це математична модель штучно виділеної частини системи, яка характеризується певним (найпростішим) алгоритмом передачі сигналу зі входу ланки на її вихід (рис. {fig:link}).
- figure:
    id: link
    src: tau_work/typed/fig/p1_link.png
    caption: Схематичне зображення динамічної ланки
    orientation: portrait
- p: 'Рівняння динаміки елемента в загальному вигляді є лінійним диференціальним рівнянням:'
- eq: \sum_{i=0}^{n}a_i\frac{d^ix_2(t)}{dt^i}=\sum_{j=0}^{m}b_j\frac{d^jx_1(t)}{dt^j}.
  num: true
  id: gen
- p: 'Для його розв''язання застосовують **перетворення Лапласа**, яке ставить у відповідність функції часу $x(t)$ (оригіналу) функцію комплексної змінної $p$ (зображення):'
- eq: X(p)=L\{x(t)\}=\int_{0}^{\infty}x(t)e^{-pt}dt.
  num: true
  id: lap
- p: 'Під час переходу до зображень використовують такі теореми перетворення Лапласа:'
- numbered:
  - 'теорема про додавання (лінійність): $L\{a_1x_1(t)+a_2x_2(t)\}=a_1X_1(p)+a_2X_2(p)$;'
  - 'теорема про диференціювання за нульових початкових умов: $L\left\{\frac{d^nx(t)}{dt^n}\right\}=p^nX(p)$;'
  - 'теорема про інтегрування: $L\left\{\int x(t)dt\right\}=\frac{X(p)}{p}$.'
- p: 'Отже, функції часу замінюються їх зображеннями, а операція диференціювання — множенням зображення на $p$ (інтегрування — діленням на $p$). Рівняння ({eq:gen}) в операторній формі:'
- eq: \left(a_np^n+\ldots+a_1p+a_0\right)X_2(p)=\left(b_mp^m+\ldots+b_1p+b_0\right)X_1(p).
  num: false
- p: '**Передатна функція** $W(p)$ — це відношення зображення за Лапласом вихідної величини до зображення вхідної величини за нульових початкових умов:'
- eq: W(p)=\frac{X_2(p)}{X_1(p)}=\frac{b_mp^m+\ldots+b_1p+b_0}{a_np^n+\ldots+a_1p+a_0}=\frac{B(p)}{A(p)}.
  num: true
  id: wdef
- p: Поліном $A(p)$ знаменника називають характеристичним; його корені — **полюси**, корені чисельника $B(p)$ — **нулі** передатної функції. Реальний елемент фізично реалізований, якщо $m\le n$. Будь-яку дробово-раціональну передатну функцію можна подати як добуток передатних функцій типових ланок (табл. {tab:links}).
- table:
    id: links
    caption: Передатні функції типових динамічних ланок
    header:
    - Ланка
    - Передатна функція
    - Ланка
    - Передатна функція
    rows:
    - - Підсилювальна
      - $W(p)=k$
      - Аперіодична 1-го порядку
      - $W(p)=\frac{k}{Tp+1}$
    - - Інтегруюча
      - $W(p)=\frac{k}{p}$
      - Форсуюча 1-го порядку
      - $W(p)=k(\tau p+1)$
    - - Ідеальна диференціююча
      - $W(p)=kp$
      - Коливальна (0 < ζ < 1)
      - $W(p)=\frac{k}{T^2p^2+2\zeta Tp+1}$
    font: 12
    align: center
    first_left: true
    widths:
    - 3.4
    - 3.2
    - 4.4
    - 5.5
- h1: 3. Хід виконання роботи
  new_page: true
- h2: 3.1. Перехід до зображень за Лапласом
- p: Замінимо функції часу, що входять до рівняння ({eq:ode}), їх зображеннями за Лапласом. Початкові умови вважаємо нульовими, тому кожна похідна замінюється множенням зображення на відповідний степінь $p$ (табл. {tab:map}).
- table:
    id: map
    caption: Відповідність оригіналів і зображень для рівняння (1.1)
    header:
    - Оригінал
    - Зображення
    - Оригінал
    - Зображення
    rows:
    - - $x_1(t)$
      - $X_1(p)$
      - $x_2(t)$
      - $X_2(p)$
    - - $\frac{dx_1(t)}{dt}$
      - $pX_1(p)$
      - $\frac{dx_2(t)}{dt}$
      - $pX_2(p)$
    - - —
      - —
      - $\frac{d^2x_2(t)}{dt^2}$
      - $p^2X_2(p)$
    font: 12
    align: center
    first_left: false
    widths:
    - 4
    - 4
    - 4
    - 4
- h2: 3.2. Рівняння динаміки в операторній формі
- p: 'Підставивши зображення з табл. {tab:map} у рівняння ({eq:ode}), отримаємо:'
- eq: Tp^2X_2(p)+pX_2(p)=pX_1(p)+X_1(p).
  num: true
  id: op
- p: 'Винесемо за дужки зображення вихідної величини в лівій частині та вхідної — у правій:'
- eq: X_2(p)\left(Tp^2+p\right)=X_1(p)\left(p+1\right).
  num: true
  id: op2
- h2: 3.3. Визначення передатної функції
- p: 'За означенням ({eq:wdef}) поділимо обидві частини рівняння ({eq:op2}) на $X_1(p)\left(Tp^2+p\right)$:'
- eq: W(p)=\frac{X_2(p)}{X_1(p)}=\frac{p+1}{Tp^2+p}=\frac{p+1}{p\left(Tp+1\right)}.
  num: true
  id: wsym
- p: 'Підставимо значення сталої часу $T=5$ с:'
- eq: W(p)=\frac{p+1}{5p^2+p}=\frac{p+1}{p\left(5p+1\right)}.
  num: true
  id: w8
- p: 'Коефіцієнти полінома чисельника: $b_1=1$, $b_0=1$ ($m=1$); знаменника: $a_2=5$ с, $a_1=1$, $a_0=0$ ($n=2$).'
- h2: 3.4. Аналіз отриманої передатної функції
- p: 'Подамо ({eq:w8}) як добуток передатних функцій типових ланок табл. {tab:links}:'
- eq: W(p)=\frac{1}{p}\cdot\left(p+1\right)\cdot\frac{1}{5p+1}=W_{\text{і}}(p)\cdot W_{\text{ф}}(p)\cdot W_{\text{а}}(p),
  num: true
  id: dec
- p: де $W_{\text{і}}(p)=\frac{1}{p}$ — інтегруюча ланка з коефіцієнтом передачі $k=1\ \text{с}^{-1}$; $W_{\text{ф}}(p)=\tau p+1$ — форсуюча ланка першого порядку зі сталою часу $\tau=1$ с; $W_{\text{а}}(p)=\frac{1}{Tp+1}$ — аперіодична ланка першого порядку зі сталою часу $T=5$ с. Отже, елемент еквівалентний послідовному з'єднанню трьох типових ланок (рис. {fig:chain}).
- figure:
    id: chain
    src: tau_work/typed/fig/p1_chain.png
    caption: Структурна схема елемента варіанту 8 як послідовне з'єднання типових ланок
    orientation: portrait
- p: 'Нулі й полюси передатної функції (рис. {fig:pz}):'
- eq: B(p)=p+1=0\ \Rightarrow\ z_1=-1;
  num: false
- eq: A(p)=p\left(5p+1\right)=0\ \Rightarrow\ p_1=0,\quad p_2=-\frac{1}{5}=-0,2.
  num: false
- figure:
    id: pz
    src: tau_work/typed/fig/p1_pz.png
    caption: Розташування нулів і полюсів передатної функції W(p) на комплексній площині
    orientation: portrait
- p: 'Висновки з аналізу:'
- bullets:
  - порядок чисельника $m=1$ менший за порядок знаменника $n=2$, тобто елемент фізично реалізований;
  - 'нульовий полюс $p_1=0$ означає наявність інтегруючої властивості (порядок астатизму $\nu=1$): за сталого вхідного сигналу вихідна величина необмежено зростає;'
  - полюс $p_2=-0,2$ лежить у лівій півплощині, він визначає сталу часу інерційної частини $T=1/0,2=5$ с;
  - нуль $z_1=-1$ (форсуюча ланка) прискорює реакцію елемента на зміну вхідного сигналу.
- h2: 3.5. Перевірка результату
- p: 'Виконаємо обернений перехід: перемноживши ({eq:w8}) навхрест, отримаємо $\left(5p^2+p\right)X_2(p)=\left(p+1\right)X_1(p)$. Замінивши $p^k$ на оператор $k$-ї похідної, дістанемо'
- eq: 5\frac{d^2x_2(t)}{dt^2}+\frac{dx_2(t)}{dt}=\frac{dx_1(t)}{dt}+x_1(t),
  num: false
- p: що збігається з вихідним рівнянням ({eq:ode}) при $T=5$ с. Отже, передатну функцію визначено правильно.
- h1: Висновки
  new_page: true
- p: '1. Визначено передатну функцію елемента САУ варіанту 8: $W(p)=\frac{p+1}{p\left(5p+1\right)}=\frac{p+1}{5p^2+p}$. Для цього рівняння динаміки переведено в операторну форму за теоремами про лінійність і диференціювання перетворення Лапласа за нульових початкових умов.'
- p: 2. Елемент еквівалентний послідовному з'єднанню інтегруючої ланки $\frac{1}{p}$, форсуючої ланки $\left(p+1\right)$ та аперіодичної ланки $\frac{1}{5p+1}$; передатна функція має нуль $-1$ і полюси $0$ та $-0,2$.
- p: 3. Оскільки $m=1<n=2$, елемент фізично реалізований; нульовий полюс зумовлює астатизм першого порядку. Обернений перехід від $W(p)$ до диференціального рівняння відтворює вихідне рівняння, що підтверджує правильність розв'язання. Отримана $W(p)$ є вихідними даними для практичного заняття №2.

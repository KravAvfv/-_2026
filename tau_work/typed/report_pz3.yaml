blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися перетворювати структурні схеми систем автоматичного управління та визначати передатні функції розімкненої і замкненої системи.'
- p: '**Завдання:** визначити передатну функцію розімкненої системи $W_{\text{роз}}(p)$, передатну функцію замкненої системи за задаючим діянням $Ф(p)$ і передатну функцію замкненої системи за помилкою $Ф_\delta(p)$ відповідно до варіанту згідно з табл. 3.1 методичних вказівок.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var} (фрагмент таблиці варіантів методичних вказівок).
- figure:
    id: var
    src: tau_work/assets/var8_p3.png
    caption: Структурна схема та параметри варіанту 8 (табл. 3.1)
    orientation: portrait
    width_cm: 16
- p: 'Отже, для варіанту 8 задано:'
- p: 'структурна схема рис. {fig:var} з одиничним від''ємним зворотним зв''язком і параметри:'
- eq: k=10\ \text{с}^{-1};\quad T_1=0,01\ \text{с};\quad T_2=0,02\ \text{с};\quad T_3=1\ \text{с};\quad \zeta=0,7.
  num: false
- h1: 2. Короткі теоретичні відомості
  new_page: true
- p: '**Структурна схема** — графічне зображення математичної моделі САУ у вигляді з''єднань динамічних ланок; кожна ланка позначається прямокутником з її передатною функцією, суматори — колами (зафарбований сектор означає віднімання сигналу), точки розгалуження — вузлами [1, 2]. Для визначення передатних функцій схему послідовно спрощують за правилами структурних перетворень:'
- numbered:
  - 'послідовне з''єднання ланок: $W(p)=W_1(p)\cdot W_2(p)\cdot\ldots\cdot W_n(p)$;'
  - 'паралельне (узгоджено-паралельне) з''єднання: $W(p)=W_1(p)+W_2(p)+\ldots+W_n(p)$;'
  - 'з''єднання зі зворотним зв''язком: $W(p)=\frac{W_{\text{п}}(p)}{1\pm W_{\text{п}}(p)W_{\text{зз}}(p)}$, де знак «+» відповідає від''ємному, а «−» — додатному зворотному зв''язку.'
- p: '**Передатна функція розімкненої системи** $W_{\text{роз}}(p)$ — добуток передатних функцій усіх ланок, що входять у замкнений контур (контур розмикається перед елементом порівняння). Для системи з одиничним від''ємним зворотним зв''язком (рис. {fig:loop}):'
- eq: Ф(p)=\frac{Y(p)}{X(p)}=\frac{W_{\text{роз}}(p)}{1+W_{\text{роз}}(p)},
  num: true
  id: phi
- eq: Ф_\delta(p)=\frac{\delta(p)}{X(p)}=\frac{1}{1+W_{\text{роз}}(p)},
  num: true
  id: phid
- p: причому $Ф(p)+Ф_\delta(p)=1$. Якщо $W_{\text{роз}}(p)=\frac{B(p)}{A(p)}$, то $Ф(p)=\frac{B(p)}{A(p)+B(p)}$ і $Ф_\delta(p)=\frac{A(p)}{A(p)+B(p)}$; поліном $D(p)=A(p)+B(p)$ — **характеристичний поліном замкненої системи**, рівняння $D(p)=0$ визначає її стійкість.
- h1: 3. Хід виконання роботи
  new_page: true
- h2: 3.1. Аналіз структурної схеми
- p: 'Перемалюємо схему варіанту 8 з позначенням ланок (рис. {fig:scheme}). Сигнал помилки $\delta(p)=X(p)-Y(p)$ розгалужується: одна гілка подається на другий суматор безпосередньо (передатна функція 1), друга — через ланку $T_2p$. Далі ввімкнені послідовно ланки $W_2(p)$ та $W_3(p)$, вихід $Y(p)$ охоплений одиничним від''ємним зворотним зв''язком.'
- figure:
    id: scheme
    src: tau_work/typed/fig/p3_scheme.png
    caption: Структурна схема САУ варіанту 8 з позначенням ланок
    orientation: portrait
- h2: 3.2. Перетворення паралельного з'єднання
- p: 'Пряма гілка з передатною функцією 1 і ланка $T_2p$ мають спільний вхід $\delta(p)$, а їх виходи додаються в суматорі, тобто з''єднані паралельно:'
- eq: W_1(p)=1+T_2p=T_2p+1=0,02p+1.
  num: true
  id: w1
- p: 'Ланка $W_1(p)$ — форсуюча ланка першого порядку. Після заміни схема набуває вигляду рис. {fig:series}: три ланки з''єднані послідовно і охоплені одиничним від''ємним зворотним зв''язком, де'
- eq: W_2(p)=\frac{T_1p+1}{T_3^2p^2+2\zeta T_3p+1},\qquad W_3(p)=\frac{k}{p}.
  num: false
- figure:
    id: series
    src: tau_work/typed/fig/p3_series.png
    caption: Схема після заміни паралельного з'єднання еквівалентною ланкою
    orientation: portrait
- h2: 3.3. Передатна функція розімкненої системи
- p: Розімкнемо контур перед елементом порівняння. Ланки $W_1$, $W_2$, $W_3$ з'єднані послідовно, тому
- eq: W_{\text{роз}}(p)=W_1(p)W_2(p)W_3(p)=\frac{k\left(T_1p+1\right)\left(T_2p+1\right)}{p\left(T_3^2p^2+2\zeta T_3p+1\right)}.
  num: true
  id: wroz
- p: 'Обчислимо поліноми чисельника та знаменника для заданих параметрів:'
- eq: \left(T_1p+1\right)\left(T_2p+1\right)=\left(0,01p+1\right)\left(0,02p+1\right)=0,0002p^2+0,03p+1;
  num: false
- eq: T_3^2p^2+2\zeta T_3p+1=1^2\cdot p^2+2\cdot 0,7\cdot 1\cdot p+1=p^2+1,4p+1.
  num: false
- eq:
  - W_{\text{роз}}(p)=\frac{10\left(0,0002p^2+0,03p+1\right)}{p\left(p^2+1,4p+1\right)}=
  - =\frac{0,002p^2+0,3p+10}{p^3+1,4p^2+p}.
  num: true
  id: wrozn
- p: Отже, $B(p)=0,002p^2+0,3p+10$, $A(p)=p^3+1,4p^2+p$. Розімкнена система має порядок астатизму $\nu=1$ (один нульовий полюс) і коефіцієнт передачі $k=10\ \text{с}^{-1}$. Еквівалентна одноконтурна схема показана на рис. {fig:loop}.
- figure:
    id: loop
    src: tau_work/typed/fig/p3_loop.png
    caption: Еквівалентна одноконтурна схема з одиничним від'ємним зворотним зв'язком
    orientation: portrait
- h2: 3.4. Передатна функція замкненої системи за задаючим діянням
- p: 'За формулою ({eq:phi}):'
- eq: Ф(p)=\frac{W_{\text{роз}}(p)}{1+W_{\text{роз}}(p)}=\frac{k\left(T_1p+1\right)\left(T_2p+1\right)}{p\left(T_3^2p^2+2\zeta T_3p+1\right)+k\left(T_1p+1\right)\left(T_2p+1\right)}.
  num: false
- p: 'Знаменник дорівнює сумі поліномів $A(p)$ і $B(p)$:'
- eq:
  - A(p)+B(p)=p^3+1,4p^2+p+0,002p^2+0,3p+10=
  - =p^3+1,402p^2+1,3p+10.
  num: false
- p: Отже,
- eq: Ф(p)=\frac{0,002p^2+0,3p+10}{p^3+1,402p^2+1,3p+10}.
  num: true
  id: phin
- h2: 3.5. Передатна функція замкненої системи за помилкою
- p: 'За формулою ({eq:phid}):'
- eq: Ф_\delta(p)=\frac{1}{1+W_{\text{роз}}(p)}=\frac{p\left(T_3^2p^2+2\zeta T_3p+1\right)}{p\left(T_3^2p^2+2\zeta T_3p+1\right)+k\left(T_1p+1\right)\left(T_2p+1\right)}=
  num: false
- eq: =\frac{p^3+1,4p^2+p}{p^3+1,402p^2+1,3p+10}.
  num: true
  id: phidn
- h2: 3.6. Перевірка та аналіз результатів
- p: '1) Сума передатних функцій замкненої системи дорівнює одиниці:'
- eq: Ф(p)+Ф_\delta(p)=\frac{\left(0,002p^2+0,3p+10\right)+\left(p^3+1,4p^2+p\right)}{p^3+1,402p^2+1,3p+10}=1.
  num: false
- p: '2) Статичний режим: $Ф(0)=\frac{10}{10}=1$, $Ф_\delta(0)=0$ — завдяки астатизму першого порядку система за сталого задаючого впливу не має статичної помилки.'
- p: '3) Знаменники $Ф(p)$ і $Ф_\delta(p)$ однакові — це характеристичний поліном замкненої системи:'
- eq: D(p)=p^3+1,402p^2+1,3p+10=0.
  num: true
  id: char
- p: 'Корені рівняння ({eq:char}), обчислені числово: $p_1=−2,491$, $p_{2,3}=0,545\pm j1,928$. Пара комплексних коренів має додатну дійсну частину, тож за заданого $k=10\ \text{с}^{-1}$ замкнена система **нестійка**; це ж показує алгебраїчна умова для системи третього порядку: $a_2a_1=1,402\cdot 1,3=1,823<a_3a_0=1\cdot 10=10$. Моделювання реакції $Ф(p)$ на одиничний стрибок (рис. {fig:step}) підтверджує розбіжні коливання. Детально стійкість досліджується в практичних роботах №4 і №6.'
- figure:
    id: step
    src: tau_work/typed/fig/p3_step.png
    caption: Перехідна характеристика замкненої системи при k = 10 с⁻¹ (числове моделювання)
    orientation: portrait
- h1: Висновки
  new_page: true
- p: '1. Структурну схему варіанту 8 перетворено до одноконтурної: паралельне з''єднання прямої гілки та ланки $T_2p$ замінено форсуючою ланкою $0,02p+1$, після чого три послідовні ланки об''єднано в $W_{\text{роз}}(p)=\frac{10(0,01p+1)(0,02p+1)}{p(p^2+1,4p+1)}=\frac{0,002p^2+0,3p+10}{p^3+1,4p^2+p}$.'
- p: '2. Отримано передатні функції замкненої системи: за задаючим діянням $Ф(p)=\frac{0,002p^2+0,3p+10}{p^3+1,402p^2+1,3p+10}$ і за помилкою $Ф_\delta(p)=\frac{p^3+1,4p^2+p}{p^3+1,402p^2+1,3p+10}$; їх сума дорівнює одиниці, $Ф(0)=1$.'
- p: 3. Характеристичне рівняння замкненої системи $p^3+1,402p^2+1,3p+10=0$ має корені з додатною дійсною частиною, тому при $k=10\ \text{с}^{-1}$ система нестійка — для працездатності коефіцієнт передачі потрібно зменшити або ввести коригувальні ланки.

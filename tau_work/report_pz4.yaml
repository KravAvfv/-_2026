- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися будувати асимптотичну логарифмічну амплітудно-частотну
    (ЛАЧХ) і логарифмічну фазочастотну (ЛФЧХ) характеристики розімкненої САУ за її
    передатною функцією.'
- p: '**Завдання:** побудувати ЛАЧХ і ЛФЧХ розімкненої системи, використовуючи структурну
    схему і значення параметрів САК відповідно до варіанту згідно з табл. 3.1.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var}.

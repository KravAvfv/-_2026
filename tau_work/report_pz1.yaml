- p: '**Мета роботи:** навчитися визначати передатні функції елементів систем автоматичного
    управління (САУ) за заданими рівняннями динаміки з використанням перетворення
    Лапласа.'
- p: '**Завдання:** визначити передатну функцію W(p) елемента системи за заданим рівнянням
    динаміки, де x₁(t) і x₂(t) — відповідно вхідна і вихідна величини, відповідно
    до варіанту згідно з табл. 1.1.'

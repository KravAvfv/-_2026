- h1: 1. Мета та завдання роботи
  new_page: true
- p: '**Мета роботи:** навчитися визначати усталені помилки САУ при сталому, лінійному
    та гармонійному задаючих впливах з використанням теореми про кінцеве значення
    та ЛАЧХ розімкненої системи.'
- p: '**Завдання:** визначити усталені помилки САК, якщо задано передатну функцію
    розімкненої системи і вигляд задаючого впливу, відповідно до варіанту згідно з
    табл. 5.1.'
- p: Вихідні дані індивідуального варіанту 8 наведено на рис. {fig:var}.

- h3: 4.2. Звіт про потоки даних (Arrow Report)
- p: Звіт про стрілки діаграм DFD (табл. {tab:arr4}, {tab:arr5}) містить назву потоку, джерело, приймач і напрям
    (→ — однонапрямлений, ↔ — двонапрямлений потік); він слугує специфікацією інтерфейсів між компонентами платформи.
- table:
    id: arr4
    caption: 'Arrow Report: потоки даних діаграми DFD A4'
    header:
    - Потік даних
    - Джерело
    - Приймач
    - Напрям
    widths:
    - 4.5
    - 5.0
    - 5.0
    - 2.1
    font: 11
    rows:
    - - Доповідь, відео і телеметрія
      - E1 Розрахунок перехоплювачів (зовн. сутність)
      - A41 Зібрати докази перехоплення (процес)
      - →
    - - Дані треку цілі
      - D1 Сховище треків (сховище)
      - A41 Зібрати докази перехоплення (процес)
      - →
    - - Пакет доказів
      - A41 Зібрати докази перехоплення (процес)
      - A42 Оцінити результат перехоплення (процес)
      - →
    - - Оцінка результату
      - A42 Оцінити результат перехоплення (процес)
      - D2 Архів місій (сховище)
      - →
    - - Інформація про списаний перехоплювач
      - A42 Оцінити результат перехоплення (процес)
      - Міжсторінкове посилання (A5)
      - →
    - - Дані місії
      - D2 Архів місій (сховище)
      - A43 Сформувати і надіслати звіти (процес)
      - →
    - - Звіт / підтвердження
      - A43 Сформувати і надіслати звіти (процес)
      - E2 Вищий командний пункт (зовн. сутність)
      - ↔
    - - Статус треку
      - A43 Сформувати і надіслати звіти (процес)
      - D1 Сховище треків (сховище)
      - →
    - - Координати падіння
      - A43 Сформувати і надіслати звіти (процес)
      - E3 ДСНС (зовн. сутність)
      - →

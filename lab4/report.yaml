    - - Оплата праці
      - Витрати на оплату праці чергового персоналу, розрахунків, техніків і логістів
    - - Перехоплювачі та АКБ
      - Вартість витрачених дронів-перехоплювачів, ресурсу акумуляторних батарей
    - - Управління
      - Витрати на управління, координацію з ПС ЗСУ та звітність
- p: Вартісні показники задано для робіт нижнього рівня (табл. {tab:costin}). Вартість указано на одне виконання
    роботи, тривалість — у годинах, частота — кількість виконань у межах одного виконання батьківської роботи. Наприклад,
    робота A11 «Прийняти та нормалізувати дані сенсорів» виконується 6 разів на одну ціль (в середньому шість виявлень
    від різних сенсорів), а місія перехоплення A3 — 22 рази за добу.

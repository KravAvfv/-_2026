    тоді як інформаційні функції A1 і A2, автоматизовані платформою «Щит-Лінк», коштують менше 0,2 %. Отже, найбільший
    економічний ефект дає не здешевлення обробки даних, а підвищення точності призначення цілей (зменшення повторних
    місій і промахів), яке забезпечують функції A1–A2.

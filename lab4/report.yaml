lab_number: 4
theme: Моделювання задач, які виконуватиме система. Декомпозиція задач. Побудова звітів
year: 2026
output: lab4/ЛР4_Кравченко_ІР-31.docx
blocks:
- h1: Мета роботи
- p: Ознайомитися з методологією нотації DFD та вивчити процес моделювання задач, які виконуватиме IoT-платформа
    «Щит-Лінк», для предметної області умовного РЦПДО «Щит-Північ»; виконати вартісний аналіз функціональної моделі
    (Activity Based Costing) та сформувати звіти за моделлю.
- h1: Короткі теоретичні відомості
- p: 'Діаграми потоків даних (Data Flow Diagrams, DFD) подають ієрархію функціональних процесів, пов’язаних потоками
    даних, і показують, як кожен процес перетворює вхідні дані у вихідні. Згідно з лекцією «Нотації IDEF3, DFD»
    основними компонентами DFD є зовнішні сутності, системи і підсистеми, процеси, накопичувачі (сховища) даних
    і потоки даних. У роботі використано нотацію Гейна — Сарсона, реалізовану в BPwin / AllFusion Process Modeler:
    процес — прямокутник із заокругленими кутами та номером, сховище — відкритий прямокутник з ідентифікатором D,
    зовнішня сутність — прямокутник з тінню, потік — іменована стрілка, що може бути двонапрямленою для взаємодії
    типу «команда — відповідь».'
- p: 'Рекомендації до побудови ієрархії DFD: розміщувати на діаграмі 3–6(7) процесів; не ускладнювати діаграми несуттєвими
    деталями; декомпозицію потоків виконувати паралельно з декомпозицією процесів; обирати ясні імена без абревіатур.
    Під час декомпозиції роботи IDEF0 в DFD граничні стрілки перетворюють на внутрішні, що починаються і закінчуються
    на зовнішніх сутностях, а потоки, що мають передаватися на іншу діаграму, оформлюють міжсторінковими посиланнями
    (Off-Page Reference).'
- p: 'Вартісний аналіз (Activity Based Costing, ABC) визначає вартість виконання робіт на основі центрів витрат.
    Для кожної роботи задають витрати за центрами витрат, тривалість (Duration) і частоту (Frequency) виконання
    в межах батьківської роботи. Вартість декомпонованої роботи обчислюється знизу догори: C(батьк.) = Σ C(дочірн.)
    × F(дочірн.); аналогічно агрегується тривалість. Властивості, визначувані користувачем (User Defined Properties,
    UDP), доповнюють модель довільними атрибутами (списками, числами, командами) і групуються за ключовими словами;
    вони використовуються у звітах Diagram Object Report.'
- h1: Хід виконання роботи
  new_page: true
- h2: 1. Розроблення представлення моделі в нотації DFD
- p: 'Для моделювання задач, що виконуватиме система, у нотації DFD декомпоновано дві роботи діаграми А0 з лабораторної
    роботи № 3 (*навчальна умовна модель організації*): A4 «Оцінити результат і звітувати» та A5 «Забезпечити готовність
    ресурсів». Граничні стрілки IDEF0 замінено зовнішніми сутностями, між процесами введено сховища даних, які відповідають
    базам даних платформи «Щит-Лінк».'
- h3: 1.1. Діаграма DFD A4 «Оцінити результат і звітувати»
- p: Діаграма (рис. {fig:dfd4}) містить три процеси, два сховища і три зовнішні сутності. Розрахунок перехоплювачів
    передає доповідь, відео і телеметрію; процес A41 доповнює їх даними треку зі сховища D1 і формує пакет доказів;
    A42 встановлює оцінку результату й записує її до архіву місій D2; A43 формує звіти, оновлює статус треку в D1
    і обмінюється звітом і підтвердженням з вищим КП (двонапрямлений потік), а ДСНС отримує координати падіння уламків.
- figure:
    id: dfd4
    src: lab4/diagrams/01_dfd_a4.png
    caption: Діаграма DFD A4 «Оцінити результат і звітувати»
- h3: 1.2. Діаграма DFD A5 і міжсторінкове посилання
- p: Діаграма DFD A5 (рис. {fig:dfd5}) описує післяпольотний контроль, облік запасів і формування заявок на поповнення.
    Двонапрямлені потоки «Стан техніки», «Залишки запасів» і «Заявка / поставка» моделюють читання та оновлення
    сховищ і взаємодію з постачальником.
- p: 'Інформація про списаний (втрачений) перехоплювач виникає в процесі A42 діаграми A4, а використовується процесом
    A52 діаграми A5. Для її передачі застосовано міжсторінкове посилання (Off-Page Reference): на діаграмі A4 потік
    «Інформація про списаний перехоплювач» виходить до межі діаграми з позначкою A5, а на діаграмі A5 надходить
    від межі з позначкою A4 (у властивостях моделі встановлено Off-Page Reference label — Node number). На батьківській
    діаграмі А0 відповідні стрілки тунельовано.'
- figure:
    id: dfd5
    src: lab4/diagrams/02_dfd_a5.png
    caption: Діаграма DFD A5 «Забезпечити готовність ресурсів» з міжсторінковим посиланням
- h2: 2. Вартісний аналіз функціональної моделі
  new_page: true
- p: 'У властивостях моделі (вкладка ABC Units) встановлено одиниці виміру: грошова одиниця — грн, час — години.
    Розрахунковим періодом для роботи А0 обрано одна доба бойового чергування (40 виявлених цілей, 25 призначень,
    22 місії перехоплення). У словнику центрів витрат (Dictionary / Cost Center) створено чотири центри витрат (табл.
    {tab:cc}).'

- p: 'Для декомпонованих робіт задано лише частоту на діаграмі А0: A1 — 40 (кількість виявлених цілей за добу),
    A2 — 25 (кількість призначень). Їхня вартість обчислюється автоматично. Наприклад, вартість роботи A1 на одну
    ціль: 6 × 2 + 3 + 20 + 10 = 45,00 грн; роботи A2: 2 + 1,2 × 23 + 25 + 1,1 × 2 = 56,80 грн. Вартість роботи А0
    за добу: 40 × 45,00 + 25 × 56,80 + 22 × 70 750,00 + 22 × 220,00 + 1 × 9 300,00 = **1 573 860,00 грн**.'
- p: Після ввімкнення опції ABC Data (Model Properties / Display) вартість кожної роботи відображається в лівому
    нижньому куті її прямокутника (рис. {fig:abc}).

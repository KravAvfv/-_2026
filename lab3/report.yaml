    - 5.4
    - 9
    font: 12
    rows:
    - - A0
      - Забезпечити перехоплення повітряних цілей
      - Функціональна модель процесу виявлення, призначення, виконання та оцінки перехоплення повітряних цілей дронами-перехоплювачами
        з підтримкою платформи «Щит-Лінк».
    - - A1
      - Сформувати повітряну обстановку
      - Прийом і нормалізація даних сенсорів, злиття виявлень у треки, класифікація та підтвердження цілей
    - - A11
      - Прийняти та нормалізувати дані сенсорів
      - Автентифікація джерел, перевірка схеми й часу, приведення до канонічного формату
    - - A12
      - Злити виявлення у треки
      - Асоціація виявлень, тріангуляція, ведення життєвого циклу треку
    - - A13
      - Класифікувати ціль і оцінити загрозу
      - Тип і належність цілі, звірка з планами польотів, розрахунок пріоритету
    - - A14
      - Підтвердити ціль
      - Підтвердження ворожої цілі оперативним черговим
    - - A2
      - Призначити перехоплення цілі
      - Деконфлікція, вибір розрахунку, санкціонування пуску, передача бойового завдання
    - - A21
      - Перевірити деконфлікцію
      - Перевірка зон заборони ураження та планів польотів дружньої авіації
    - - A22
      - Обрати розрахунок
      - Ранжування розрахунків-кандидатів за готовністю та часом перехоплення
    - - A23
      - Санкціонувати пуск
      - Дозвіл оперативного чергового за правилом двох осіб
    - - A24
      - Передати бойове завдання
      - Цифрова доставка завдання на планшет розрахунку та контроль підтвердження
    - - A3
      - Виконати місію перехоплення
      - Прийняття завдання, підготовка, пуск, наведення з підтвердженням оператора, доповідь
    - - A4
      - Оцінити результат і звітувати
      - Збір доказів, оцінка результату, звіти вищому КП, повідомлення ДСНС
    - - A5
      - Забезпечити готовність ресурсів
      - Післяпольотний контроль, ремонт, облік запасів, заявки на поповнення

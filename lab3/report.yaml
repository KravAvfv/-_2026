      - Діяльність РЦПДО «Щит-Північ» з перехоплення повітряних цілей
    - - Проєкт (Project)
      - IoT-платформа «Щит-Лінк»
    - - Автор (Author)
      - Кравченко П., гр. ІР-31
    - - Часове представлення (Time Frame)
      - TO-BE (як має бути)
    - - Мета (Purpose)
      - Визначити функції центру та інформаційні потоки між ними для обґрунтування вимог до IoT-платформи «Щит-Лінк».
    - - Точка зору (Viewpoint)
      - Оперативний черговий командного пункту.
    - - Визначення (Definition)
      - Функціональна модель процесу виявлення, призначення, виконання та оцінки перехоплення повітряних цілей дронами-перехоплювачами
        з підтримкою платформи «Щит-Лінк».
    - - Охоплення (Scope)
      - Від надходження сигналів сенсорів до звіту про результат перехоплення та поповнення ресурсів; керування
        польотом перехоплювачів і засоби ураження не моделюються.
- p: Контекстна діаграма (рис. {fig:ctx}) містить єдиний блок «Забезпечити перехоплення повітряних цілей» і стрілки

    - - Глибина моделі ≤ 5–6 рівнів
      - 3 рівні (А-0, А0, A1/A2) + IDEF3 для A3
- h2: 4. Створення діаграми дерева вузлів
  new_page: true
- p: Діаграма дерева вузлів (Diagram / Add Node Tree) відображає ієрархію робіт моделі без стрілок (рис. {fig:tree}).
    Коренем дерева є контекстна робота А0, другий рівень утворюють роботи A1–A5, третій — роботи декомпозицій A1
    та A2. Опцію Bullet Last Level вимкнено, тому останній рівень відображено прямокутниками, а не маркованим списком.
- figure:
    id: tree
    src: lab3/diagrams/05_node_tree.png
    caption: Діаграма дерева вузлів моделі «Забезпечити перехоплення повітряних цілей»
- h2: 5. Створення FEO-діаграми
  new_page: true
- p: Для детального розгляду взаємодії роботи A3 «Виконати місію перехоплення» з іншими роботами створено FEO-діаграму
    (Diagram / Add FEO Diagram) на основі діаграми А0, на якій залишено лише стрілки роботи A3 (рис. {fig:feo}).
    Номер діаграми має суфікс «F», а в полі назви зазначено призначення «тільки для експозиції»; діаграма декомпозиції
    А0 при цьому не змінюється.
- figure:
    id: feo
    src: lab3/diagrams/06_feo_a3.png
    caption: FEO-діаграма A0F «Взаємодія роботи «Виконати місію перехоплення»»
- h2: 6. Розділення та злиття моделей
  new_page: true
- p: Для розділення моделі на діаграмі А0 обрано роботу A3 і виконано команду Split Model з іменем нової моделі
    «Виконання місії перехоплення». У результаті в Model Explorer з’являється окрема модель, а на діаграмі А0 біля
    роботи A3 — стрілка виклику, спрямована вниз (рис. {fig:split}). Контекстна діаграма нової моделі містить роботу
    «Виконати місію перехоплення» з тими самими граничними стрілками, що й робота A3 (рис. {fig:splitctx}).
- figure:
    id: split
    src: lab3/diagrams/07_split_a0.png
    caption: Діаграма А0 після розділення моделі (стрілка виклику роботи A3)
- p: 'У відокремленій моделі створено нову стрілку виходу «Телеметрія місії» (аналог стрілки «Відходи» з методичних
    вказівок). Для злиття моделей на діаграмі А0 вихідної моделі для роботи A3 виконано команду Merge Model з увімкненою
    опцією Cut / Paste entire dictionaries: дві моделі об’єдналися, словники робіт і стрілок злито, стрілка виклику
    зникла, а нова стрілка «Телеметрія місії» з’явилася на діаграмі А0 як гранична стрілка виходу роботи A3 у тунелі,
    яку за потреби дозволяють як граничну (Resolve it to Border Arrow).'
- figure:
    id: splitctx
    src: lab3/diagrams/08_split_model.png
    caption: Контекстна діаграма відокремленої моделі «Виконання місії перехоплення»
- h2: 7. Створення діаграми IDEF3
  new_page: true
- p: Роботу A3 «Виконати місію перехоплення» декомпоновано в нотації IDEF3 (рис. {fig:idef3}), оскільки для неї
    важлива послідовність дій і паралелізм. Діаграма містить п’ять одиниць роботи, три перехрестя та два об’єкти
    посилання. Перехрестя J1 (виключне «або», X) розгалужує процес на прийняття або відмову, J2 (асинхронне «і»,
    &) запускає паралельну підготовку маршруту та передпольотний контроль, J3 (асинхронне «і») очікує завершення
    обох гілок перед пуском. Об’єкти посилання «Бойове завдання» і «Перехоплювач» пов’язано з відповідними роботами.
    Властивості одиниць роботи (вкладка UOW вікна Activity Properties) наведено в табл. {tab:uow}, перехрестя —
    у табл. {tab:junctions}.
- table:
    id: uow
    caption: Властивості одиниць роботи (UOW)
    header:
    - №
    - Одиниця роботи
    - Objects (об’єкти)
    - Facts (факти)
    - Constraints (обмеження)
    widths:
    - 0.8
    - 3.6
    - 3.6
    - 3.8
    - 4.2
    font: 11
    rows:
    - - '1'
      - Оцінити бойове завдання
      - Бойове завдання, трек цілі
      - Стан розрахунку, погода, заряд АКБ
      - Рішення протягом 15 с після отримання завдання
    - - '2'
      - Надіслати відмову
      - Повідомлення про відмову
      - Причина відмови
      - Відмова фіксується в журналі
    - - '3'
      - Підготувати маршрут і канал керування
      - Маршрут, канал зв’язку
      - Прогнозна точка перехоплення
      - Маршрут поза зонами заборони
    - - '4'
      - Виконати передпольотний контроль
      - Перехоплювач, АКБ
      - Чек-лист передпольотного контролю
      - Заряд АКБ не нижче порогу
    - - '5'
      - Здійснити пуск і супровід цілі
      - Перехоплювач, телеметрія
      - Оновлення треку не рідше 1 Гц
      - Підтвердження цілі оператором перед наведенням
- table:
    id: junctions
    caption: Перехрестя діаграми IDEF3
    header:
    - Перехрестя
    - Тип
    - Призначення
    widths:
    - 2.4
    - 5.2
    - 8.4
    font: 12
    rows:
    - - J1
      - Виключна диз’юнкція (X)
      - 'Розгалуження: прийняття завдання або відмова (fan-out)'
    - - J2
      - Асинхронна кон’юнкція (&)
      - Розгалуження на паралельну підготовку маршруту і передпольотний контроль (fan-out)
    - - J3
      - Асинхронна кон’юнкція (&)
      - 'Злиття: пуск лише після завершення обох гілок підготовки (fan-in)'
- figure:
    id: idef3
    src: lab3/diagrams/09_idef3.png
    caption: Діаграма IDEF3 декомпозиції роботи A3 «Виконати місію перехоплення»
- h2: 8. Створення діаграми сценарію
  new_page: true
- p: 'На основі діаграми IDEF3 створено діаграму сценарію «Штатне виконання місії» (Diagram / Add IDEF3 Scenario),
    з якої видалено елементи, що не входять до сценарію: одиницю роботи «Надіслати відмову» та перехрестя J1 (рис.
    {fig:scen}). Сценарій описує випадок, коли розрахунок приймає завдання, паралельно готує маршрут і перехоплювач
    та здійснює пуск і супровід цілі.'
- figure:
    id: scen
    src: lab3/diagrams/10_scenario.png
    caption: Діаграма сценарію «Штатне виконання місії»
- h1: Графічна частина
- p: 'Діаграми розміщено у відповідних підрозділах ходу виконання роботи. Перелік графічних матеріалів:'
- bullets:
  - рис. {fig:ctx} — контекстна діаграма А-0;
  - рис. {fig:a0}, {fig:a1}, {fig:a2} — діаграми декомпозиції А0, A1, A2;
  - рис. {fig:tree} — діаграма дерева вузлів;
  - рис. {fig:feo} — FEO-діаграма взаємодії роботи A3;
  - 'рис. {fig:split}, {fig:splitctx} — розділення моделі: стрілка виклику та відокремлена модель;'
  - рис. {fig:idef3} — діаграма IDEF3 роботи A3;
  - рис. {fig:scen} — діаграма сценарію.
- h1: Висновки
  new_page: true
- p: 'У лабораторній роботі побудовано функціональну модель діяльності умовного РЦПДО «Щит-Північ» у нотаціях IDEF0
    та IDEF3. Контекстна діаграма визначає межі системи: 2 входи, 3 управління, 4 виходи та 4 механізми, а також
    мету моделювання й точку зору оперативного чергового.'
- p: 'Декомпозиція містить три діаграми: А0 (5 робіт, що відповідають пулам BPMN з ЛР2) та A1, A2 (по 4 роботи).
    На діаграмах використано зв’язки «вихід — вхід», «вихід — управління», зворотні зв’язки, розгалуження і тунельовані
    стрілки; виконання правил IDEF0 підтверджено табл. {tab:rules}. Сформовано звіт за моделлю зі словниками робіт
    (14 робіт) і стрілок.'
- p: Побудовано діаграму дерева вузлів на три рівні, FEO-діаграму для аналізу взаємодії роботи «Виконати місію перехоплення»,
    виконано розділення моделі зі стрілкою виклику та злиття моделей. Діаграма IDEF3 описує послідовність і паралелізм
    виконання місії за допомогою п’яти одиниць роботи, трьох перехресть і двох об’єктів посилання, а діаграма сценарію
    — штатний варіант її виконання. Отримана модель є основою для об’єктно-орієнтованого проєктування платформи
    «Щит-Лінк» засобами UML.

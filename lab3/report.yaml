- h2: 3. Створення діаграм декомпозиції
  new_page: true
- p: 'Контекстний блок декомпоновано на п’ять робіт (діаграма А0, рис. {fig:a0}), які відповідають функціональним
    пулам P1–P5 моделі BPMN з лабораторної роботи № 2. Блоки розташовано по діагоналі за порядком домінування. На
    діаграмі використано всі основні типи зв’язків: «вихід — вхід» (A1 → A2: підтверджена ціль; A3 → A4: доповідь
    про результат), «вихід — управління» (A2 → A3: бойове завдання), зворотні зв’язки за управлінням (A5 → A2: дані
    про готовність) і за входом (A5 → A3: готові перехоплювачі). Граничні стрілки мають ICOM-коди (I1–I2, C1–C3,
    O1–O4, M1–M4), що збігаються зі стрілками контекстної діаграми; стрілки зі спільним джерелом (C1, C3, M1, M3)
    об’єднано в розгалуження.'

lab_number: 3
theme: Опанування CASE-засобів моделювання систем. Створення функціональної моделі в нотаціях IDEF0 та IDEF3
year: 2026
output: lab3/ЛР3_Кравченко_ІР-31.docx
blocks:
- h1: Мета роботи
- p: 'Опанувати методику функціонального моделювання засобами CASE-технологій: створити для умовного регіонального
    центру протидронової оборони РЦПДО «Щит-Північ» функціональну модель у нотації IDEF0 (контекстна діаграма, діаграми
    декомпозиції, дерево вузлів, FEO-діаграма), сформувати звіт за моделлю, виконати розділення та злиття моделей,
    побудувати діаграму IDEF3 та діаграму сценарію.'
- h1: Короткі теоретичні відомості
- p: CASE-засоби підтримують процеси життєвого циклу програмного забезпечення та містять графічні засоби аналізу,
    репозитарій і засоби документування. AllFusion Process Modeler (раніше BPwin) реалізує нотації IDEF0, IDEF3
    і DFD та дозволяє поєднувати їх в одній моделі.
- p: 'Згідно з лекцією «CASE-засоби структурного аналізу складної системи. Нотація IDEF0» IDEF0-модель — це набір
    погоджених діаграм, фрагментів тексту і глосарію. Контекстна діаграма (рівень А-0) подає систему як «чорну скриньку»
    з одним функціональним блоком, метою моделювання та точкою зору. Функціональний блок має чотири види стрілок
    (ICOM): вхід (зліва) — те, що перетворюється; управління (зверху) — те, що регламентує виконання; вихід (справа)
    — результат; механізм (знизу) — виконавці та засоби. Стрілка виклику використовується для розділення та злиття
    моделей. Декомпозиція розбиває функцію на підфункції, а ICOM-кодування зберігає зв’язок граничних стрілок дочірньої
    діаграми зі стрілками батьківського блоку.'
- p: 'Правила побудови IDEF0-діаграм: модель обов’язково містить контекстну діаграму А-0; блоки розташовують по
    діагоналі; неконтекстні діаграми містять від 3 до 6 блоків; імена функцій — дієслова, імена стрілок — іменники,
    всі імена унікальні; кожен блок має щонайменше одну стрілку управління й одну стрілку виходу; кількість перетинів
    і поворотів стрілок мінімізують; стрілки зі спільним джерелом об’єднують. Між блоками розрізняють зв’язки «вихід
    — вхід», «вихід — управління», «вихід — механізм» і зворотний зв’язок. Тунельовані стрілки (у круглих дужках)
    не переносяться на сусідній рівень моделі. Діаграма дерева вузлів відображає ієрархію функцій без стрілок, а
    FEO-діаграма (For Exposition Only — «тільки для експозиції») ілюструє окремий аспект моделі й не підпорядковується
    всім правилам IDEF0.'
- p: 'Відповідно до лекції «Нотації IDEF3, DFD» IDEF3 описує послідовність дій і паралелізм у вигляді сценарію процесу.
    Основна одиниця — одиниця роботи (UOW), що має номер і супровідний опис (об’єкти, факти, обмеження). Зв’язки:
    передування (суцільна стрілка), потік об’єктів (подвійна стрілка), відношення (пунктир), об’єкт посилання (лінія
    без стрілки). Перехрестя (J) бувають кон’юнкцією (асинхронне та синхронне «і», позначення &), диз’юнкцією (асинхронне
    та синхронне «або», O) та виключною диз’юнкцією (X); синхронні перехрестя позначають подвійною вертикальною
    лінією. Діаграма сценарію подає одну конкретну реалізацію процесу.'
- p: Оскільки AllFusion Process Modeler працює лише в середовищі Windows, діаграми побудовано засобами автоматизованого
    генерування відповідно до стандартів IDEF0 (FIPS PUB 183) та IDEF3; оформлення (рамка діаграми з полями «Автор»,
    «Проєкт», «Вузол», «Назва», «Номер», ICOM-коди, номери вузлів) відтворює формат звітних діаграм AllFusion Process
    Modeler.
- h1: Хід виконання роботи
  new_page: true
- h2: 1. Створення контекстної діаграми в нотації IDEF0
- p: Модель створено для умовного РЦПДО «Щит-Північ» (*навчальна умовна модель організації*, ЛР1) у цільовому стані
    після впровадження IoT-платформи «Щит-Лінк». Властивості моделі, які в AllFusion Process Modeler задаються у
    вікні Model Properties, наведено в табл. {tab:props}.

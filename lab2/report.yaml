- p: Функціональну модель верхнього рівня — карту взаємодії функцій центру із зовнішніми учасниками — подано на
    рис. {fig:map}. Кожну функцію показано згорнутим пулом; потоки повідомлень відображають інформаційні обміни,
    визначені в таблиці функціональних взаємозв’язків ЛР1. Повний цикл перехоплення проходить ланцюжком «Моніторинг
    → Призначення → Виконання місії → Оцінка результату», а функція забезпечення готовності ресурсів замикає цикл,
    повертаючи дані про готовність розрахунків.

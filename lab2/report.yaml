- p: 'Аналіз показує, що найбільше передач між доріжками має пул «Виконання місії перехоплення» (6), що відображає
    спільну роботу кількох ролей у межах однієї функції. Найінтенсивніша взаємодія відбувається між ролями «Аналітик
    повітряної обстановки» і «Оперативний черговий». Ролі командного пункту (оперативний черговий, офіцер бойового
    управління, аналітик) задіяні в трьох пулах із п’яти, що підтверджує центральну роль КП, визначену в ЛР1. Пул
    «Призначення цілі та санкціонування пуску» є вузловим: він отримує дані від трьох учасників (P1, P5, вищий КП)
    і передає завдання до P3, тому саме його автоматизація найбільше скорочує цикл «виявлення — рішення — перехоплення».'

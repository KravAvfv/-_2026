lab_number: 2
theme: Побудова моделі роботи підприємства в нотації BPMN
year: 2026
output: lab2/ЛР2_Кравченко_ІР-31.docx
blocks:
- h1: Мета роботи
- p: 'Ознайомитися з нотацією BPMN 2.0 та створити функціональну модель діяльності умовного регіонального центру
    протидронової оборони РЦПДО «Щит-Північ», визначеного в лабораторній роботі № 1: подати кожну окрему функцію
    центру як окремий пул, а ролі виконавців — як доріжки, і проаналізувати кількість пулів, доріжок і взаємозв’язків
    між ролями.'
- h1: Короткі теоретичні відомості
- p: BPMN (Business Process Model and Notation) — графічна нотація для опису бізнес-процесів у вигляді діаграм бізнес-процесів,
    зрозумілих як бізнес-аналітикам, так і розробникам інформаційних систем. Згідно з лекцією «Моделювання. Види
    діаграм» модель бізнес-процесів має допускати автоматичну перевірку коректності, формування звітів про склад
    моделі та обмін моделями між інструментальними засобами; стандарт BPMN 2.0 забезпечує це завдяки формату обміну
    BPMN XML з графічною інформацією (Diagram Interchange).
- p: 'Елементи BPMN поділяють на чотири категорії: **об’єкти потоку управління** (події, дії, логічні оператори),
    **з’єднувальні об’єкти** (потік управління, потік повідомлень, асоціації), **ролі** (пули і доріжки) та **артефакти**
    (об’єкти даних, групи, текстові анотації). Подію зображують колом: початкова — тонким контуром, проміжна — подвійним,
    завершальна — жирним; маркер усередині визначає тип події (повідомлення, таймер, сигнал, помилка, посилання,
    зупинка тощо). Дію зображують прямокутником із заокругленими кутами; маркер у лівому верхньому куті визначає
    тип завдання (користувацьке, сервісне, відправлення чи отримання повідомлення, ручне).'
- p: 'Логічні оператори (шлюзи) зображують ромбом: виключне «або» (X) спрямовує потік лише однією гілкою, паралельний
    оператор «і» (+) активує всі гілки одночасно й синхронізує їх, включне «або» (O) активує одну або кілька гілок,
    а оператор, керований подіями, обирає гілку, на якій першою відбулася подія. Потік управління (суцільна лінія)
    задає порядок дій усередині пулу; потік повідомлень (штрихова лінія з незафарбованою стрілкою) з’єднує лише
    різні пули й показує обмін інформацією між учасниками. Пул відображає учасника процесу або окрему функцію, а
    доріжка — зону відповідальності ролі всередині пулу; згорнутий пул показує зовнішнього учасника як «чорну скриньку».'
- p: 'Події-посилання (link events) використовують як міжсторінкові з’єднання: пара відповідних посилань еквівалентна
    потоку управління. У цій роботі їх застосовано, щоб розділити великі пули на частини без втрати читабельності
    діаграм.'
- h1: Хід виконання роботи
  new_page: true
- h2: 1. Створення функціональної моделі роботи підприємства в нотації BPMN
- p: 'Об’єктом моделювання є діяльність умовного РЦПДО «Щит-Північ», визначеного в лабораторній роботі № 1 (*навчальна
    умовна модель організації*). Модель описує цільовий стан («як має бути») процесів командного пункту та взаємодіючих
    підрозділів після впровадження IoT-платформи «Щит-Лінк»: завдання з маркером сервісного завдання (шестерня)
    виконуються платформою автоматично, але відповідальність за них залишається за роллю, у доріжці якої вони розміщені.'
- p: Моделі побудовано у форматі BPMN 2.0 XML з графічною інформацією (файли *.bpmn* у каталозі лабораторної роботи)
    та візуалізовано еталонним засобом bpmn-js (bpmn.io); файли можна відкрити й редагувати в будь-якому BPMN-сумісному
    редакторі (Camunda Modeler, bpmn.io). Використані елементи нотації наведено в табл. {tab:elements}.

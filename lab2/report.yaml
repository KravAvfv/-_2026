- p: Моделі збережено у форматі BPMN 2.0 XML (*.bpmn*), що забезпечує їх повторне використання та редагування в
    BPMN-сумісних засобах; розмір шрифту на діаграмах у документі — не менше 10 пт.
- h1: Висновки
  new_page: true
- p: У лабораторній роботі вивчено нотацію BPMN 2.0 і побудовано функціональну модель діяльності умовного РЦПДО
    «Щит-Північ» у цільовому стані після впровадження IoT-платформи «Щит-Лінк». Модель верхнього рівня показує взаємодію
    5 функцій центру з чотирма зовнішніми учасниками через 12 потоків повідомлень.
- p: 'Кожну функцію подано окремим пулом: моніторинг повітряної обстановки, призначення цілі та санкціонування пуску,
    виконання місії перехоплення, оцінка результату та звітність, забезпечення готовності ресурсів. Ролі в 15 доріжках
    (10 різних ролей) відповідають структурній схемі з лабораторної роботи № 1. У моделі використано 27 завдань
    п’яти типів, 22 подій (зокрема події-повідомлення, таймер і події-посилання), 13 шлюзів чотирьох типів і 3 сховища
    даних.'
- p: Аналіз виявив 21 передач відповідальності між ролями та 15 обмінів повідомленнями на детальних діаграмах; вузловою
    функцією є призначення цілі, а центральною ланкою — командний пункт. Ці результати визначають вимоги до інтерфейсів
    платформи «Щит-Лінк» і будуть використані для функціонального моделювання в нотаціях IDEF0 та IDEF3 у лабораторній
    роботі № 3.

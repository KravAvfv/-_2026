- h3: 2.1. Пул P1 «Моніторинг повітряної обстановки»
- p: Процес запускається початковою подією-повідомленням від згорнутого пулу «Сенсорна мережа». Оператор сенсорного
    поста верифікує виявлення; хибні виявлення завершуються простою завершальною подією. Підтверджене виявлення
    платформа автоматично зливає у трек (сервісне завдання) і записує до сховища треків. Аналітик класифікує ціль
    і оцінює загрозу; незагрозливі треки залишаються під спостереженням, а ворожу ціль підтверджує оперативний черговий,
    після чого завершальна подія-повідомлення передає підтверджену ціль до пулу P2. Модель подано на рис. {fig:p1}.
- h3: 2.2. Пул P2 «Призначення цілі та санкціонування пуску»
- p: Після отримання підтвердженої цілі платформа перевіряє зони заборони ураження та плани польотів дружньої авіації.
    У разі конфлікту офіцер взаємодії надсилає запит на погодження до вищого КП, а перехоплення відкладається. За
    відсутності конфлікту офіцер бойового управління обирає розрахунок-кандидат, а оперативний черговий санкціонує
    пуск за правилом двох осіб; відмова повертає процес до вибору розрахунку, дозвіл передає управління частині
    2 через подію-посилання «А». Модель подано на рис. {fig:p2a}.
- p: 'У частині 2 офіцер бойового управління надсилає бойове завдання розрахунку (завдання відправлення повідомлення)
    і через шлюз, керований подіями, очікує першої з двох подій: підтвердження прийняття від пулу P3 або спрацювання
    таймера через 15 с. У першому випадку платформа фіксує призначення, у другому оперативний черговий обирає резервний
    розрахунок і завдання надсилається повторно. Модель подано на рис. {fig:p2b}.'
- h3: 2.3. Пул P3 «Виконання місії перехоплення»
- p: Командир розрахунку оцінює можливість виконання отриманого завдання та надсилає до пулу P2 або підтвердження
    прийняття (проміжна подія відправлення повідомлення), або відмову (завершальна подія-повідомлення). Після прийняття
    паралельний шлюз одночасно запускає підготовку маршруту й каналу керування оператором і передпольотний контроль
    технікою; синхронізуючий шлюз чекає завершення обох гілок, після чого подія-посилання «Б» передає управління
    частині 2. Модель подано на рис. {fig:p3a}.
- p: Оператор здійснює пуск і виводить перехоплювач на ціль; телеметрія записується до архіву. Якщо ціль виявлено,
    оператор підтверджує її у фазі наведення (людина в контурі управління); в іншому разі командир одразу доповідає
    про результат. Доповідь надсилається до пулу P4, після чого технік повертає або списує перехоплювач. Модель
    подано на рис. {fig:p3b}.
- h3: 2.4. Пул P4 «Оцінка результату та звітність»
- p: 'Отримавши доповідь, платформа збирає докази (відео та дані сенсорів), аналітик встановлює оцінку результату
    й зберігає її в архіві місій. Включний шлюз активує одну або дві гілки: звіт вищому КП надсилається завжди,
    а повідомлення ДСНС про місце падіння — лише за наявності уламків; другий включний шлюз синхронізує активовані
    гілки. Модель подано на рис. {fig:p4}.'
- h3: 2.5. Пул P5 «Забезпечення готовності ресурсів»
- p: Після завершення місії командир розрахунку доповідає про витрату й стан техніки, технік технічної служби проводить
    післяпольотний контроль і за потреби ремонтує або списує техніку. Платформа оновлює облік запасів і готовності;
    якщо запас нижчий за норму, логіст надсилає заявку постачальнику. Модель подано на рис. {fig:p5}.

- h2: 3. Структурна схема підприємства
  new_page: true
- p: Організаційна структура центру лінійно-функціональна (рис. {fig:org}). Начальнику центру підпорядковані заступник
    з бойового управління, заступник з технічного забезпечення, відділ аналітики, планування та звітності, навчально-тренувальний
    відділ і сектор взаємодії. Заступнику з бойового управління підпорядковані командний пункт, відділ розвідки
    повітряного простору та сенсорних мереж і підрозділ дронів-перехоплювачів; заступнику з технічного забезпечення
    — служба зв’язку та ІТ, технічна служба і служба логістики. Досліджуваним підрозділом обрано **командний пункт
    (КП)** — оперативний черговий центр, через який проходять усі інформаційні потоки бойового управління.

- h2: 4. Роботи, що виконуються в досліджуваному підрозділі
  new_page: true
- p: 'Командний пункт працює в режимі цілодобового бойового чергування. Послідовність робіт протягом зміни подано
    на рис. {fig:kpflow} у вигляді текстового алгоритму:'
- numbered:
  - 'приймання зміни: оперативний черговий перевіряє стан сенсорної мережі, каналів зв’язку, готовність розрахунків
    і запаси перехоплювачів на позиціях, отримує розпорядження вищого командного пункту;'
  - 'моніторинг повітряної обстановки: аналітик веде картину повітряного простору, оцінює покриття сенсорами та
    отримує попередження від суміжних центрів;'
  - 'отримання та верифікація виявлень: донесення акустичних вузлів, РЛС, оптико-електронних постів і спостерігачів
    зіставляються, дублікати об’єднуються в єдиний трек;'
  - 'класифікація цілі та оцінка загрози: визначаються тип і належність цілі, звіряються плани польотів дружньої
    авіації, розраховується пріоритет за часом підльоту до об’єктів прикриття; хибні цілі знімаються із супроводу;'
  - 'призначення розрахунку та санкціонування пуску: офіцер бойового управління обирає розрахунок, оперативний черговий
    санкціонує пуск, завдання передається розрахунку;'
  - 'супровід місії: КП передає розрахунку уточнені дані про ціль, контролює хід перехоплення і за потреби скасовує
    місію;'
  - 'оцінка результату та доповідь: фіксуються результат, докази і місце падіння уламків, доповідь надсилається
    вищому командному пункту, після чого КП повертається до моніторингу наступних цілей;'
  - 'облік витрати ресурсу та передача зміни: оформлюються журнал бойового чергування, витрата перехоплювачів і
    заявки на поповнення.'

- p: 'Об’єктом WBS-аналізу є проект «Створення IoT-платформи „Щит-Лінк“». Проект триває з 02.11.2026 до 29.10.2027
    (12 місяців) і охоплює стадії створення автоматизованої системи за ГОСТ 34.601-90: формування вимог і технічне
    завдання, проєктування, розроблення підсистем, введення в дію. Робочу структуру проекту побудовано за **продуктовим
    принципом**: другий рівень утворюють субпроекти, що відповідають підсистемам платформи, а також інтегровані
    роботи, спільні для всіх підсистем, — управління проектом, обстеження, інфраструктура та впровадження. Структура
    має чотири рівні: 1 — проект; 2 — субпроекти (8); 3 — блоки робіт (20); 4 — робочі пакети (38).'

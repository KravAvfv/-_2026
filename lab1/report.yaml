lab_number: 1
theme: Вибір об’єкту дослідження. Формулювання задач, які потребують автоматизації. Побудова дерева цілей автоматизованої
  системи. Проведення WBS-аналізу
year: 2026
output: lab1/ЛР1_Кравченко_ІР-31.docx
blocks:
- h1: Мета роботи
- p: Дослідити функції підприємства, описати роботи та взаємодії його підрозділів на прикладі умовного регіонального
    центру протидронової оборони; сформулювати задачі, які потребують автоматизації в межах теми «Проєктування розподіленої
    IoT-системи обміну телеметрією та координації дронів-перехоплювачів»; навчитися будувати дерево цілей автоматизованої
    системи та виконати структуризацію проекту її створення відповідно до WBS-аналізу.
- h1: Короткі теоретичні відомості
- p: 'Підприємство є самостійним суб’єктом господарювання, що систематично здійснює виробничу, науково-дослідну
    або іншу діяльність. Воно складається з виробничих і функціональних структурних підрозділів, функції, права
    та обов’язки яких визначаються положеннями про них. Структурна схема підприємства відображає основні підрозділи,
    їхнє призначення та підпорядкування: елементарні функціональні ланки зображують прямокутниками, а зв’язки підпорядкування
    — суцільними лініями зі стрілками. Для опису роботи підрозділу визначають виконувані роботи, ролі працівників
    і таблицю взаємодії, у якій показують інформаційні та матеріальні потоки, що надходять до підрозділу і виходять
    з нього.'
- p: 'Дерево цілей — наочне графічне зображення підпорядкованості та взаємозв’язку цілей, яке демонструє розподіл
    генеральної мети (місії) на підцілі, завдання й окремі дії. Основна ідея його побудови — декомпозиція. Згідно
    з лекцією «Планування проекту» до дерева цілей висувають такі вимоги: цілі кожного рівня мають бути порівнянні
    за масштабом і значенням; формулювання повинні допускати кількісну та якісну оцінку досягнення; має забезпечуватися
    повнота редукції, тобто сукупність підцілей повністю описує ціль вищого рівня; цілі описують бажані результати,
    а не способи їх отримання; підцілі одного рівня незалежні одна від одної; між рівнями відсутні суперечності;
    декомпозиція на всіх рівнях виконується за одним методологічним підходом, а завершується формулюванням заходів,
    що є альтернативними способами досягнення цілей.'
- p: 'Для побудови дерева цілей застосовують два основні методи. Метод дезагрегації цілей використовують для формалізованих
    цілей, що характеризують реально існуючі або створювані об’єкти: генеральна ціль (система, код «0») поділяється
    на функціонально значущі підсистеми першого рівня, які не містять альтернатив, а другий і нижчі рівні містять
    основні та альтернативні елементи («і/або»-дерево). Метод забезпечення необхідних умов (В. М. Глушков) передбачає,
    що експерти формулюють умови, необхідні для досягнення мети, і на кожному наступному рівні конкретизують їх
    у термінах робіт.'
- p: 'Ієрархічна структура робіт (WBS, Work Breakdown Structure) — ієрархічна структура, побудована для логічного
    розподілу всього обсягу робіт проекту і подана в графічному вигляді. Кожен елемент WBS є частиною проекту, до
    якої можна застосувати планування, управління і контроль; елементом найнижчого рівня є робочий пакет, що має
    обсяг робіт, відповідального виконавця, бюджет, потрібні ресурси та дати початку й завершення. Основні етапи
    розробки WBS: визначення ступеня деталізації робіт; визначення кількості рівнів (оптимально чотири); розробка
    структури кожного рівня; опис елементів; формування системи кодування; проведення зворотних обчислень (агрегування
    витрат знизу догори). Рівні формують за продуктами (субпроектами), фазами проекту, місцем виконання робіт або
    центрами затрат; під час розробки дотримуються правил результативності, агрегації, логічності, унікальності
    та гнучкості.'
- p: Об’єкт дослідження цієї роботи — розподілена система класу інформаційно-управляючих. Відповідно до лекцій «Архітектура
    ІС» та «Інфраструктура інформаційно-управляючих систем» вона поєднує рівень сприйняття (сенсори та вбудоване
    програмне забезпечення), мережевий та периферійний рівень (шлюзи, брокери повідомлень), прикладний рівень (сервіси
    обробки даних) і рівень користувача (людино-машинний інтерфейс, мнемосхеми), а за способом управління належить
    до інтерактивних систем супервізорного управління, у яких оператор видає цілевказівки, а автоматика виконує
    відповідні програми.
- h1: Хід виконання роботи
  new_page: true
- h2: 1. Вибір об’єкту дослідження
- p: Відповідно до теми «Проєктування розподіленої IoT-системи обміну телеметрією та координації дронів-перехоплювачів»
    об’єктом дослідження обрано діяльність регіонального центру протидронової оборони з виявлення, супроводу та
    перехоплення повітряних цілей — ударних і розвідувальних безпілотних літальних апаратів (БпЛА) — дронами-перехоплювачами.
    Предметом дослідження є процеси збору, передавання та злиття телеметрії, а також координації розрахунків перехоплювачів,
    що підлягають автоматизації. Інформаційна система, яка проєктується в межах циклу лабораторних робіт, отримала
    умовну назву **IoT-платформа «Щит-Лінк»**.
- p: '*Примітка: РЦПДО «Щит-Північ» є навчальною умовною моделлю організації; усі назви, процеси та структури наведено
    суто з навчально-ілюстративною метою для проєктування інформаційної системи.*'
- p: Актуальність теми зумовлена масовим застосуванням ударних БпЛА, значна частина яких летить на гранично малих
    висотах, що ускладнює їх виявлення радіолокаційними засобами. Ефективне протистояння потребує поєднання розподіленої
    мережі акустичних, радіолокаційних та оптико-електронних сенсорів із мобільними розрахунками дронів-перехоплювачів,
    а отже — інформаційної системи, яка в реальному часі об’єднує дані від сотень пристроїв і скорочує час від виявлення
    цілі до її перехоплення.
- h2: 2. Загальні відомості про підприємство
  new_page: true
- p: Основні відомості про умовний центр наведено в табл. {tab:general}. РЦПДО «Щит-Північ» забезпечує прикриття
    об’єктів критичної інфраструктури та населених пунктів у визначеній зоні відповідальності, працює цілодобово
    в змінному режимі та взаємодіє з Повітряними силами, суміжними центрами, ДСНС і військовими адміністраціями.

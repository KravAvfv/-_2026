    шрифту в документі — не менше 10 пт, роздільна здатність зображень — не менше 300 точок на дюйм.'
- h1: Висновки
  new_page: true
- p: 'У лабораторній роботі досліджено діяльність умовного регіонального центру протидронової оборони РЦПДО «Щит-Північ»:
    подано загальні відомості, побудовано структурну схему з дев’ятьма підрозділами, описано роботи командного пункту
    у вигляді алгоритму з восьми кроків, визначено задачі та функції підрозділів і складено таблицю функціональних
    взаємозв’язків командного пункту з вісьмома підрозділами.'
- p: На основі аналізу сформульовано десять задач, які потребують автоматизації, — від збору та нормалізації телеметрії
    до управління доступом і аудиту; вони визначають функціональний склад IoT-платформи «Щит-Лінк».
- p: 'Методом дезагрегації побудовано дерево цілей системи з чотирма рівнями: генеральна мета, 5 цілей першого рівня,
    15 вимірюваних цілей другого рівня та 40 заходів третього рівня, серед яких виділено альтернативні варіанти
    («і/або»-дерево). Дерево відповідає вимогам повноти редукції, незалежності підцілей і єдності методологічного
    підходу.'
- p: 'Виконано WBS-аналіз проекту «Створення IoT-платформи „Щит-Лінк“»: за продуктовим принципом побудовано чотирирівневу
    структуру з 8 субпроектами, 20 блоками та 38 робочими пакетами з ієрархічним кодуванням; для кожного пакета
    визначено відповідального, тривалість і бюджет, а зворотними обчисленнями отримано загальний бюджет 29 330 тис.
    грн при тривалості проекту 12 місяців. Отримані результати є основою для побудови моделей бізнес-процесів у
    наступних лабораторних роботах.'

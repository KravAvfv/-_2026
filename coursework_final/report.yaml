- structural: ВСТУП
- p: Протидія ударним безпілотним літальним апаратам (БпЛА) стала одним із ключових завдань захисту критичної інфраструктури
    України. За даними Defense News, у 2025 році в Україні вироблено 100 тис. дронів-перехоплювачів вартістю 3–5 тис. дол.
    США (ракета Patriot — понад 3 млн дол.), у лютому 2026 року вони збивали понад 70 % БпЛА типу Shahed над столицею, а основним
    обмеженням названо сенсори {cite:defnews}. Масове застосування перехоплювачів потребує інформаційної системи, яка в реальному
    часі об’єднує дані розподіленої мережі сенсорів, допомагає обрати розрахунок, зберігає за людиною рішення на пуск і враховує
    результати, що зумовлює актуальність теми.
- p: Об’єкт дослідження — діяльність умовного регіонального центру протидронової оборони РЦПДО «Щит-Північ» з виявлення, супроводу
    та перехоплення повітряних цілей. Предмет дослідження — процеси збору, передавання та злиття телеметрії і координації
    розрахунків дронів-перехоплювачів, що автоматизуються IoT-платформою «Щит-Лінк».
- p: 'Мета роботи — розробити проєкт розподіленої IoT-системи обміну телеметрією та координації дронів-перехоплювачів, яка
    забезпечує безпеку повітряного простору на території, що її покриває система. Відповідно до методичних вказівок {cite:metod|с.
    6–7} поставлено завдання: 1) дослідити предметну область і діяльність центру; 2) визначити проблеми та процеси для автоматизації;
    3) побудувати дерево цілей і WBS; 4) виконати функціональне моделювання в нотації BPMN; 5) виконати об’єктно-орієнтоване
    проєктування засобами UML; 6) спроєктувати архітектуру, ролі та взаємодію компонентів; 7) розробити прототип для всіх
    категорій користувачів.'
- p: 'Практичне значення — узгоджений набір моделей і працюючий прототип (веб-застосунок і PostgreSQL) з ядром бізнес-правил:
    життєвий цикл бойового завдання з правилом двох осіб, рольовий доступ і незмінний журнал аудиту. Примітка: РЦПДО «Щит-Північ»
    та IoT-платформа «Щит-Лінк» є умовними навчальними моделями.'
- chapter:
  - 1
  - АНАЛІЗ ТА ОПИС ОБ’ЄКТА ДОСЛІДЖЕННЯ. ПОСТАНОВКА ЗАДАЧІ НА ПРОЄКТУВАННЯ
- h2: 1.1 Аналіз об’єкта дослідження
- p: Об’єктом дослідження є умовний регіональний центр протидронової оборони РЦПДО «Щит-Північ», який забезпечує прикриття
    об’єктів критичної інфраструктури та населених пунктів. Призначення центру — виявлення, супровід і перехоплення повітряних
    цілей (ударних і розвідувальних БпЛА) у зоні відповідальності; зона відповідальності — 3 райони області, ≈ 9 000 км²,
    14 об’єктів критичної інфраструктури. Центр працює цілодобово; 3 зміни по 8 год, у періоди масованих атак — 2 зміни по
    12 год; чисельність персоналу — ≈ 160 осіб. Сенсорна мережа включає 120 акустичних сенсорів, 4 малогабаритні РЛС, 12 оптико-електронних
    постів, сили перехоплення — 18 розрахунків дронів-перехоплювачів на 9 позиціях; запас 300–600 перехоплювачів.
- p: Організаційна структура центру лінійно-функціональна (рисунок {fig:org}). Начальнику центру підпорядковані заступник
    з бойового управління (командний пункт, відділ розвідки повітряного простору, підрозділ дронів-перехоплювачів), заступник
    з технічного забезпечення (служба зв’язку та ІТ, технічна служба, служба логістики), відділ аналітики, навчально-тренувальний
    відділ і сектор взаємодії.
- figure:
    id: org
    src: coursework_final/diagrams/01_org_structure.mmd
    caption: Організаційна структура умовного РЦПДО «Щит-Північ»
- p: 'Досліджуваним підрозділом обрано командний пункт (КП) — оперативний черговий центр, через який проходять усі інформаційні
    потоки бойового управління. Його персонал: оперативний черговий (ОЧ) керує зміною, підтверджує класифікацію цілей і санкціонує
    пуски; офіцер бойового управління (ОБУ) обирає розрахунки і формує бойові завдання; аналітик повітряної обстановки веде
    треки і класифікує цілі; офіцер взаємодії обмінюється обстановкою з Повітряними силами. КП одержує від підрозділів розвідки,
    забезпечення і взаємодії дані про обстановку і ресурси, а підрозділу дронів-перехоплювачів передає бойові завдання.'
- p: 'Основні бізнес-процеси центру (у дужках — відповідальний виконавець): BP-01 реєстрація та контроль стану сенсорних вузлів
    (технік (технічна служба)); BP-02 прийом і нормалізація телеметрії та виявлень (периферійний шлюз (автоматично)); BP-03
    злиття виявлень і формування треків (аналітик повітряної обстановки); BP-04 класифікація цілі та оцінка загрози (аналітик
    повітряної обстановки); BP-05 підбір і призначення розрахунку, санкціонування пуску (офіцер бойового управління; оперативний
    черговий); BP-06 виконання та супровід місії перехоплення (командир розрахунку; оператор перехоплювача); BP-07 оцінка
    результату та звітність про перехоплення (командир розрахунку; аналітик); BP-08 облік готовності, обслуговування та логістика
    (технік; логіст); BP-09 деконфлікція повітряного простору (офіцер взаємодії); BP-10 робота в деградованому режимі (периферійний
    шлюз; командир розрахунку); BP-11 аналітика та звітність (аналітик ефективності); BP-12 управління доступом і кібербезпека
    (адміністратор системи; офіцер кібербезпеки). Процеси BP-03…BP-07 утворюють ланцюжок «виявлення — рішення — перехоплення
    — оцінка».'
- p: 'Перелік робіт командного пункту протягом зміни: 1) приймання зміни, перевірка стану сенсорної мережі, каналів зв’язку,
    готовності розрахунків і запасів; 2) моніторинг повітряної обстановки, верифікація виявлень і об’єднання дублікатів у
    трек; 3) класифікація цілі та оцінка загрози з урахуванням часу підльоту до об’єктів прикриття; 4) призначення розрахунку
    (ОБУ) і санкціонування пуску (ОЧ), супровід і, за потреби, скасування місії; 5) оцінка результату, доповідь вищому командному
    пункту, облік витрати ресурсу, передача зміни.'
- h2: 1.2 Основні функції підприємства
- p: 'Основні функції структурних підрозділів центру: командний пункт — моніторинг треків, підтвердження класифікації, призначення
    цілей розрахункам; відділ розвідки повітряного простору та сенсорних мереж — експлуатація сенсорної мережі, верифікація
    виявлень, калібрування сенсорів; підрозділ дронів-перехоплювачів — підтримання готовності, підготовка до пуску, пілотування
    і супровід; служба зв’язку та ІТ — адміністрування платформи, резервування каналів, керування ключами і сертифікатами;
    технічна служба — передпольотний і післяпольотний контроль, ремонт, облік ресурсу АКБ; служба логістики — облік запасів,
    розподіл по позиціях, заявки на поповнення; відділ аналітики, планування та звітності — аналіз результатів, розрахунок
    показників ефективності, добові та місячні звіти; навчально-тренувальний відділ — курси операторів, тренування на симуляторі,
    атестація; сектор взаємодії — обмін обстановкою з ПС ЗСУ і суміжними центрами, погодження польотів дружньої авіації, інформування
    військових адміністрацій і ДСНС.'
- p: Інформаційні потоки між підрозділами поділяються на потоки обстановки (виявлення, треки, донесення, плани польотів дружньої
    авіації), управління (бойові завдання, дозвіл або заборона пуску, команди скасування), готовності (стан розрахунків, справність
    техніки, залишки перехоплювачів), звітні (доповіді про результат, журнали чергування) і службові (стан каналів, інциденти,
    права доступу). Функціональні взаємозв’язки КП з іншими підрозділами наведено в таблиці {tab:links}.
- p: 'Командний пункт взаємодіє з усіма вісьмома підрозділами; найінтенсивніший обмін — з відділом розвідки (вхідні виявлення)
    і підрозділом дронів-перехоплювачів (вихідні завдання, вхідні доповіді). Саме ці обміни нині виконуються голосом і через
    різнорідні канали, тому вони першочергові для автоматизації. Між іншими підрозділами: дрони-перехоплювачі → логістика
    (витрата), технічна служба ↔ логістика (запаси, справність), усі → аналітика (журнали). Основні задачі персоналу: ОЧ —
    керування зміною і санкціонування пусків; ОБУ — вибір розрахунку і контроль виконання; аналітик — ведення треків і класифікація;
    командир розрахунку — прийняття завдання, пуск, доповідь; технік і логіст — облік техніки та запасів; адміністратор і
    офіцер кібербезпеки — облікові записи та аудит.'

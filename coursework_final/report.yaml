- p: 'Розмежування обов’язків: ОБУ пропонує місію, а санкціонує ОЧ, який не є її автором; адміністратор не має бойових прав;
    офіцер кібербезпеки читає журнал аудиту і блокує облікові записи, але не змінює журнал. Механізми безпеки: автентифікація
    й авторизація (вхід за паролем, RBAC), шифрування каналів (TLS, WireGuard), захист API (ключ шлюзу, валідація), контроль
    доступу до даних (застосунок підключається від ролі shch_app без прав суперкористувача, тож стан місії без автентифікованого
    користувача змінити не можна), журналювання (журнал аудиту, до якого роль застосунку може лише додавати записи).'
- h2: 3.7 Механізми взаємодії користувачів із системою
- p: 'Вхід виконується за логіном і паролем; паролі зберігаються лише як хеш функції generate_password_hash бібліотеки Werkzeug
    (типовий метод scrypt) {cite:werkzeug}. Після п’яти невдалих спроб обліковий запис блокується, після 15 хв бездіяльності
    сеанс завершується. Форми, що змінюють дані, містять маркер, який звіряється з маркером у сеансі (захист від підробки
    запитів), а шаблонізатор автоматично екранує дані {cite:flask}. Недоступні ролі дії не показуються; спробу відкрити чужу
    сторінку застосунок відхиляє відповіддю 403, запит до API без ключа шлюзу — відповіддю 401, а недозволений перехід стану
    місії відхиляє тригер СКБД, і застосунок показує причину. Машинні клієнти використовують REST API з ключем шлюзу: POST
    /api/v1/detections — передавання виявлення, GET /api/v1/threats — черга загроз у форматі JSON.'
- chapter:
  - 4
  - СТВОРЕННЯ ПРОТОТИПУ СИСТЕМИ
- h2: 4.1 Засоби прототипування
- p: 'Методичні вказівки рекомендують Figma, Adobe XD, Penpot або інші аналогічні інструменти {cite:metod|с. 17}. Прототип
    створено як працюючий веб-застосунок над PostgreSQL, що показує і екрани, і логіку роботи (переходи станів, перевірку
    прав, відмови з причиною) для ядра системи (таблиця {tab:spec_fr}). Засоби: PostgreSQL 18.6, Python 3.14.7, Flask 3.1.1,
    Jinja2 3.1.6, psycopg 3.2.10, pytest 9.1.1; знімки екрана зроблено з працюючого застосунку.'
- h2: 4.2 Карта навігації
- p: 'Карту навігації наведено на рисунку {fig:nav}: після входу користувач потрапляє на головну сторінку, з якої переходить
    до модулів; у дужках зазначено ролі, яким модуль доступний (обчислено з матриці прав).'
- figure:
    id: nav
    src: coursework_final/diagrams/40_navmap.png
    caption: Карта навігації інформаційної системи
- h2: 4.3 Сторінка авторизації та головна сторінка
- p: 'Сторінка авторизації (рисунок {fig:s01_login}) містить форму введення логіна і пароля та нагадування про блокування
    і тайм-аут сеансу. Сценарій: користувач вводить облікові дані; у разі помилки бачить повідомлення «Неправильний логін
    або пароль…», після п’ятої — повідомлення про блокування.'
- figure:
    id: s01_login
    src: coursework_final/diagrams/screens/s01_login.png
    caption: Сторінка авторизації
- p: 'Головна сторінка (рисунок {fig:s02_home_och}) має однакову структуру для всіх ролей: меню модулів ролі, поле пошуку,
    ім’я користувача, плитки модулів і віджети. Для ОЧ показано найвищі загрози, місії, що очікують санкції, готовність ресурсів
    і підсумок місій за 30 діб.'
- figure:
    id: s02_home_och
    src: coursework_final/diagrams/screens/s02_home_och.png
    caption: Головна сторінка оперативного чергового
- h2: 4.4 Основні функціональні модулі
- p: 'Модуль «Обстановка» (рисунок {fig:s03_situation}) — сторінка перегляду: ключові показники, мнемосхема району (об’єкти
    прикриття, позиції, активні цілі) і черга загроз за спаданням оцінки. Сценарій: ОБУ оцінює обстановку, відкриває картку
    треку і пропонує місію обраному розрахунку.'
- figure:
    id: s03_situation
    src: coursework_final/diagrams/screens/s03_situation.png
    caption: 'Сторінка «Повітряна обстановка»: мнемосхема і черга загроз'
- p: Картка місії (рисунок {fig:s08_launched}) показує ціль, розрахунок, авторів пропозиції і санкції, хронологію подій і
    лише дозволені ролі дії. Місія М-1024-03 розрахунку «Орлан-3» пройшла в демонстраційному прогоні весь цикл і закрита з
    оцінкою «влучання».
- figure:
    id: s08_launched
    src: coursework_final/diagrams/screens/s08_launched.png
    caption: Картка місії в інтерфейсі командира розрахунку (R-04) під час виконання
- p: 'Сторінка «Місії» (рисунок {fig:s10_missions_filter}) — приклад сторінки пошуку і фільтрації: відбір за номером, станом,
    розрахунком і періодом; глобальний пошук у заголовку показує лише записи з розділів, доступних ролі.'
- figure:
    id: s10_missions_filter
    src: coursework_final/diagrams/screens/s10_missions_filter.png
    caption: Сторінка «Місії» з фільтрацією
- p: 'Форма введення ручного донесення (рисунок {fig:s12_detection_form}) призначена оператору поста спостереження: вона перевіряє
    діапазони значень і передає донесення до тієї самої функції fn_ingest_detection, що й REST API шлюзу.'
- figure:
    id: s12_detection_form
    src: coursework_final/diagrams/screens/s12_detection_form.png
    caption: Форма введення ручного донесення
- p: Форма редагування перехоплювача (рисунок {fig:s15_interceptor_edit}) змінює модель, позицію, стан і версію прошивки;
    спроба видалити перехоплювач, використаний у місіях, відхиляється з поясненням причини. Аналогічні форми мають модулі
    «Сенсори» (лише допустимі переходи стану), «Об’єкти прикриття» та «Облікові записи».
- figure:
    id: s15_interceptor_edit
    src: coursework_final/diagrams/screens/s15_interceptor_edit.png
    caption: Форма редагування перехоплювача
- h2: 4.5 Інтерфейси користувачів за ролями
- p: 'Пункти меню, плитки головної сторінки і доступні дії кожної ролі визначаються матрицею прав (таблиця {tab:rights}).
    Екрани ролей R-01, R-02, R-04, R-06, R-08 наведено на рисунках {fig:s02_home_och}–{fig:s15_interceptor_edit}, решти ролей
    — на рисунках {fig:s28_roles_a} і {fig:s28_roles_b} (заголовок і верх робочого екрана): R-03 класифікує ціль у картці
    треку, R-05 переглядає місії з фільтром, R-07 веде реєстр сенсорів, R-09 розраховує показники за період, R-10 змінює матрицю
    прав, R-11 переглядає журнал аудиту з перевіркою ланцюжка хешів, R-12 веде об’єкти прикриття, R-13 переглядає обстановку,
    місії й аналітику.'
- figure:
    id: s28_roles_a
    src: coursework_final/diagrams/screens/s28_roles_a.png
    caption: Робочі екрани ролей R-03, R-05, R-07 і R-09
- figure:
    id: s28_roles_b
    src: coursework_final/diagrams/screens/s28_roles_b.png
    caption: Робочі екрани ролей R-10, R-11, R-12 і R-13
- h2: 4.6 Перевірка прототипу
- p: 'Тести pytest (правила БД, доступ 13 ролей, REST API, відповідність діаграм коду): виконано 51 тест, усі успішні (час
    виконання 6,21 с). Медіана обробки виявлення через REST API — 8,6 мс (50 запитів).'
- structural: ВИСНОВКИ
- p: 'У курсовій роботі розроблено проєкт розподіленої IoT-системи обміну телеметрією та координації дронів-перехоплювачів,
    спрямованої на забезпечення безпеки повітряного простору на території, яку покриває система. Мету досягнуто: пройдено
    всі етапи проєктування — від аналізу предметної області до працюючого прототипу. Основні результати:'
- list:
  - проаналізовано діяльність центру, 12 бізнес-процесів і взаємозв’язки командного пункту з вісьмома підрозділами; визначено
    7 проблем і 22 функціональні вимоги;
  - побудовано на одній схемі дерево цілей (генеральна мета, 5 цілей першого рівня, 15 — другого, 30 заходів) і WBS проєкту
    (8 субпроєктів, 42 робочі пакети, бюджет 29 330 тис. грн);
  - виконано функціональне моделювання в нотації BPMN 2.0.2 і побудовано UML-діаграми варіантів використання, діяльності,
    послідовності та класів зі специфікаціями прецедентів;
  - обґрунтовано розподілену багаторівневу клієнт-серверну архітектуру з периферійними обчисленнями, побудовано схеми програмної,
    апаратної архітектури, мережевої взаємодії і взаємодії компонентів, визначено 13 ролей і таблицю прав доступу;
  - створено працюючий прототип (20 таблиць, 22 функції і 16 тригерів PostgreSQL, веб-застосунок з 27 маршрутами, інтерфейсами
    для кожної ролі, формами введення, редагування, перегляду, пошуку і фільтрації); 51 автоматизований тест виконується успішно.
  style: dash
- p: 'Переваги системи: правила виконуються тригерами СКБД, а застосунок працює без прав суперкористувача; кожна дія фіксується
    в незмінному журналі аудиту; рішення на пуск ухвалює людина, а перепризначення потребує нової санкції. Напрями розвитку:
    периферійні шлюзи з адаптерами MQTT, ASTERIX і MAVLink та автономною роботою; автоматична деконфлікція з планами польотів;
    доставка завдання на планшет із тайм-аутом підтвердження; сповіщення; другий фактор автентифікації; геореплікація ядра.'
- refs: true

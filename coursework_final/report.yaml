    src: coursework_final/diagrams/21_uc_support.png
    caption: 'Діаграма варіантів використання: забезпечення та адміністрування'
- h3: 2.2.2 Діаграма діяльності
- p: 'Діаграма діяльності подає граф дій, переходи між якими відбуваються після їх завершення {cite:l6|с. 27}, і деталізує
    алгоритмічну реалізацію операцій {cite:izm|с. 73}. Діаграма (рисунок {fig:act}) охоплює всі 8 переходів mission_transition:
    ОЧ санкціонує або відхиляє місію; за відмови розрахунку ОЧ перепризначає його, і санкціонує інший ОЧ; після пуску місію
    скасовують (також ОЧ або ОБУ) або командир доповідає результат, і trg_report_after її закриває. Кожен перехід, зокрема
    відхилення і повторну санкцію, перевіряє trg_mission_guard, правило двох осіб — CHECK.'
- figure:
    id: act
    src: coursework_final/diagrams/22_activity.puml
    caption: 'Діаграма діяльності: життєвий цикл бойового завдання'
- h3: 2.2.3 Діаграма послідовності
- p: Діаграма послідовності відображає впорядковані в часі взаємодії об’єктів {cite:l6|с. 17}. На рисунку {fig:seq} застосунок
    передає СКБД ідентифікатор користувача (set_config) і викликає серверні функції; у фрагменті alt він фіксує транзакцію
    або після помилки тригера відкочує її і показує причину.
- figure:
    id: seq
    src: coursework_final/diagrams/23_sequence.puml
    caption: Діаграма послідовності прецедентів «Запропонувати місію» та «Санкціонувати або відхилити місію»
- h3: 2.2.4 Діаграма класів
- p: 'Діаграма класів статично подає класи, їхні атрибути і відношення {cite:l6|с. 33} та моделює словник системи {cite:izm|с.
    47}. Діаграма (рисунок {fig:cls}) подає 10 класів предметної області з 20 таблиць бази даних; не показано таблиці RBAC
    (role, permission, role_permission), довідники (sector, interceptor_model), позиції (position), таблиці переходів станів,
    телеметрії (telemetry_frame) і журналу аудиту (audit_log). Показані класи збігаються з таблицями: атрибути і типи — зі
    стовпцями, кратність біля батьківського класу — з обов’язковістю зовнішнього ключа (1 або 0..1), біля дочірнього — «*»,
    а для унікального ключа — 0..1 (місія має не більше одного звіту). Два зовнішні ключі місії на користувача подано окремими
    асоціаціями «запропонував» і «санкціонував» — це і є правило двох осіб. Композиція «Місія — ПодіяМісії» означає, що події
    не існують без місії; допустимі переходи стану місії (8 переходів, кожен з правом) задано таблицею mission_transition.
    Для читабельності не показано допоміжні зовнішні ключі на користувача (air_track.classified_by, engagement_report.submitted_by,
    mission_event.actor_id).'
- h3: 2.2.5 Взаємозв’язок діаграм
- p: 'Діаграми утворюють узгоджену модель: доріжки ОБУ та ОЧ пулу P2 (рисунок {fig:p2a}) стали акторами діаграми варіантів
    використання (рисунок {fig:uc1}), а офіцер взаємодії, чиє завдання (погодження з вищим КП) прототип не автоматизує (FR-07),
    актором прототипу не є; прецеденти визначили права доступу і сторінки застосунку; діаграма діяльності (рисунок {fig:act})
    задає порядок викликів функцій і тригерів для прецедентів бойового управління, діаграма послідовності (рисунок {fig:seq})
    — маршрути застосунку та інтерфейс до СКБД, а діаграма класів (рисунок {fig:cls}) — таблиці, стовпці і зовнішні ключі,
    що обмежують цю взаємодію.'

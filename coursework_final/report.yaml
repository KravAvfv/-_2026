  - ПРОЄКТУВАННЯ МОДЕЛІ ІНФОРМАЦІЙНОЇ СИСТЕМИ
- h2: 2.1 Функціональне моделювання
- p: BPMN визначає графічну нотацію діаграм бізнес-процесів, зрозумілу і бізнес-аналітикам, і технічним фахівцям, і керівникам
    {cite:l3|с. 6}. Її елементи — об’єкти потоку управління (події, дії, логічні оператори), з’єднувальні об’єкти (потік управління,
    потік повідомлень, асоціації), ролі (пули і доріжки) та артефакти {cite:l3|с. 7}; пул відповідає учасникові процесу, а
    доріжки всередині пулу — виконавцям {cite:l3|с. 14}. Моделі побудовано у форматі BPMN 2.0.2 {cite:bpmn} з графічною інформацією,
    що дає змогу обмінюватися ними між інструментами й автоматично перевіряти {cite:l3|с. 5}.
- p: Модель описує цільовий стан процесів центру після впровадження системи. Діяльність центру подано п’ятьма пулами-функціями
    — P1 «Моніторинг повітряної обстановки», P2 «Призначення цілі та санкціонування пуску», P3 «Виконання місії перехоплення»,
    P4 «Оцінка результату та звітність», P5 «Забезпечення готовності ресурсів»; зовнішні учасники (сенсорна мережа, вищий
    командний пункт, ДСНС, постачальник) — згорнуті пули. Потоки повідомлень між ними передають виявлення цілей, підтверджену
    ціль, плани польотів і запит на погодження, бойове завдання і прийняття або відмову, доповідь і звіт про перехоплення,
    координати падіння уламків, дані про витрату, готовність розрахунків і заявки. Карту взаємодії пулів наведено на рисунку
    {fig:bmap}.

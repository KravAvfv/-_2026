- p: 'Прецедент «Санкціонувати або відхилити місію (UC5)» виконує оперативний черговий (R-01): система показує лише дозволені
    переходи стану, на які в ролі є право; тригер trg_mission_guard перевіряє перехід, а обмеження CHECK забороняє санкцію
    автором пропозиції. Прецедент «Доповісти результат» (UC8) доступний лише командиру розрахунку, якому призначено місію:
    це перевіряє тригерна функція trg_report_guard, а повторний звіт відхиляє обмеження UNIQUE.'
- p: Діаграма забезпечення та адміністрування (UC13–UC21) охоплює облік сенсорів і перехоплювачів, готовність ресурсів, об’єкти
    прикриття, показники ефективності, керування користувачами і матрицею прав, блокування облікових записів і журнал аудиту,
    а інструктор (R-13) переглядає показники ефективності для розбору навчальних місій; вхід до системи є передумовою всіх
    прецедентів обох діаграм. Її наведено на рисунку {fig:uc2}.

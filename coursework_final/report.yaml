- chapter:
  - 3
  - ПРОЄКТУВАННЯ КОМПОНЕНТІВ ДІЯЛЬНОСТІ СИСТЕМИ
- h2: 3.1 Концепція автоматизованої інформаційної системи
- p: 'За визначенням IEEE, «архітектура – це базова організація системи, яка описує зв’язки між компонентами цієї системи
    (і зовнішнім середовищем), а також визначає принципи її проектування і розвитку» {cite:l7|с. 3}. IoT-платформа «Щит-Лінк»
    належить до інтерактивних систем супервізорного управління {cite:l89|с. 162}: оператор ідентифікує ситуацію і видає цілевказівки,
    а автоматика виконує відповідні програми {cite:l89|с. 77}. Принципи концепції: розподіленість (кожна позиція має автономний
    периферійний шлюз), подієва модель (правила виконуються в момент зміни даних) і людина в контурі управління (рішення на
    пуск ухвалює ОЧ).'
- p: 'Чотирирівневу модель IoT-системи {cite:l7|с. 12} для «Щит-Лінк» розширено до п’яти рівнів: сприйняття (сенсори, перехоплювачі),
    мережевий (LoRaWAN, ЛОМ, радіоканал, магістраль), периферійний (шлюзи позицій), оброблення і зберігання (ядро в ЦОД) та
    рівень користувача (АРМ, застосунок розрахунку). Програмні компоненти периферійного рівня, рівня оброблення і зберігання
    (колонки «Оброблення» і «Зберігання») та рівня користувача показано на рисунку {fig:comp}, пристрої рівнів сприйняття
    і мережевого — на схемах апаратної архітектури і мережевої взаємодії (підрозділ 3.3).'
- h2: 3.2 Тип архітектури та її обґрунтування
- p: За способом організації ІС поділяють на системи з архітектурою файл-сервер, клієнт-сервер, багаторівневою та на основі
    інтернет-технологій {cite:rem|с. 19}; багаторівнева додає до дворівневої сервер застосунків з прикладною логікою {cite:rem|с.
    20} і робить клієнтів «тонкими» {cite:rem|с. 83}. Файл-сервер не має централізованого контролю прав, дворівнева схема
    тримає логіку в «товстих» клієнтах, мікросервіси {cite:l7|с. 25} ускладнюють експлуатацію, а периферійні обчислення потребують
    синхронізації після відновлення зв’язку.
- p: 'Обрано розподілену багаторівневу клієнт-серверну архітектуру з периферійними обчисленнями: ядро в основному і резервному
    ЦОД побудоване за трирівневою схемою «клієнт — сервер застосунку — сервер БД» {cite:kov|с. 33}, сервіси реального часу
    виносяться окремо, позиції обслуговують периферійні шлюзи. Прототип реалізує ядро як трирівневу систему «браузер — Flask-застосунок
    — PostgreSQL».'
- h2: 3.3 Програмно-апаратна архітектура
- p: 'На схемі програмної архітектури (рисунок {fig:comp}) компоненти з позначкою «прототип» реалізовано в цій роботі. Програмні
    компоненти прототипу: схема БД (db/schema.sql, 18 таблиць сутностей і 14 переліків), серверна логіка (db/impl.sql: 22
    функції, 16 тригерів, 2 представлення, 6 ролей СКБД), наповнення тестовими даними (db/seed.py), веб-застосунок (app.py,
    шаблони Jinja2, стиль) і автоматизовані тести.'
- figure:
    id: comp
    src: coursework_final/diagrams/31_components.png
    caption: Схема програмної архітектури системи
- p: 'Серверна частина: сервер застосунку виконує веб-застосунок на Python 3.14.7 і Flask 3.1.1 (сеанс, маркер форми, права,
    виклик функцій БД, формування сторінок); сервер БД PostgreSQL 18.6 зберігає дані й виконує критичні правила функціями
    і тригерами {cite:pg}. Клієнтська частина — браузер на АРМ або планшеті; периферійні шлюзи — машинні клієнти REST API.'
- p: 'Схему апаратної архітектури наведено на рисунку {fig:deploy}. Конфігурація обладнання: сервери ядра в основному і резервному
    ЦОД (від 16 ядер, 64 ГБ ОЗП, NVMe від 2 ТБ, потокова реплікація PostgreSQL); 9 периферійних шлюзів (промисловий ПК від
    4 ядер і 8 ГБ ОЗП, Ethernet, LTE, меш-радіомережа); АРМ КП з двома моніторами; планшети розрахунків; маршрутизатори з
    VPN, комутатори з VLAN, міжмережеві екрани.'
- figure:
    id: deploy
    src: coursework_final/diagrams/32_deployment.puml
    caption: Схема апаратної архітектури (діаграма розгортання)
- p: 'Прототип розгорнуто і перевірено на одному комп’ютері (Intel(R) Core(TM) Ultra 5 125H, 18 логічних процесорів, 31 ГБ
    оперативної пам’яті, ОС Linux). Схему мережевої взаємодії наведено на рисунку {fig:net}: мережа сенсорів, ЛОМ позиції,
    магістраль (тунель WireGuard поверх меш-радіомережі, LTE або супутника), мережа ЦОД за міжмережевим екраном (стрілки показують
    напрям встановлення з’єднань, обмін — двобічний; НСУ підключено до ЛОМ позиції, рисунок {fig:deploy}). Для сенсорних вузлів
    обрано легкий протокол «публікація — підписка» MQTT 5 {cite:mqtt}, для РЛС — ASTERIX, для перехоплювачів — MAVLink 2,
    для застосунків — HTTPS і WebSocket.'
- figure:
    id: net
    src: coursework_final/diagrams/33_network.png
    caption: Схема мережевої взаємодії
- h2: 3.4 Інформаційні потоки та взаємодія компонентів
- p: 'Інформаційні потоки: виявлення йдуть від сенсорів через шлюз до сервісів злиття і БД, команди користувача — від АРМ
    через ядро і шлюз позиції до НСУ і перехоплювача, аналітика читає дані з БД. Схему взаємодії компонентів прототипу наведено
    на рисунку {fig:inter}: для запиту користувача (1) обробник before_request перевіряє сеанс, тайм-аут і маркер CSRF та
    завантажує права, а функція need() в обробнику сторінки перевіряє право (2), обробник викликає функцію PL/pgSQL (3), тригери
    перевіряють правила і пишуть аудит (4), вибірки беруться з представлень (5); шлюз надсилає виявлення до REST API (6),
    яке викликає fn_ingest_detection (7).'
- figure:
    id: inter
    src: coursework_final/diagrams/34_interaction.puml
    caption: Схема взаємодії компонентів прототипу
- h2: 3.5 Опис бази даних
- p: 'База даних містить 20 таблиць: 18 таблиць сутностей і дві таблиці допустимих переходів станів (mission_transition, sensor_transition),
    згрупованих у довідники (ролі, права, сектори, моделі перехоплювачів), основні дані (об’єкти, сенсори, позиції, розрахунки,
    перехоплювачі) та операційні дані (треки, виявлення, місії, телеметрія, звіти, аудит). Після наповнення тестовими даними
    БД містить 651 виявлення, 40 треків, 30 місій і 426 записів аудиту; у тестовому наборі скорочено кількість об’єктів прикриття
    (12) і сенсорів (42), позицій — 10 (9 штатних і одна в передислокації), розрахунків — 18, перехоплювачів — 60. Цілісність
    забезпечують обмеження NOT NULL, UNIQUE, CHECK і зовнішні ключі (CHECK approved_by ≠ proposed_by реалізує правило двох
    осіб), а бізнес-правила — тригерні функції: допустимість переходів і права (trg_mission_guard, trg_sensor_guard), дії
    лише свого розрахунку (trg_mission_crew_scope, trg_report_guard), бойові права лише бойовим ролям, журнал аудиту з ланцюжком
    хешів SHA-256 і заборона його змін (trg_audit, trg_audit_immutable).'
- h2: 3.6 Ролі користувачів і права доступу
- p: 'Розмежування доступу побудовано за моделлю RBAC: людські ролі і системні ролі машинних сутностей {cite:l7|с. 17}. Визначено
    13 ролей і 21 елементарне право; ролі R-01, R-02, R-04, R-05 мають бойові права (позначено зірочкою). Таблицю прав доступу
    наведено в таблиці {tab:rights}; застосунок зчитує її з таблиці role_permission, а адміністратор редагує на сторінці «Ролі
    та права».'

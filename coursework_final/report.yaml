- h2: 1.3 Завдання на автоматизацію
- p: 'Аналіз діяльності центру виявив такі проблеми існуючої системи (у дужках — наслідки): П1 — виявлення від акустичних
    вузлів, РЛС і спостерігачів надходять різними каналами (радіо, месенджери, окремі застосунки) (дублікати та суперечливі
    треки); П2 — голосове цілевказання розрахунків по радіо (затримка 30–90 с); П3 — немає оперативних даних про готовність
    розрахунків і перехоплювачів (призначення не того розрахунку); П4 — телеметрія перехоплювачів не зберігається централізовано
    (немає аналізу місій після завершення); П5 — ризик ураження дружньої авіації та падіння уламків на населені пункти (ураження
    своїх); П6 — подавлення каналів зв’язку засобами РЕБ (втрата ситуаційної картини); П7 — паперовий облік результатів і
    витрати перехоплювачів (повільне поповнення).'
- p: 'Автоматизації підлягають процеси: збір і нормалізація телеметрії з різнотипних сенсорів і перехоплювачів; злиття виявлень
    у треки та прогноз траєкторій; підтримка класифікації та оцінки загрози; підбір розрахунку і доставка бойових завдань;
    моніторинг місії в реальному часі; облік готовності розрахунків, перехоплювачів, АКБ і запасів; деконфлікція з дружньою
    авіацією та контроль зон заборони; формування звітів про перехоплення та аналітика; оповіщення та ескалація подій; управління
    доступом, аудит і кіберзахист.'
- p: 'Функціональні вимоги сформульовано у вигляді «Система повинна …»: 22 вимоги, з них 14 високого пріоритету. Вони охоплюють
    збір і нормалізацію даних (FR-01…FR-03), обстановку й оцінку загрози (FR-04…FR-07), призначення, санкціонування і супровід
    місій (FR-08…FR-13), облік ресурсів і сповіщення (FR-14…FR-16), аналітику та інтеграцію (FR-17, FR-18, FR-21, FR-22),
    керування доступом і аудит (FR-19, FR-20). Специфікацію вимог із пріоритетами і станом реалізації в прототипі (розділ
    4) наведено в таблиці {tab:spec_fr}.'

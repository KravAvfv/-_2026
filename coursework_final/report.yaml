- p: 'Очікувані результати: призначення розрахунку до 30 с і доставка завдання до 1 с; єдина обстановка; пуск лише із санкцією
    іншої особи; облік готовності; автоматичні звіти.'
- h2: 1.4 Цілі підприємства
- p: Дерево цілей наочно показує, як місія і мета розподіляються на підцілі, завдання й окремі дії і як цілі підпорядковані
    одна одній {cite:l2|с. 7}. Головною (генеральною) метою автоматизації визначено «Забезпечення безпеки повітряного простору
    на території, яку покриває система». Безпеку повітряного простору території розуміємо як стан, за якого всі повітряні
    цілі над нею своєчасно виявляються, загрози нейтралізуються, а дружня авіація й населення не зазнають шкоди.
- p: 'Для побудови дерева обрано метод дезагрегації цілей (система, що створюється, має формалізовані цілі): перший рівень
    утворюють функціонально значущі цілі без альтернатив, другий — вимірювані цілі, третій — основні та альтернативні заходи
    («і/або»-дерево) {cite:lb1|с. 13}: суцільна рамка позначає обов’язковий захід («і»), пунктирна — альтернативні варіанти
    з кодами «а»/«б» («або»), з яких під час проєктування обирають один. Усе дерево подано на одній схемі (рисунок {fig:gt}).'
- p: 'Взаємозв’язки між цілями такі. Ціль 1 (обізнаність про обстановку) є інформаційною основою для цілі 2 (нейтралізація
    загроз): без достовірних треків неможливо вчасно призначити розрахунок. Ціль 4 (готовність сил і засобів) забезпечує ціль
    2 готовими розрахунками і перехоплювачами. Ціль 3 (безпека дружньої авіації та населення) обмежує застосування сил — звірка
    з планами польотів, зони заборони ураження, рішення на пуск ухвалює людина. Ціль 5 (стійка та захищена робота системи)
    є умовою досягнення всіх інших і замикає контур вдосконалення. Дерево має 1 генеральну мету, 5 цілей першого рівня, 15
    цілей другого рівня та 30 заходів третього рівня і відповідає вимогам до побудови дерева цілей {cite:l2|с. 8}: порівнянність
    цілей одного рівня, повнота редукції, незалежність підцілей, єдиний методологічний підхід. Критерії досягнення цілей:
    0 — частка нейтралізованих повітряних загроз серед виявлених над територією ≥ 90 %; відсутність уражень дружніх повітряних
    суден і цивільних об’єктів власними засобами; 1 — доступність сенсорів ≥ 97 %; частка хибних тривог ≤ 5 %; 2 — час «підтвердження
    треку — призначення» ≤ 30 с; доставка завдання ≤ 1 с; 3 — 0 уражень дружніх суден; 100 % пусків із санкцією другої особи;
    4 — частка розрахунків у готовності ≥ 80 %; запас на позиціях ≥ 2 ночей; 5 — доступність ядра 99,95 %; 100 % команд в
    аудиті; звіт ≤ 15 хв.'

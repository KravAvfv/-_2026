    caption: Пул «Призначення цілі та санкціонування пуску» (частина 2)
- p: Учасники пулу P2 — доріжки офіцера взаємодії, ОБУ та ОЧ. Частина 1 запускається подією-повідомленням «Ціль отримано»
    від пулу P1; сервісне завдання перевіряє зони заборони ураження та плани польотів, і виключний шлюз «Конфлікт?» спрямовує
    процес до офіцера взаємодії (погодження з вищим КП) або до ОБУ, який обирає розрахунок-кандидат; ОЧ санкціонує пуск за
    правилом двох осіб, а шлюз «Дозволено?» при відмові повертає процес до вибору розрахунку. У частині 2 ОБУ передає бойове
    завдання до пулу P3 і через шлюз, керований подіями, очікує прийняття або таймера «15 с без відповіді» (відмову розрахунку
    діаграма окремо не моделює — процес чекає таймера), після чого ОЧ обирає резервний розрахунок (санкцію іншим ОЧ деталізує
    підрозділ 2.2.2). Карта на рисунку 2.1 узагальнює потоки всіх пулів; плани польотів і готовність розрахунків P2 використовує
    як дані сервісних завдань. Прототип реалізує завдання, які виконують люди; не реалізовано перевірку зон заборони і планів
    польотів (FR-07), таймер 15 с і доставку завдання на планшет (FR-11) — таблиця {tab:spec_fr}.
- h2: 2.2 Об’єктно-орієнтоване проєктування
- p: Об’єктно-орієнтовану модель побудовано мовою UML 2.5.1, яка визначає 14 типів діаграм {cite:uml}; використано обов’язкові
    діаграми варіантів використання, діяльності, послідовності та класів; їхню відповідність коду перевіряє автоматичний тест
    (підрозділ 4.6).
- h3: 2.2.1 Діаграма варіантів використання
- p: Прецеденти зображують еліпсами й називають дієсловами; їх виявляють, розглядаючи суттєві цілі кожного основного актора
    {cite:l6|с. 14}. На діаграмі бойового управління (рисунок {fig:uc1}, UC1–UC12) ролі КП узагальнено актором «Персонал КП»,
    шлюз — актор-система; UC3 включає UC4 («include»); UC12 розширює UC5 за умови «відмова» розрахунку (актор UC5 — лише ОЧ);
    UC9 пов’язано з ролями, що мають право mission.abort. Роль кожного актора має право на свій прецедент (підрозділ 3.6).

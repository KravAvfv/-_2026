- p: 'Особливості ТЦК та СП як державного органу: персональні дані громадян обробляються на підставі закону [9], ведення Реєстру
    регулюється окремим законом [10], а кіберзахист державних інформаційних ресурсів і повідомлення CERT-UA про інциденти
    є обов’язковими [11]. Тому управлінська робота поєднує вимоги СУІБ з національним порядком створення КСЗІ [12]. Ризики,
    оцінені за CRAMM, і порушники з ЛР1 стають вихідними даними для моделі загроз і моделі порушника КСЗІ, а ступінь ризику,
    пов’язаний з посадою працівника, ураховують під час розподілу прав доступу [13].'
- h1: 6. Методики управління ризиками для ТЦК та СП
  new_page: true
- p: 'За завданням 5 таблицю методик (форма таблиці 3.1 методичних рекомендацій [1]) заповнено всіма методиками, що можуть
    бути застосовані для безпеки ТЦК та СП, і розширено методиками, які найкраще відповідають діяльності державного органу:
    міжнародними стандартами процесу (ISO/IEC 27005, ISO 31000), методами моделювання загроз і аналізу впливу з лекцій курсу
    [3; 14] та національним порядком створення КСЗІ [12]. Описи методик ґрунтуються на першоджерелах [8; 15; 16; 17; 18] (табл.
    {tab:methods}).'

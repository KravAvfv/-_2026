- h2: '4.4. Етап 2: оцінка загроз, вразливостей і міри ризику'
- p: 'Для груп активів оцінено рівні загроз і вразливостей за шкалами CRAMM (табл. {tab:tv}). Оригінальна матриця засобу CRAMM
    не публікується, тому в роботі міру ризику R обчислено монотонною апроксимацією, що зберігає шкали та напрям впливу кожного
    чинника:'
- p: R = 1 + округл(2,5·(V − 1)/9 + 2·(T − 1)/4 + 1,5·(U − 1)/2),
  align: center
- p: де V — цінність групи активів (1–10, найбільша в групі), T — рівень загрози (1–5), U — рівень вразливості (1–3). Найменшим

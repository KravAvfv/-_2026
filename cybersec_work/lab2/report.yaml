    ухвалює рішення й надає ресурси, тактичний перетворює їх на методики й правила, операційний виконує заходи, а контроль
    повертає керівництву звіти про стан ризиків. Така побудова відповідає вимогам розділів 5, 6 і 9 ISO/IEC 27001:2022 [7].

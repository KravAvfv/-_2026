    - 7
- p: 'Для ТЦК та СП доцільне поєднання: ISO/IEC 27005 як рамка процесу, CRAMM з державним профілем для детального аналізу
    критичних активів, STRIDE і BIA для ідентифікації загроз і оцінки недоступності, FRAP для швидкого аналізу нових сервісів
    і НД ТЗІ 3.7-003-05 як обов’язковий національний контур. Відповідно до рекомендацій методички великим організаціям відповідає
    CRAMM, середнім — FRAP, малим — OCTAVE [1]; районний ТЦК та СП як елемент великої державної системи належить до першої
    групи.'
- h1: 7. Переваги та недоліки методик управління ризиками ІБ
  new_page: true
- p: Переваги й недоліки п’яти методик, визначених у таблиці 3.2 методичних рекомендацій [1], наведено в табл. {tab:pros}.
    Оцінки CRAMM узгоджено з досвідом її застосування [6], OCTAVE — з описом підходу розробниками [19].
- table:
    font: 12
    id: pros
    caption: Переваги та недоліки методик з управління ризиками ІБ
    header:
    - Методика
    - Переваги
    - Недоліки
    widths:
    - 3.2
    - 6.6
    - 6.7
    rows:
    - - CRAMM
      - поєднання кількісних і якісних оцінок; велика бібліотека контрзаходів; державний профіль; економічне обґрунтування
        витрат
      - потребує спеціального засобу та підготовленого аналітика; платна ліцензія; оцінки за найгіршим сценарієм можуть завищувати
        ризик
    - - COBIT 5 for Risk
      - зв’язує ризики з врядуванням і цілями організації; узгоджений з COBIT 5
      - не містить детальної процедури розрахунку ризиків; потребує зрілих ІТ-процесів
    - - FRAP
      - швидкість і простота; не потребує спеціальних засобів; залучає власників процесів
      - суб’єктивність групових оцінок; лише якісний результат; залежність від фасилітатора
    - - NIST SP 800-30
      - детальна загальнодоступна настанова; шкали й приклади; узгодження з NIST CSF
      - орієнтація на федеральні системи США; трудомісткість для малих організацій
    - - OCTAVE
      - безкоштовність; самостійне виконання працівниками; фокус на критичних активах
      - велика кількість робочих аркушів; якісні шкали без фінансової точності
- p: 'Порівняння показує, що жодна методика не є універсальною: CRAMM найповніша, але найдорожча; FRAP і OCTAVE швидкі, але
    якісні; NIST SP 800-30 і COBIT 5 for Risk є радше рамками, ніж готовими інструментами розрахунку. Для ТЦК та СП це обґрунтовує
    комбінований підхід, описаний у розділі 6.'
- h1: 8. Відповіді на питання для самоперевірки
  new_page: true
- p: Питання 1. За допомогою яких механізмів здійснюється управління ризиками на підприємстві?
- p: Відповідь. Політика й критерії прийняття ризиків, призначення власників ризиків, методика оцінювання (у ТЦК та СП — CRAMM),
    реєстр ризиків, план обробки з контрзаходами, моніторинг, внутрішній аудит і аналіз керівництвом (розділ 2.2, табл. {tab:aspects}).
- p: Питання 2. Що є управлінням інформаційною безпекою?
- p: 'Відповідь. Це частина загальної системи управління підприємством: скоординована діяльність керівництва на стратегічному,
    тактичному й операційному рівнях, спрямована на досягнення цілей конфіденційності, цілісності й доступності через управління
    ризиками (рис. {fig:levels}).'
- p: Питання 3. Основні положення методології CRAMM?
- p: 'Відповідь. Три етапи: ідентифікація й оцінка активів (1–10), оцінка загроз (5 рівнів) і вразливостей (3 рівні) з мірою
    ризику 1–7, вибір контрзаходів з бібліотеки за аспектами безпеки. Методика поєднує кількісні й якісні оцінки, має профілі
    для комерційних і державних організацій (розділ 4).'
- p: Питання 4. Що таке ресурси, загрози, вразливості?
- p: 'Відповідь. Ресурси (активи) — дані, ПЗ, обладнання, приміщення, персонал і процеси, що мають цінність; загроза — потенційна
    небезпека для ресурсу; вразливість — слабке місце, через яке загроза може реалізуватися. Приклад для ТЦК та СП: відомості
    Реєстру — фішинг — відсутність MFA (табл. {tab:tv}).'
- h1: Висновки
  new_page: true
- p: У лабораторній роботі досліджено процес управління ризиками кібернетичної безпеки військкомату — районного ТЦК та СП
    — за методикою CRAMM.
- numbered:
  - Розкрито поняття ризику, загрози, вразливості та управління ризиками і чотири способи обробки ризиків з прикладами для
    ТЦК та СП.
  - Описано процес управління ризиками за ISO/IEC 27005 і ISO 31000 з двома точками рішень і наповненням кожного етапу для
    ТЦК та СП (табл. {tab:stages}).
  - 'Застосовано три етапи CRAMM: оцінено 6 груп даних і 5 груп ПЗ та фізичних активів; 9 з 11 мають цінність 8 і вище, тому
    потрібен детальний аналіз.'
  - 'Для 10 загроз обчислено міру ризику: найвища — R = 7 (З-01, цільовий фішинг), міру 6 мають 3, прийнятну міру 4 — 2.'
  - Сформовано 12 аспектів управлінської роботи на чотирьох рівнях і таблицю з 12 методик з обґрунтуванням їх застосування;
    порівняно переваги й недоліки п’яти методик.
- p: Аналіз результатів показує, що для ТЦК та СП найважливіші не окремі технічні засоби, а заходи, які одночасно перекривають
    кілька загроз (багатофакторна автентифікація, сегментація, EDR), і процедурний контроль змін записів Реєстру. CRAMM дала
    змогу обґрунтувати цей пріоритет кількісно, а комбінація з ISO/IEC 27005 і НД ТЗІ 3.7-003-05 забезпечує відповідність
    як міжнародним практикам, так і національним вимогам.

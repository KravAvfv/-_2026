blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — за допомогою методики CRAMM (CCTA Risk Analysis and Management Method) навчитися процесу управління ризиками
    інформаційної безпеки підприємства [1]. Об’єкт дослідження, як і в лабораторній роботі 1, — військкомат за індивідуальним
    варіантом № 24, тобто районний територіальний центр комплектування та соціальної підтримки (далі — ТЦК та СП) [2].
- p: 'Завдання роботи відповідно до методичних рекомендацій [1]:'
- numbered:
  - дослідити поняття управління ризиками (розділ 2);
  - дослідити процес управління ризиками на підприємстві (розділ 3);
  - дослідити методологію CRAMM і застосувати її до ТЦК та СП (розділ 4);
  - перерахувати основні аспекти управлінської роботи щодо забезпечення інформаційної безпеки на рівні підприємства за індивідуальним
    варіантом (розділ 5);
  - заповнити таблицю методик, які можуть бути застосовані для безпеки підприємства, розширивши перелік методиками, що найкраще
    підходять для діяльності ТЦК та СП (розділ 6);
  - заповнити таблицю переваг і недоліків методик управління ризиками ІБ (розділ 7).
- p: Відповіді на питання для самоперевірки наведено в розділі 8, аналіз результатів — у висновках. Активи, загрози та вразливості
    взято з моделі лабораторної роботи 1, що забезпечує наскрізність досліджень.
- p: Примітка. ТЦК та СП, його підрозділи, інформаційна система й усі числові оцінки в роботі є умовною навчальною моделлю,
    побудованою лише на відкритих нормативних джерелах.
- h1: 2. Поняття управління ризиками
  new_page: true
- h2: 2.1. Ризик, загроза, вразливість
- p: 'Кіберризик — це ймовірність реалізації кіберзагрози з урахуванням потенційних негативних наслідків для підприємства:
    загроза характеризує можливе джерело або сценарій небажаної події, а ризик враховує ймовірність її реалізації та величину
    збитків [3]. Загроза — потенційна небезпека для інформаційної системи, вразливість — її слабке місце, атака — практична
    реалізація дій, спрямованих на використання цієї слабкості [3]. Отже, ризик існує лише там, де є одночасно цінний ресурс,
    загроза для нього і вразливість, через яку загроза може реалізуватися.'
- p: 'У стандартах ризик визначають як вплив невизначеності на цілі [4], а ризик інформаційної безпеки пов’язують з можливістю
    того, що загроза використає вразливість активу й завдасть шкоди організації [5]. У методиці CRAMM ця залежність виражена
    прямо: міра ризику визначається поєднанням цінності активу, рівня загрози та рівня вразливості [6].'
- h2: 2.2. Управління ризиками та способи обробки
- p: Управління ризиками — скоординована діяльність зі спрямування й контролю організації щодо ризиків [4]. Для інформаційної
    безпеки це безперервний цикл виявлення, оцінювання, обробки ризиків і контролю результатів, який є основою системи інформаційної
    безпеки підприємства [1]. Управління інформаційною безпекою на рівні підприємства спрямоване на нейтралізацію зовнішніх
    загроз (неправомірні дії, злочинна діяльність, збої глобальних систем і систем партнерів) і внутрішніх (помилки й халатність
    персоналу, навмисні порушення, збої власних систем) і має здійснюватися в контексті загальної діяльності підприємства
    [1].
- p: 'Для кожного оціненого ризику обирають один зі способів обробки [4; 5]:'
- bullets:
  - 'зменшення (модифікація) — впровадження заходів, що знижують ймовірність або наслідки: для ТЦК та СП — багатофакторна
    автентифікація операторів Реєстру;'
  - 'уникнення — відмова від діяльності, що породжує ризик: наприклад, заборона обробки мобілізаційних документів на мережевих
    АРМ;'
  - 'передавання (розподіл) — перекладання частини наслідків на іншу сторону: захист від DDoS-атак провайдером, вимоги безпеки
    в договорах з постачальниками;'
  - прийняття (збереження) — свідоме рішення власника ризику не обробляти ризик, рівень якого не перевищує критеріїв прийнятності.
- p: Механізмами управління ризиками на підприємстві є політика й критерії прийняття ризиків, призначення власників ризиків,
    методика оцінювання, реєстр ризиків, план обробки, внутрішній аудит і аналіз керівництвом [7]. Для ТЦК та СП власником
    ризиків є начальник, а методику та реєстр веде служба захисту інформації (розділ 5).
- h1: 3. Процес управління ризиками на підприємстві
  new_page: true
- h2: 3.1. Етапи процесу
- p: Процес управління ризиками інформаційної безпеки за ISO/IEC 27005 і ISO 31000 подано на рис. {fig:rmp}. Він починається
    зі встановлення контексту й містить оцінювання ризиків (ідентифікацію, аналіз і оцінювання), обробку та прийняття ризиків,
    а комунікація й моніторинг супроводжують усі етапи [4; 5].
- figure:
    id: rmp
    src: cybersec_work/lab2/diagrams/01_rm_process.png
    caption: Процес управління ризиками інформаційної безпеки з точками прийняття рішень
- p: Дві точки рішень роблять процес ітеративним. Якщо після оцінювання інформації недостатньо для рішення (рішення 1), повертаються
    до встановлення контексту й уточнюють межі або критерії. Якщо залишковий ризик після обробки неприйнятний (рішення 2),
    обирають додаткові заходи. Наповнення етапів для ТЦК та СП наведено в табл. {tab:stages}.

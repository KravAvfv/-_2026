      - щоквартальний звіт керівнику СУІБ, переоцінка після інцидентів
- h2: 3.2. Процесний підхід у методичних рекомендаціях
- p: 'Методичні рекомендації подають систему інформаційної безпеки як процес управління ризиками з шести складових: опис бізнес-процесів,
    збір ризиків, оцінка ризиків, планування заходів, реалізація заходів і оцінка ефективності [1]. Ці складові відповідають
    етапам рис. {fig:rmp}: опис процесів — встановленню контексту, збір і оцінка ризиків — оцінюванню, планування та реалізація
    заходів — обробці, оцінка ефективності — моніторингу й перегляду. Види заходів (організаційні, правові, організаційно-технічні,
    програмні, інженерно-технічні) використано в розділі 4.4.'
- h1: 4. Методологія CRAMM та її застосування до ТЦК та СП
  new_page: true
- h2: 4.1. Загальна характеристика CRAMM
- p: Методику CRAMM розробило Центральне агентство з комп’ютерів і телекомунікацій Великобританії (Central Computer and Telecommunications
    Agency, CCTA) на замовлення британського уряду; її використовують з 1985 року державні й комерційні організації [1]. За
    даними інвентаризації ENISA, перший випуск методу й однойменного програмного засобу датовано 1985 роком, версію 5 — 2003
    роком, постачальником засобу була компанія Insight Consulting, а сама методика є бажаним методом аналізу ризиків для урядових
    установ Великобританії й особливо придатна для великих організацій [8].
- p: В основу CRAMM покладено комплексний підхід, що поєднує кількісні та якісні методи; бази знань (профілі) засобу відрізняються
    для комерційних і державних організацій [1]. Метою розроблення методики було отримати формалізовану процедуру, яка дає
    змогу повністю проаналізувати вимоги безпеки, уникнути зайвих витрат, обґрунтувати контрзаходи, порівнювати їх варіанти
    та генерувати звіти [1].
- h2: 4.2. Етапи CRAMM
- p: Методика поділяє процедуру на три послідовні етапи (рис. {fig:cramm}). Перший етап відповідає на запитання, чи достатньо
    засобів базового рівня, чи потрібен детальніший аналіз; на другому ідентифікують ризики та оцінюють їх величину; на третьому
    обирають адекватні контрзаходи [1].
- figure:
    id: cramm
    src: cybersec_work/lab2/diagrams/02_cramm.png
    caption: Етапи методики CRAMM та шкали оцінювання
- p: 'Шкали CRAMM такі [6]. Цінність даних визначають в інтерв’ю з їх власниками через наслідки найгірших сценаріїв недоступності,
    знищення, розголошення та модифікації і переводять у шкалу 1–10; прикладне ПЗ і фізичні активи оцінюють за вартістю заміни
    в тій самій шкалі, а також успадковують цінність даних, які вони обробляють. Рівень загрози має п’ять градацій (дуже низький
    … дуже високий), рівень вразливості — три (низький, середній, високий). Засіб CRAMM за вбудованою матрицею перетворює
    поєднання цінності, загрози та вразливості на міру ризику від 1 (базові вимоги безпеки) до 7 (дуже високі вимоги). Бібліотеку
    з майже 4000 контрзаходів згруповано за аспектами безпеки: апаратні, програмні, комунікаційні, процедурні, фізичні, кадрові
    та середовищні [6].'
- h2: '4.3. Етап 1: ідентифікація та оцінка активів ТЦК та СП'
- p: Оцінки цінності даних (табл. {tab:data}) отримано за принципом CRAMM — від власників даних, через наслідки найгіршого
    сценарію для кожного з чотирьох видів порушення. Цінність активу дорівнює найбільшій з чотирьох оцінок.

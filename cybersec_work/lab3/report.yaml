blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: 'Мета роботи — ознайомитися з методикою оцінки ризиків OCTAVE та процесом аналізу ризиків FRAP [1]. Об’єктом практичної
    частини, як вимагає методичка, є інформаційні активи власних пристроїв автора: ноутбука, смартфона та пов’язаних з ними
    хмарних сервісів.'
- p: 'Завдання роботи відповідно до методичних рекомендацій [1]:'
- numbered:
  - дослідити оцінку активів, яка проводиться кількісними та якісними методами (розділ 2);
  - проаналізувати методику оцінки ризиків OCTAVE (розділ 3);
  - проаналізувати груповий процес аналізу ризиків FRAP (розділ 4);
  - виконати класифікацію інформаційних активів, що знаходяться на власних пристроях (розділ 5);
  - сформулювати потенційні загрози інформації, визначити методи та засоби їх уникнення (розділи 6–7);
  - заповнити таблицю відповідності «інформація — загрози — методи і засоби уникнення» (розділ 7).
- p: Відповіді на питання для самоперевірки наведено в розділі 8, аналіз результатів — у висновках. Грошові оцінки активів
    є власними орієнтовними оцінками автора станом на жовтень 2026 року.
- h1: 2. Кількісні та якісні методи оцінки активів
  new_page: true
- h2: 2.1. Активи та їх класифікація
- p: Аналіз ризиків інформаційної безпеки передбачає облік активів і встановлення їхньої цінності, класифікацію загроз і вразливостей,
    визначення ймовірності та впливу загроз і оптимізацію витрат між збитками та вартістю захисту [1]. Активи бувають матеріальними
    (мережеве обладнання, комп’ютери, програмне забезпечення, устаткування, матеріали) і нематеріальними (репутація, інформація,
    авторське право); кількісно оцінити нематеріальні активи значно важче [1]. Об’єктами кібербезпеки є інформаційні, програмні,
    апаратні, мережеві ресурси та бізнес-процеси [2].
- p: Під час визначення цінності враховують корисність активу для власника, його цінність для конкурентів і користувачів,
    витрати на купівлю, розроблення, захист, заміну чи ремонт і наслідки компрометації; саме цінність активів визначає механізми
    та заходи їх захисту [1]. На підприємстві оцінку виконує група управління інформаційними ризиками з керівників підрозділів,
    ІТ-працівників і розробників застосунків, а керівництво за її звітом визначає обсяг проєкту [1].
- h2: 2.2. Кількісні методи
- p: 'Кількісні методи виражають цінність і ризик у грошових одиницях. Фактична вартість активу визначається вартістю його
    придбання, розроблення та підтримки [1]. Для розрахунку очікуваних втрат застосовують класичні показники кількісного аналізу
    ризиків:'
- bullets:
  - AV (asset value) — вартість активу;
  - EF (exposure factor) — частка вартості, що втрачається за однієї реалізації загрози (0…1);
  - SLE = AV × EF — очікувані втрати від одного інциденту;
  - ARO — очікувана кількість інцидентів за рік;
  - ALE = SLE × ARO — очікувані річні втрати, з якими порівнюють річну вартість заходу захисту.
- p: Захід економічно виправданий, якщо його річна вартість менша за зменшення ALE, яке він забезпечує. Недолік кількісних
    методів — потреба в статистиці інцидентів, якої для більшості організацій немає.
- h2: 2.3. Якісні методи
- p: Якісні методи описують цінність і ризик порядковими шкалами (високий / середній / низький, 1–3, 1–10), отриманими з експертних
    оцінок власників і користувачів активу [1]. Вони швидші й не потребують статистики, але суб’єктивні. Якісні шкали використовують
    OCTAVE і FRAP, а CRAMM поєднує обидва підходи [1; 3]. Класифікацію методів подано на рис. {fig:valuation}.
- figure:
    id: valuation
    src: cybersec_work/lab3/diagrams/01_valuation.png
    caption: Кількісні та якісні методи оцінки активів
- h1: 3. Методика оцінки ризиків OCTAVE
  new_page: true
- h2: 3.1. Загальні положення та різновиди
- p: Методику OCTAVE (Operationally Critical Threat, Asset, and Vulnerability Evaluation) розробив Software Engineering Institute
    (SEI) Університету Карнегі — Меллона. Вона передбачає аналіз ризиків силами працівників підприємства без залучення зовнішніх
    консультантів, оскільки вони краще розуміють потреби підприємства й властиві йому ризики; основними перевагами є загальнодоступність
    і безкоштовність [1]. Базовий підхід викладено розробниками в монографії [4].
- p: 'Існує три різновиди [5; 6]:'
- bullets:
  - 'OCTAVE — три фази: побудова профілів загроз на основі активів, ідентифікація вразливостей інфраструктури, розроблення
    стратегії безпеки та планів зменшення ризиків;'
  - OCTAVE-S — варіант для малих організацій (близько 100 осіб і менше), який виконує команда з трьох — п’яти працівників
    без формальних семінарів збирання знань;
  - OCTAVE Allegro (2007) — спрощений підхід, зосереджений на інформаційних активах і місцях їх зберігання, передавання й
    обробки (контейнерах); придатний і для групи, і для однієї особи.
- h2: 3.2. OCTAVE Allegro
- p: OCTAVE Allegro складається з восьми кроків, згрупованих у чотири фази (рис. {fig:allegro}) [5]. У фазі 1 встановлюють
    критерії вимірювання ризику, у фазі 2 профілюють критичні активи й визначають їхні контейнери, у фазі 3 ідентифікують
    загрози в контексті контейнерів, у фазі 4 ідентифікують і аналізують ризики та обирають підхід до їх зменшення.
- figure:
    id: allegro
    src: cybersec_work/lab3/diagrams/02_octave_allegro.png
    caption: Фази та кроки методики OCTAVE Allegro
- p: 'Загрози систематизують деревами загроз з чотирма гілками: люди з використанням технічних засобів, люди з фізичним доступом,
    технічні проблеми та інші проблеми (стихійні лиха, відмови інфраструктури). Ймовірність описують якісно — висока, середня
    або низька. На кроці 7 обчислюють відносний бал ризику: для кожної сфери впливу ранг сфери (найважливіша — найбільший
    ранг) множать на значення впливу (високий — 3, середній — 2, низький — 1) і підсумовують [5]. Методичка зазначає, що для
    кожного джерела загроз будується дерево варіантів, а ризик оцінюється за трьома рівнями з можливим фінансовим збитком
    [1].'
- p: 'На кроці 8 ризики розподіляють на пули за матрицею «ймовірність × бал» (30–45, 16–29, 0–15) і призначають підхід: пул
    1 — зменшити, пул 2 — зменшити або відкласти, пул 3 — відкласти або прийняти, пул 4 — прийняти; передавання ризику допустиме
    для будь-якого пулу [5]. Різниця балів значення не має — бал лише впорядковує ризики.'
- h1: 4. Груповий процес аналізу ризиків FRAP
  new_page: true
- p: FRAP (Facilitated Risk Analysis Process) — методика якісної оцінки ризиків, побудована так, що будь-яка людина з навичками
    організації групової роботи може провести аналіз [1]. Її описав Т. Пелтьє; процес складається з попередньої зустрічі,
    сесії FRAP і підсумкового етапу (рис. {fig:frap}) [7]. Група з власників процесів і технічних фахівців аналізує одну систему
    чи один сегмент діяльності за раз, а фасилітатор стежить за регламентом.
- figure:
    id: frap
    src: cybersec_work/lab3/diagrams/03_frap.png
    caption: Етапи групового процесу аналізу ризиків FRAP
- p: 'Етапи сесії за методичкою [1]: мозковий штурм для встановлення всіх загроз; визначення ймовірності та вразливостей для
    кожної загрози за шкалою велика / середня / низька; формування звіту щодо можливого впливу кожної загрози. Перевага —
    швидкість і простота прийняття рішень; недолік — суб’єктивність і лише якісний результат. Методичка рекомендує OCTAVE
    для невеликих підприємств, FRAP — для середніх, CRAMM — для великих [1].'
- p: Порівняння двох методик з CRAMM наведено в табл. {tab:cmp}.

    - 6
- p: 'Три заходи перекривають більшість загроз: менеджер паролів з апаратним ключем FIDO2 (І-01, І-06, І-07, І-09), повне
    шифрування пристроїв з автоблокуванням (А-01, А-02 і всі дані на них) і резервування за правилом 3-2-1 (І-03, І-05). Їх
    упроваджено першими.'
- h1: 8. Відповіді на питання для самоперевірки
  new_page: true
- p: Питання 1. Дайте визначення «нематеріальні активи підприємства», що відноситься до цієї категорії?
- p: 'Відповідь. Нематеріальні активи — ресурси без фізичної форми, що мають цінність для підприємства: інформація (бази даних,
    документи, ноу-хау), репутація, авторське право й інша інтелектуальна власність, програмні ліцензії. Їх важче оцінити
    кількісно, ніж матеріальні.'
- p: Питання 2. Дайте визначення активів підприємства. Наведіть приклади.
- p: 'Відповідь. Актив — будь-який ресурс, що має цінність для підприємства і тому потребує захисту: інформація, програмне
    забезпечення, обладнання, мережі, персонал, процеси. Приклади з роботи — сховище паролів, вихідний код, ноутбук, маршрутизатор
    (табл. {tab:assets}).'
- p: Питання 3. Що таке активи підприємства? Які їх джерела та класифікація?
- p: Відповідь. Джерела активів — придбання (обладнання, ліцензії), власне створення (дані, код, документи) та отримання від
    партнерів і клієнтів (персональні дані). Класифікують за видом (інформаційні, програмні, апаратні, мережеві, людські,
    процеси), формою (матеріальні та нематеріальні), категорією доступу й критичністю за К, Ц, Д.
- p: Питання 4. Які особливості методики оцінки ризиків OCTAVE?
- p: Відповідь. Самостійне виконання працівниками без зовнішніх консультантів, фокус на критичних інформаційних активах і
    контейнерах, дерева загроз, якісні шкали з відносним балом, безкоштовність; різновиди — OCTAVE, OCTAVE-S, OCTAVE Allegro
    (розділ 3).
- p: Питання 5. Які особливості групового процесу аналізу ризиків FRAP?
- p: 'Відповідь. Якісний аналіз однієї системи групою під керівництвом фасилітатора: мозковий штурм загроз, оцінка ймовірності
    й впливу за шкалою В / С / Н, пріоритизація і звіт. Швидкий і простий, але суб’єктивний (розділ 4, табл. {tab:frap}).'
- p: Питання 6. Якими методами проводиться оцінка активів підприємства?
- p: Відповідь. Кількісними (фактична вартість, вартість заміни, SLE, ALE) і якісними (рівні цінності, критичність за К, Ц,
    Д, наслідки за сферами впливу); комбіновані методики, як-от CRAMM, поєднують обидва підходи (рис. {fig:valuation}).
- p: Питання 7. Розкрийте поняття «матеріальні активи підприємства», що відноситься до цієї категорії?
- p: 'Відповідь. Матеріальні активи мають фізичну форму і ринкову вартість: комп’ютери, сервери, мережеве обладнання, носії,
    устаткування, матеріали; методичка відносить сюди й програмне забезпечення. Їх оцінюють за вартістю придбання, підтримки
    та заміни (А-01…А-04 у табл. {tab:assets}).'
- h1: Висновки
  new_page: true
- p: У лабораторній роботі досліджено кількісні та якісні методи оцінки активів і застосовано методики OCTAVE Allegro та FRAP
    до інформаційних активів власних пристроїв.
- numbered:
  - Розглянуто кількісні (AV, SLE, ALE) і якісні (рівні, К/Ц/Д, сфери впливу) методи оцінки активів, їхні переваги та обмеження.
  - Проаналізовано OCTAVE та її різновиди, зокрема вісім кроків OCTAVE Allegro з відносним балом і пулами, і груповий процес
    FRAP; порівняно їх з CRAMM.
  - Класифіковано 14 активів у 7 контейнерах; високу цінність мають 5; інформаційні активи цінніші за обладнання.
  - Розраховано очікувані річні втрати для 6 загроз (разом 16 720 грн/рік).
  - За OCTAVE Allegro проаналізовано 7 сценаріїв загроз для критичного активу І-01; за FRAP — 10 загроз для всіх пристроїв;
    результати узгоджуються.
  - Заповнено таблицю «інформація — загрози — методи і засоби уникнення» (12 рядків).
- p: Аналіз результатів показує, що кількісні методи добре обґрунтовують витрати на захист обладнання, а якісні — пріоритети
    для нематеріальних активів, грошова оцінка яких умовна. Для особистих пристроїв, як і для невеликого підприємства, OCTAVE
    Allegro придатна для самостійного виконання однією особою, а FRAP дає швидкий загальний огляд. Найбільший ризик пов’язаний
    з людським чинником — фішингом, тому головний захід — автентифікація, стійка до фішингу.

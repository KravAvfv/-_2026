blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — проаналізувати метод FMEA, сферу його застосування, процес виконання, переваги та недоліки [1] і виконати
    аналіз видів, наслідків і критичності відмов (FMECA) інформаційної системи військкомату — районного територіального центру
    комплектування та соціальної підтримки (далі — ТЦК та СП) за індивідуальним варіантом № 24 [2].
- p: 'Завдання роботи відповідно до методичних рекомендацій [1]:'
- numbered:
  - ознайомитися з методом FMEA (розділ 2);
  - ознайомитися зі сферою застосування FMEA (розділ 3);
  - розробити функціональну схему досліджуваної системи (розділ 4);
  - виконати FMECA досліджуваної системи за індивідуальним варіантом (розділ 5);
  - 'розробити функціональну схему: проаналізувати структуру й функції системи, поділити її на частини та елементи з урахуванням
    впливу відмов елементів на відмови системи і рівня деталізації (розділ 4);'
  - 'виконати FMECA: визначити типи відмов і режими роботи, наслідки, критичність і ймовірність, першопричини несправностей,
    розрахувати коефіцієнт RPN (розділи 5–6).'
- p: 'Пункти 3 і 5 та 4 і 6 завдання збігаються за змістом, тому виконані спільно: пункт 5 деталізує пункт 3, пункт 6 — пункт
    4. Відповіді на питання для самоперевірки наведено в розділі 7.'
- p: Примітка. ТЦК та СП, його підрозділи, інформаційна система й усі числові оцінки в роботі є умовною навчальною моделлю,
    побудованою лише на відкритих нормативних джерелах.
- h1: 2. Метод FMEA / FMECA
  new_page: true
- h2: 2.1. Сутність методу
- p: Аналіз видів і наслідків відмов (FMEA — Failure Mode and Effects Analysis) — метод ідентифікації способів відмови компонентів,
    систем або процесів, які можуть призвести до невиконання призначеної функції [1]. Метод допомагає ідентифікувати всі види
    відмов частин і компонентів, наслідки відмов для системи, механізми відмови та способи досягнення безвідмовної роботи
    або пом’якшення наслідків. Розширена версія FMECA (Failure Mode, Effects and Criticality Analysis) додатково оцінює критичність
    кожного виду відмови — сукупність ознак, що характеризують її наслідки [1].
- p: 'Чинна редакція міжнародного стандарту методу — IEC 60812:2018 (третє видання, замінило видання 2006 р.): він поширюється
    на апаратні засоби, програмне забезпечення, процеси з участю людини та їхні інтерфейси, а аналіз називають FMECA, якщо
    ранжування критичності враховує щонайменше значущість наслідків; у новій редакції наведено альтернативні способи розрахунку
    RPN і метод матриці критичності [3].'
- h2: 2.2. Показники критичності
- p: 'Методичка описує три загальноприйняті показники [1]:'
- bullets:
  - показник критичності виду відмови — добуток ймовірності наслідків відмови, інтенсивності виду відмови та часу функціонування
    системи; застосовується, коли ці величини відомі кількісно;
  - рівень ризику — поєднання наслідків виду відмови та її ймовірності в якісному, змішаному чи кількісному вигляді;
  - ранг пріоритетності ризику RPN — добуток рангу значущості наслідків (зазвичай 1–10) на ймовірність відмови та можливість
    виявлення; якщо відмову важко виявити, їй надають першочергового значення.
- p: 'У прикладі методички використано спрощену формулу RPN = критичність × ймовірність [1]. У роботі розраховано обидва показники:
    RPN = S × O × D (повне визначення) і критичність C = S × O (як у прикладі), де S — значущість наслідків, O — ймовірність
    виникнення, D — складність виявлення. Порівняння показників дає змогу побачити відмови, небезпечні саме через те, що їх
    важко виявити.'
- h2: 2.3. Процес виконання методу
- p: Процес FMEA складається із семи етапів (рис. {fig:process}) [1]; при виконанні FMECA робоча група додатково класифікує
    кожен вид відмови за критичністю, а після впровадження коригувальних дій систему повторно оцінюють у новому циклі FMEA.
- figure:
    id: process
    src: cybersec_work/lab4/diagrams/01_fmea_process.png
    caption: Етапи виконання методу FMEA / FMECA
- h2: 2.4. Вхідні та вихідні дані
- p: Вхідні дані — креслення й блок-схеми системи, відомості про функціонування кожного компонента, параметри середовища,
    результати й хронологія відмов з інтенсивністю [1]. Для ТЦК та СП ними є модель активів і загроз ЛР1, оцінки ризиків CRAMM
    з ЛР2, функціональна схема (рис. {fig:func}) та журнали подій SIEM. Вихідні дані — перелік видів відмов, механізмів і
    наслідків для кожного компонента, а для FMECA — ранжування відмов за критичністю; звіт містить опис системи, способи аналізу,
    припущення, джерела даних, результати й рекомендації [1].
- h2: 2.5. Переваги та недоліки
- table:
    font: 12
    id: pros
    caption: Переваги та недоліки методу FMEA / FMECA
    header:
    - Переваги
    - Недоліки
    widths:
    - 8.3
    - 8.2
    rows:
    - - застосовний до відмов обладнання, програмного забезпечення, процесів і помилок персоналу
      - аналізує лише окремі відмови, а не їх поєднання
    - - подає види відмов, причини й наслідки у зручній табличній формі
      - без контролю спрямованості трудомісткий і дорогий
    - - дає змогу уникнути дорогих модифікацій, виявивши проблеми на етапі проєктування
      - тривалий для складних багаторівневих систем
    - - виявляє відмови в окремій точці й обґрунтовує резервування
      - 'RPN — порядкова величина: однакові добутки можуть мати різний зміст'
    - - дає вхідні дані для програм моніторингу та аналізу дерева несправностей
      - оцінки S, O, D експертні та суб’єктивні
- p: Перші три рядки обох стовпців відповідають методичці [1]; останні два недоліки сформульовано за результатами виконання
    роботи й узгоджено з тим, що IEC 60812:2018 пропонує альтернативи простому добутку RPN [3].
- h1: 3. Сфера застосування FMEA
  new_page: true
- p: Залежно від об’єкта дослідження виділяють FMEA проєкту (продукції), процесу (виробничі й складальні процеси), системи,
    послуги та програмного забезпечення [1]. Метод застосовують на стадіях проєктування, виробництва й експлуатації; найбільш
    ефективні зміни на стадії проєктування. FMEA/FMECA використовують для вибору надійніших варіантів проєкту, дослідження
    всіх видів відмов, ідентифікації наслідків помилок персоналу, планування перевірок і обслуговування, поліпшення процедур
    і як джерело даних для аналізу дерева несправностей [1].
- p: 'Для кібербезпеки підприємства метод корисний тим, що поєднує відмови обладнання й живлення з навмисними діями порушника
    та помилками персоналу в одній таблиці. Це відповідає вимозі управління безперервністю: оцінювання ризиків має враховувати
    кібератаки, відмови обладнання й ПЗ, людські помилки, компрометацію облікових даних і перебої електропостачання, а для
    IoT-інфраструктури — відмови сенсорів, контролерів і шлюзів [4]. Для ТЦК та СП застосовано FMEA системи (FMECA) у поєднанні
    з FMEA процесу для процедур, де відмова пов’язана з людиною (В-02, В-07, В-09).'
- h1: 4. Функціональна схема інформаційної системи ТЦК та СП
  new_page: true
- h2: 4.1. Структура та функції системи
- p: 'Інформаційна система ТЦК та СП забезпечує процеси, визначені в ЛР1: ведення військового обліку з внесенням даних до
    Реєстру «Оберіг» як орган ведення [5], оповіщення, медичний огляд ВЛК, прийом громадян та міжвідомчий обмін. Функціональну
    схему системи подано на рис. {fig:func}.'
- figure:
    id: func
    src: cybersec_work/lab4/diagrams/02_functional.png
    caption: Функціональна схема інформаційної системи ТЦК та СП
- p: 'Суцільні стрілки на рис. {fig:func} — потоки даних (двосторонні — обмін), пунктирні — керування доступом і передавання
    подій безпеки; підсистема ПС-6 живить усі інші. Критичний шлях даних: АРМ обліку (Е-01) → комутатори (Е-07) → міжмережевий
    екран (Е-08) → криптошлюз (Е-09) → канал (Е-10) → Реєстр. Відмова будь-якого елемента цього шляху зупиняє обмін з Реєстром.'
- h2: 4.2. Поділ системи на частини та елементи
- p: 'Систему поділено на 6 підсистем і 16 елементів (рис. {fig:dec}, табл. {tab:elements}). Рівень деталізації обрано так,
    щоб відмова кожного елемента окремо впливала на функцію системи: для FMEA системи в цілому елементи визначають на укрупненому
    рівні блоків і підсистем [1]. Наприклад, окремі АРМ операторів не виокремлено — їхні відмови однотипні й охоплені елементом
    Е-01.'

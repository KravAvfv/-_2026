    (В-09) — організаційні заходи, що майже не потребують витрат.'
- h1: 7. Відповіді на питання для самоперевірки
  new_page: true
- p: Питання 1. Що допомагає ідентифікувати метод FMEA?
- p: Відповідь. Усі види відмов частин і компонентів системи, їх наслідки для системи, механізми відмов і способи досягнення
    безвідмовної роботи або пом’якшення наслідків; FMECA додатково — критичність кожного виду відмови (табл. {tab:fmeca}).
- p: Питання 2. У яких сферах застосовується метод FMEA?
- p: 'Відповідь. Для проєктів і продукції, процесів, систем, послуг і програмного забезпечення на стадіях проєктування, виробництва
    й експлуатації: вибір надійних варіантів, аналіз помилок персоналу, планування перевірок і обслуговування, підготовка
    даних для дерева несправностей (розділ 3).'
- p: Питання 3. Які вхідні дані використовує метод FMEA?
- p: Відповідь. Креслення та блок-схеми системи (рис. {fig:func}), інформацію про функціонування кожного компонента, параметри
    середовища, відомості про результати відмов і хронологічні дані з інтенсивністю відмов.
- p: Питання 4. Які особливості процесу виконання методу FMEA?
- p: 'Відповідь. Сім етапів: сфера і цілі, робоча група, вивчення системи, поділ на компоненти, функції, визначення відмов,
    причин, наслідків і способів виявлення, компенсувальні особливості; для FMECA — оцінка критичності (RPN, C), коригувальні
    дії й повторний цикл (рис. {fig:process}).'
- p: Питання 5. Які переваги та недоліки методу FMEA?
- p: Відповідь. Переваги — охоплення обладнання, ПЗ, процесів і людського чинника, наочна таблична форма, раннє виявлення
    проблем, обґрунтування резервування; недоліки — аналіз лише одиничних відмов, трудомісткість для складних систем, суб’єктивність
    оцінок (табл. {tab:pros}).
- h1: Висновки
  new_page: true
- p: У лабораторній роботі проаналізовано метод FMEA/FMECA та виконано FMECA інформаційної системи військкомату — районного
    ТЦК та СП.
- numbered:
  - Розглянуто сутність FMEA і FMECA, показники критичності (C, рівень ризику, RPN), сім етапів процесу, вхідні та вихідні
    дані, переваги й недоліки, чинний стандарт IEC 60812:2018.
  - Описано сферу застосування методу й обґрунтовано використання FMEA системи разом з FMEA процесу для кібербезпеки ТЦК та
    СП.
  - Розроблено функціональну схему системи та поділ на 6 підсистем і 16 елементів з функціями; визначено 4 режими роботи.
  - Виконано FMECA для 17 видів відмов з першопричинами, наслідками та оцінками S, O, D; високий пріоритет за RPN мають 5,
    найбільший RPN — В-01 (420).
  - Запропоновано коригувальні дії, після яких сумарний RPN зменшився з 2619 до 733.
- p: 'Аналіз результатів показує, що для інформаційної системи державного органу найнебезпечніші відмови — не апаратні, а
    приховані: компрометація облікового запису, непридатні резервні копії й невиявлені інциденти. Повний RPN з показником
    виявлення D розкриває їх краще, ніж критичність S × O, тому для кібербезпеки доцільно використовувати обидва показники
    разом і переглядати FMECA після кожного суттєвого інциденту чи зміни системи.'

- h2: 5.1. Шкали оцінювання
- p: Значущість наслідків S, ймовірність O і складність виявлення D оцінено за десятибальними шкалами (табл. {tab:scales}).
    Ймовірність узгоджено з частотою подій, а значущість — з наслідками для громадян і процесів ТЦК та СП.

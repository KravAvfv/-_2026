- h2: 5.3. Наслідки відмов і першопричини
- p: 'Наслідки варіюються від часткових (черга на оформлення через відмову біометричного комплексу В-04) до критичних (зупинка
    всієї системи при відмові живлення В-17 або служби каталогів В-14). Першопричини згруповано так:'
- bullets:
  - людський чинник — В-01, В-02, В-03, В-09, В-15 (5 відмов);
  - організаційні прогалини процедур — В-07, В-10, В-13 (3 відмови);
  - навмисні атаки — В-06, В-12, В-16 (3 відмови);
  - апаратні відмови — В-04, В-05, В-08, В-14 (4 відмови);
  - зовнішня інфраструктура (живлення, зв’язок) — В-11, В-17 (2 відмови);
- p: Отже, понад половину першопричин пов’язано з людьми й процедурами, а не з обладнанням, що узгоджується з висновками ЛР1
    і ЛР2.
- h1: 6. Розрахунок RPN і аналіз критичності
  new_page: true
- h2: 6.1. Ранжування за RPN
- p: 'RPN розраховано як добуток S × O × D (табл. {tab:fmeca}). Прийнято межі: RPN ≥ 200 — високий пріоритет (дія обов’язкова),
    100–199 — середній (дія планова), менше 100 — низький (контроль). Високий пріоритет мають 5 відмов, середній — 4, низький
    — 8. Перша п’ятірка: В-01 компрометація облікового запису оператора (420); В-07 непридатна резервна копія (324); В-15
    невиявлення інциденту (320); В-02 несанкціонована зміна запису (288); В-09 помилка правил міжмережевого екрана (224).'
- p: 'Приклад розрахунку для В-01: RPN = 10 × 6 × 7 = 420; C = 10 × 6 = 60.'
- h2: 6.2. Матриця критичності
- p: Розміщення відмов у матриці «значущість × ймовірність» (метод матриці критичності IEC 60812:2018 [3]) подано на рис.
    {fig:matrix}; воно відповідає візуальному поданню ефектів і пріоритетів у прикладі методички [1].
- figure:
    id: matrix
    src: cybersec_work/lab4/diagrams/04_criticality_matrix.png
    caption: Матриця критичності відмов інформаційної системи ТЦК та СП
- p: За критичністю C перші місця посідають В-01 (C = 60) і В-17 (C = 54). Порівняння рангів за C і RPN показує розбіжність
    для В-11 (місце 3 за C, 15 за RPN), В-16 (місце 13 за C, 7 за RPN), В-17 (місце 2 за C, 9 за RPN). Відмова живлення В-17
    критична, але виявляється миттєво (D = 2), тому її RPN помірний; натомість непридатна резервна копія В-07 і невиявлений
    інцидент В-15 мають помірну критичність, але практично не помічаються без спеціальних перевірок (D = 8–9), що й підносить
    їх у RPN. Тому відмови з S ≥ 9 і O ≥ 5 (В-01, В-17) також віднесено до обов’язкових для обробки незалежно від RPN.
- h2: 6.3. Коригувальні дії та повторна оцінка
- p: Для кожної відмови визначено коригувальні дії та повторно оцінено S, O, D після їх впровадження (табл. {tab:actions},
    рис. {fig:rpn}). Дії переважно зменшують ймовірність O і покращують виявлення D; значущість наслідків S без зміни архітектури
    не змінюється.

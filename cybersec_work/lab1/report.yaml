blocks:
- h1: 1. Мета та завдання роботи
  new_page: true
- p: Мета роботи — проаналізувати структуру системи управління кібернетичною безпекою підприємства та основні стандарти в
    цій галузі [1]. Об’єктом дослідження за індивідуальним варіантом № 24 є військкомат — районний територіальний центр комплектування
    та соціальної підтримки (далі — ТЦК та СП), правовий статус якого визначає Положення, затверджене постановою Кабінету
    Міністрів України № 154 [2].
- p: 'Завдання роботи відповідно до методичних рекомендацій [1]:'
- numbered:
  - ознайомитися з поняттям та основними положеннями інформаційної безпеки, дослідити її основні цілі та завдання (розділ
    2);
  - проаналізувати стандарт ISO/IEC 27001:2022 (розділ 3);
  - дослідити застосування стандарту ISO/IEC 27001:2022 для організації кібернетичної безпеки на підприємстві (розділ 4);
  - зобразити модель системи інформаційної безпеки підприємства відповідно до індивідуального варіанта (розділ 5);
  - виконати представлення кібернетичної безпеки підприємства на базі міжнародних стандартів ISO/IEC 27001 (розділ 6);
  - дослідити інші стандарти в галузі інформаційної безпеки та заповнити таблицю стандартів, придатних для захисту обраного
    підприємства (розділ 7).
- p: Відповіді на питання для самоперевірки наведено в розділі 8, аналіз результатів — у висновках. Звіт оформлено відповідно
    до ДСТУ 3008:2015 [3].
- p: Примітка. ТЦК та СП, його підрозділи, мережа й показники ризиків у роботі є умовною навчальною моделлю, побудованою лише
    на відкритих нормативних джерелах.
- h1: 2. Поняття, цілі та завдання інформаційної безпеки
  new_page: true
- h2: 2.1. Поняття інформаційної та кібернетичної безпеки
- p: Інформаційна безпека — це стан (рівень) захищеності інформаційних ресурсів, тобто інформаційних об’єктів і інформаційних
    систем, від випадкових і навмисних негативних впливів, які можуть завдати шкоди самій інформації, засобам її передавання
    та обробки, а отже її власникам, державі та суспільству [1]. Узагальнено інформаційну безпеку визначають як сукупність
    засобів, методів і процедур, що забезпечують захист інформаційних активів і зберігають ефективність технічної інфраструктури
    та відомостей, які в ній обробляються [4].
- p: 'Кібербезпека підприємства ширша за захист окремих даних: це сукупність організаційних, правових, програмно-технічних
    і технологічних заходів, спрямованих на захист інформації, інформаційних систем, мереж, програмного забезпечення, пристроїв
    і бізнес-процесів від кіберзагроз [5]. Жоден окремий засіб (міжмережевий екран, антивірус, SIEM) не забезпечує повноцінного
    захисту; об’єктом захисту є також процеси, у яких інформація створюється та використовується. Законодавчо кібербезпеку
    визначено як захищеність життєво важливих інтересів людини і громадянина, суспільства та держави під час використання
    кіберпростору [6].'
- p: Для ТЦК та СП така процесна позиція має прямий зміст. Наслідком компрометації є не лише розголошення персональних даних,
    а й зрив оповіщення, спотворення облікових відомостей, від яких залежать права громадян, і порушення мобілізаційної роботи
    держави в умовах воєнного стану.
- h2: 2.2. Цілі інформаційної безпеки та принципи кібербезпеки
- p: Основними цілями інформаційної безпеки є конфіденційність, неможливість несанкціонованого доступу, цілісність інформації
    та пов’язаних з нею процесів, доступність, мінімізація ризиків шляхом компенсаційних заходів і облік усіх процесів, пов’язаних
    з ризиками [1]. Ядро цих цілей утворює модель CIA (конфіденційність, цілісність, доступність); її доповнюють принципи
    автентичності, підзвітності, найменших привілеїв, багаторівневого захисту (Defense in Depth), Security by Design і Zero
    Trust [5]. У табл. {tab:goals} кожну ціль конкретизовано для ТЦК та СП.
- table:
    font: 12
    id: goals
    caption: Цілі та принципи кібербезпеки в контексті ТЦК та СП
    header:
    - Ціль / принцип
    - Зміст
    - Конкретизація для ТЦК та СП
    widths:
    - 3.9
    - 5.3
    - 7.3
    rows:
    - - Конфіденційність
      - доступ до інформації лише уповноважених суб’єктів
      - дані Реєстру та ВЛК доступні лише операторам відповідних відділень; секретні документи — лише особам з допуском
    - - Цілісність
      - точність, повнота й незмінність інформації, крім санкціонованих змін
      - кожна зміна облікового запису військовозобов’язаного обґрунтована документом і фіксується в журналі
    - - Доступність
      - своєчасне використання ресурсів уповноваженими суб’єктами
      - Реєстр, оповіщення й електронна черга доступні під час відключень живлення та атак
    - - Автентичність
      - підтвердження справжності суб’єкта, пристрою чи джерела
      - багатофакторна автентифікація операторів, сертифікати вузлів обміну
    - - Підзвітність
      - встановлення відповідності між дією та суб’єктом
      - захищені журнали дій операторів як засіб протидії корупційному втручанню
    - - Найменші привілеї
      - лише мінімально необхідні права
      - 'рольовий доступ: працівник центру обслуговування не бачить медичних висновків'
    - - Багаторівневий захист
      - кілька незалежних рівнів механізмів безпеки
      - периметр, сегментація, КЗІ, EDR, SIEM, резервні копії (рис. {fig:perimeter})
    - - Zero Trust
      - жоден суб’єкт не вважається довіреним автоматично
      - перевірка кожного підключення до Реєстру незалежно від розташування у внутрішній мережі
- h2: 2.3. Завдання та стадії побудови системи управління інформаційною безпекою
- p: 'Досягнення цілей забезпечується розв’язанням таких завдань [1]: введення термінології; класифікація інформаційних ресурсів;
    визначення власників процесів, відповідальних за безпеку; розроблення спектра ризиків та їх експертне оцінювання; визначення
    груп доступу; розроблення системи управління ризиками; складання переліків адміністративних і технічних заходів; виконання
    заходів і періодичний контроль ризиків; забезпечення фізичної безпеки та безпеки персоналу; формування вимог безпеки до
    інформаційної системи; контролінг безпеки.'
- p: 'Реалізація системи управління інформаційною безпекою (СУІБ) проходить чотири стадії: формування політики в галузі ризиків,
    аналіз бізнес-процесів, аналіз ризиків і формування цільової концепції [1]. Для ТЦК та СП ці стадії виконано в розділах
    4–6: політика й контекст (розділ 4), процеси та активи (підрозділи 4.1 і 5.1), ризики та цільова модель захисту (розділ
    6).'
- p: Загрози класифікують за природою (випадкові та навмисні) і за відношенням до об’єкта (зовнішні та внутрішні) [1]. Порушення
    бувають організаційно-правовими, організаційними, фізичними та радіоелектронними; для ТЦК та СП актуальні всі чотири види,
    що обґрунтовує комплексний характер СУІБ.
- h1: 3. Аналіз стандарту ISO/IEC 27001:2022
  new_page: true
- h2: 3.1. Призначення та структура стандарту
- p: ISO/IEC 27001:2022 встановлює вимоги до створення, впровадження, підтримання та постійного поліпшення системи управління
    інформаційною безпекою в контексті організації, а також до оцінювання й обробки ризиків інформаційної безпеки [7]. СУІБ
    є частиною загальної системи управління, що ґрунтується на аналізі ризиків; її складають організаційні структури, політика,
    планування, обов’язки, процедури, процеси і ресурси [1]. В Україні стандарт прийнято як ідентичний національний — ДСТУ
    ISO/IEC 27001:2023, що замінив ДСТУ ISO/IEC 27001:2015 [8].
- p: 'Стандарт має уніфіковану структуру систем менеджменту: розділи 0–3 (вступ, сфера, посилання, терміни) мають довідковий
    характер, а обов’язкові вимоги містять розділи 4–10, наведені в табл. {tab:clauses}. Відхилення від вимог розділів 4–10
    не допускаються, якщо організація заявляє про відповідність стандарту.'

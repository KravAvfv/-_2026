    категорій персональних даних, обробка яких допускається лише у випадках, визначених статтею 7 Закону [12].'
- h2: 5.2. Модель порушника
- p: 'Модель порушника — формалізований опис потенційного суб’єкта загрози, його мотивації, рівня доступу, знань і можливостей
    [16]. За лекцією виділено чотири рівні можливостей: від використання штатного ПЗ (1) до повноважень, співставних з адміністративними
    (4). Модель порушника ТЦК та СП наведено в табл. {tab:violators}.'

    rows:
    - - ISO/IEC 27001:2022 (в Україні — ДСТУ ISO/IEC 27001:2023, IDT)
      - Вимоги до створення, впровадження, підтримання та постійного поліпшення СУІБ; 93 заходи додатка A
      - 'Основа СУІБ ТЦК та СП: область застосування П1–П7, реєстр ризиків, Декларація про застосовність'
    - - ISO/IEC 27002:2022
      - Настанови щодо впровадження заходів безпеки з атрибутами (тип заходу, властивості, концепції кібербезпеки)
      - Деталізація заходів MFA, DLP, журналювання, сегментації для АРМ Реєстру та ВЛК
    - - ISO/IEC 27003
      - Настанова з реалізації СУІБ
      - Покроковий план впровадження СУІБ у районному ТЦК та СП
    - - ISO/IEC 27004
      - Моніторинг, вимірювання, аналіз і оцінювання СУІБ
      - 'Метрики: частка операторів з MFA, час реагування на інцидент, результати фішинг-тренувань'
    - - ISO/IEC 27005
      - Керування ризиками інформаційної безпеки
      - Методика оцінювання ризиків З-01…З-10 (ймовірність × вплив)
    - - ISO/IEC 27006
      - Вимоги до органів аудиту та сертифікації СУІБ
      - Вимоги до зовнішніх аудиторів у разі незалежного оцінювання
    - - ISO/IEC 27007, ISO/IEC TS 27008
      - Настанови з аудиту СУІБ і аудиту заходів
      - Програма внутрішніх аудитів СУІБ і перевірок технічних заходів
    - - ISO/IEC 27010
      - Менеджмент ІБ для міжгалузевих і міжорганізаційних комунікацій
      - Правила обміну з МО, Генштабом ЗСУ, ДПСУ, обласним ТЦК та СП
    - - ISO/IEC 27011
      - Настанова для телекомунікаційних організацій
      - 'Обмежено: вимоги до операторів каналів зв’язку, якими користується ТЦК та СП'
    - - ISO/IEC 27013
      - Інтегрована реалізація ISO/IEC 20000-1 і ISO/IEC 27001
      - Узгодження ІТ-сервісів групи ІКТ з вимогами СУІБ
    - - ISO/IEC 27014
      - Врядування інформаційною безпекою
      - Відповідальність керівництва, звітування начальнику ТЦК та СП
    - - ISO/IEC TR 27015:2012
      - Настанови для фінансових послуг; скасований у 2017 р. без заміни
      - 'Не застосовується: документ скасовано, фінансових послуг ТЦК та СП не надає'
    - - ISO/IEC 27031
      - Готовність ІКТ до неперервності бізнесу
      - Резервні канали, живлення, план відновлення Реєстрового АРМ
    - - ISO/IEC 27033 (усі частини)
      - Безпека мереж
      - Сегментація зон 1–5, захист периметра
    - - ISO/IEC 27034 (усі частини)
      - Безпека застосунків
      - Вимоги до сервісу електронної черги та його постачальника
    - - ISO/IEC 27035
      - Менеджмент інцидентів ІБ
      - Процедура реагування, взаємодія з CERT-UA
    - - ISO/IEC 27037
      - Ідентифікація, збирання та збереження цифрових доказів
      - Збереження доказів у разі корупційного втручання або атаки
    - - Закон України «Про основні засади забезпечення кібербезпеки України» № 2163-VIII
      - Засади кібербезпеки, суб’єкти національної системи кібербезпеки, захист критичної інфраструктури
      - Обов’язок кіберзахисту державних інформаційних ресурсів, повідомлення CERT-UA про інциденти
    - - Закон України «Про захист персональних даних» № 2297-VI
      - Правила обробки персональних даних, особливі категорії (ст. 7), обов’язки володільця
      - Обробка даних громадян і медичних даних ВЛК, призначення відповідальної особи
    - - Закон України «Про захист інформації в інформаційно-комунікаційних системах» № 80/94-ВР
      - Захист державних інформаційних ресурсів і інформації з обмеженим доступом в системах
      - Обов’язковість КСЗІ з підтвердженою відповідністю для АРМ Реєстру та документообігу
    - - Закон України «Про Єдиний державний реєстр призовників, військовозобов’язаних та резервістів» № 1951-VIII
      - Склад Реєстру, держатель і адміністратор (МО), розпорядник (Генштаб ЗСУ), порядок ведення і обміну
      - Повноваження ТЦК та СП як органу ведення, вимоги до захисту даних Реєстру
    - - Закон України «Про державну таємницю» № 3855-XII
      - Режим секретності, допуск і доступ до секретної інформації
      - Робота РСО з мобілізаційними документами в ізольованій зоні
    - - НД ТЗІ 3.7-003-05
      - Порядок створення КСЗІ в інформаційно-телекомунікаційній системі
      - Етапи створення КСЗІ АС ТЦК та СП, державна експертиза
    - - НД ТЗІ 2.5-004-99, НД ТЗІ 2.5-005-99
      - Критерії оцінки захищеності, класифікація АС і функціональні профілі
      - Вибір функціонального профілю для ЛОМ з АРМ Реєстру (АС класу 3) і автономних АРМ (клас 1)
    - - NIST Cybersecurity Framework 2.0
      - 'Шість функцій: Govern, Identify, Protect, Detect, Respond, Recover'
      - Перевірка повноти заходів і звітування керівництву за функціями
    - - NIST SP 800-30 Rev. 1, NIST SP 800-34 Rev. 1
      - Оцінювання ризиків; планування неперервності
      - Сценарії відновлення роботи під час відключень і атак
    continue_at:
    - 13
- p: 'Отже, базовим для ТЦК та СП є поєднання ISO/IEC 27001/27002/27005 (управління ризиками та заходи), ISO/IEC 27035 і 27031
    (інциденти та неперервність), законів України щодо кібербезпеки, персональних даних, захисту інформації, Реєстру й державної
    таємниці та НД ТЗІ щодо КСЗІ. Наведений у переліку методичних рекомендацій ISO/IEC TR 27015:2012 не застосовується: його
    скасовано без заміни, а фінансових послуг ТЦК та СП не надає.'
- h1: 8. Відповіді на питання для самоперевірки
  new_page: true
- p: Питання 1. Яким чином визначаються терміни інформаційної безпеки? Назвіть приклади.
- p: 'Відповідь. Терміни визначаються законодавством, національними та міжнародними стандартами і вводяться в СУІБ політикою
    безпеки, щоб усі учасники однаково їх розуміли. Приклади: конфіденційність, цілісність, доступність, загроза, вразливість,
    ризик, інцидент, актив, власник ризику (підрозділ 2.2).'
- p: Питання 2. Розкрийте поняття «заходи інформаційної безпеки».
- p: Відповідь. Заходи — це організаційні, правові, програмні та технічні дії й засоби, що зменшують ймовірність реалізації
    загроз або їх вплив. У ISO/IEC 27001:2022 їх 93 у чотирьох темах; для ТЦК та СП відібрані заходи наведено в табл. {tab:controls}.
- p: Питання 3. Яким чином може здійснюватися забезпечення фізичної безпеки та безпеки персоналу?
- p: 'Відповідь. Фізична безпека: периметр і контроль входу, захищені зони, відеомоніторинг, захист носіїв і живлення, безпечна
    утилізація (заходи 7.1–7.14). Безпека персоналу: перевірка кандидатів і оформлення допуску, зобов’язання про нерозголошення,
    навчання, дисциплінарна відповідальність, відкликання прав після звільнення (заходи 6.1–6.8).'
- p: Питання 4. Яким чином відбувається аналіз ризиків?
- p: Відповідь. Описують об’єкт і наявні заходи, ідентифікують ресурси, аналізують загрози й вразливості, оцінюють ймовірність
    і вплив, визначають рівень ризику та порівнюють його з критеріями прийнятності (табл. {tab:risks}).
- p: Питання 5. Розкрийте поняття «об’єкти захисту», що до них відноситься, наведіть приклади.
- p: 'Відповідь. Об’єкти захисту — інформація та матеріальні ресурси, які необхідно захищати: інформаційні, програмні, апаратні,
    мережеві ресурси і бізнес-процеси. Приклади для ТЦК та СП — відомості Реєстру, висновки ВЛК, засоби КЗІ, процес оповіщення
    (табл. {tab:assets}).'
- p: Питання 6. Що таке «загрози»? Їх види та джерела. Наведіть приклади.
- p: 'Відповідь. Загроза — потенційна можливість події, що порушує конфіденційність, цілісність або доступність. За природою
    загрози бувають випадковими й навмисними, за джерелом — зовнішніми та внутрішніми. Приклади: цільовий фішинг APT-угруповання,
    DDoS-атака хактивістів, корупційна зміна записів інсайдером, відмова живлення (табл. {tab:threats}).'
- p: Питання 7. Види заходів інформаційної безпеки. Докладно розкрийте кожен з них.
- p: Відповідь. Організаційні — політики, ролі, регламенти, навчання; правові — закони, договори, зобов’язання про нерозголошення,
    відповідальність; організаційно-технічні — допуск, облік ключів, керування змінами; програмні — автентифікація, антивірусний
    захист, журналювання, шифрування; інженерно-технічні — фізичний захист, резервне живлення, мережеве обладнання та засоби
    КЗІ.
- p: Питання 8. Яким чином і з якою метою відбувається оцінка ефективності системи управління кібербезпекою? Назвіть ключові
    чинники успішності.
- p: Відповідь. Оцінка — системне отримання об’єктивних даних про стан системи та їх порівняння з критеріями шляхом моніторингу,
    метрик, внутрішнього аудиту й аналізу керівництвом. Мета — визначити рівень ефективності, вузькі місця, відповідність
    стандартам і виробити рекомендації. Ключовий чинник успішності — побудова СУІБ на базі ISO/IEC 27001 за підтримки керівництва
    та з урахуванням ризиків.
- p: Питання 9. Які основні вимоги міжнародних стандартів ISO/IEC 27001? З яких елементів складається стандарт?
- p: Відповідь. Стандарт вимагає визначити контекст і область СУІБ, забезпечити лідерство й політику, оцінювати та обробляти
    ризики, підтримувати ресурси та документацію, оцінювати результативність і постійно поліпшувати систему. Складається з
    розділів 0–10 (обов’язкові 4–10) та додатка A з 93 заходами (табл. {tab:clauses} і {tab:annex}).
- p: Питання 10. Які основні стандарти серії ISO 27К ви знаєте?
- p: Відповідь. ISO/IEC 27000 (огляд і словник), 27001 (вимоги до СУІБ), 27002 (заходи), 27003 (впровадження), 27004 (вимірювання),
    27005 (ризики), 27006 і 27007 (аудит і сертифікація), 27014 (врядування), 27031 (неперервність ІКТ), 27033 (мережі), 27034
    (застосунки), 27035 (інциденти), 27037 (цифрові докази) — див. табл. {tab:standards}.
- h1: Висновки
  new_page: true
- p: У лабораторній роботі досліджено структуру системи управління кібернетичною безпекою військкомату — районного ТЦК та
    СП — на основі стандарту ISO/IEC 27001:2022 і національної нормативної бази.
- numbered:
  - Розкрито поняття інформаційної та кібербезпеки, цілі (модель CIA та додаткові принципи) і завдання СУІБ; кожну ціль конкретизовано
    для ТЦК та СП (табл. {tab:goals}).
  - 'Проаналізовано ISO/IEC 27001:2022: обов’язкові розділи 4–10, цикл PDCA, 93 заходи додатка A в чотирьох темах і зміни
    редакції 2022 р.'
  - 'Визначено контекст, зацікавлені сторони й область застосування СУІБ ТЦК та СП: 7 процесів, 12 активів, з яких 5 мають
    максимальну критичність за К, Ц і Д.'
  - Побудовано модель системи інформаційної безпеки за структурою методичних рекомендацій, модель порушника (6 типів) і архітектуру
    периметра з п’ятьма зонами довіри.
  - 'Оцінено 10 ризиків: високих — 4, середніх — 6; для кожного обрано заходи додатка A та категорії NIST CSF 2.0, що утворює
    основу Декларації про застосовність.'
  - Заповнено таблицю стандартів (26 позицій), що поєднує серію ISO/IEC 27000, закони України, НД ТЗІ та рамки NIST.
- p: 'Аналіз результатів показує, що найбільші ризики ТЦК та СП пов’язані не з периметром, а з людським чинником: фішингом
    проти операторів Реєстру та корупційним втручанням у записи. Тому пріоритетними є багатофакторна автентифікація, розподіл
    обов’язків, захищене журналювання та навчання персоналу, а сертифікована КСЗІ і сегментація мережі мають доповнювати ці
    заходи, а не замінювати їх.'

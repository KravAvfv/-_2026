- p: 'Розподіл посилань на функції NIST CSF 2.0: Govern — 2; Identify — 2; Protect — 9; Detect — 3; Respond — 1; Recover —
    3. Переважання функції Protect закономірне для етапу створення СУІБ; функції Respond і Govern додатково забезпечуються
    процедурою реагування на інциденти та політикою безпеки (підрозділ 4.3).'
- h2: 6.4. Узгодження з національною нормативною базою
- p: 'Сертифікація за ISO/IEC 27001 для державного органу є добровільною, тоді як вимоги національного законодавства обов’язкові.
    Тому СУІБ ТЦК та СП поєднує два контури: управлінський (ISO/IEC 27001, NIST CSF) і нормативно-технічний (КСЗІ за НД ТЗІ
    з підтвердженням відповідності, режим секретності, захист персональних даних) [13; 15]. Ризики та заходи, обрані за ISO/IEC
    27001, стають вихідними даними для технічного завдання на КСЗІ, а результати державної експертизи КСЗІ — свідченням результативності
    для внутрішнього аудиту за розділом 9.'
- p: Реагування на інциденти організовано за циклом «планування та підготовка — виявлення та реагування — аналіз і розслідування
    — оцінювання та вдосконалення» з обов’язковою взаємодією із зовнішніми центрами реагування (CERT-UA) [10].
- h1: 7. Стандарти інформаційної безпеки для ТЦК та СП
  new_page: true
- p: За завданням 6 досліджено стандарти серії ISO/IEC 27000 з переліку методичних рекомендацій [1] і доповнено їх нормативними
    документами України та рамками NIST, необхідними для захисту ТЦК та СП. Результат (форма таблиці 1.1 методичних рекомендацій)
    наведено в табл. {tab:standards}; для стандартів серії ISO/IEC 27000 зазначено поточні редакції без року, якщо їх кілька.

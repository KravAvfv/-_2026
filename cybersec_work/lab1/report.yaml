- h2: 3.3. Зміни редакції 2022 року та процесний цикл
- p: 'Редакція 2022 р. додала вимогу планування змін СУІБ (6.3), уточнила вимоги до процесів (4.4, 8.1) і змінила порядок
    підрозділів розділу 10. Серед заходів з’явилися 11 нових: розвідувальні дані про загрози (5.7), безпека хмарних сервісів
    (5.23), готовність ІКТ до неперервності (5.30), моніторинг фізичної безпеки (7.4), керування конфігураціями (8.9), видалення
    інформації (8.10), маскування даних (8.11), запобігання витоку даних (8.12), моніторинг діяльності (8.16), вебфільтрація
    (8.23) і безпечне кодування (8.28) [9]. Для ТЦК та СП найважливішими з них є 5.7, 5.30, 8.12 і 8.16, оскільки основні
    загрози мають державне походження, а витоки персональних даних мають високий суспільний резонанс.'
- p: Розділи 4–10 утворюють цикл «планування — виконання — перевірка — поліпшення» (PDCA), що забезпечує постійне вдосконалення
    СУІБ; той самий цикл застосовують і до управління кіберінцидентами [10]. Застосування стандарту дає змогу встановити вимоги
    й цілі безпеки, переконатися в результативності управління ризиками та відповідності законодавству, контролювати впровадження
    СУІБ і надавати аудиторам та партнерам підтвердження рівня захищеності [1].
- h1: 4. Застосування ISO/IEC 27001:2022 для організації кібербезпеки ТЦК та СП
  new_page: true
- h2: 4.1. Характеристика об’єкта дослідження
- p: ТЦК та СП є органом військового управління, що забезпечує виконання законодавства з питань військового обов’язку, військової
    служби та мобілізаційної підготовки, веде військовий облік і здійснює соціальну підтримку військовослужбовців та членів
    їхніх сімей [2]. ТЦК та СП є органом ведення Єдиного державного реєстру призовників, військовозобов’язаних та резервістів
    (електронна система «Оберіг»), держателем якого є Міністерство оборони України [11].
- p: Умовну організаційну структуру районного ТЦК та СП з розподілом ролей СУІБ подано на рис. {fig:org}. Начальник є власником
    ризиків, заступник — керівником СУІБ, служба захисту інформації разом з режимно-секретним органом (РСО) контролює дотримання
    політик у всіх підрозділах.

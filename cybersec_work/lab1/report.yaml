- h2: 5.4. Структурна модель системи інформаційної безпеки
- p: Структурну модель системи інформаційної безпеки ТЦК та СП подано на рис. {fig:iss}; вона повторює структуру рисунка 1.1
    методичних рекомендацій [1] з наповненням за варіантом. Порушники (табл. {tab:violators}) здійснюють атаки, що реалізують
    загрози конфіденційності, цілісності та доступності. Загрози використовують вразливості й разом з ними створюють ризики,
    які загрожують ресурсам (табл. {tab:assets}). Власник ресурсів — начальник ТЦК та СП — встановлює контрзаходи, що зменшують
    вразливості. Загрози, вразливості, ризики та контрзаходи розташовані в межах інформаційного простору установи, тоді як
    порушник і власник перебувають за його межами.
- figure:
    id: iss
    src: cybersec_work/lab1/diagrams/03_iss_model.png
    caption: Модель системи інформаційної безпеки ТЦК та СП
- h2: 5.5. Архітектура периметра захисту
- p: Технічну складову моделі — архітектуру периметра захисту з п’ятьма зонами довіри — подано на рис. {fig:perimeter}. Вона
    реалізує принцип багаторівневого захисту та мережевої сегментації, що обмежує латеральне переміщення порушника [18].
- figure:
    id: perimeter
    src: cybersec_work/lab1/diagrams/04_perimeter.png
    caption: Архітектура периметра захисту та зони довіри ТЦК та СП
- p: 'На рис. {fig:perimeter} суцільні стрілки позначають дозволені потоки даних, пунктирна — передавання журналів подій до
    зони керування безпекою; зона 5 не має мережевих з’єднань. Призначення зон:'
- bullets:
  - 'Зовнішнє середовище: громадяни та зовнішні адресати пошти — недовірені джерела трафіку.'
  - 'Зона 1 (ДМЗ): анти-DDoS-фільтр і WAF перед сервісом електронної черги, поштовий шлюз з «пісочницею» для перевірки вкладень;
    з ДМЗ до ЛОМ дозволено лише визначені потоки через міжмережевий екран.'
  - 'Зона 2: криптошлюз з засобами КЗІ, що мають позитивний експертний висновок, забезпечує захищений обмін з відомчою мережею
    (Реєстр «Оберіг», ДПСУ, обласний ТЦК та СП).'
  - 'Зона 3: ЛОМ автоматизованої системи з КСЗІ, поділена на VLAN за функціями (Реєстр, ВЛК, біометрія, документообіг); для
    неї доцільний клас АС 3 (розподілений комплекс) за НД ТЗІ 2.5-005-99 [19].'
  - 'Зона 4: SIEM, EDR, контроль мережевого доступу (NAC), керування привілейованим доступом (PAM) і офлайн-резервні копії;
    сюди надходять журнали з усіх зон.'
  - 'Зона 5: ізольовані автономні АРМ РСО (клас АС 1) для мобілізаційних документів з грифом секретності, без підключення
    до будь-яких мереж.'
- h1: 6. Кібербезпека ТЦК та СП на базі ISO/IEC 27001
  new_page: true
- h2: 6.1. Процес управління ризиками
- p: 'З погляду процесного підходу систему інформаційної безпеки подають як процес управління ризиками з шести складових:
    опис бізнес-процесів, збір ризиків, оцінка ризиків, планування заходів, реалізація заходів і оцінка ефективності [1].
    Наповнення кожної складової для ТЦК та СП подано на рис. {fig:risk}; процес відповідає вимогам 6.1.2, 6.1.3, 8.2 і 8.3
    ISO/IEC 27001:2022 [7] та методології NIST SP 800-30 [20].'
- figure:

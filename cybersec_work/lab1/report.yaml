- h2: 4.2. Контекст організації та область застосування СУІБ
- p: 'Відповідно до розділу 4 стандарту [7] визначено зовнішні та внутрішні чинники. Зовнішні: воєнний стан і постійні кібератаки
    держави-агресора, висока суспільна увага до діяльності ТЦК та СП, залежність від відомчих систем МО та каналів зв’язку,
    нестабільне електроживлення. Внутрішні: обмежена чисельність ІТ-персоналу, велика кількість операторів з доступом до персональних
    даних, поєднання відкритої, службової та секретної інформації в одній установі.'
- p: 'Зацікавлені сторони та їхні вимоги:'
- bullets:
  - Міністерство оборони та Генеральний штаб ЗСУ — цілісність і доступність даних Реєстру, дотримання відомчих правил обміну
    [11];
  - громадяни — захист персональних і медичних даних, законність обробки, доступність прийому [12];
  - Держспецзв’язку та CERT-UA — створення КСЗІ з підтвердженою відповідністю, повідомлення про кіберінциденти [6; 13];
  - СБУ та органи, що здійснюють режим секретності, — охорона державної таємниці [14];
  - ДПСУ та обласний ТЦК та СП — своєчасний і захищений обмін відомостями.
- p: 'Область застосування СУІБ: процеси П1–П7, інформаційні активи A-01…A-12, приміщення ТЦК та СП і канали обміну до точки
    підключення до відомчої мережі. Поза областю залишаються центральні компоненти Реєстру «Оберіг», за безпеку яких відповідають
    держатель (він же адміністратор) і розпорядник Реєстру, однак інтерфейси до них входять до СУІБ.'
- h2: 4.3. Лідерство, політика та ролі
- p: 'Згідно з розділом 5 стандарту начальник ТЦК та СП затверджує політику інформаційної безпеки, забезпечує ресурси й інтеграцію
    вимог СУІБ у процеси. Політика визначає цілі (табл. {tab:goals}), принцип найменших привілеїв, порядок класифікації інформації
    за грифами, обов’язкову багатофакторну автентифікацію і порядок реагування на інциденти. Ролі: власник ризиків — начальник;
    керівник СУІБ — заступник; служба захисту інформації — адміністратор безпеки, аналітик подій, відповідальний за захист
    персональних даних; власники активів — керівники відділень (табл. {tab:assets}).'
- h2: 4.4. Етапи впровадження СУІБ
- p: Цикл впровадження СУІБ ТЦК та СП подано на рис. {fig:pdca}. На вході цикл отримує вимоги зацікавлених сторін, на виході
    — керовану кібербезпеку критичних процесів.
- figure:
    id: pdca
    src: cybersec_work/lab1/diagrams/02_pdca.png
    caption: Цикл PDCA СУІБ ТЦК та СП за розділами 4–10 ISO/IEC 27001:2022
- numbered:
  - 'Планування (розділи 4–6): аналіз контексту, затвердження політики, ідентифікація активів, оцінка ризиків, складання ДЗ
    і плану обробки ризиків.'
  - 'Виконання (розділи 7–8): забезпечення ресурсами, навчання персоналу, створення КСЗІ за НД ТЗІ 3.7-003-05 [15], впровадження
    технічних і організаційних заходів.'
  - 'Перевірка (розділ 9): моніторинг подій у SIEM, метрики результативності, внутрішній аудит, аналіз керівництвом.'
  - 'Поліпшення (розділ 10): усунення невідповідностей, коригувальні дії за результатами інцидентів і аудитів, перегляд ризиків.'
- h1: 5. Модель системи інформаційної безпеки ТЦК та СП
  new_page: true
- h2: 5.1. Об’єкти захисту
- p: Модель системи інформаційної безпеки підприємства — це сукупність зовнішніх і внутрішніх чинників та їх впливу на стан
    безпеки й збереження ресурсів; вона пов’язує загрози, вразливості та ризики [1]. Об’єктами захисту є інформаційні, програмні,
    апаратні, мережеві ресурси та бізнес-процеси [5]. Реєстр активів ТЦК та СП з оцінкою критичності за властивостями К, Ц,

      - Лідерство
      - зобов’язання керівництва, політика ІБ, ролі та повноваження
      - начальник ТЦК та СП затверджує політику, призначає керівника СУІБ і службу захисту інформації
    - - '6'
      - Планування
      - оцінювання й обробка ризиків, Декларація про застосовність, цілі ІБ, планування змін
      - реєстр ризиків З-01…З-10, вибір заходів додатка A
    - - '7'
      - Підтримка
      - ресурси, компетентність, обізнаність, комунікація, документована інформація
      - допуск персоналу, навчання з протидії фішингу, облік документів
    - - '8'
      - Функціонування
      - планування й контроль процесів, виконання оцінювання та обробки ризиків
      - впровадження КСЗІ, сегментації, резервування
    - - '9'
      - Оцінювання результативності
      - моніторинг і вимірювання, внутрішній аудит, аналіз керівництвом
      - метрики SIEM, щоквартальний внутрішній аудит
    - - '10'
      - Поліпшення
      - постійне поліпшення, невідповідності та коригувальні дії
      - усунення причин інцидентів, оновлення політик
- h2: '3.2. Додаток A: перелік заходів безпеки'
- p: 'Нормативний додаток A містить 93 заходи безпеки, згруповані в чотири теми (табл. {tab:annex}); у редакції 2013 р. було
    114 заходів у 14 доменах. Організація зобов’язана порівняти обрані заходи з додатком A, обґрунтувати включення чи виключення
    кожного з них і зафіксувати це в Декларації про застосовність (Statement of Applicability, далі — ДЗ) [7]. Настанови щодо
    впровадження заходів наведено в ISO/IEC 27002:2022, де кожному заходу присвоєно атрибути: тип (запобіжний, виявляючий,
    коригувальний), властивості ІБ (К, Ц, Д), концепції кібербезпеки (ідентифікувати, захищати, виявляти, реагувати, відновлювати),
    операційні можливості та домени безпеки [9].'

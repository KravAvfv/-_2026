    ризики підлягають обов’язковій обробці (зменшенню), середні — зменшенню в межах ресурсів; залишкові ризики приймає власник
    — начальник ТЦК та СП.'
- h2: 6.3. Обробка ризиків і Декларація про застосовність
- p: Для кожної загрози обрано заходи додатка A ISO/IEC 27001:2022 [7], визначено відповідні категорії NIST CSF 2.0 [21] і
    вид заходу за класифікацією методичних рекомендацій (організаційні, правові, організаційно-технічні, програмні, інженерно-технічні)
    [1]. Отримане відображення (табл. {tab:controls}) є основою ДЗ.
